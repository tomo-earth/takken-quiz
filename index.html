工業専用地域では建築できない点と区別する。"},{"text":"保育所は、すべての用途地域内において建築することができる。","is_correct":false,"explanation":"正しい。保育所はすべての用途地域で建築できる。幼稚園が工業地域・工業専用地域で建築できないことと対比して覚える。"}],"explanation":"神社・寺院・教会、診療所、保育所、公衆浴場、交番などはすべての用途地域で建築できる代表例である。住宅は一見どこでも建てられそうだが、工業専用地域だけは例外的に建築できない点が定番の引っ掛けである。","difficulty":1,"tags":["法令上の制限","建築基準法","用途制限"],"shuffle_choices":true},{"id":"Q3026","topic":"建築基準法","question_type":"select_correct","question":"用途地域内の建築物の用途制限に関する次の記述のうち、正しいものはどれか。ただし、特定行政庁の許可については考慮しないものとする。","choices":[{"text":"小学校は、工業地域内において建築することができる。","is_correct":false,"explanation":"幼稚園、小学校、中学校、高等学校は、工業地域及び工業専用地域内では建築することができない。"},{"text":"大学は、第一種低層住居専用地域内において建築することができる。","is_correct":false,"explanation":"大学・高等専門学校・専修学校は、第一種・第二種低層住居専用地域、田園住居地域、工業地域、工業専用地域内では建築できない。小中高より制限が厳しい点に注意する。"},{"text":"病院は、第一種住居地域内において建築することができる。","is_correct":true,"explanation":"病院は第一種・第二種低層住居専用地域、田園住居地域、工業地域、工業専用地域では建築できないが、第一種住居地域では建築することができる。"},{"text":"カラオケボックスは、第一種住居地域内において建築することができる。","is_correct":false,"explanation":"カラオケボックスは第二種住居地域以降(第二種住居・準住居・近隣商業・商業・準工業・工業・工業専用)で建築可能であり、第一種住居地域では建築できない。"}],"explanation":"用途制限は代表例の建築可否を対比で覚えるのが効率的である。小中高は工業系2地域で不可、大学・病院はさらに低層系でも不可、カラオケボックスは第二種住居地域から可能というように、施設ごとの可否の境目を押さえたい。","difficulty":2,"tags":["法令上の制限","建築基準法","用途制限"],"shuffle_choices":true},{"id":"Q3027","topic":"建築基準法","question_type":"select_correct","question":"建築物の敷地が二の用途地域にわたる場合等に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"建築物の敷地が二の用途地域にわたる場合、その敷地の過半の属する用途地域の用途制限が、敷地全体に適用される。","is_correct":true,"explanation":"用途制限については、敷地の過半が属する用途地域の規制が敷地全体に及ぶ(過半主義)。地域ごとに別々の規制が適用されるのではない。"},{"text":"建築物の敷地が二の用途地域にわたる場合、面積の大小にかかわらず、制限の厳しい方の用途地域の用途制限が敷地全体に適用される。","is_correct":false,"explanation":"用途制限は「厳しい方」ではなく「敷地の過半が属する地域」の規制が適用される。厳しい方の規制が全体に及ぶのは、建築物が防火地域と準防火地域等にわたる場合の扱いである。"},{"text":"用途地域の用途制限に適合しない建築物は、いかなる場合であっても建築することができない。","is_correct":false,"explanation":"特定行政庁が用途地域における良好な環境を害するおそれがない等と認めて許可した場合には、用途制限に適合しない建築物でも建築することができる。"},{"text":"建築物の敷地が建蔽率の制限の異なる二の地域にわたる場合、敷地の過半の属する地域の建蔽率が敷地全体に適用される。","is_correct":false,"explanation":"建蔽率や容積率が異なる地域にわたる場合は、過半主義ではなく、各地域の面積比に応じた加重平均により敷地全体の限度を算出する。用途制限の過半主義との違いを問う典型論点である。"}],"explanation":"敷地が複数の地域にまたがる場合の処理は規制ごとに異なり、用途制限は過半主義、建蔽率・容積率は面積按分(加重平均)、防火規制は厳しい方が原則である。この3パターンの使い分けが合否を分ける論点である。","difficulty":3,"tags":["法令上の制限","建築基準法","用途制限"],"shuffle_choices":true},{"id":"Q3028","topic":"建築基準法","question_type":"select_correct","question":"建蔽率に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"街区の角にある敷地で特定行政庁が指定するものの内にある建築物については、建蔽率の限度が10分の2加算される。","is_correct":false,"explanation":"角地指定による加算は10分の1である。防火地域内の耐火建築物等の加算(10分の1)と重複すれば合計10分の2となるが、角地単独では10分の1である。"},{"text":"防火地域内にある耐火建築物等については、建蔽率の指定の数値にかかわらず、常に建蔽率の制限は適用されない。","is_correct":false,"explanation":"建蔽率制限が適用除外となるのは、建蔽率の限度が10分の8とされている地域内で、かつ防火地域内にある耐火建築物等の場合である。それ以外の地域では10分の1の加算にとどまる。"},{"text":"公衆便所及び巡査派出所についても、建蔽率の制限が適用される。","is_correct":false,"explanation":"巡査派出所、公衆便所、公共用歩廊その他これらに類するものには、建蔽率の制限は適用されない。"},{"text":"建蔽率の限度が10分の8とされている地域内で、かつ、防火地域内にある耐火建築物等については、建蔽率の制限は適用されない。","is_correct":true,"explanation":"10分の8の地域内かつ防火地域内の耐火建築物等は建蔽率制限の適用除外となり、敷地いっぱい(10分の10)まで建築することが可能となる。"}],"explanation":"建蔽率の緩和は、角地指定で10分の1、防火地域内の耐火建築物等(準防火地域内の耐火・準耐火建築物等を含む)で10分の1の加算が基本であり、10分の8地域かつ防火地域内の耐火建築物等に至ると制限自体が適用除外となる。派出所・公衆便所等の適用除外も併せて覚える。","difficulty":3,"tags":["法令上の制限","建築基準法","建蔽率"],"shuffle_choices":true},{"id":"Q3029","topic":"建築基準法","question_type":"select_incorrect","question":"容積率に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"前面道路の幅員が12メートル未満である場合、住居系の用途地域内の建築物の容積率は、原則として当該道路の幅員に10分の4を乗じた数値以下に制限される。","is_correct":false,"explanation":"正しい。住居系用途地域では幅員×10分の4、その他の地域では原則として幅員×10分の6が前面道路幅員による容積率の限度となる。"},{"text":"建築物の敷地が二以上の道路に接する場合、前面道路の幅員による容積率の制限は、最も幅員の狭い道路を基準として算定する。","is_correct":true,"explanation":"誤り。前面道路が二以上あるときは、最も幅員の「広い」道路を基準として算定する。狭い方を基準とするのではない。"},{"text":"前面道路の幅員が12メートル以上である場合には、前面道路の幅員による容積率の制限は適用されない。","is_correct":false,"explanation":"正しい。幅員12メートル以上の道路に接する敷地では、都市計画で定められた指定容積率のみが限度となる。"},{"text":"前面道路の幅員に基づき算定した数値と都市計画において定められた容積率とでは、いずれか小さい方の数値が当該敷地の容積率の限度となる。","is_correct":false,"explanation":"正しい。指定容積率と道路幅員による数値を比較し、厳しい方(小さい方)が実際の限度となる。"}],"explanation":"容積率は、指定容積率と前面道路幅員(12メートル未満の場合)による数値のうち小さい方が限度となる。幅員は複数の道路に接する場合は最大のものを用い、住居系は10分の4、その他は10分の6を乗じるという計算の枠組みを正確に押さえたい。","difficulty":2,"tags":["法令上の制限","建築基準法","容積率"],"shuffle_choices":true},{"id":"Q3030","topic":"建築基準法","question_type":"select_correct","question":"建築物の高さの制限に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"建築物の絶対高さの制限(10メートル又は12メートル)は、すべての住居系用途地域に適用される。","is_correct":false,"explanation":"絶対高さの制限が適用されるのは、第一種・第二種低層住居専用地域及び田園住居地域の3地域のみであり、中高層住居専用地域や住居地域には適用されない。"},{"text":"北側斜線制限は、商業地域内の建築物にも適用される。","is_correct":false,"explanation":"北側斜線制限が適用されるのは、低層系3地域(第一種・第二種低層住居専用地域、田園住居地域)と、第一種・第二種中高層住居専用地域(日影規制の対象区域を除く)であり、商業地域には適用されない。"},{"text":"第一種低層住居専用地域内においては、建築物の高さは、原則として10メートル又は12メートルのうち都市計画で定められた限度を超えてはならない。","is_correct":true,"explanation":"低層系3地域では、低層住宅地としての良好な環境を守るため、10メートル又は12メートルの絶対高さの制限が課される。"},{"text":"隣地斜線制限は、第一種低層住居専用地域内の建築物にも適用される。","is_correct":false,"explanation":"低層系3地域には絶対高さの制限(10メートル又は12メートル)があるため、隣地斜線制限は適用されない。20メートル又は31メートルを超える部分を規制する隣地斜線は、絶対高さ制限のある地域では意味を持たないからである。"}],"explanation":"高さ制限は地域とのセットで覚えるのが鉄則である。絶対高さ10メートル・12メートルは低層系3地域のみ、その低層系3地域には隣地斜線が適用されず、北側斜線は低層系と中高層系のみに適用されるという対応関係を整理したい。","difficulty":1,"tags":["法令上の制限","建築基準法","高さ制限"],"shuffle_choices":true},{"id":"Q3031","topic":"建築基準法","question_type":"select_incorrect","question":"日影による中高層の建築物の高さの制限(日影規制)に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"商業地域、工業地域及び工業専用地域内の区域は、日影規制の対象区域として指定することができない。","is_correct":false,"explanation":"正しい。土地の高度利用を図るべき商業地域と、工業の利便を優先する工業地域・工業専用地域は、日影規制の対象区域から除外されている。"},{"text":"日影規制の対象区域は、地方公共団体が条例で指定する。","is_correct":false,"explanation":"正しい。日影規制は、法律の別表に掲げる区域のうちから地方公共団体が条例で指定した区域内で適用される。地域の実情に応じた規制を可能とする趣旨である。"},{"text":"日影規制の対象区域外にある高さ10メートルを超える建築物であっても、冬至日において対象区域内の土地に日影を生じさせるものは、対象区域内にある建築物とみなして日影規制が適用される。","is_correct":false,"explanation":"正しい。対象区域のすぐ外側に高層建築物を建てて規制を免れることを防ぐための、いわゆるみなし規定である。"},{"text":"第一種低層住居専用地域内においては、高さが10メートルを超える建築物が日影規制の対象となる。","is_correct":true,"explanation":"誤り。低層系の地域(第一種・第二種低層住居専用地域、田園住居地域)では、軒の高さが7メートルを超える建築物又は地階を除く階数が3以上の建築物が規制対象である。高さ10メートル超を基準とするのは中高層系などその他の対象地域である。"}],"explanation":"日影規制は住環境の日照を守る制度であり、商業・工業・工業専用の3地域は対象区域に指定できない。規制対象となる建築物の規模は、低層系では軒高7メートル超又は3階以上、それ以外では高さ10メートル超と地域によって異なる点が細かく問われる。","difficulty":3,"tags":["法令上の制限","建築基準法","高さ制限"],"shuffle_choices":true},{"id":"Q3032","topic":"建築基準法","question_type":"select_correct","question":"防火地域内の制限に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"防火地域内においては、延べ面積100平方メートル以下の平屋建ての建築物であれば、耐火性能に関する制限を受けることなく木造で建築することができる。","is_correct":false,"explanation":"防火地域内では、階数2以下かつ延べ面積100平方メートル以下の建築物であっても、準耐火建築物等以上の性能が要求される。制限を受けずに建築できるわけではない。"},{"text":"防火地域内において建築物の屋上に看板を設ける場合は、その高さにかかわらず、看板の主要な部分を不燃材料で造り、又は覆わなければならない。","is_correct":true,"explanation":"防火地域内の看板・広告塔・装飾塔等の工作物で、建築物の屋上に設けるもの又は高さ3メートルを超えるものは、主要な部分を不燃材料で造り又は覆う必要がある。屋上に設けるものは高さを問わず対象となる。"},{"text":"看板等の工作物の主要な部分を不燃材料で造り又は覆う義務は、準防火地域内においても同様に課される。","is_correct":false,"explanation":"看板等の不燃化義務は防火地域内についてのみ定められており、準防火地域には適用されない。"},{"text":"防火地域内において、階数3・延べ面積80平方メートルの建築物は、準耐火建築物等とすれば建築することができる。","is_correct":false,"explanation":"防火地域内では、階数3以上又は延べ面積100平方メートル超の建築物は耐火建築物等としなければならない。階数3である本肢の建築物は、面積が小さくても準耐火建築物等では足りない。"}],"explanation":"防火地域内では、階数3以上又は延べ面積100平方メートル超なら耐火建築物等、それ以外でも準耐火建築物等以上が要求される。看板等の不燃化義務は「屋上に設けるもの(高さ不問)又は高さ3メートル超のもの」が対象で、防火地域だけの規制である点が頻出である。","difficulty":2,"tags":["法令上の制限","建築基準法","防火地域"],"shuffle_choices":true},{"id":"Q3033","topic":"建築基準法","question_type":"select_correct","question":"防火地域及び準防火地域に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"建築物が防火地域と準防火地域にわたる場合、原則として、その全部について防火地域内の建築物に関する規定が適用される。","is_correct":true,"explanation":"建築物が規制の異なる地域にわたる場合は、原則として厳しい方である防火地域の規制が建築物全体に適用される。防火上の安全は建築物単位で確保する必要があるからである。"},{"text":"建築物が防火地域と準防火地域にわたる場合、それぞれの地域内にある部分ごとに、その地域の規定が適用される。","is_correct":false,"explanation":"地域ごとに別々の規制を適用するのではなく、原則として厳しい方(防火地域)の規制が建築物の全部に適用される。"},{"text":"建築物が防火地域と準防火地域にわたる場合において、その建築物が防火壁で区画されているときであっても、建築物の全部について防火地域の規定が適用される。","is_correct":false,"explanation":"防火地域外において防火壁で区画されているときは、その防火壁外の部分については準防火地域の規定が適用される。防火壁による緩和の例外がある点で誤りである。"},{"text":"準防火地域内においては、地階を除く階数が4・延べ面積800平方メートルの建築物は、準耐火建築物等とすれば建築することができる。","is_correct":false,"explanation":"準防火地域内では、地階を除く階数が4以上又は延べ面積1,500平方メートル超の建築物は耐火建築物等としなければならない。階数4である本肢の建築物は準耐火建築物等では足りない。"}],"explanation":"建築物が防火地域と準防火地域(又は地域外)にわたる場合は、原則として厳しい方の規制が全体に及ぶが、防火壁で区画されていれば防火壁外の部分は緩やかな方の規制で足りる。準防火地域の耐火要件(4階以上又は1,500平方メートル超で耐火建築物等)の数字も確実に押さえたい。","difficulty":1,"tags":["法令上の制限","建築基準法","防火地域"],"shuffle_choices":true},{"id":"Q3034","topic":"国土利用計画法","question_type":"select_correct","question":"国土利用計画法第23条の事後届出の要否に関する次の記述のうち、正しいものはどれか。なお、いずれの区域も注視区域・監視区域には指定されていないものとする。","choices":[{"text":"市街化区域内の1,500㎡の土地を売買により取得した者は、事後届出を行わなければならない。","is_correct":false,"explanation":"市街化区域内で事後届出が必要となるのは2,000㎡以上の土地取引である。1,500㎡は基準未満のため届出は不要。"},{"text":"市街化調整区域内の6,000㎡の土地を売買により取得した者は、事後届出を行わなければならない。","is_correct":true,"explanation":"市街化調整区域は「市街化区域以外の都市計画区域」に含まれ、5,000㎡以上の土地取引で事後届出が必要となる。6,000㎡は基準以上なので届出が必要であり、正しい。"},{"text":"都市計画区域外の8,000㎡の土地を売買により取得した者は、事後届出を行わなければならない。","is_correct":false,"explanation":"都市計画区域外で事後届出が必要となるのは10,000㎡(1ha)以上の土地取引である。8,000㎡は基準未満のため届出は不要。"},{"text":"市街化区域内のちょうど2,000㎡の土地を売買により取得した場合、2,000㎡を「超えて」いないため事後届出は不要である。","is_correct":false,"explanation":"面積基準は「2,000㎡以上」であり、ちょうど2,000㎡でも基準に該当するため届出が必要である。「超」ではなく「以上」である点がひっかけ。"}],"explanation":"事後届出の面積基準は、市街化区域2,000㎡以上、市街化区域以外の都市計画区域(市街化調整区域・非線引き区域)5,000㎡以上、都市計画区域外10,000㎡以上である。土地の投機的取引と地価高騰を抑え、適正な土地利用を確保するため、一定規模以上の取引を知事のチェック下に置く制度である。いずれも「以上」である点に注意したい。","difficulty":1,"tags":["法令上の制限","国土利用計画法"],"shuffle_choices":true},{"id":"Q3035","topic":"国土利用計画法","question_type":"select_incorrect","question":"国土利用計画法第23条の事後届出の手続に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"届出をする者は、対価の額及び土地の利用目的などを届け出なければならない。","is_correct":false,"explanation":"正しい記述である。事後届出では、対価の額と土地の利用目的等を届け出る。ただし勧告の対象となるのは利用目的のみである。"},{"text":"届出は、契約を締結した日から起算して2週間以内に行わなければならない。","is_correct":false,"explanation":"正しい記述である。事後届出は契約締結日から起算して2週間以内に行う必要がある。"},{"text":"届出は、土地が所在する市町村の長を経由して都道府県知事に対して行う。","is_correct":false,"explanation":"正しい記述である。届出書は市町村長を経由して知事に提出する。"},{"text":"届出は、売主と買主(権利取得者)が共同して行わなければならない。","is_correct":true,"explanation":"誤りである。事後届出の届出義務者は権利取得者(買主等)のみであり、当事者双方が共同で行うのは注視区域・監視区域における事前届出である。"}],"explanation":"事後届出は、権利取得者が単独で、契約締結日から起算して2週間以内に、市町村長を経由して知事に行う。契約締結後に土地の利用目的をチェックする制度であるため、届出義務は土地を取得して利用する側にのみ課されている。当事者双方の届出が必要な事前届出制との違いを押さえたい。","difficulty":1,"tags":["法令上の制限","国土利用計画法"],"shuffle_choices":true},{"id":"Q3036","topic":"国土利用計画法","question_type":"select_correct","question":"国土利用計画法第24条の勧告に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"都道府県知事は、事後届出に係る対価の額が著しく不適正であると認めるときは、対価の額を変更すべきことを勧告することができる。","is_correct":false,"explanation":"誤り。事後届出において勧告の対象となるのは土地の利用目的のみであり、対価の額は勧告の対象とならない。対価の額も勧告対象となるのは事前届出制(注視区域・監視区域)である。"},{"text":"勧告を受けた者がその勧告に従わなかった場合、当該土地売買等の契約は無効となる。","is_correct":false,"explanation":"誤り。勧告に従わなくても契約の効力に影響はなく、契約は有効なままである。"},{"text":"勧告は、原則として届出があった日から起算して3週間以内にしなければならない。","is_correct":true,"explanation":"正しい。利用目的の変更勧告は届出日から起算して3週間以内に行うのが原則である(合理的な理由があれば3週間の範囲内で延長可)。"},{"text":"勧告を受けた者がその勧告に従わなかった場合、6月以下の拘禁刑又は100万円以下の罰金に処せられる。","is_correct":false,"explanation":"誤り。勧告に従わない場合の制裁は「その旨及び勧告の内容の公表」ができるにとどまり、罰則はない。罰則があるのは届出そのものをしなかった場合である。"}],"explanation":"事後届出制では、知事は土地の利用目的についてのみ、届出日から起算して3週間以内に変更勧告をすることができる。勧告に従わない場合の措置は公表にとどまり、契約は有効で罰則もない。事後的に利用目的の適正化を促す緩やかな制度設計である点が特徴である。","difficulty":2,"tags":["法令上の制限","国土利用計画法"],"shuffle_choices":true},{"id":"Q3037","topic":"国土利用計画法","question_type":"select_correct","question":"国土利用計画法第23条の事後届出が不要となる場合に関する次の記述のうち、正しいものはどれか。なお、面積はいずれも届出対象規模以上であるものとする。","choices":[{"text":"当事者の一方又は双方が国又は地方公共団体である土地売買等の契約については、事後届出は不要である。","is_correct":true,"explanation":"正しい。当事者の一方又は双方が国・地方公共団体等である場合、公的主体による適正な土地利用が期待できるため、届出は不要とされている。"},{"text":"民事調停法による調停に基づき土地の所有権を取得した場合でも、権利取得者は事後届出を行わなければならない。","is_correct":false,"explanation":"誤り。民事調停法による調停に基づく場合は、裁判所が関与する手続であることから届出不要とされている。"},{"text":"土地の贈与を受けた場合でも、面積が届出対象規模以上であれば事後届出が必要である。","is_correct":false,"explanation":"誤り。贈与は対価の授受がないため「土地売買等の契約」に該当せず、面積にかかわらず届出は不要である。"},{"text":"相続により土地を取得した場合、権利取得者は取得を知った日から2週間以内に事後届出を行わなければならない。","is_correct":false,"explanation":"誤り。相続は契約による権利移転ではないため、届出の対象とならない。"}],"explanation":"事後届出の対象は、対価を得て行われる所有権・地上権・賃借権の移転又は設定の「契約」である。したがって、贈与(対価なし)や相続(契約でない)は対象外であり、当事者に国・地方公共団体等が含まれる場合や民事調停による場合も届出不要とされる。届出対象の3要件(権利性・対価性・契約性)から整理すると理解しやすい。","difficulty":2,"tags":["法令上の制限","国土利用計画法"],"shuffle_choices":true},{"id":"Q3038","topic":"国土利用計画法","question_type":"select_incorrect","question":"国土利用計画法第23条の事後届出の対象となる「土地売買等の契約」に関する次の記述のうち、誤っているものはどれか。なお、面積はいずれも届出対象規模以上であるものとする。","choices":[{"text":"土地の交換契約は、金銭の授受がなければ対価性を欠くため、いずれの当事者も事後届出を行う必要はない。","is_correct":true,"explanation":"誤りである。交換では互いに取得する土地そのものが対価に当たるため対価性が認められ、双方の権利取得者がそれぞれ事後届出を行う必要がある。"},{"text":"土地に抵当権を設定する契約は、事後届出の対象とならない。","is_correct":false,"explanation":"正しい記述である。届出対象となる権利は所有権・地上権・賃借権であり、抵当権の設定は対象外である。"},{"text":"土地の売買の予約も、事後届出の対象となる。","is_correct":false,"explanation":"正しい記述である。予約も将来の権利移転を約する契約であるため、予約をした時点で届出対象となる。"},{"text":"土地の賃借権を設定する契約は、権利金など設定の対価の授受がある場合には事後届出の対象となる。","is_correct":false,"explanation":"正しい記述である。賃借権の設定は、権利金等の一時金という対価があれば届出対象となる。地代の支払いのみで設定の対価がない場合は対象外である。"}],"explanation":"届出対象となる「土地売買等の契約」は、①所有権・地上権・賃借権を、②対価を得て、③契約(予約を含む)により移転・設定するものである。交換は取得する土地が互いの対価となるため届出対象であり、抵当権設定はそもそも対象権利でない。3要件のあてはめを問う応用論点である。","difficulty":3,"tags":["法令上の制限","国土利用計画法"],"shuffle_choices":true},{"id":"Q3039","topic":"国土利用計画法","question_type":"select_correct","question":"国土利用計画法の注視区域及び監視区域に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"注視区域内において届出対象規模以上の土地売買等の契約を締結した場合、権利取得者は契約締結後2週間以内に届出を行わなければならない。","is_correct":false,"explanation":"誤り。注視区域・監視区域では契約締結「前」にあらかじめ届け出る事前届出制が採られており、当事者双方が届出義務を負う。"},{"text":"監視区域における届出対象面積は、都道府県の規則により、事後届出の面積基準より小さい面積で定めることができる。","is_correct":true,"explanation":"正しい。監視区域では地価の急激な上昇等に対応するため、都道府県(指定都市)の規則で届出対象面積を事後届出の基準未満に引き下げて定めることができる。"},{"text":"注視区域内の事前届出では、土地の利用目的のみを届け出れば足り、予定対価の額を届け出る必要はない。","is_correct":false,"explanation":"誤り。事前届出では予定対価の額と利用目的の双方を届け出る必要があり、勧告も両方を対象として行われ得る。"},{"text":"注視区域は、地価が一定期間内に社会的経済的事情に照らして相当な程度を超えて上昇するおそれがある区域について、市町村長が指定する。","is_correct":false,"explanation":"誤り。注視区域・監視区域を指定するのは都道府県知事(指定都市ではその長)であり、市町村長ではない。"}],"explanation":"注視区域・監視区域では、地価上昇の程度に応じて契約前のチェックを行う事前届出制が採用され、予定対価の額と利用目的の双方が届出・勧告の対象となる。特に監視区域では、規則により届出対象面積を引き下げて小規模な取引まで監視できる点が特徴である。地価高騰を未然に抑止するための強化された仕組みといえる。","difficulty":2,"tags":["法令上の制限","国土利用計画法"],"shuffle_choices":true},{"id":"Q3040","topic":"国土利用計画法","question_type":"select_correct","question":"国土利用計画法の事後届出義務に違反した場合の効果に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"事後届出をしないで土地売買等の契約を履行した場合、当該契約は無効となる。","is_correct":false,"explanation":"誤り。届出をしなくても契約の私法上の効力には影響がなく、契約は有効である。"},{"text":"事後届出をしなかった場合でも罰則の適用はなく、都道府県知事による公表の対象となるにとどまる。","is_correct":false,"explanation":"誤り。公表は勧告に従わなかった場合の措置である。届出義務違反そのものには罰則が定められている。"},{"text":"都道府県知事の勧告に従わなかった者は、6月以下の拘禁刑又は100万円以下の罰金に処せられる。","is_correct":false,"explanation":"誤り。勧告に従わないことへの罰則はなく、公表ができるにとどまる。罰則の対象は届出をしなかった場合等である。"},{"text":"事後届出をしなかった者は6月以下の拘禁刑又は100万円以下の罰金に処せられるが、契約自体は有効である。","is_correct":true,"explanation":"正しい。無届出には6月以下の拘禁刑又は100万円以下の罰金という罰則が科されるが、契約の効力自体は否定されない。"}],"explanation":"事後届出制では「届出をしないこと」に対して罰則(6月以下の拘禁刑又は100万円以下の罰金)が科される一方、契約の効力は有効なまま維持される。逆に「勧告に従わないこと」には罰則がなく公表のみである。制裁の対象と内容の対応関係を正確に区別することがポイントである。","difficulty":2,"tags":["法令上の制限","国土利用計画法"],"shuffle_choices":true},{"id":"Q3041","topic":"国土利用計画法","question_type":"select_incorrect","question":"国土利用計画法の事後届出における「一団の土地」の取扱いに関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"事後届出の要否は、権利取得者が取得する土地の合計面積が面積基準に達するかどうかで判断される。","is_correct":false,"explanation":"正しい記述である。事後届出では取得する側を基準とする、いわゆる「買いの一団」で判断する。"},{"text":"市街化区域内で、同一の買主が隣接する1,200㎡と900㎡の土地を順次購入する場合、合計が2,100㎡となるため、それぞれの契約について事後届出が必要である。","is_correct":false,"explanation":"正しい記述である。一団の土地として合計2,000㎡以上を取得する計画であれば、個々の契約面積が基準未満でも、各契約ごとに届出が必要となる。"},{"text":"一団の土地に当たるかどうかは売主側の土地を基準に判断するため、売主が一団の2,000㎡以上の土地を分割して販売する場合、市街化区域内で2,000㎡未満を取得した各買主も事後届出が必要である。","is_correct":true,"explanation":"誤りである。事後届出は権利取得者(買主)側を基準に判断するため、各買主の取得面積が2,000㎡未満であれば、売主側で一団の土地であっても各買主に届出義務はない。"},{"text":"都市計画区域外において、同一の買主が一団の土地として合計10,000㎡以上となる土地を順次取得する場合、各契約について事後届出が必要である。","is_correct":false,"explanation":"正しい記述である。都市計画区域外の基準は10,000㎡以上であり、一団の土地として合計が基準以上となる取得には各契約ごとに届出が必要である。"}],"explanation":"事後届出は取得後の土地利用をチェックする制度であるため、面積判定は権利取得者が取得する側(買いの一団)を基準とする。売主が大きな土地を分割販売しても、各買主の取得面積が基準未満なら届出不要であり、逆に買主が基準以上の一団の土地を分割取得する場合は個々の契約ごとに届出が必要となる。","difficulty":3,"tags":["法令上の制限","国土利用計画法"],"shuffle_choices":true},{"id":"Q3042","topic":"農地法","question_type":"select_correct","question":"農地法第3条の許可に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"農地を耕作目的で売買する場合、当事者は原則として農業委員会の許可を受けなければならない。","is_correct":true,"explanation":"正しい。農地を農地のまま権利移動する場合の3条許可の許可権者は農業委員会である。"},{"text":"相続により農地の所有権を取得する場合には、あらかじめ農業委員会の許可を受けなければならない。","is_correct":false,"explanation":"誤り。相続は契約による権利移動ではないため3条許可は不要である。ただし、取得後遅滞なく農業委員会に届け出る必要がある。"},{"text":"市街化区域内の農地を耕作目的で取得する場合は、あらかじめ農業委員会に届け出れば3条許可は不要である。","is_correct":false,"explanation":"誤り。市街化区域内の届出特例があるのは転用に係る4条・5条であり、3条(権利移動)には市街化区域内の特例はなく、原則どおり許可が必要である。"},{"text":"3条許可を受けずに締結した農地の売買契約も、当事者間では有効に効力を生ずる。","is_correct":false,"explanation":"誤り。3条許可を受けない権利移動は、その効力を生じない(無効)。"}],"explanation":"農地を農地のまま権利移動する3条許可は、農地の耕作者としての適格性を審査するもので、許可権者は農業委員会である。相続・遺産分割など契約によらない取得は許可不要だが、農業委員会への届出が必要となる。市街化区域内の届出特例は転用規制(4条・5条)にしかない点が頻出のひっかけである。","difficulty":1,"tags":["法令上の制限","農地法"],"shuffle_choices":true},{"id":"Q3043","topic":"農地法","question_type":"select_correct","question":"農地法第4条の許可に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"自己所有の農地を駐車場に転用する場合の4条許可の許可権者は、農業委員会である。","is_correct":false,"explanation":"誤り。4条許可の許可権者は都道府県知事(指定市町村の区域内では指定市町村の長)であり、農業委員会ではない。"},{"text":"市街化区域内の自己所有の農地を住宅用地に転用する場合、あらかじめ農業委員会に届け出れば4条許可を受ける必要はない。","is_correct":true,"explanation":"正しい。市街化区域内の農地の転用は、あらかじめ農業委員会に届け出れば許可不要となる特例がある。"},{"text":"市街化調整区域内の自己所有の農地を資材置場に転用する場合、あらかじめ農業委員会に届け出れば4条許可を受ける必要はない。","is_correct":false,"explanation":"誤り。届出で足りる特例は市街化区域内の農地に限られる。市街化調整区域内では原則どおり知事等の許可が必要である。"},{"text":"農地を一時的に砂利採取場として利用し、その後農地に復元する場合には、4条許可を受ける必要はない。","is_correct":false,"explanation":"誤り。一時的な転用であっても農地を農地以外のものにする以上、4条許可が必要である。"}],"explanation":"4条は自己の農地を農地以外に転用する場合の規制で、許可権者は都道府県知事等である。市街化区域は市街化を図るべき区域であるため、あらかじめ農業委員会に届け出れば許可不要という特例が設けられている。一時転用にも許可が必要な点に注意したい。","difficulty":1,"tags":["法令上の制限","農地法"],"shuffle_choices":true},{"id":"Q3044","topic":"農地法","question_type":"select_incorrect","question":"農地法第5条の許可に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"5条許可の許可権者は、都道府県知事(指定市町村の区域内では指定市町村の長)である。","is_correct":false,"explanation":"正しい記述である。転用目的の権利移動である5条許可の許可権者は、4条と同じく都道府県知事等である。"},{"text":"市街化区域内の農地を住宅建設の目的で購入する場合、あらかじめ農業委員会に届け出れば5条許可は不要である。","is_correct":false,"explanation":"正しい記述である。市街化区域内の特例は5条にも適用され、あらかじめの届出で許可が不要となる。"},{"text":"採草放牧地を宅地に転用する目的で取得する場合も、5条許可の対象となる。","is_correct":false,"explanation":"正しい記述である。5条は農地だけでなく、採草放牧地を農地以外(宅地等)に転用する目的での権利移動も対象とする。"},{"text":"農地を耕作目的のまま購入する場合も、5条許可を受けなければならない。","is_correct":true,"explanation":"誤りである。農地を農地のまま取得する権利移動は3条許可(農業委員会)の対象であり、5条は転用目的の権利移動を対象とする。"}],"explanation":"5条は「転用目的での権利移動」を規制するもので、3条(権利移動)と4条(転用)の両方の性質を併せもつ。許可権者は知事等であり、市街化区域内ではあらかじめの農業委員会への届出で足りる。どの条文がどの行為を規制するのかの振り分けが最重要ポイントである。","difficulty":2,"tags":["法令上の制限","農地法"],"shuffle_choices":true},{"id":"Q3045","topic":"農地法","question_type":"select_correct","question":"農地法の許可を受けずに行われた行為の効力等に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"5条許可を受けずに締結した農地の売買契約は、当事者間では有効であり、所有権移転登記もすることができる。","is_correct":false,"explanation":"誤り。許可を受けない契約は効力を生じない(無効)ため、所有権は移転せず、移転登記もできない。"},{"text":"許可を受けずに農地を転用した者に対する原状回復命令は、市町村長のみが行うことができる。","is_correct":false,"explanation":"誤り。違反転用に対する工事の停止命令や原状回復命令は、都道府県知事(指定市町村の長)が行うことができる。"},{"text":"許可を受けずに農地を転用した場合でも、罰則の適用はない。","is_correct":false,"explanation":"誤り。違反転用には3年以下の拘禁刑又は300万円以下の罰金(法人による違反転用は1億円以下の罰金)という重い罰則が定められている。"},{"text":"3条又は5条の許可を受けずに締結した売買契約は効力を生ぜず、違反転用者に対しては都道府県知事等が原状回復等の措置を命ずることができる。","is_correct":true,"explanation":"正しい。無許可の権利移動は無効であり、違反転用に対しては知事等が工事停止・原状回復その他必要な措置を命ずることができる。"}],"explanation":"農地法の許可は契約の効力要件であり、許可のない3条・5条の契約は無効となる。さらに違反転用に対しては知事等による工事停止命令・原状回復命令が可能で、罰則も個人3年以下の拘禁刑又は300万円以下の罰金、法人には1億円以下の罰金と厳しい。農地の確保という制度趣旨から強力な是正手段が用意されている。","difficulty":2,"tags":["法令上の制限","農地法"],"shuffle_choices":true},{"id":"Q3046","topic":"農地法","question_type":"select_correct","question":"農地の賃貸借の対抗力に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"農地の賃貸借は、その登記をしなければ、農地の所有権を取得した第三者に対抗することができない。","is_correct":false,"explanation":"誤り。農地の賃貸借には引渡しによる対抗力が認められており、登記がなくても対抗できる場合がある。"},{"text":"農地の使用貸借についても、引渡しがあれば第三者に対抗することができる。","is_correct":false,"explanation":"誤り。引渡しによる対抗力が認められるのは賃貸借であり、無償契約である使用貸借には認められない。"},{"text":"農地の賃貸借は、登記がなくても、農地の引渡しがあれば、その後に所有権を取得した第三者に対抗することができる。","is_correct":true,"explanation":"正しい。農地法は、登記を備えにくい小作人保護のため、引渡しをもって賃貸借の対抗要件と認めている。"},{"text":"農地の賃貸借を第三者に対抗するためには、引渡しに加えて農業委員会の承認を受けなければならない。","is_correct":false,"explanation":"誤り。対抗要件として必要なのは引渡し(又は登記)であり、農業委員会の承認は対抗要件ではない。"}],"explanation":"民法の原則では不動産賃貸借の対抗要件は登記だが、農地法は耕作者保護の観点から、農地・採草放牧地の賃貸借について引渡しに対抗力を認めている。借地借家法の建物引渡し(借家)と同様の発想であり、無償の使用貸借には適用がない点に注意したい。","difficulty":1,"tags":["法令上の制限","農地法"],"shuffle_choices":true},{"id":"Q3047","topic":"農地法","question_type":"select_incorrect","question":"農地法の許可の例外に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"耕作の事業を行う者が、自己所有の2アール未満の農地を自己の農作物の育成又は養畜の事業のための農業用施設に転用する場合、4条許可は不要である。","is_correct":false,"explanation":"正しい記述である。2アール(200㎡)未満の農地を自己の農業用施設(温室・畜舎等)に転用する場合は、4条許可が不要とされている。"},{"text":"2アール未満の農地を農業用施設の用地として第三者から取得する場合も、5条許可は不要である。","is_correct":true,"explanation":"誤りである。2アール未満の農業用施設への転用の例外は4条(自己転用)にのみ認められており、権利移動を伴う5条にはこの例外はなく、原則どおり許可が必要である。"},{"text":"国又は都道府県等が道路の用に供するために農地を転用する場合、4条許可は不要である。","is_correct":false,"explanation":"正しい記述である。国・都道府県等が道路・農業用排水施設など一定の施設の用に供するため転用する場合は許可不要である。"},{"text":"土地収用法により収用された農地を、その収用に係る目的に供するため転用する場合、許可は不要である。","is_correct":false,"explanation":"正しい記述である。土地収用法により収用・使用された農地をその目的に転用する場合は許可不要とされている。"}],"explanation":"2アール未満の自己の農業用施設への転用の例外は4条だけの例外であり、5条(転用目的の権利移動)には適用されない。第三者から農地を取得する場合には農地の減少に加えて権利関係の変動も生じるため、規模が小さくても許可を要するという制度設計である。例外規定が「どの条文の例外か」を意識して整理したい。","difficulty":3,"tags":["法令上の制限","農地法"],"shuffle_choices":true},{"id":"Q3048","topic":"盛土規制法","question_type":"select_correct","question":"宅地造成及び特定盛土等規制法(盛土規制法)の宅地造成等工事規制区域に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"都道府県知事(指定都市・中核市の区域内ではその長)は、宅地造成等に伴い災害が生ずるおそれが大きい市街地若しくは市街地となろうとする土地の区域又は集落の区域等について、関係市町村長の意見を聴いて、宅地造成等工事規制区域を指定することができる。","is_correct":true,"explanation":"正しい。規制区域の指定権者は都道府県知事等であり、市街地・市街地となろうとする区域や集落の区域とその周辺で、災害のおそれが大きい区域を指定できる。"},{"text":"宅地造成等工事規制区域は、国土交通大臣が指定する。","is_correct":false,"explanation":"誤り。規制区域を指定するのは都道府県知事(指定都市・中核市ではその長)であり、国土交通大臣ではない。"},{"text":"宅地造成等工事規制区域は、都市計画区域内に限って指定することができる。","is_correct":false,"explanation":"誤り。規制区域は災害防止の観点から指定されるものであり、都市計画区域の内外を問わず指定できる。"},{"text":"農地や森林である土地は、宅地造成等工事規制区域に含めて指定することができない。","is_correct":false,"explanation":"誤り。盛土規制法は土地の用途にかかわらず危険な盛土等を規制する法律であり、農地・森林を含む区域も規制区域に指定できる。"}],"explanation":"盛土規制法は、旧宅地造成等規制法を抜本改正し、宅地に限らず農地・森林等も含めて危険な盛土等を包括的に規制する法律である。宅地造成等工事規制区域は知事等が関係市町村長の意見を聴いて指定し、都市計画区域外にも指定できる。「宅地」に限定されない点が旧法との大きな違いである。","difficulty":1,"tags":["法令上の制限","盛土規制法"],"shuffle_choices":true},{"id":"Q3049","topic":"盛土規制法","question_type":"select_correct","question":"宅地造成等工事規制区域内において、都道府県知事等の許可が必要となる工事に関する次の記述のうち、正しいものはどれか。なお、いずれも宅地造成に該当する切土又は盛土であるものとする。","choices":[{"text":"盛土であって、高さがちょうど1mの崖を生ずることとなるものは、許可が必要である。","is_correct":false,"explanation":"誤り。盛土で許可が必要となるのは高さ1mを「超える」崖を生ずるものであり、ちょうど1mの崖では該当しない。"},{"text":"盛土と切土とを同時に行い、高さ1.5mの崖を生ずることとなる工事は、許可が必要である。","is_correct":false,"explanation":"誤り。盛土と切土を同時に行う場合に許可が必要となるのは、合わせて高さ2mを超える崖を生ずるものである。1.5mでは該当しない(ただし盛土部分単独で1m超の崖を生ずる場合は別)。"},{"text":"崖を生じない盛土又は切土であって、その面積がちょうど500㎡のものは、許可が必要である。","is_correct":false,"explanation":"誤り。面積基準は500㎡を「超える」ものであり、ちょうど500㎡では該当しない。"},{"text":"切土であって、高さが2mを超える崖を生ずることとなる工事は、許可が必要である。","is_correct":true,"explanation":"正しい。切土で高さ2mを超える崖を生ずる工事は宅地造成に該当し、知事等の許可が必要である。"}],"explanation":"許可が必要となる規模は、盛土で1m超の崖、切土で2m超の崖、盛土と切土を合わせて2m超の崖、崖を生じない盛土で高さ2m超、盛土又は切土をする面積が500㎡超である。いずれも「超える」であり、「以上」ではない点が数字のひっかけどころである。崩落しやすい盛土の基準(1m超)が切土(2m超)より厳しいのは、災害リスクの差を反映したものである。","difficulty":1,"tags":["法令上の制限","盛土規制法"],"shuffle_choices":true},{"id":"Q3050","topic":"盛土規制法","question_type":"select_incorrect","question":"宅地造成等工事規制区域内における宅地造成等に関する工事の許可に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"崖を生じない盛土であっても、その高さが2mを超えるものは、許可が必要である。","is_correct":false,"explanation":"正しい記述である。崖を生じない場合でも、高さ2m超の盛土は許可対象となる。"},{"text":"宅地造成等工事規制区域内で行う盛土の工事は、規模にかかわらず、すべて都道府県知事等の許可を受けなければならない。","is_correct":true,"explanation":"誤りである。許可が必要となるのは政令で定める一定規模(盛土1m超の崖、切土2m超の崖、盛土切土合計2m超の崖、崖なし盛土2m超、面積500㎡超)の工事であり、すべての盛土に許可が必要となるわけではない。"},{"text":"盛土と切土とを同時にする場合において、合わせて高さ2mを超える崖を生ずることとなる工事は、許可が必要である。","is_correct":false,"explanation":"正しい記述である。盛土と切土を合わせて2m超の崖を生ずる工事は許可対象である。"},{"text":"崖を生じない工事であっても、盛土又は切土をする土地の面積が500㎡を超えるものは、許可が必要である。","is_correct":false,"explanation":"正しい記述である。崖の有無や高さにかかわらず、面積が500㎡を超える盛土・切土は許可対象となる。"}],"explanation":"許可制の対象は災害発生のおそれが類型的に大きい一定規模以上の工事に限られており、小規模な盛土まですべて許可が必要となるわけではない。5つの規模基準(1m超・2m超・2m超・2m超・500㎡超)をセットで正確に記憶することが得点の鍵となる。","difficulty":2,"tags":["法令上の制限","盛土規制法"],"shuffle_choices":true},{"id":"Q3051","topic":"盛土規制法","question_type":"select_correct","question":"宅地造成等工事規制区域内における届出に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"宅地造成等工事規制区域の指定の際、当該区域内において既に宅地造成等に関する工事を行っている者は、指定があった日から21日以内に、都道府県知事等に当該工事について届け出なければならない。","is_correct":true,"explanation":"正しい。規制区域指定の際に現に行われている工事については、改めて許可を受ける必要はなく、指定日から21日以内の届出で足りる。"},{"text":"高さが2mを超える擁壁の全部又は一部を除却する工事を行おうとする者は、工事完了後14日以内に都道府県知事等に届け出なければならない。","is_correct":false,"explanation":"誤り。擁壁等の除却工事の届出は、工事に着手する日の14日「前まで」に行う事前届出であり、事後の届出ではない。"},{"text":"公共施設用地を宅地又は農地等に転用した者は、あらかじめ都道府県知事等の許可を受けなければならない。","is_correct":false,"explanation":"誤り。公共施設用地の転用は許可ではなく、転用した日から14日以内に知事等へ届け出れば足りる。"},{"text":"宅地造成等工事規制区域の指定の際に既に行われている宅地造成等に関する工事については、指定後改めて都道府県知事等の許可を受けなければ、工事を続行することができない。","is_correct":false,"explanation":"誤り。指定の際に現に行われている工事は許可を受ける必要はなく、21日以内の届出をすれば続行できる。"}],"explanation":"規制区域内の届出には、①指定の際に工事中の場合は指定日から21日以内、②高さ2m超の擁壁や崖面崩壊防止施設・排水施設等の除却工事は着手14日前まで、③公共施設用地の転用は転用後14日以内、という3つの類型がある。「21日以内・14日前まで・14日以内」という数字と事前・事後の区別が出題の中心である。","difficulty":3,"tags":["法令上の制限","盛土規制法"],"shuffle_choices":true},{"id":"Q3052","topic":"盛土規制法","question_type":"select_correct","question":"宅地造成等工事規制区域内の許可を受けた工事の検査に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"宅地造成等に関する工事の完了検査は、当該土地の所在する市町村の長が行う。","is_correct":false,"explanation":"誤り。完了検査を行うのは許可権者である都道府県知事(指定都市・中核市の長)であり、一般の市町村長ではない。"},{"text":"特定工程を含む工事について行われる中間検査は任意の制度であり、工事主は中間検査を受けないことを選択できる。","is_correct":false,"explanation":"誤り。政令で定める規模の工事において特定工程(擁壁の設置工事など)に係る工事を終えたときは、中間検査の申請が義務付けられている。"},{"text":"許可を受けた宅地造成等に関する工事が完了したときは、工事主は都道府県知事等の完了検査を申請しなければならず、工事が技術的基準等に適合していれば検査済証が交付される。","is_correct":true,"explanation":"正しい。工事完了時には知事等の検査を受けることが義務付けられており、基準適合が確認されると検査済証が交付される。"},{"text":"完了検査に合格した工事については、その後に擁壁が技術的基準に適合しないことが判明した場合でも、都道府県知事等が是正のための措置を求めることは一切できない。","is_correct":false,"explanation":"誤り。検査済証の交付後であっても、災害防止のため必要があるときは、知事等は改善命令等の措置をとることができる。"}],"explanation":"盛土規制法では、許可時の審査に加え、施工段階での中間検査と工事完了時の完了検査という二段階のチェックが制度化され、盛土等の安全性を工事の過程を通じて確認する仕組みとなっている。旧宅地造成等規制法にはなかった中間検査が導入された点が改正の重要ポイントである。","difficulty":2,"tags":["法令上の制限","盛土規制法"],"shuffle_choices":true},{"id":"Q3053","topic":"盛土規制法","question_type":"select_correct","question":"宅地造成及び特定盛土等規制法の特定盛土等規制区域に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"特定盛土等規制区域は、宅地造成等工事規制区域の区域内に重ねて指定することができる。","is_correct":false,"explanation":"誤り。特定盛土等規制区域は、宅地造成等工事規制区域以外の区域について指定されるものであり、重ねて指定することはできない。"},{"text":"特定盛土等規制区域内において、盛土で高さ1mを超える崖を生ずる工事など一定規模の特定盛土等に関する工事を行おうとする工事主は、原則として工事に着手する日の30日前までに都道府県知事等に届け出なければならない。","is_correct":true,"explanation":"正しい。特定盛土等規制区域では、宅地造成等工事規制区域の許可対象と同じ規模の工事について、着手30日前までの届出が義務付けられている。"},{"text":"特定盛土等規制区域内で行う盛土又は切土の工事は、規模にかかわらず、すべて都道府県知事等の許可を受けなければならない。","is_correct":false,"explanation":"誤り。特定盛土等規制区域では一定規模の工事は届出制であり、許可が必要となるのは盛土で高さ2m超の崖を生ずるものなど、より大規模な工事に限られる。"},{"text":"特定盛土等規制区域は、市街地の中心部の区域に限って指定される。","is_correct":false,"explanation":"誤り。特定盛土等規制区域は、市街地や集落から離れた区域であっても、盛土等の崩落により居住者等に危害を及ぼしうる区域(渓流沿いの山間部など)に指定されるものである。"}],"explanation":"特定盛土等規制区域は、市街地等から離れていても盛土等が崩落すれば人家等に被害を及ぼしうる区域を対象とし、宅地造成等工事規制区域の外側に指定される。基本は着手30日前までの届出制で、特に大規模なもの(盛土2m超の崖等)は許可制となる二段構えである。危険な盛土をすき間なく規制するという法改正の趣旨を体現した制度である。","difficulty":3,"tags":["法令上の制限","盛土規制法"],"shuffle_choices":true},{"id":"Q3054","topic":"盛土規制法","question_type":"select_correct","question":"宅地造成及び特定盛土等規制法の造成宅地防災区域に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"造成宅地防災区域は、宅地造成等工事規制区域内の造成宅地についても指定することができる。","is_correct":false,"explanation":"誤り。造成宅地防災区域は宅地造成等工事規制区域「以外」の区域に指定されるものであり、規制区域内に指定することはできない。"},{"text":"造成宅地防災区域の指定は、市町村長が行う。","is_correct":false,"explanation":"誤り。指定するのは都道府県知事(指定都市・中核市ではその長)である。"},{"text":"都道府県知事等は、宅地造成又は特定盛土等に伴う災害で相当数の居住者等に危害を生ずるものの発生のおそれが大きい既に造成された宅地について、宅地造成等工事規制区域外の区域を造成宅地防災区域として指定することができる。","is_correct":true,"explanation":"正しい。造成宅地防災区域は、既に造成が完了した宅地のうち災害発生のおそれが大きいものについて、規制区域外に指定される。"},{"text":"造成宅地防災区域に指定された区域内では、新たな宅地造成に関する工事は一律に禁止される。","is_correct":false,"explanation":"誤り。指定の効果は工事の一律禁止ではなく、所有者等の災害防止努力義務、知事等による勧告・改善命令である。"}],"explanation":"造成宅地防災区域は、過去に造成された既存の宅地(大規模盛土造成地など)が地震等で崩落するおそれに対処するための制度であり、これから行う工事を規制する宅地造成等工事規制区域とは役割が異なる。指定されると所有者等に災害防止の努力義務が課され、知事等は擁壁設置等の勧告や改善命令ができる。","difficulty":2,"tags":["法令上の制限","盛土規制法"],"shuffle_choices":true},{"id":"Q3055","topic":"盛土規制法","question_type":"select_incorrect","question":"宅地造成及び特定盛土等規制法に基づく監督処分等に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"都道府県知事等は、許可を受けずに宅地造成等に関する工事が行われている場合、当該工事の施行の停止を命ずることができる。","is_correct":false,"explanation":"正しい記述である。無許可工事に対しては、知事等が工事の施行停止や災害防止のための措置を命ずることができる。"},{"text":"都道府県知事等は、許可に付した条件に違反した者に対して、その許可を取り消すことができる。","is_correct":false,"explanation":"正しい記述である。偽りその他不正な手段による許可取得や許可条件違反に対しては、許可の取消しができる。"},{"text":"都道府県知事等は、宅地造成等工事規制区域内の土地について、災害の防止のため必要があると認める場合には、その土地の所有者等に対して、擁壁の設置等の措置をとることを勧告することができる。","is_correct":false,"explanation":"正しい記述である。規制区域内の土地の保全のため、知事等は所有者・管理者・占有者等に対し災害防止措置を勧告できる。"},{"text":"監督処分の対象となるのは工事主に限られ、工事施行者や現場の管理者が命令の対象となることはない。","is_correct":true,"explanation":"誤りである。監督処分や災害防止のための命令は、工事主だけでなく、工事の請負人(工事施行者)や現場管理者、土地の所有者・管理者・占有者等も対象となり得る。"}],"explanation":"盛土規制法は、無許可行為や基準違反に対して工事停止命令・許可取消し・改善命令などの監督処分を用意し、その名宛人も工事主に限らず工事施行者や土地の所有者等まで広く及ぶ。危険な盛土等を放置させないため、責任追及の対象を広くとらえているのが特徴である。","difficulty":2,"tags":["法令上の制限","盛土規制法"],"shuffle_choices":true},{"id":"Q3056","topic":"土地区画整理法","question_type":"select_correct","question":"土地区画整理事業の施行者に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"宅地の所有者又は借地権者は、1人で、又は数人が共同して、その宅地について土地区画整理事業を施行することができる。","is_correct":true,"explanation":"正しい。個人施行者として、宅地の所有者・借地権者(又はその同意を得た者)は1人又は数人共同で施行することができる。"},{"text":"民間の株式会社は、土地区画整理事業の施行者となることはできない。","is_correct":false,"explanation":"誤り。宅地の所有者又は借地権者を株主とする一定の要件を満たした株式会社(区画整理会社)は、施行者となることができる。"},{"text":"都道府県は、土地区画整理事業を施行することができない。","is_correct":false,"explanation":"誤り。都道府県・市町村は、施行区域内の土地について都市計画事業として土地区画整理事業を施行することができる。"},{"text":"土地区画整理組合が施行する土地区画整理事業は、必ず都市計画事業として施行しなければならない。","is_correct":false,"explanation":"誤り。都市計画事業として施行区域内で施行する義務があるのは都道府県・市町村等の公的施行であり、組合など民間施行は都市計画事業として施行することを要しない。"}],"explanation":"施行者には、個人・土地区画整理組合・区画整理会社という民間施行と、都道府県・市町村・国土交通大臣・UR等の公的施行がある。公的施行は都市計画で定められた施行区域内で都市計画事業として行う必要があるのに対し、民間施行にはその制約がない。施行者ごとの違いを軸に整理するのが効率的である。","difficulty":1,"tags":["法令上の制限","土地区画整理法"],"shuffle_choices":true},{"id":"Q3057","topic":"土地区画整理法","question_type":"select_incorrect","question":"土地区画整理組合に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"土地区画整理組合を設立しようとする者は、7人以上共同して、定款及び事業計画を定め、都道府県知事の認可を受けなければならない。","is_correct":false,"explanation":"正しい記述である。組合の設立には7人以上の共同と知事の認可が必要である。"},{"text":"組合が設立されると、施行地区内の宅地について所有権又は借地権を有する者は、すべてその組合の組合員となる。","is_correct":false,"explanation":"正しい記述である。組合設立に同意しなかった者も含め、施行地区内の宅地の所有者・借地権者は全員が組合員となる(強制加入)。"},{"text":"組合は、その事業に要する経費に充てるため、賦課金として参加組合員以外の組合員に対して金銭を賦課徴収することができる。","is_correct":false,"explanation":"正しい記述である。組合は事業費に充てるため組合員に賦課金を賦課徴収でき、組合員は相殺をもって納付を拒むことができない。"},{"text":"組合が賦課金を徴収するには、組合員全員の同意を得なければならない。","is_correct":true,"explanation":"誤りである。賦課金の徴収に組合員全員の同意は不要であり、総会の議決等の手続によって賦課徴収することができる。"}],"explanation":"土地区画整理組合は、7人以上の共同による定款・事業計画の作成と知事の認可により設立され、施行地区内の宅地の所有者・借地権者は同意の有無を問わず全員組合員となる。事業費が不足する場合には賦課金を徴収でき、全員の同意までは要求されない。強制加入と賦課金は、事業を確実に遂行するための仕組みである。","difficulty":2,"tags":["法令上の制限","土地区画整理法"],"shuffle_choices":true},{"id":"Q3058","topic":"土地区画整理法","question_type":"select_correct","question":"土地区画整理法の換地処分に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"換地処分は、関係権利者に対する個別の通知によらず、公告のみによって行われる。","is_correct":false,"explanation":"誤り。換地処分は関係権利者に換地計画において定められた事項を通知して行うものであり、その後に知事等が換地処分があった旨を公告する。"},{"text":"換地計画において定められた換地は、換地処分の公告があった日の翌日から、従前の宅地とみなされる。","is_correct":true,"explanation":"正しい。換地は公告日の「翌日」から従前の宅地とみなされ、従前の宅地上の権利関係が換地上に移行する。"},{"text":"換地処分は、いかなる場合も土地区画整理事業の工事がすべて完了した後でなければ行うことができない。","is_correct":false,"explanation":"誤り。換地処分は工事完了後に遅滞なく行うのが原則であるが、規準・規約・定款又は施行規程に別段の定めがあれば、工事完了前でも行うことができる。"},{"text":"換地計画において換地を定めなかった従前の宅地について存する権利は、換地処分の公告があった日の翌日に消滅する。","is_correct":false,"explanation":"誤り。換地を定めなかった従前の宅地上の権利は、公告があった日が終了した時(公告の日の終了時)に消滅する。翌日ではない。"}],"explanation":"換地処分の効果は、権利の消滅系(換地を定めない宅地の権利消滅、行使の利益がなくなった地役権の消滅等)が公告の日の終了時、権利の取得系(換地が従前の宅地とみなされる、清算金の確定、保留地の取得等)が公告の翌日と整理できる。「公告の日の終了時」と「翌日」の振り分けが最頻出ポイントである。","difficulty":2,"tags":["法令上の制限","土地区画整理法"],"shuffle_choices":true},{"id":"Q3059","topic":"土地区画整理法","question_type":"select_correct","question":"土地区画整理事業の仮換地に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"仮換地が指定されると、従前の宅地の所有権は仮換地の上に移転する。","is_correct":false,"explanation":"誤り。仮換地の指定によって移転するのは使用収益権のみであり、所有権は依然として従前の宅地の上に存する。"},{"text":"仮換地の指定を受けた者は、仮換地の指定の効力発生の日以後も、従前の宅地を引き続き使用収益することができる。","is_correct":false,"explanation":"誤り。仮換地指定の効力発生日以後は、従前の宅地の使用収益はできなくなる。"},{"text":"仮換地の指定を受けた従前の宅地の所有者は、指定の効力発生の日から換地処分の公告がある日まで、仮換地を使用収益することができる一方、従前の宅地については使用収益することができなくなる。","is_correct":true,"explanation":"正しい。仮換地指定により使用収益権が仮換地に移り、従前の宅地は施行者が管理することとなるため、従前の宅地の使用収益はできなくなる。"},{"text":"仮換地の指定後に従前の宅地を売却する場合、売買契約の目的物は仮換地としなければならない。","is_correct":false,"explanation":"誤り。所有権は従前の宅地に残っているため、処分(売却・抵当権設定等)の対象はあくまで従前の宅地である。"}],"explanation":"仮換地の指定は、換地処分に先立って使用収益の場所を暫定的に移す制度であり、「使用収益は仮換地で、処分は従前の宅地で」という関係になる。所有権の帰属と使用収益権の所在を分けて考えることが、仮換地問題を解く基本である。","difficulty":1,"tags":["法令上の制限","土地区画整理法"],"shuffle_choices":true},{"id":"Q3060","topic":"土地区画整理法","question_type":"select_correct","question":"土地区画整理事業の保留地に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"換地計画において定められた保留地は、換地処分の公告があった日の翌日において、施行者が取得する。","is_correct":true,"explanation":"正しい。保留地は換地処分の公告の翌日に施行者が取得し、その後の売却代金が事業費等に充てられる。"},{"text":"換地計画において定められた保留地は、換地処分の公告があった日に、市町村に帰属する。","is_correct":false,"explanation":"誤り。保留地を取得するのは施行者であり、市町村ではない。また取得の時期は公告の日ではなく、公告があった日の翌日である。"},{"text":"土地区画整理組合が保留地を定めるには、土地区画整理審議会の同意を得なければならない。","is_correct":false,"explanation":"誤り。土地区画整理審議会は都道府県・市町村等の公的施行の場合に設置される機関であり、組合施行では設置されない。審議会の同意が必要となるのは公的施行が保留地を定める場合である。"},{"text":"都道府県が施行する土地区画整理事業では、事業に要する費用に充てる目的であれば、施行後の宅地の価額の総額にかかわらず自由に保留地を定めることができる。","is_correct":false,"explanation":"誤り。公的施行では、施行後の宅地の価額の総額が施行前の宅地の価額の総額を超える場合に、その差額の範囲内でのみ保留地を定めることができる。"}],"explanation":"保留地は、換地として定めずに残しておき、その売却益を事業費等に充てるための土地である。民間施行(個人・組合・区画整理会社)は事業費充当のほか定款等で定める目的のためにも定められるが、公的施行は価額総額の増加分の範囲内という制限があり、土地区画整理審議会の同意も必要となる。帰属は公告の翌日に施行者へ、という点も併せて押さえたい。","difficulty":3,"tags":["法令上の制限","土地区画整理法"],"shuffle_choices":true},{"id":"Q3061","topic":"土地区画整理法","question_type":"select_incorrect","question":"土地区画整理法第76条の建築行為等の制限に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"土地区画整理事業の施行地区内において、事業の施行の障害となるおそれのある建築物の新築を行おうとする者は、許可を受けなければならない。","is_correct":false,"explanation":"正しい記述である。事業の認可等の公告日から換地処分の公告がある日まで、施行の障害となるおそれのある建築行為等は許可制となる。"},{"text":"許可権者は、国土交通大臣が施行する事業にあっては国土交通大臣、その他の者が施行する事業にあっては都道府県知事(市の区域内において個人施行者、組合等が施行する事業にあっては当該市の長)である。","is_correct":false,"explanation":"正しい記述である。76条の許可権者は施行者ではなく、国土交通大臣又は知事等である。"},{"text":"事業の施行の障害となるおそれのある土地の形質の変更や、重量が5tを超える物件の設置・堆積も、許可が必要な行為に含まれる。","is_correct":false,"explanation":"正しい記述である。建築物等の新築・改築・増築のほか、土地の形質の変更、政令で定める移動の容易でない物件(重量5t超)の設置・堆積も許可対象である。"},{"text":"仮換地の指定があった後は、施行地区内で建築物の新築を行う場合でも、76条の許可を受ける必要はない。","is_correct":true,"explanation":"誤りである。76条の制限は事業の認可等の公告日から換地処分の公告がある日まで続くものであり、仮換地の指定によって制限が終了するわけではない。"}],"explanation":"76条の建築行為等の制限は、工事や換地の設計を無意味にする行為を防ぐため、事業認可等の公告から換地処分の公告まで施行地区内全体に及ぶ。許可権者が施行者ではなく国土交通大臣・知事等である点、対象が建築だけでなく形質変更や重量物の設置・堆積にも及ぶ点がひっかけどころである。","difficulty":2,"tags":["法令上の制限","土地区画整理法"],"shuffle_choices":true},{"id":"Q3062","topic":"その他の法令上の制限","question_type":"select_correct","question":"各種法令に基づく行為の制限に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"河川法によれば、河川区域内の土地において工作物を新築しようとする者は、原則として都道府県知事の許可を受けなければならない。","is_correct":false,"explanation":"誤り。河川区域内の工作物の新築等について許可を与えるのは「河川管理者」であり、都道府県知事と特定されているわけではない。"},{"text":"道路法によれば、道路の区域が決定された後、道路の供用が開始されるまでの間に、当該区域内で土地の形質を変更しようとする者は、原則として道路管理者の許可を受けなければならない。","is_correct":true,"explanation":"正しい。道路予定区域内における土地の形質変更・工作物の新築等は、道路管理者の許可が必要である。"},{"text":"海岸法によれば、海岸保全区域内において土石を採取しようとする者は、原則として市町村長の許可を受けなければならない。","is_correct":false,"explanation":"誤り。海岸保全区域内の土石採取等の許可権者は「海岸管理者」である。"},{"text":"港湾法によれば、港湾区域内において一定の水域施設の建設等をしようとする者は、原則として都道府県知事の許可を受けなければならない。","is_correct":false,"explanation":"誤り。港湾区域内の一定行為の許可権者は「港湾管理者」である。"}],"explanation":"その他の法令上の制限では、許可権者が「原則は都道府県知事等」であるのに対し、例外的に固有の管理者が許可権者となる法律(河川法=河川管理者、道路法=道路管理者、海岸法=海岸管理者、港湾法=港湾管理者など)を押さえるのが定石である。「〇〇法は〇〇管理者」という対応関係の例外グループとして一括で覚えるとよい。","difficulty":2,"tags":["法令上の制限","その他の法令"],"shuffle_choices":true},{"id":"Q3063","topic":"その他の法令上の制限","question_type":"select_incorrect","question":"各種法令に基づく行為の制限に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"自然公園法によれば、国定公園の特別地域内において工作物を新築しようとする者は、原則として都道府県知事の許可を受けなければならない。","is_correct":false,"explanation":"正しい記述である。国定公園の特別地域内の行為の許可権者は都道府県知事である。"},{"text":"文化財保護法によれば、重要文化財の現状を変更しようとする者は、原則として文化庁長官の許可を受けなければならない。","is_correct":false,"explanation":"正しい記述である。重要文化財の現状変更等の許可権者は文化庁長官である。"},{"text":"生産緑地法によれば、生産緑地地区内において建築物を新築しようとする者は、原則として市町村長の許可を受けなければならない。","is_correct":false,"explanation":"正しい記述である。生産緑地地区内の建築等の許可権者は市町村長である。"},{"text":"自然公園法によれば、国立公園の特別地域内において工作物を新築しようとする者は、原則として都道府県知事の許可を受けなければならない。","is_correct":true,"explanation":"誤りである。国立公園の特別地域内の行為の許可権者は環境大臣である。都道府県知事が許可権者となるのは国定公園の特別地域である。"}],"explanation":"自然公園法では、国が管理する国立公園は環境大臣、都道府県が管理する国定公園は都道府県知事が許可権者となる。このほか、文化財保護法の文化庁長官、生産緑地法の市町村長など、「知事等」以外が許可・届出の相手方となる法律が横断問題の狙われどころである。誰が管理する制度かをイメージすると覚えやすい。","difficulty":3,"tags":["法令上の制限","その他の法令"],"shuffle_choices":true},{"id":"Q4001","topic":"不動産取得税","question_type":"select_correct","question":"不動産取得税に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"不動産取得税は、不動産の取得に対し、当該不動産の所在する市町村が課する税である。","is_correct":false,"explanation":"不動産取得税は市町村税ではなく、不動産の所在する都道府県が課する道府県税である。固定資産税(市町村税)との課税主体の違いは頻出のひっかけである。"},{"text":"相続により不動産を取得した場合には、その取得に対して不動産取得税が課される。","is_correct":false,"explanation":"相続による取得は、本人の意思に基づかない形式的な所有権の移転であるため、不動産取得税は課されない(非課税)。これに対し贈与による取得は課税される。"},{"text":"個人が贈与により土地を取得した場合には、その取得に対して不動産取得税が課される。","is_correct":true,"explanation":"不動産取得税は、売買・交換・贈与・新築・増改築など、有償・無償を問わず不動産の取得に対して課される。贈与による取得も課税対象である(相続は非課税)。"},{"text":"不動産取得税は、納税者が自ら税額を計算して申告し納付する申告納付の方法によることとされている。","is_correct":false,"explanation":"不動産取得税は、都道府県が税額を計算し納税通知書を交付して徴収する普通徴収の方法による。申告納付ではない。"}],"explanation":"不動産取得税は、不動産の移転という事実に着目して都道府県が課する流通税である。売買・交換・贈与・建築など取得の原因を問わず課されるが、相続や法人の合併など形式的な移転は非課税とされ、徴収は普通徴収による。","difficulty":1,"tags":["税・その他","不動産取得税"],"shuffle_choices":true},{"id":"Q4002","topic":"不動産取得税","question_type":"select_incorrect","question":"不動産取得税の免税点に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"課税標準となるべき額が、土地の取得にあっては30万円、家屋の取得にあっては20万円に満たない場合には、不動産取得税を課することができない。","is_correct":true,"explanation":"誤り。土地30万円・家屋20万円は固定資産税の免税点である。不動産取得税の免税点は、土地10万円、家屋の建築23万円、建築以外の家屋の取得12万円である。"},{"text":"家屋を新築又は増改築により取得した場合、課税標準となるべき額が23万円に満たないときは、不動産取得税を課することができない。","is_correct":false,"explanation":"正しい。家屋の建築(新築・増築・改築)による取得の免税点は23万円である。"},{"text":"売買により家屋を取得した場合、課税標準となるべき額が12万円に満たないときは、不動産取得税を課することができない。","is_correct":false,"explanation":"正しい。建築以外の原因(売買・交換・贈与など)による家屋の取得の免税点は12万円である。"},{"text":"土地を取得した者が、その取得の日から1年以内にその土地に隣接する土地を取得した場合には、前後の取得を合わせて一の土地の取得とみなして免税点の判定が行われる。","is_correct":false,"explanation":"正しい。免税点逃れを防ぐため、1年以内の隣接地の取得は一つの土地の取得とみなして、合算して免税点(10万円)を判定する。"}],"explanation":"不動産取得税の免税点は、土地10万円、家屋の建築23万円、建築以外の家屋の取得12万円である。零細な取得にまで課税する実益がないことから設けられた制度で、固定資産税の免税点(土地30万円・家屋20万円)との混同を狙う出題が多い。","difficulty":2,"tags":["税・その他","不動産取得税"],"shuffle_choices":true},{"id":"Q4003","topic":"不動産取得税","question_type":"select_correct","question":"不動産取得税の課税標準の特例に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"床面積30㎡の新築住宅を取得した場合であっても、課税標準の算定について一戸につき1,200万円を価格から控除する特例の適用を受けることができる。","is_correct":false,"explanation":"新築住宅に係る1,200万円控除の特例は、床面積が50㎡(戸建て以外の貸家住宅は40㎡)以上240㎡以下の住宅に限り適用される。床面積30㎡の住宅には適用されない。"},{"text":"新築住宅に係る課税標準の特例(1,200万円控除)は、個人が取得した場合に限り適用され、法人が取得した場合には適用されない。","is_correct":false,"explanation":"新築住宅の特例は、取得者が個人か法人かを問わず、床面積要件を満たせば適用される。取得者が個人に限定されるのは既存(中古)住宅の特例である。"},{"text":"既存(中古)住宅に係る課税標準の特例は、法人が賃貸の用に供するために取得した場合にも適用される。","is_correct":false,"explanation":"既存住宅の課税標準の特例は、個人が自己の居住の用に供するために取得した場合に限り適用される。法人の取得や賃貸目的の取得には適用されない。"},{"text":"床面積が50㎡以上240㎡以下の新築住宅を取得した場合、課税標準の算定については、一戸につき1,200万円が当該住宅の価格から控除される。","is_correct":true,"explanation":"正しい。一定の床面積要件(50㎡以上240㎡以下。戸建て以外の貸家住宅は40㎡以上240㎡以下)を満たす新築住宅については、一戸につき1,200万円が課税標準から控除される。"}],"explanation":"住宅取得の負担軽減のため、要件を満たす新築住宅は一戸につき1,200万円が課税標準から控除される。新築住宅の特例は取得者を問わないが、既存住宅の特例は個人の自己居住用に限られる点、床面積要件(50㎡以上240㎡以下)が課される点を正確に押さえたい。","difficulty":2,"tags":["税・その他","不動産取得税"],"shuffle_choices":true},{"id":"Q4004","topic":"不動産取得税","question_type":"select_incorrect","question":"不動産取得税に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"宅地を取得した場合において課税標準の特例が適用されるときは、当該宅地の価格の2分の1に相当する額が課税標準となる。","is_correct":false,"explanation":"正しい。宅地及び宅地比準土地の取得については、特例が適用される場合、固定資産課税台帳に登録された価格の2分の1が課税標準とされる。"},{"text":"税率の特例が適用される場合、住宅である家屋の取得に係る税率は3%となるが、住宅用の土地の取得に係る税率は本則どおり4%である。","is_correct":true,"explanation":"誤り。税率の特例が適用される場合、住宅及び土地の取得に係る標準税率はいずれも3%である。4%(本則)が維持されるのは住宅以外の家屋(店舗・事務所等)の取得である。"},{"text":"不動産取得税は普通徴収の方法によって徴収され、納税通知書が納税者に交付される。","is_correct":false,"explanation":"正しい。不動産取得税は、都道府県が納税通知書を交付して徴収する普通徴収の方法による。"},{"text":"国又は地方公共団体が不動産を取得した場合には、不動産取得税は課されない。","is_correct":false,"explanation":"正しい。国、都道府県、市町村等が取得した不動産については、不動産取得税を課することができない(非課税)。"}],"explanation":"税率の特例が適用される場合、土地及び住宅の標準税率は3%であり、4%となるのは住宅以外の家屋のみである。宅地の課税標準を価格の2分の1とする特例と合わせ、土地取得の負担を軽減する趣旨の制度である。","difficulty":3,"tags":["税・その他","不動産取得税"],"shuffle_choices":true},{"id":"Q4005","topic":"固定資産税","question_type":"select_correct","question":"固定資産税に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"固定資産税は、固定資産の所在する都道府県が課する税である。","is_correct":false,"explanation":"固定資産税は市町村が課する市町村税である(東京都の特別区の区域内では都が課する)。都道府県税である不動産取得税とのひっかけに注意。"},{"text":"固定資産税の賦課期日は当該年度の初日の属する年の1月1日であり、原則としてその日現在に固定資産課税台帳に所有者として登録されている者が納税義務者となる。","is_correct":true,"explanation":"正しい。固定資産税は1月1日(賦課期日)現在の状況で課税され、原則として同日現在に課税台帳に所有者として登録されている者がその年度分の納税義務を負う。"},{"text":"年の途中で土地の売買が行われた場合、その年度分の固定資産税は、売主と買主がそれぞれの所有期間に応じて按分して納付する義務を負う。","is_correct":false,"explanation":"法律上は、1月1日現在の所有者がその年度分の全額について納税義務を負う。実務上の日割精算は当事者間の契約上の処理にすぎず、納税義務の分割ではない。"},{"text":"質権が設定されている土地については、質権者ではなく所有者が固定資産税の納税義務を負う。","is_correct":false,"explanation":"質権又は100年より永い存続期間の定めのある地上権が設定されている土地については、所有者ではなく質権者又は地上権者が納税義務を負う。"}],"explanation":"固定資産税は、毎年1月1日現在の固定資産の所有者に対し市町村が課する財産税である。台帳課税主義を採り、原則として賦課期日現在の登録名義人が納税義務者となるが、質権者・100年超の地上権者は例外的に納税義務を負う。","difficulty":1,"tags":["税・その他","固定資産税"],"shuffle_choices":true},{"id":"Q4006","topic":"固定資産税","question_type":"select_incorrect","question":"固定資産税の免税点に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"同一の者が同一市町村の区域内に所有する土地に係る課税標準額の合計が30万円に満たない場合には、原則として固定資産税を課することができない。","is_correct":false,"explanation":"正しい。土地の免税点は、同一市町村内に同一人が所有する土地の課税標準額の合計で30万円である。"},{"text":"同一の者が同一市町村の区域内に所有する家屋に係る課税標準額の合計が20万円に満たない場合には、原則として固定資産税を課することができない。","is_correct":false,"explanation":"正しい。家屋の免税点は20万円である。土地30万円・家屋20万円のセットで覚えておくこと。"},{"text":"市町村は、財政上その他特別の必要がある場合には、条例の定めるところにより、免税点に満たない固定資産に対しても固定資産税を課することができる。","is_correct":false,"explanation":"正しい。免税点未満であっても、財政上その他特別の必要があるときは、条例により課税することが認められている。"},{"text":"償却資産に係る固定資産税の免税点は、課税標準額の合計で100万円である。","is_correct":true,"explanation":"誤り。償却資産の免税点は150万円である。土地30万円・家屋20万円・償却資産150万円の数字を正確に区別する必要がある。"}],"explanation":"固定資産税の免税点は、同一市町村内の課税標準額の合計で、土地30万円・家屋20万円・償却資産150万円である。少額資産への課税を省く趣旨だが、条例により免税点未満でも課税できる例外がある点も押さえたい。","difficulty":2,"tags":["税・その他","固定資産税"],"shuffle_choices":true},{"id":"Q4007","topic":"固定資産税","question_type":"select_correct","question":"住宅用地に対する固定資産税の課税標準の特例に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"面積が200㎡以下の住宅用地(小規模住宅用地)については、課税標準が価格の6分の1の額とされる。","is_correct":true,"explanation":"正しい。住宅用地のうち200㎡以下の部分(小規模住宅用地)は課税標準が価格の6分の1となる。住宅政策上、居住用の土地の税負担を大きく軽減する特例である。"},{"text":"面積が200㎡を超える住宅用地の200㎡を超える部分については、課税標準が価格の2分の1の額とされる。","is_correct":false,"explanation":"200㎡を超える部分(一般住宅用地)の課税標準は価格の3分の1である。2分の1は不動産取得税における宅地の課税標準特例の数字であり、混同しないこと。"},{"text":"この特例は、所有者自身が居住する住宅の敷地に限って適用され、賃貸アパートの敷地には適用されない。","is_correct":false,"explanation":"住宅用地の特例は、自己居住用に限られず、賃貸住宅の敷地である住宅用地にも適用される。"},{"text":"面積300㎡の住宅用地については、その全部について課税標準が価格の3分の1の額とされる。","is_correct":false,"explanation":"300㎡の住宅用地は、200㎡までの部分が6分の1、200㎡を超える100㎡の部分が3分の1となる。全体が一律に3分の1となるのではない。"}],"explanation":"住宅用地については、200㎡以下の部分は価格の6分の1、200㎡を超える部分は価格の3分の1が課税標準となる。住宅の敷地の保有コストを軽減し居住の安定を図る趣旨であり、賃貸住宅の敷地にも適用される。","difficulty":1,"tags":["税・その他","固定資産税"],"shuffle_choices":true},{"id":"Q4008","topic":"固定資産税","question_type":"select_incorrect","question":"固定資産税に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"床面積要件を満たす新築住宅については、120㎡までの部分を限度として、新たに課税される年度から3年度分(3階建て以上の中高層耐火建築物等は5年度分)、税額の2分の1が減額される。","is_correct":false,"explanation":"正しい。新築住宅の減額特例は、居住部分の床面積120㎡までを限度に、原則3年度分(中高層耐火建築物等は5年度分)、税額が2分の1減額されるものである。"},{"text":"納税者は、縦覧帳簿の縦覧により、自己の土地又は家屋の価格と同一市町村内の他の土地又は家屋の価格とを比較することができる。","is_correct":false,"explanation":"正しい。土地価格等縦覧帳簿・家屋価格等縦覧帳簿の縦覧制度は、納税者が自己の資産の評価の適正さを他の資産との比較によって確認できるようにする制度である。"},{"text":"新築住宅に係る特例は、課税標準となるべき価格から一定額を控除する方法により行われる。","is_correct":true,"explanation":"誤り。新築住宅の特例は課税標準の控除ではなく、算出された税額の2分の1を減額する税額減額の方法による。課税標準の特例(住宅用地の6分の1等)との違いがポイントである。"},{"text":"固定資産税の標準税率は1.4%であり、市町村は条例によりこれを超える税率を定めることができる。","is_correct":false,"explanation":"正しい。1.4%は標準税率であり、財政上の必要があれば市町村は条例でこれを超える税率を定めることができる(制限税率は設けられていない)。"}],"explanation":"新築住宅の特例は、課税標準を減らすのではなく税額そのものを2分の1に減額する仕組みである点に注意する。新築住宅の取得を促進する政策的措置であり、縦覧制度は評価の公平性を納税者自身が確認するための制度である。","difficulty":2,"tags":["税・その他","固定資産税"],"shuffle_choices":true},{"id":"Q4009","topic":"登録免許税","question_type":"select_correct","question":"登録免許税に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"登録免許税は、登記の対象となる不動産の所在する都道府県が課する税である。","is_correct":false,"explanation":"登録免許税は国が課する国税である。不動産取得税(都道府県税)・固定資産税(市町村税)との課税主体の区別は必須の知識である。"},{"text":"売買による所有権移転登記に係る登録免許税の課税標準は、当該売買契約における実際の取引価格である。","is_correct":false,"explanation":"課税標準となる不動産の価額は、実際の取引価格ではなく、固定資産課税台帳に登録された価格を基礎として計算される。"},{"text":"登録免許税は、原則として収入印紙を登記申請書に貼付する方法により納付しなければならない。","is_correct":false,"explanation":"登録免許税の納付は現金納付が原則であり、税額が3万円以下である場合等に印紙による納付が認められる。印紙納付が原則なのではない。"},{"text":"登記を受ける者が2人以上あるときは、これらの者は連帯して登録免許税を納付する義務を負う。","is_correct":true,"explanation":"正しい。売買による所有権移転登記のように登記権利者(買主)と登記義務者(売主)がいる場合、両者が連帯して納税義務を負う。実務上買主が負担する慣行があっても、法律上は連帯納付義務である。"}],"explanation":"登録免許税は、登記という国の役務の提供に着目して国が課する流通税である。納税義務者は登記を受ける者で、2人以上いれば連帯納付義務を負い、課税標準は固定資産課税台帳の登録価格を基礎とする点が特徴である。","difficulty":2,"tags":["税・その他","登録免許税"],"shuffle_choices":true},{"id":"Q4010","topic":"登録免許税","question_type":"select_incorrect","question":"住宅用家屋の所有権の移転登記に係る登録免許税の税率の軽減措置(特例が適用される場合)に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"この軽減措置は、住宅用家屋の所有権の移転登記のみならず、その敷地の用に供されている土地の所有権の移転登記にも適用される。","is_correct":true,"explanation":"誤り。住宅用家屋の軽減税率は家屋の登記についてのみ適用され、その敷地である土地の所有権移転登記には適用されない。"},{"text":"この軽減措置の適用を受けるためには、当該家屋が個人の自己の居住の用に供される床面積50㎡以上の家屋であることが必要である。","is_correct":false,"explanation":"正しい。軽減措置は、個人が自己の居住の用に供する床面積50㎡以上の家屋で、取得後1年以内に登記を受けるものなどの要件を満たす場合に適用される。"},{"text":"以前にこの軽減措置の適用を受けたことがある者であっても、要件を満たす住宅用家屋を新たに取得した場合には、再びこの軽減措置の適用を受けることができる。","is_correct":false,"explanation":"正しい。この軽減措置には適用回数の制限がなく、要件を満たせば何度でも適用を受けることができる。"},{"text":"この軽減措置は、売買又は競落により取得した住宅用家屋の所有権の移転登記に適用され、贈与により取得した場合の移転登記には適用されない。","is_correct":false,"explanation":"正しい。所有権移転登記に係る軽減措置の対象となる取得原因は売買又は競落に限られ、贈与や交換による取得には適用されない。"}],"explanation":"住宅用家屋の軽減税率は、個人の居住用家屋の取得を促進する趣旨から、床面積50㎡以上・取得後1年以内の登記・売買又は競落による取得などの要件のもとで適用される。あくまで家屋に係る登記の特例であり、土地には適用がない点が最重要のひっかけである。","difficulty":3,"tags":["税・その他","登録免許税"],"shuffle_choices":true},{"id":"Q4011","topic":"印紙税","question_type":"select_correct","question":"印紙税に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"建物の賃貸借契約書は、印紙税の課税文書に該当する。","is_correct":false,"explanation":"建物の賃貸借契約書は課税文書に該当しない。なお、土地の賃貸借契約書(権利金等の記載があるもの)は課税文書となる点と区別すること。"},{"text":"給与所得者である個人が自己の居住用の自宅を売却し、その代金を受領した際に作成した領収書には、印紙税は課されない。","is_correct":true,"explanation":"正しい。営業に関しない受取書は非課税である。事業者でない個人がマイホームを売却して作成する領収書は営業に関しない受取書に該当し、記載金額にかかわらず印紙税は課されない。"},{"text":"宅地建物取引業者が売買の媒介に際して依頼者と取り交わす媒介契約書は、印紙税の課税文書に該当する。","is_correct":false,"explanation":"媒介契約書は委任に関する契約書であり、印紙税の課税文書には該当しない。"},{"text":"売買代金として受領した10万円について作成した受取書は、記載金額が少額であるため印紙税は課されない。","is_correct":false,"explanation":"受取書が非課税となるのは記載金額が5万円未満の場合である。記載金額10万円の受取書は、営業に関するものであれば課税される。"}],"explanation":"印紙税は、経済取引に伴って作成される文書に担税力を認めて国が課する税である。不動産売買契約書や受取書は課税文書だが、建物賃貸借契約書や媒介契約書(委任)は課税されず、5万円未満の受取書や営業に関しない受取書は非課税とされる。","difficulty":1,"tags":["税・その他","印紙税"],"shuffle_choices":true},{"id":"Q4012","topic":"印紙税","question_type":"select_incorrect","question":"印紙税に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"土地の交換契約書に交換対象である双方の土地の価額が記載されている場合、高い方の金額が当該契約書の記載金額となる。","is_correct":false,"explanation":"正しい。交換契約書に双方の価額が記載されているときは高い方の金額が記載金額となり、交換差金のみが記載されているときはその差金の額が記載金額となる。"},{"text":"課税文書に貼り付けた印紙の消印は、文書の作成者本人のほか、その代理人や従業者の印章又は署名によって行うこともできる。","is_correct":false,"explanation":"正しい。消印は、作成者本人に限らず、代理人・使用人その他の従業者の印章又は署名により行うことができる。"},{"text":"課税文書の作成者が納付すべき印紙税を納付しなかった場合に徴収される過怠税の額は、原則として、納付しなかった印紙税額と同額である。","is_correct":true,"explanation":"誤り。過怠税は、原則として納付しなかった印紙税額とその2倍に相当する金額との合計額、すなわち本来の税額の3倍である(調査前に自主的に申し出た場合は1.1倍)。"},{"text":"贈与契約書は、契約金額の記載のない契約書として印紙税が課される。","is_correct":false,"explanation":"正しい。贈与は無償契約であり譲渡の対価がないため、贈与契約書は記載金額のない契約書として扱われ、印紙税(200円)が課される。"}],"explanation":"印紙税を納付しなかった場合の過怠税は本来の税額の3倍(自主申出の場合1.1倍)であり、消印を欠いた場合は消印されていない印紙の額面と同額の過怠税が課される。記載金額の判定(交換は高い方、贈与は記載金額なし)と併せて整理しておきたい。","difficulty":2,"tags":["税・その他","印紙税"],"shuffle_choices":true},{"id":"Q4013","topic":"所得税(譲渡所得)","question_type":"select_correct","question":"個人が土地建物を譲渡した場合の譲渡所得に対する所得税に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"譲渡した年の1月1日における所有期間が5年以下である土地を譲渡した場合の譲渡所得は、短期譲渡所得として課税される。","is_correct":true,"explanation":"正しい。土地建物の譲渡所得の長期・短期の区分は、譲渡した年の1月1日における所有期間が5年を超えるか否かで判定され、5年以下であれば短期譲渡所得となる。"},{"text":"譲渡所得の長期・短期の区分は、実際に譲渡した日における所有期間が5年を超えるか否かにより判定される。","is_correct":false,"explanation":"判定の基準日は譲渡日ではなく、譲渡した年の1月1日である。実際の所有期間が5年を超えていても、その年の1月1日時点で5年以下であれば短期譲渡所得となる。"},{"text":"居住用財産を譲渡した場合の3,000万円特別控除は、譲渡した年の1月1日における所有期間が10年を超える居住用財産を譲渡した場合に限り適用される。","is_correct":false,"explanation":"3,000万円特別控除に所有期間の要件はなく、短期譲渡であっても適用を受けられる。所有期間10年超が要件となるのは軽減税率の特例である。"},{"text":"自己の居住用家屋とその敷地を配偶者に譲渡した場合であっても、3,000万円特別控除の適用を受けることができる。","is_correct":false,"explanation":"譲受人が配偶者、直系血族、生計を一にする親族等である場合には、3,000万円特別控除の適用を受けることができない。"}],"explanation":"土地建物の譲渡所得は、譲渡した年の1月1日における所有期間5年超か否かで長期・短期に区分され、税率が大きく異なる。居住用財産の3,000万円特別控除は所有期間を問わず適用されるが、配偶者等の近親者への譲渡には適用されない。","difficulty":2,"tags":["税・その他","所得税"],"shuffle_choices":true},{"id":"Q4014","topic":"所得税(譲渡所得)","question_type":"select_incorrect","question":"個人が居住用財産を譲渡した場合の課税の特例に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"居住用財産を譲渡した場合の軽減税率の特例は、譲渡した年の1月1日における所有期間が10年を超える居住用財産を譲渡した場合に適用される。","is_correct":false,"explanation":"正しい。軽減税率の特例は所有期間10年超(譲渡年の1月1日で判定)の居住用財産の譲渡に適用され、課税長期譲渡所得のうち6,000万円以下の部分に低い税率が適用される。"},{"text":"前年又は前々年において3,000万円特別控除の適用を受けている者は、本年の居住用財産の譲渡について同控除の適用を受けることができない。","is_correct":false,"explanation":"正しい。3,000万円特別控除は、前年・前々年に同控除等の適用を受けている場合には適用されない。いわゆる3年に1度しか使えない制限である。"},{"text":"居住用財産を譲渡した場合の軽減税率の特例と3,000万円特別控除は、重ねて適用を受けることができる。","is_correct":false,"explanation":"正しい。軽減税率の特例と3,000万円特別控除は併用が可能であり、3,000万円を控除した後の課税長期譲渡所得に軽減税率が適用される。"},{"text":"特定の居住用財産の買換えの特例は、同一の譲渡について3,000万円特別控除と併せて適用を受けることができる。","is_correct":true,"explanation":"誤り。買換えの特例は課税の繰延べの制度であり、同一の譲渡について3,000万円特別控除や軽減税率の特例と重ねて適用を受けることはできない。いずれか有利な方を選択する。"}],"explanation":"居住用財産の譲渡には、3,000万円特別控除、所有期間10年超の軽減税率、買換えの特例などがある。特別控除と軽減税率は併用できるが、買換えの特例は課税繰延べの制度であるため他の特例との併用が認められない点が重要である。","difficulty":3,"tags":["税・その他","所得税"],"shuffle_choices":true},{"id":"Q4015","topic":"不動産鑑定評価基準","question_type":"select_correct","question":"不動産の鑑定評価によって求める価格に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"限定価格とは、文化財の指定を受けた建造物のように、一般的に市場性を有しない不動産について求められる価格をいう。","is_correct":false,"explanation":"市場性を有しない不動産について、その利用現況等を前提として求められるのは特殊価格である。限定価格は市場性を有する不動産について求められる価格である。"},{"text":"特定価格とは、市場性を有しない不動産について、その経済価値を適正に表示する価格をいう。","is_correct":false,"explanation":"特定価格は、市場性を有する不動産について、法令等による社会的要請を背景に、正常価格の前提となる諸条件を満たさない場合に求められる価格である。市場性を有しない不動産の価格は特殊価格である。"},{"text":"借地権者が底地の併合を目的として当該土地を取得する場合のように、市場が相対的に限定される場合に求められる価格は、限定価格である。","is_correct":true,"explanation":"正しい。限定価格は、市場性を有する不動産について、隣接不動産の併合や借地権者による底地の取得など、市場が相対的に限定される場合の市場価値を適正に表示する価格である。"},{"text":"正常価格とは、現実に成立した個々の取引価格そのものをいう。","is_correct":false,"explanation":"正常価格は、市場性を有する不動産について、現実の社会経済情勢下で合理的と考えられる条件を満たす市場で形成されるであろう市場価値を表示する適正な価格であり、個別事情を含む現実の成約価格そのものではない。"}],"explanation":"鑑定評価によって求める価格は、原則として正常価格であるが、市場が相対的に限定される場合の限定価格、法令等の社会的要請を背景とする特定価格、市場性を有しない不動産の特殊価格がある。それぞれ市場性の有無と市場の限定の有無で区別して整理する。","difficulty":2,"tags":["税・その他","不動産鑑定評価基準"],"shuffle_choices":true},{"id":"Q4016","topic":"不動産鑑定評価基準","question_type":"select_incorrect","question":"不動産の鑑定評価に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"不動産の価格は、その不動産の効用が最高度に発揮される可能性に最も富む使用、すなわち最有効使用を前提として把握される価格を標準として形成される。","is_correct":false,"explanation":"正しい。最有効使用の原則は不動産の価格に関する諸原則の中でも中心的なものであり、不動産の価格は最有効使用を前提として把握される価格を標準として形成される。"},{"text":"最有効使用とは、現実にその不動産を使用収益している者が主観的に最も有利と考える使用方法をいう。","is_correct":true,"explanation":"誤り。最有効使用は、現実の使用者の主観的な判断ではなく、良識と通常の使用能力を持つ人による合理的かつ合法的な最高最善の使用方法として客観的に判定される。"},{"text":"鑑定評価に当たっては、不動産の価格を形成する要因を、一般的要因、地域要因及び個別的要因に分けて明確に把握し、分析する必要がある。","is_correct":false,"explanation":"正しい。価格形成要因は一般的要因・地域要因・個別的要因に分類され、鑑定評価ではこれらを明確に把握し十分に分析することが求められる。"},{"text":"不動産の価格を形成する要因は常に変動する傾向を持つため、鑑定評価に当たっては価格形成要因の変動を的確に把握する必要がある。","is_correct":false,"explanation":"正しい。不動産の価格は多数の要因の相互作用の結果として形成され、要因自体も常に変動するため、その動向に留意しなければならない(変動の原則)。"}],"explanation":"最有効使用の原則は、良識と通常の使用能力を持つ人による合理的・合法的な最高最善の使用を前提とする客観的な概念であり、現実の使用者の主観的な使用方法を意味しない。価格形成要因の三分類とともに鑑定評価の基礎となる考え方である。","difficulty":1,"tags":["税・その他","不動産鑑定評価基準"],"shuffle_choices":true},{"id":"Q4017","topic":"不動産鑑定評価基準","question_type":"select_correct","question":"原価法に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"原価法は建物の評価に用いる手法であり、土地についてはいかなる場合も適用することができない。","is_correct":false,"explanation":"土地についても、造成地や埋立地のように再調達原価を適切に求めることができる場合には、原価法を適用することができる。"},{"text":"原価法における減価修正は、耐用年数に基づく方法によらなければならず、観察減価法を用いることは認められていない。","is_correct":false,"explanation":"減価修正には耐用年数に基づく方法と観察減価法があり、原則としてこれらを併用して減価額を求めるものとされている。"},{"text":"原価法は、対象不動産が将来生み出すであろう純収益に着目して価格を求める手法である。","is_correct":false,"explanation":"将来の純収益に着目するのは収益還元法である。原価法は、不動産の再調達に要する費用(費用性)に着目する手法である。"},{"text":"原価法は、価格時点における対象不動産の再調達原価を求め、この再調達原価について減価修正を行って対象不動産の試算価格を求める手法である。","is_correct":true,"explanation":"正しい。原価法は、再調達原価の把握と減価修正を中心とする手法であり、これにより求められた試算価格を積算価格という。"}],"explanation":"原価法は費用性に着目し、再調達原価から減価修正を行って積算価格を求める手法である。建物に限らず、造成地・埋立地など再調達原価を求め得る土地にも適用でき、減価修正は耐用年数に基づく方法と観察減価法を併用するのが原則である。","difficulty":2,"tags":["税・その他","不動産鑑定評価基準"],"shuffle_choices":true},{"id":"Q4018","topic":"不動産鑑定評価基準","question_type":"select_incorrect","question":"取引事例比較法に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"投機的取引であると認められる事例であっても、時点修正を行うことができるものであれば、取引事例として採用することができる。","is_correct":true,"explanation":"誤り。投機的取引であると認められる事例は、時点修正の可否にかかわらず、取引事例として用いてはならないとされている。"},{"text":"取引事例が特殊な事情を含み、これが当該取引価格に影響を及ぼしているときは、適切に補正できるものであれば採用することができ、その場合には事情補正を行う必要がある。","is_correct":false,"explanation":"正しい。特殊な事情を含む事例でも、正常なものに補正できる場合には採用でき、事情補正を行ったうえで比準する。"},{"text":"取引事例に係る取引の時点が価格時点と異なり、その間に価格水準の変動があると認められる場合には、当該事例の価格を価格時点の価格に修正する時点修正を行う必要がある。","is_correct":false,"explanation":"正しい。取引時点と価格時点の間に価格変動があるときは時点修正が必要であり、そのうえで地域要因の比較及び個別的要因の比較を行う。"},{"text":"取引事例比較法により求められた試算価格は、比準価格と呼ばれる。","is_correct":false,"explanation":"正しい。取引事例比較法による試算価格は比準価格という。原価法による積算価格、収益還元法による収益価格と対応させて覚えること。"}],"explanation":"取引事例比較法は、多数の取引事例を収集し、事情補正・時点修正を行い、地域要因・個別的要因を比較して比準価格を求める手法である。市場性に着目する手法であるため、市場の実勢を反映しない投機的取引の事例は用いてはならない。","difficulty":2,"tags":["税・その他","不動産鑑定評価基準"],"shuffle_choices":true},{"id":"Q4019","topic":"不動産鑑定評価基準","question_type":"select_correct","question":"収益還元法に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"収益還元法は、賃貸用不動産又は事業用不動産の評価にのみ適用される手法であり、自用の住宅地の評価に適用することはできない。","is_correct":false,"explanation":"収益還元法は、自用の不動産についても、賃貸を想定することにより適用されるものとされている。賃貸用・事業用に限定されるわけではない。"},{"text":"収益還元法は、文化財の指定を受けた建造物など市場性を有しない不動産以外のものには、基本的にすべて適用すべきものとされている。","is_correct":true,"explanation":"正しい。収益還元法は、市場性を有しない不動産以外のものにはすべて適用すべきものとされ、自用の不動産にも賃貸を想定することにより適用される。"},{"text":"DCF法とは、一期間の純収益を還元利回りによって還元して対象不動産の収益価格を求める方法をいう。","is_correct":false,"explanation":"一期間の純収益を還元利回りで還元するのは直接還元法である。DCF法は、連続する複数の期間に発生する純収益及び復帰価格を、その発生時期に応じて現在価値に割り引いて合計する方法である。"},{"text":"収益還元法により求められた収益価格は、市場性を有しない文化財指定建造物の評価に最も有効である。","is_correct":false,"explanation":"収益還元法は市場における収益性を前提とする手法であり、市場性を有しない不動産(文化財指定建造物等)には適用されない。そのような不動産には特殊価格が求められる。"}],"explanation":"収益還元法は、対象不動産が将来生み出すであろう純収益の現在価値の総和を求める手法で、直接還元法とDCF法がある。市場性を有しない不動産を除き広く適用すべきものとされ、自用の不動産にも賃貸を想定して適用できる点が重要である。","difficulty":3,"tags":["税・その他","不動産鑑定評価基準"],"shuffle_choices":true},{"id":"Q4020","topic":"地価公示法","question_type":"select_incorrect","question":"地価公示法に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"地価公示は、標準地の正常な価格を公示することにより、一般の土地の取引価格に対して指標を与え、適正な地価の形成に寄与することを目的としている。","is_correct":false,"explanation":"正しい。地価公示法第1条の目的規定のとおり、一般の土地取引価格への指標の付与と適正な地価の形成への寄与が目的である。"},{"text":"標準地は、土地鑑定委員会が、自然的及び社会的条件からみて類似の利用価値を有すると認められる地域において、土地の利用状況、環境等が通常と認められる一団の土地について選定する。","is_correct":false,"explanation":"正しい。標準地の選定は土地鑑定委員会が行い、当該地域において利用状況・環境等が通常と認められる一団の土地から選定される。"},{"text":"標準地は都市計画区域内に限って選定されるものであり、都市計画区域外の区域において標準地が選定されることはない。","is_correct":true,"explanation":"誤り。公示区域は、都市計画区域その他の土地取引が相当程度見込まれるものとして国土交通省令で定める区域であり、都市計画区域外であっても標準地が選定されることがある。"},{"text":"国土利用計画法の規定により指定された規制区域内の土地が、標準地として選定されることはない。","is_correct":false,"explanation":"正しい。規制区域は公示区域から除外されているため、規制区域内の土地が標準地として選定されることはない。"}],"explanation":"地価公示の対象となる公示区域は、都市計画区域に限られず、土地取引が相当程度見込まれる区域を含む(ただし規制区域は除く)。標準地の選定は土地鑑定委員会の権限であり、地域の通常の利用状況を代表する一団の土地が選ばれる。","difficulty":1,"tags":["税・その他","地価公示法"],"shuffle_choices":true},{"id":"Q4021","topic":"地価公示法","question_type":"select_correct","question":"地価公示法における標準地の価格の判定に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"標準地に建物が存する場合であっても、標準地の正常な価格は、当該建物が存しないものとして判定される。","is_correct":true,"explanation":"正しい。正常な価格は、標準地に建物その他の定着物や地上権等の権利が存する場合には、これらが存しないものとして、すなわち更地としての価格として判定される。"},{"text":"土地鑑定委員会は、標準地について1人の不動産鑑定士の鑑定評価を求めれば、正常な価格を判定して公示することができる。","is_correct":false,"explanation":"土地鑑定委員会は、2人以上の不動産鑑定士の鑑定評価を求め、その結果を審査し、必要な調整を行って正常な価格を判定する。1人では足りない。"},{"text":"標準地の正常な価格の判定の基準日は、毎年4月1日とされている。","is_correct":false,"explanation":"価格判定の基準日は毎年1月1日である。公示は例年3月に行われるが、判定の基準日は1月1日である点に注意する。"},{"text":"地上権が設定されている土地は、標準地として選定することができない。","is_correct":false,"explanation":"地上権等の権利が存する土地も標準地として選定でき、その場合、正常な価格は当該権利が存しないものとして判定される。"}],"explanation":"標準地の正常な価格は、自由な取引において通常成立すると認められる価格であり、建物や借地権等が存する場合でもこれらがないものとした更地価格として判定される。土地鑑定委員会は2人以上の不動産鑑定士の鑑定評価を求め、審査調整のうえこれを判定する。","difficulty":2,"tags":["税・その他","地価公示法"],"shuffle_choices":true},{"id":"Q4022","topic":"地価公示法","question_type":"select_incorrect","question":"地価公示の公示事項及び閲覧に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"土地鑑定委員会は、標準地の単位面積当たりの価格及び価格判定の基準日を官報で公示しなければならない。","is_correct":false,"explanation":"正しい。標準地の単位面積当たりの価格と価格判定の基準日は、官報で公示すべき事項に含まれる。"},{"text":"標準地の地積及び形状は、官報で公示すべき事項に含まれる。","is_correct":false,"explanation":"正しい。標準地の所在地のほか、地積及び形状、標準地及びその周辺の土地の利用の現況なども公示事項である。"},{"text":"関係市町村の長は、公示された事項のうち当該市町村が属する都道府県に存する標準地に係る部分を記載した書面及び図面を、当該市町村の事務所において一般の閲覧に供しなければならない。","is_correct":false,"explanation":"正しい。関係市町村の長は、土地鑑定委員会から送付された書面及び図面を市町村の事務所において一般の閲覧に供する義務を負う。"},{"text":"標準地の前回の公示価格からの変動率は、官報で公示すべき事項に含まれる。","is_correct":true,"explanation":"誤り。前回公示価格からの変動率は公示事項に含まれていない。報道等で変動率が示されることがあるが、法定の公示事項ではない。"}],"explanation":"官報で公示される事項は、標準地の所在地、単位面積当たりの価格、価格判定の基準日、地積・形状、利用の現況などであり、前回価格からの変動率は含まれない。公示内容は関係市町村の事務所で誰でも閲覧できる仕組みが整えられている。","difficulty":1,"tags":["税・その他","地価公示法"],"shuffle_choices":true},{"id":"Q4023","topic":"地価公示法","question_type":"select_correct","question":"公示価格の効力に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"都市及びその周辺の地域等において土地の取引を行う者は、取引の対象となる土地に類似する標準地の公示価格を規準として取引を行う義務を負い、これに違反した取引は効力を生じない。","is_correct":false,"explanation":"一般の土地取引については、公示価格を指標として取引を行うよう努めなければならないという努力義務にとどまる。規準とする法的義務ではなく、違反しても取引の効力に影響はない。"},{"text":"土地収用法その他の法律により土地を収用することができる事業を行う者が、公示区域内の土地を当該事業の用に供するため取得する場合には、当該土地の取得価格は公示価格を規準としなければならない。","is_correct":true,"explanation":"正しい。公共事業の用に供する土地を取得する場合の取得価格については、公示価格を規準とすることが法律上義務付けられている。"},{"text":"不動産鑑定士が公示区域内の土地について正常な価格を求めるときは、公示価格を参考とすれば足り、これを規準とする義務までは負わない。","is_correct":false,"explanation":"不動産鑑定士が公示区域内の土地の鑑定評価を行う場合において正常な価格を求めるときは、公示価格を規準としなければならない(法的義務)。参考にとどまるものではない。"},{"text":"公示価格を規準とするとは、取引の対象となる土地の価格を、類似する標準地の公示価格と同一の額に定めなければならないことをいう。","is_correct":false,"explanation":"規準とするとは、対象土地と類似の利用価値を有する標準地との位置・地積・環境等の比較を行い、その結果に基づき公示価格と対象土地の価格との間に均衡を保たせることをいう。同一額とすることではない。"}],"explanation":"公示価格の効力は、一般の土地取引に対しては指標としての努力義務にとどまるが、不動産鑑定士の正常価格の鑑定評価、公共事業用地の取得価格の算定、収用における補償金額の算定においては規準とすることが義務付けられている。努力義務と法的義務の区別が出題の中心である。","difficulty":3,"tags":["税・その他","地価公示法"],"shuffle_choices":true},{"id":"Q4024","topic":"住宅金融支援機構","question_type":"select_correct","question":"独立行政法人住宅金融支援機構(以下「機構」という。)の証券化支援事業(買取型)に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"機構が金融機関から買い取る貸付債権は、賃貸住宅の建設に必要な資金の貸付けに係るものに限られる。","is_correct":false,"explanation":"誤り。買取型の対象は、申込者本人又はその親族が居住する住宅の建設・購入に必要な資金(これに付随する土地・借地権の取得資金を含む)の貸付債権であり、賃貸住宅建設資金に限られるのではない。"},{"text":"証券化支援事業(買取型)における貸付金利や融資手数料は、機構が全国一律に定めており、どの金融機関に申し込んでも同一である。","is_correct":false,"explanation":"誤り。フラット35の貸付金利や事務手数料は、取扱金融機関がそれぞれ独自に定めるため、金融機関によって異なる。"},{"text":"機構は、金融機関から買い取った住宅ローン債権を信託し、これを担保として資産担保証券(MBS)を発行することにより、債券市場(投資家)から資金を調達している。","is_correct":true,"explanation":"正しい。買取型は、民間金融機関の長期・固定金利の住宅ローン債権を機構が買い取り、証券化して市場から資金調達する仕組みであり、これが証券化支援業務の中核である。"},{"text":"中古住宅の購入に付随して行う当該住宅の改良(リフォーム)に必要な資金は、購入資金と併せて借り入れる場合であっても、買取りの対象とならない。","is_correct":false,"explanation":"誤り。リフォーム資金単独の貸付債権は買取対象外であるが、住宅の購入に付随して行う改良資金は、購入資金と一体であれば買取りの対象となる。"}],"explanation":"証券化支援事業(買取型)は、民間金融機関では提供が難しい長期・固定金利住宅ローン(フラット35)を支えるため、機構が債権を買い取ってMBSを発行し市場から資金を調達する制度である。金利や手数料は各金融機関が独自に定める点、対象は自己居住用等の住宅である点が頻出論点である。","difficulty":2,"tags":["税・その他","住宅金融支援機構"],"shuffle_choices":true},{"id":"Q4025","topic":"住宅金融支援機構","question_type":"select_incorrect","question":"独立行政法人住宅金融支援機構(以下「機構」という。)の業務に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"機構は、一般の勤労者が自ら居住する住宅を新築する場合に、その建設に必要な資金を直接貸し付けることを主たる業務としている。","is_correct":true,"explanation":"誤り。旧住宅金融公庫が行っていた一般個人向けの直接融資は原則として廃止されており、機構の主たる業務は証券化支援業務である。直接融資は災害関連など政策上必要な場合の例外に限られる。"},{"text":"機構は、災害復興建築物の建設又は購入に必要な資金の貸付けを業務として行っている。","is_correct":false,"explanation":"正しい。災害復興建築物の建設・購入資金の貸付けは、民間金融機関による融資が困難な分野として、機構が例外的に行う直接融資の代表例である。"},{"text":"機構は、子育て世帯向け・高齢者世帯向けの賃貸住宅の建設に必要な資金の貸付けを業務として行っている。","is_correct":false,"explanation":"正しい。子育て世帯・高齢者世帯に適した良好な居住性能を有する賃貸住宅の建設・改良資金の貸付けは、機構の直接融資業務として認められている。"},{"text":"機構は、マンションの共用部分の改良に必要な資金の貸付けを業務として行っている。","is_correct":false,"explanation":"正しい。マンション共用部分の改良資金の貸付けは、機構が例外的に行う直接融資の一つである。"}],"explanation":"機構は旧住宅金融公庫の直接融資業務を原則として引き継いでおらず、証券化支援業務を通じて民間金融機関の長期固定ローンを支援することを本来業務とする。ただし、災害復興、子育て・高齢者世帯向け賃貸住宅、マンション共用部分改良など、民間では対応困難な分野に限って直接融資を行う。","difficulty":2,"tags":["税・その他","住宅金融支援機構"],"shuffle_choices":true},{"id":"Q4026","topic":"住宅金融支援機構","question_type":"select_correct","question":"独立行政法人住宅金融支援機構(以下「機構」という。)の業務に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"団体信用生命保険業務では、貸付けを受けた者が死亡した場合に限り保険金が債務の弁済に充当され、重度障害の状態となった場合は対象とならない。","is_correct":false,"explanation":"誤り。団体信用生命保険業務は、死亡した場合だけでなく、重度障害の状態となった場合も対象となり、支払われる保険金等が残債務の弁済に充当される。"},{"text":"機構は、高齢者が自ら居住する住宅にバリアフリー工事又は耐震改修工事を行う場合の貸付けについて、元金と利息をあわせて毎月返済する方法しか認めていない。","is_correct":false,"explanation":"誤り。高齢者向け返済特例により、毎月の返済を利息のみとし、元金は債務者の死亡時に一括して返済する方法(死亡時一括償還)が認められている。"},{"text":"住宅融資保険は、機構が自ら行う直接融資について、その貸付債権を保全するために機構が保険料を支払う制度である。","is_correct":false,"explanation":"誤り。住宅融資保険は、民間金融機関が行った住宅ローンについて債務不履行が生じた場合に機構が保険金を支払う制度であり、民間金融機関の住宅資金供給を支援するためのものである。"},{"text":"機構は、貸付けを受けた者が死亡した場合のほか、重度障害の状態となった場合においても、支払われる生命保険の保険金等を当該貸付けに係る債務の弁済に充当する団体信用生命保険業務を行っている。","is_correct":true,"explanation":"正しい。団体信用生命保険業務は、死亡・重度障害のいずれの場合も、保険金等を残債務の弁済に充てる業務である。"}],"explanation":"団体信用生命保険は、債務者に死亡・重度障害という不測の事態が生じた場合に保険金で住宅ローンを完済させ、遺族が住宅を失わないようにする制度である。「死亡した場合に限る」といった限定を付けたひっかけが頻出であり、重度障害も対象である点を正確に押さえたい。","difficulty":2,"tags":["税・その他","住宅金融支援機構"],"shuffle_choices":true},{"id":"Q4027","topic":"住宅金融支援機構","question_type":"select_incorrect","question":"独立行政法人住宅金融支援機構(以下「機構」という。)の業務に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"機構は、金融機関に対し、証券化支援事業(買取型)により譲り受けた貸付債権に係る元利金の回収業務を委託することができる。","is_correct":false,"explanation":"正しい。機構は、譲り受けた貸付債権の回収その他の業務を、金融機関に委託することができる。"},{"text":"機構は、貸付けを行うかどうかの決定を含め、その業務の全部を金融機関に委託することができる。","is_correct":true,"explanation":"誤り。機構は業務の一部を金融機関等に委託することができるが、貸付けの決定など業務の根幹に関わる判断まで委託することはできない。"},{"text":"機構は、地方公共団体その他政令で定める法人に対し、その業務の一部を委託することができる。","is_correct":false,"explanation":"正しい。委託先は金融機関に限られず、地方公共団体その他政令で定める法人にも業務の一部を委託することができる。"},{"text":"証券化支援事業(保証型)において、機構は、民間金融機関の住宅ローンに住宅融資保険を付すとともに、そのローンを担保として発行された債券等について、投資家に対し元利払いを保証している。","is_correct":false,"explanation":"正しい。保証型は、機構が住宅融資保険の引受けと債券等の期日どおりの元利払いの保証を行うことで、民間金融機関による長期固定ローンの供給を支援する仕組みである。"}],"explanation":"機構は全国に支店網を持たないため、債権回収などの業務を金融機関や地方公共団体等に委託して効率的に運営している。ただし、委託できるのは業務の一部であり、貸付けの決定そのものを委託することはできない点が出題のポイントである。","difficulty":3,"tags":["税・その他","住宅金融支援機構"],"shuffle_choices":true},{"id":"Q4028","topic":"景品表示法","question_type":"select_correct","question":"宅地建物取引業者が行う広告における徒歩所要時間の表示に関する次の記述のうち、不動産の表示に関する公正競争規約によれば、正しいものはどれか。","choices":[{"text":"徒歩による所要時間は、道路距離100mにつき1分間を要するものとして算出しなければならない。","is_correct":false,"explanation":"誤り。徒歩所要時間は、道路距離80mにつき1分間を要するものとして算出する。100mではない。"},{"text":"算出した所要時間に1分未満の端数が生じたときは、その端数を切り捨てて表示することができる。","is_correct":false,"explanation":"誤り。1分未満の端数が生じたときは、これを1分として算出する。すなわち切り上げであり、切り捨ては認められない。"},{"text":"経路上に信号や歩道橋がある場合には、信号待ちや歩道橋の昇降に要する時間を加算して表示しなければならない。","is_correct":false,"explanation":"誤り。信号待ちや歩道橋の昇降に要する時間は、所要時間の算出にあたって考慮する必要はない(加算しない)。"},{"text":"駅から物件までの道路距離が1,000mである場合、徒歩所要時間は「13分」と表示することになる。","is_correct":true,"explanation":"正しい。1,000m÷80m=12.5分となり、1分未満の端数は切り上げるため、13分と表示する。"}],"explanation":"徒歩所要時間は「道路距離80mにつき1分、端数切上げ」という統一基準で算出させることで、広告間の比較可能性を確保し、消費者の誤認を防いでいる。信号待ちや坂道などの事情は考慮しないため、実際の所要時間より短く表示され得る点も理解しておきたい。","difficulty":1,"tags":["税・その他","景品表示法"],"shuffle_choices":true},{"id":"Q4029","topic":"景品表示法","question_type":"select_incorrect","question":"宅地建物取引業者が行う広告における「新築」の表示に関する次の記述のうち、不動産の表示に関する公正競争規約によれば、誤っているものはどれか。","choices":[{"text":"建築工事完了後2年を経過した住宅であっても、一度も居住の用に供されていなければ、「新築」と表示することができる。","is_correct":true,"explanation":"誤り。「新築」と表示できるのは、建築工事完了後1年未満であって、かつ居住の用に供されたことがないものに限られる。未使用でも1年以上経過すれば「新築」とは表示できない。"},{"text":"建築工事完了後1年未満の住宅であっても、一度でも居住の用に供されたものは、「新築」と表示することができない。","is_correct":false,"explanation":"正しい。「新築」の要件は「1年未満」と「未使用」の両方を満たすことであり、短期間でも入居歴があれば新築とは表示できない。"},{"text":"「新築」とは、建築工事完了後1年未満であって、居住の用に供されたことがないものをいう。","is_correct":false,"explanation":"正しい。表示規約における「新築」の定義そのものである。"},{"text":"建築工事完了後8か月が経過した未入居の住宅は、「新築」と表示することができる。","is_correct":false,"explanation":"正しい。建築後1年未満かつ未使用であるため、「新築」の表示要件を満たす。"}],"explanation":"「新築」は消費者にとって強い訴求力を持つ用語であるため、表示規約は「建築工事完了後1年未満かつ未使用」という2要件で厳格に定義している。どちらか一方でも欠ければ「新築」と表示できない点が最重要ポイントである。","difficulty":1,"tags":["税・その他","景品表示法"],"shuffle_choices":true},{"id":"Q4030","topic":"景品表示法","question_type":"select_correct","question":"宅地建物取引業者が行う広告における交通の利便に関する表示について、不動産の表示に関する公正競争規約によれば、正しいものはどれか。","choices":[{"text":"新設予定の鉄道駅は、実際に駅が開業するまでは、いかなる方法によっても広告に表示することができない。","is_correct":false,"explanation":"誤り。新設予定の駅であっても、当該路線の運行主体が公表したものであれば、その新設予定時期を明示して表示することができる。"},{"text":"電車による所要時間は、日中の平常時における所要時間を表示すれば足り、朝の通勤ラッシュ時の所要時間を表示する必要はない。","is_correct":false,"explanation":"誤り。電車等の所要時間は、朝の通勤ラッシュ時の所要時間を明示することとされている(平常時の所要時間をその旨を明示して併記することは可能)。"},{"text":"新設予定の鉄道駅は、当該路線の運行主体が公表したものに限り、その新設予定時期を明示して表示することができる。","is_correct":true,"explanation":"正しい。運行主体の公表という客観的裏付けと、予定時期の明示という条件のもとで、新設予定駅の表示が認められている。"},{"text":"電車の乗換えを要する場合であっても、乗換えを要する旨を表示する必要はなく、乗換えに要する時間を所要時間に含める必要もない。","is_correct":false,"explanation":"誤り。乗換えを要するときはその旨を明示し、所要時間には乗換えにおおむね要する時間を含めなければならない。"}],"explanation":"交通利便の表示は物件選択に大きな影響を与えるため、表示規約は実態より有利に見せる表示を厳しく制限している。新設予定駅は運行主体の公表を条件に予定時期を明示して表示でき、所要時間は通勤ラッシュ時基準・乗換え時間込みが原則である。","difficulty":2,"tags":["税・その他","景品表示法"],"shuffle_choices":true},{"id":"Q4031","topic":"景品表示法","question_type":"select_incorrect","question":"宅地建物取引業者が行う広告における面積等の表示に関する次の記述のうち、不動産の表示に関する公正競争規約によれば、誤っているものはどれか。","choices":[{"text":"面積はメートル法により表示し、1㎡未満の数値は切り捨てて表示することができる。","is_correct":false,"explanation":"正しい。面積はメートル法によることとされ、1㎡未満の端数は切り捨てて表示することが認められている。"},{"text":"住宅の居室の広さを畳数で表示する場合、畳1枚当たりの広さは1.5㎡以上の広さがあるという意味で用いなければならない。","is_correct":true,"explanation":"誤り。畳数表示における畳1枚当たりの広さは、1.62㎡(各室の壁心面積を畳数で除した数値)以上でなければならない。1.5㎡ではない。"},{"text":"土地の面積は、原則として私道負担部分の面積を含めずに表示し、私道負担部分があるときは、その旨及びその面積を表示しなければならない。","is_correct":false,"explanation":"正しい。私道負担部分は実際に建物の敷地として利用できない部分であるため、その旨と面積の明示が義務付けられている。"},{"text":"建物の面積は延べ面積(マンションにあっては専有面積)を表示し、車庫等の面積を含むときは、その旨及びその面積を表示しなければならない。","is_correct":false,"explanation":"正しい。建物面積は延べ面積(マンションは専有面積)によることとされ、車庫・地下室等の面積を含む場合はその旨と面積を明示する必要がある。"}],"explanation":"面積表示は物件の価値判断の基礎となるため、メートル法・畳1枚1.62㎡以上という客観基準が定められている。「1.62㎡」という具体的数値は頻出であり、1.5㎡や1.8㎡などと置き換えるひっかけに注意したい。","difficulty":1,"tags":["税・その他","景品表示法"],"shuffle_choices":true},{"id":"Q4032","topic":"景品表示法","question_type":"select_correct","question":"宅地建物取引業者が行う二重価格表示に関する次の記述のうち、不動産の表示に関する公正競争規約によれば、正しいものはどれか。","choices":[{"text":"過去の販売価格を比較対照価格とする二重価格表示は、消費者に有利であるかのような誤認を与えるため、いかなる場合であっても行うことができない。","is_correct":false,"explanation":"誤り。過去の販売価格を比較対照価格とする二重価格表示は、値下げ直前の価格であること、値下げ前2か月以上公表されていた価格であること等の要件を満たせば行うことができる。"},{"text":"販売を開始した当初の価格であれば、値下げの直前に公表していた価格でなくても、比較対照価格として表示することができる。","is_correct":false,"explanation":"誤り。比較対照価格とすることができるのは、値下げの直前の価格であって所定の期間公表されていたものに限られる。当初価格であっても値下げ直前の価格でなければ用いることはできない。"},{"text":"過去の販売価格を比較対照価格とする二重価格表示は、値下げの日から1年以内であれば行うことができる。","is_correct":false,"explanation":"誤り。過去の販売価格を比較対照価格とする表示は、値下げの日から6か月以内に表示するものであることが要件とされている。1年ではない。"},{"text":"過去の販売価格を比較対照価格とするには、それが値下げの直前の価格であって、値下げ前2か月以上にわたり実際に販売のために公表していた価格であることを要し、かつ、値下げの日から6か月以内に表示するものでなければならない。","is_correct":true,"explanation":"正しい。「値下げ直前の価格」「値下げ前2か月以上の公表実績」「値下げの日から6か月以内の表示」が、過去の販売価格を比較対照価格とする二重価格表示の主要な要件である。"}],"explanation":"二重価格表示は、実際には販売実績のない架空の高値を並べて値引きを装う不当表示につながりやすいため、比較対照価格に厳格な要件が課されている。「2か月以上の公表実績」「値下げから6か月以内」という数字は正確に記憶しておく必要がある。","difficulty":3,"tags":["税・その他","景品表示法"],"shuffle_choices":true},{"id":"Q4033","topic":"景品表示法","question_type":"select_incorrect","question":"宅地建物取引業者が行う広告に関する次の記述のうち、不動産の表示に関する公正競争規約(おとり広告の禁止)によれば、誤っているものはどれか。","choices":[{"text":"実際に存在する物件であれば、既に売約済みとなって取引の対象となり得ない物件を広告に掲載し続けても、おとり広告には当たらない。","is_correct":true,"explanation":"誤り。物件が存在しても、売約済み等により実際には取引の対象となり得ない物件に関する表示は、おとり広告として禁止される。成約後に広告を掲載し続ける行為は典型的な違反例である。"},{"text":"物件が存在しないため、実際には取引することができない物件に関する表示は、禁止されている。","is_correct":false,"explanation":"正しい。架空の物件(存在しない住所・地番の物件等)の表示は、おとり広告として禁止される。"},{"text":"物件は存在するが、実際には取引する意思がない物件に関する表示は、禁止されている。","is_correct":false,"explanation":"正しい。合理的な理由なく案内を拒否したり、他の物件ばかりを勧めるなど、取引する意思のない物件の表示はおとり広告として禁止される。"},{"text":"おとり広告は、顧客を集めて他の物件に誘導する意図の有無にかかわらず、禁止される。","is_correct":false,"explanation":"正しい。売約済み物件の掲載継続のように、誘導の意図がなくても、取引できない物件の表示自体がおとり広告として規制の対象となる。"}],"explanation":"おとり広告の禁止は、①存在しない物件、②存在するが取引の対象となり得ない物件(売約済み等)、③存在するが取引する意思がない物件、の3類型の表示を禁じるものである。好条件の広告で顧客を誘引し別物件を売り込む営業手法を防ぐことが制度趣旨である。","difficulty":2,"tags":["税・その他","景品表示法"],"shuffle_choices":true},{"id":"Q4034","topic":"景品表示法","question_type":"select_correct","question":"宅地建物取引業者が行う広告における特定事項の明示義務に関する次の記述のうち、不動産の表示に関する公正競争規約によれば、正しいものはどれか。","choices":[{"text":"市街化調整区域に所在する土地を新聞折込チラシで広告する場合、「市街化調整区域」と表示すれば足り、建物の建築ができない旨まで表示する必要はない。","is_correct":false,"explanation":"誤り。市街化調整区域内の土地(開発許可を受けているもの等を除く)は、「市街化調整区域。宅地の造成及び建物の建築はできません。」と明示しなければならず、原則として16ポイント以上の文字で表示することとされている。"},{"text":"建築基準法上の道路に適法に接していない土地であっても、現に建物が建っている場合には、「再建築不可」である旨を表示する必要はない。","is_correct":false,"explanation":"誤り。接道義務を満たさない土地は、現況建物の有無にかかわらず、「再建築不可」又は「建築不可」と明示しなければならない。"},{"text":"建築基準法第42条第2項の道路に接する土地でセットバックを要する部分を含むものは、その旨を表示し、セットバックを要する部分の面積がおおむね10%以上である場合は、併せてその面積も明示しなければならない。","is_correct":true,"explanation":"正しい。セットバック部分は建物の敷地として利用できないため、その旨の明示が義務付けられ、面積がおおむね10%以上のときは面積の明示も必要となる。"},{"text":"土地の上に古家が存在する場合であっても、取引の対象があくまで土地であるときは、古家がある旨を表示する必要はない。","is_correct":false,"explanation":"誤り。土地取引において、その土地上に古家、廃屋等が存在するときは、その旨を明示しなければならない。"}],"explanation":"特定事項の明示義務は、一般消費者が通常予期できない物件の欠点・制限(市街化調整区域、再建築不可、セットバック、古家の存在等)を広告段階で開示させ、不利益事項を隠した誘引を防ぐ制度である。セットバックの「おおむね10%以上で面積も明示」という基準は頻出である。","difficulty":3,"tags":["税・その他","景品表示法"],"shuffle_choices":true},{"id":"Q4035","topic":"土地","question_type":"select_incorrect","question":"土地に関する次の記述のうち、最も不適当なものはどれか。","choices":[{"text":"台地や段丘は、一般に水はけが良く地盤も安定しているため、低地に比べて宅地として良好な地形といえる。","is_correct":false,"explanation":"適当。台地・段丘は地盤が安定し、洪水や液状化の危険も比較的少ないため、宅地に適した地形の代表例である。"},{"text":"台地上の浅い谷や池沼を埋め立てた部分も、台地の一部である以上、豪雨時の浸水や地震時の被害を受けるおそれはないといえる。","is_correct":true,"explanation":"不適当。台地上であっても、浅い谷や池沼・水田の埋立地は周囲より低く軟弱で、豪雨時には雨水が集中して浸水しやすく、地震の際にも被害が生じやすい。台地だから一律に安全とはいえない。"},{"text":"台地の縁辺部(崖に近い部分)は、集中豪雨の際に崖崩れを起こす危険があるため、宅地としては注意を要する。","is_correct":false,"explanation":"適当。台地そのものは良好でも、縁辺部は斜面崩壊の危険があるため、宅地選定にあたって注意が必要である。"},{"text":"丘陵地や台地内の小さな谷間は、軟弱な地盤であることが多く、盛土で造成された場合には地盤沈下や排水不良が生じやすい。","is_correct":false,"explanation":"適当。谷を埋めた盛土造成地は、沈下・排水不良・地震時の変状が生じやすい典型的な要注意地形である。"}],"explanation":"台地・段丘は宅地に適した地形の代表であるが、その中でも浅い谷・池沼跡・縁辺部といった局所的な弱点が存在する。「良好な地形の中の例外」を問うのが土地分野の定番パターンであり、地形を一律に安全・危険と断定する肢は誤りであることが多い。","difficulty":1,"tags":["税・その他","土地"],"shuffle_choices":true},{"id":"Q4036","topic":"土地","question_type":"select_correct","question":"土地に関する次の記述のうち、最も適当なものはどれか。","choices":[{"text":"旧河道は、かつて河川の流路であった土地であるが、現在は水が流れていないため、宅地として特に問題のない地形である。","is_correct":false,"explanation":"不適当。旧河道は軟弱な地盤であることが多く、洪水時には再び水の通り道となりやすいうえ、地震時には液状化の危険も大きい要注意地形である。"},{"text":"後背湿地は、自然堤防の背後に位置し、砂質土がよく締まった地盤であるため、建物の基礎の支持地盤として適している。","is_correct":false,"explanation":"不適当。後背湿地は粘性土や有機質土が堆積した軟弱地盤であり、排水も悪く、宅地としては不適である。"},{"text":"干拓地は、海面より高い位置に造成されるため、高潮や津波の被害を受けるおそれは小さい。","is_correct":false,"explanation":"不適当。干拓地は海面以下ないし海面とほぼ同じ高さであることが多く、高潮・津波・洪水の被害を受けやすい。"},{"text":"自然堤防は、主に砂や小礫が堆積してできた周囲よりやや高い微高地であり、低地の中では比較的宅地に適している。","is_correct":true,"explanation":"適当。自然堤防は河川沿いに土砂が堆積した微高地で、排水性・地盤とも低地の中では良好であり、古くから集落が立地してきた。"}],"explanation":"低地は全体として宅地に不適であるが、その中でも自然堤防は例外的に比較的良好、旧河道・後背湿地・干拓地は特に危険という相対関係を押さえることが重要である。自然堤防とその背後の後背湿地はセットで出題されやすい。","difficulty":2,"tags":["税・その他","土地"],"shuffle_choices":true},{"id":"Q4037","topic":"土地","question_type":"select_incorrect","question":"土地に関する次の記述のうち、最も不適当なものはどれか。","choices":[{"text":"扇状地は、山地から平野に出た所に泥炭などの有機質土が厚く堆積してできた地盤であり、地耐力は極めて小さい。","is_correct":true,"explanation":"不適当。扇状地は、河川が山地から平地に出る所に砂礫が堆積して形成された地形であり、地盤は比較的良好で地耐力もある。泥炭が堆積した軟弱地盤という説明は誤りである。ただし土石流や洪水流路には注意を要する。"},{"text":"扇状地は、地形図上では等高線が扇状(同心円状)に表れることが多い。","is_correct":false,"explanation":"適当。扇状地は扇頂を中心に土砂が広がって堆積するため、等高線はほぼ同心円状に表れる。"},{"text":"天井川は、土砂の堆積により河床面が周辺の平地の地盤面より高くなった河川であり、堤防が決壊した場合の氾濫の危険が大きい。","is_correct":false,"explanation":"適当。天井川は河床が周辺より高いため、破堤すると水が周辺低地に一気に流れ込み、大きな被害をもたらす。"},{"text":"廃川となった天井川は、周辺の低地より高い位置にあるため、宅地として比較的良好な場合がある。","is_correct":false,"explanation":"適当。廃川になった天井川は微高地であり水害を受けにくいため、比較的良好な宅地となり得る。"}],"explanation":"扇状地は砂礫の堆積地形で地盤は比較的良好だが、谷の出口に位置するため土石流の危険と隣り合わせという二面性を持つ。天井川は現役の川であれば危険、廃川であれば微高地として良好という対比も、土地分野の定番論点である。","difficulty":2,"tags":["税・その他","土地"],"shuffle_choices":true},{"id":"Q4038","topic":"土地","question_type":"select_correct","question":"宅地造成された土地や崖・擁壁に関する次の記述のうち、最も適当なものはどれか。","choices":[{"text":"盛土をした部分は、切土をした部分に比べて地盤がよく締まっているため、造成後に沈下するおそれは小さい。","is_correct":false,"explanation":"不適当。盛土部分は人工的に土を盛った地盤であり、切土部分(元の地山)に比べて締固めが不十分になりやすく、沈下や崩壊のおそれが大きい。"},{"text":"切土部と盛土部にまたがる造成宅地は、地盤の強度が均一であるため、不同沈下が生じることはない。","is_correct":false,"explanation":"不適当。切土部と盛土部では地盤の硬さが異なるため、その境目付近では不同沈下が生じやすく、建物に亀裂等の被害をもたらすことがある。"},{"text":"崖下や擁壁に近接する宅地では、擁壁の水抜き穴の詰まり、ひび割れやはらみ出しの有無など、擁壁の状態を確認することが重要である。","is_correct":true,"explanation":"適当。擁壁の変状(ひび割れ・はらみ出し・水抜き穴の詰まり)は崩壊の予兆となり得るため、崖下や擁壁近くの宅地の安全性判断において重要な確認事項である。"},{"text":"擁壁には水抜き穴を設ける必要はなく、擁壁の背面に地下水や雨水がたまっても、その安定性に影響することはない。","is_correct":false,"explanation":"不適当。擁壁背面に水がたまると水圧で擁壁が崩壊するおそれがあるため、水抜き穴を設けて排水することが必要である。"}],"explanation":"造成地では「盛土は切土より弱い」「切土と盛土の境目は不同沈下しやすい」「擁壁は排水と変状の確認が命」という3点が基本である。人工地盤の弱点を自然地盤との対比で理解しておくと、初見の肢にも対応しやすい。","difficulty":2,"tags":["税・その他","土地"],"shuffle_choices":true},{"id":"Q4039","topic":"土地","question_type":"select_incorrect","question":"地震時の液状化現象に関する次の記述のうち、最も不適当なものはどれか。","choices":[{"text":"液状化は、比較的粒径のそろった砂質地盤で、地下水位が高い場所において発生しやすい。","is_correct":false,"explanation":"適当。液状化は、緩く堆積した砂質土が地下水で飽和している場合に、地震の振動で発生しやすい。"},{"text":"液状化は、粘土質の硬く締まった地盤で、地下水位が低い場所ほど発生しやすい。","is_correct":true,"explanation":"不適当。液状化が生じやすいのは砂質地盤かつ地下水位が高い場所であり、粘土質の硬い地盤や地下水位の低い場所では発生しにくい。条件が逆である。"},{"text":"埋立地や旧河道は、地震の際に液状化による被害が生じやすい。","is_correct":false,"explanation":"適当。埋立地・旧河道・干拓地などは、緩い砂質土と高い地下水位という液状化の条件を備えていることが多い。"},{"text":"同じ地域内であっても、地盤の粒径や地下水位などの性状によって、液状化の発生リスクは異なる。","is_correct":false,"explanation":"適当。液状化リスクは広域の地名ではなく個々の地点の地盤条件で決まるため、同一地域内でも場所により危険度は異なる。"}],"explanation":"液状化は「緩い砂質地盤+高い地下水位+地震動」の3条件がそろったときに、砂粒子の間の水圧が高まって地盤が液体状になる現象である。粘土地盤では起きにくいという対比を押さえれば、条件を入れ替えたひっかけ肢を確実に切れる。","difficulty":1,"tags":["税・その他","土地"],"shuffle_choices":true},{"id":"Q4040","topic":"土地","question_type":"select_correct","question":"土地の災害リスクと地形図の読み方に関する次の記述のうち、最も適当なものはどれか。","choices":[{"text":"地形図において、等高線の間隔が狭い所は傾斜が急であり、間隔が広い所は傾斜が緩やかである。","is_correct":true,"explanation":"適当。等高線は同じ標高の地点を結んだ線であるため、間隔が狭いほど短い水平距離で標高が変化しており、傾斜が急であることを示す。"},{"text":"土石流は、谷の出口や扇状地の扇頂部では発生せず、平坦な台地の上で多発する。","is_correct":false,"explanation":"不適当。土石流は谷筋を流下して谷の出口や扇状地に堆積するものであり、谷の出口・扇頂部こそ危険性が高い。平坦な台地上では発生しにくい。"},{"text":"地すべり地形は馬蹄形の滑落崖など特有の形状を示すことが多いが、過去に地すべりが発生した斜面で再び地すべりが起こることはない。","is_correct":false,"explanation":"不適当。地すべりは同じ場所で繰り返し発生する性質があり、地すべり地形の存在はむしろ将来の再発の危険を示すサインである。"},{"text":"等高線が標高の低い方へ張り出している部分は谷であり、標高の高い方へ食い込んでいる部分は尾根である。","is_correct":false,"explanation":"不適当。等高線が低い方へ張り出している部分は尾根、高い方へ食い込んでいる部分は谷であり、記述は逆である。"}],"explanation":"地形図の読み方では、等高線の間隔(密=急傾斜・疎=緩傾斜)と、張り出しの向き(低い方へ凸=尾根、高い方へ凸=谷)が二大論点である。地すべり・土石流は「同じ場所で繰り返す」「谷の出口が危険」という性質とあわせて理解したい。","difficulty":3,"tags":["税・その他","土地"],"shuffle_choices":true},{"id":"Q4041","topic":"建物","question_type":"select_incorrect","question":"木造建築物に関する次の記述のうち、最も不適当なものはどれか。","choices":[{"text":"在来軸組工法は、柱や梁などの軸組で建物の骨組みを構成し、筋かいや耐力壁によって地震力・風圧力などの水平力に抵抗させる工法である。","is_correct":false,"explanation":"適当。在来軸組工法の基本構成の説明として正しい。鉛直荷重は柱・梁が、水平力は筋かい・耐力壁が主として負担する。"},{"text":"耐力壁や筋かいは、建物の平面上、一部に偏らせず釣り合いよく配置することが、耐震上望ましい。","is_correct":false,"explanation":"適当。耐力要素が偏在すると地震時にねじれが生じて被害が大きくなるため、バランスの良い配置が求められる。"},{"text":"基礎は建物の荷重を地盤に伝える部分であり、土台は基礎に緊結しなければならない。","is_correct":false,"explanation":"適当。土台をアンカーボルト等で基礎に緊結することで、地震時に建物が基礎からずれたり浮き上がったりすることを防ぐ。"},{"text":"筋かいには、原則として欠込みをして他の部材と接合してよく、それにより構造耐力上の支障が生じることはない。","is_correct":true,"explanation":"不適当。筋かいは軸力を負担する重要な部材であるため、欠込みは原則として禁止されており、やむを得ず欠込みをする場合は必要な補強を行わなければならない。"}],"explanation":"木造在来軸組工法では、水平力に抵抗する筋かい・耐力壁の性能確保が耐震性の要であり、筋かいの欠込み禁止、耐力壁のバランス配置、土台と基礎の緊結はいずれもそのための基本ルールである。","difficulty":2,"tags":["税・その他","建物"],"shuffle_choices":true},{"id":"Q4042","topic":"建物","question_type":"select_correct","question":"鉄骨造の建築物に関する次の記述のうち、最も適当なものはどれか。","choices":[{"text":"鉄骨造は不燃構造であるため、火災の熱を受けても部材の強度が低下することはなく、耐火被覆を施す必要はない。","is_correct":false,"explanation":"不適当。鋼材は不燃材料ではあるが、火熱により強度が著しく低下するため、耐火構造とするには耐火被覆が必要である。"},{"text":"鋼材は細長い部材であっても座屈するおそれがないため、圧縮力を受ける部材の断面や長さを検討する必要はない。","is_correct":false,"explanation":"不適当。細長い鋼材が圧縮力を受けると座屈しやすいため、圧縮材の細長比等の検討が不可欠である。"},{"text":"鉄骨造は、鋼材のじん性(粘り強さ)を活かして大空間の建築や高層建築に適するが、火熱により耐力が低下するため、耐火構造とするには耐火被覆等の措置が必要である。","is_correct":true,"explanation":"適当。鉄骨造は軽量で強度・じん性に富み大スパン構造に適する一方、「不燃だが耐火ではない」ため耐火被覆が必要という、長所と短所を正しく述べている。"},{"text":"鋼材は大気中で錆びるおそれがないため、防錆処理を施す必要はない。","is_correct":false,"explanation":"不適当。鋼材は錆びやすく、腐食は断面欠損による耐力低下につながるため、塗装等の防錆処理が必要である。"}],"explanation":"鉄骨造の最重要論点は「不燃ではあるが、火熱で強度が落ちるため耐火被覆が必要」という点である。あわせて、細長い部材の座屈、錆による腐食への対策(防錆処理)も、鋼材という材料の性質から導かれる基本知識である。","difficulty":1,"tags":["税・その他","建物"],"shuffle_choices":true},{"id":"Q4043","topic":"建物","question_type":"select_incorrect","question":"鉄筋コンクリート造の建築物に関する次の記述のうち、最も不適当なものはどれか。","choices":[{"text":"鉄筋コンクリート造は、圧縮力に強いコンクリートと引張力に強い鉄筋とを組み合わせることで、互いの短所を補い合う構造である。","is_correct":false,"explanation":"適当。コンクリートは圧縮に強く引張りに弱い、鉄筋は引張りに強いという性質を組み合わせるのが鉄筋コンクリート造の基本原理である。"},{"text":"コンクリートは酸性であるため内部の鉄筋を錆びさせやすく、コンクリートの中性化が進行するほど、鉄筋の腐食は抑えられる。","is_correct":true,"explanation":"不適当。コンクリートはアルカリ性であり、その作用で鉄筋の錆を防いでいる。中性化が進行するとアルカリ性が失われて鉄筋が腐食しやすくなるため、記述は二重に誤っている。"},{"text":"鉄筋に対するコンクリートのかぶり厚さは、鉄筋を火熱や錆から
