<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1f2933; --sub:#68707a;
    --line:#dfe4ea; --accent:#c0392b; --accent-d:#96281b;
    --ok:#1e7e50; --ok-bg:#e8f6ef; --ng:#c0392b; --ng-bg:#fdecea;
    --shadow:0 2px 10px rgba(0,0,0,.07);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
    font-size:16px; line-height:1.8; -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{
    max-width:860px; margin:0 auto;
    padding:16px max(16px, env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  header{
    background:var(--accent); color:#fff;
    padding:14px max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left));
    padding-top:calc(14px + env(safe-area-inset-top));
    box-shadow:var(--shadow); position:sticky; top:0; z-index:10;
  }
  header .inner{max-width:860px; margin:0 auto; display:flex; align-items:center; gap:12px;}
  header h1{font-size:18px; margin:0; font-weight:700; letter-spacing:.04em;}
  header .spacer{flex:1;}
  .btn{
    display:inline-block; border:none; border-radius:8px; cursor:pointer;
    font-family:inherit; font-size:16px; font-weight:700; padding:12px 20px;
    background:var(--accent); color:#fff; transition:background .15s;
  }
  .btn:hover{background:var(--accent-d);}
  .btn.sub{background:#fff; color:var(--ink); border:1px solid var(--line);}
  .btn.sub:hover{background:#f0f2f5;}
  .btn.ghost{background:rgba(255,255,255,.15); color:#fff; padding:7px 14px; font-size:14px;}
  .btn.ghost:hover{background:rgba(255,255,255,.28);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .card{background:var(--card); border-radius:12px; box-shadow:var(--shadow); padding:20px; margin-bottom:16px;}
  h2{font-size:17px; margin:0 0 14px; padding-left:10px; border-left:4px solid var(--accent);}
  .hide{display:none !important;}

  /* ホーム */
  .opt-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
  .opt{
    border:2px solid var(--line); border-radius:10px; background:#fff; cursor:pointer;
    padding:14px 10px; text-align:center; font-family:inherit; font-size:15px; font-weight:700;
    color:var(--ink); transition:all .15s; line-height:1.5;
  }
  .opt:hover{border-color:#b8c0cc;}
  .opt[aria-pressed="true"]{border-color:var(--accent); background:#fdf2f0; color:var(--accent-d);}
  .opt small{display:block; font-weight:400; font-size:12px; color:var(--sub); margin-top:3px;}
  .opt[aria-pressed="true"] small{color:var(--accent-d);}
  .opt:disabled{opacity:.4; cursor:not-allowed;}
  .start-row{text-align:center; margin-top:6px;}
  .start-row .btn{font-size:18px; padding:16px 48px;}
  .note{font-size:13px; color:var(--sub); margin-top:10px; text-align:center;}

  /* 成績表 */
  table.stats{width:100%; border-collapse:collapse; font-size:15px;}
  table.stats th, table.stats td{padding:9px 8px; border-bottom:1px solid var(--line); text-align:left;}
  table.stats th{color:var(--sub); font-weight:700; font-size:13px;}
  table.stats td.num{text-align:right; font-variant-numeric:tabular-nums;}
  .bar{height:8px; background:#eceff3; border-radius:99px; overflow:hidden; min-width:70px;}
  .bar i{display:block; height:100%; background:var(--ok); border-radius:99px;}

  /* 出題 */
  .qhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
  .pill{font-size:12px; font-weight:700; padding:4px 10px; border-radius:99px; background:#eceff3; color:var(--sub);}
  .pill.warn{background:#fdecea; color:var(--ng);}
  .pill.type{background:#eaf1fb; color:#20548f;}
  .progress{height:6px; background:#e4e8ee; border-radius:99px; overflow:hidden; margin-bottom:14px;}
  .progress i{display:block; height:100%; background:var(--accent); transition:width .25s;}
  .qtext{font-size:17px; font-weight:700; line-height:1.85; margin:0 0 18px;}
  .choices{display:flex; flex-direction:column; gap:10px;}
  .choice{
    display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
    border:2px solid var(--line); border-radius:10px; background:#fff; cursor:pointer;
    padding:14px 16px; font-family:inherit; font-size:16px; line-height:1.75; color:var(--ink);
    transition:border-color .15s, background .15s;
  }
  .choice:hover:not(:disabled){border-color:#b8c0cc; background:#fafbfc;}
  .choice:disabled{cursor:default;}
  .choice .no{
    flex:0 0 26px; height:26px; border-radius:50%; background:#eceff3; color:var(--sub);
    font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:2px;
  }
  .choice.correct{border-color:var(--ok); background:var(--ok-bg);}
  .choice.correct .no{background:var(--ok); color:#fff;}
  .choice.wrong{border-color:var(--ng); background:var(--ng-bg);}
  .choice.wrong .no{background:var(--ng); color:#fff;}
  .verdict{font-size:20px; font-weight:700; margin:18px 0 10px;}
  .verdict.ok{color:var(--ok);} .verdict.ng{color:var(--ng);}
  .exp{background:#f7f9fb; border-radius:10px; padding:16px; font-size:15px;}
  .exp h3{font-size:14px; margin:0 0 8px; color:var(--sub);}
  .exp ul{margin:0; padding-left:0; list-style:none;}
  .exp li{margin-bottom:10px; padding-left:2px;}
  .exp li:last-child{margin-bottom:0;}
  .exp .mk{font-weight:700; margin-right:8px; white-space:nowrap;}
  .exp .mk.o{color:var(--ok);} .exp .mk.x{color:var(--sub);}
  .exp .mk .tag{
    font-size:11px; background:var(--ok); color:#fff; border-radius:99px;
    padding:2px 8px; margin-left:5px; vertical-align:1px;
  }
  .exp .total{margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}
  .nav-row{display:flex; gap:10px; margin-top:18px;}
  .nav-row .btn{flex:1;}

  /* 結果 */
  .score{text-align:center; padding:10px 0 4px;}
  .score .pct{font-size:52px; font-weight:700; line-height:1.2; color:var(--accent);}
  .score .detail{font-size:16px; color:var(--sub);}
  .score .msg{font-size:16px; font-weight:700; margin-top:10px;}
  .review-item{border-bottom:1px solid var(--line); padding:12px 0;}
  .review-item:last-child{border-bottom:none;}
  .review-item .rq{font-weight:700; font-size:15px; margin-bottom:4px;}
  .review-item .ra{font-size:14px; color:var(--sub);}
  @media (max-width:600px){
    .wrap{padding:12px 12px 50px;} .card{padding:16px;}
    .qtext{font-size:16px;} .score .pct{font-size:44px;}
    .nav-row{flex-direction:column;}
  }
</style>
</head>

<script id="quizData" type="application/json">{"subject":"宅建士試験 全科目","questions":[{"id":"Q1001","topic":"宅建業法の基本","question_type":"select_correct","question":"宅地建物取引業法に規定する「宅地」に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"登記簿上の地目が山林である土地は、建物の敷地に供する目的で取引の対象とされる場合であっても、宅地に該当しない。","is_correct":false,"explanation":"宅地に該当するかどうかは登記簿上の地目とは無関係に、現況や取引の目的から判断される。建物の敷地に供する目的で取引される土地であれば、地目が山林でも宅地に該当する。"},{"text":"用途地域内に存する土地は、現に道路として利用されているものであっても、すべて宅地に該当する。","is_correct":false,"explanation":"用途地域内の土地は原則として宅地に該当するが、現に道路・公園・河川・広場・水路の用に供されている土地は除かれる。"},{"text":"用途地域外に存する土地であっても、建物の敷地に供する目的で取引の対象とされる土地は、宅地に該当する。","is_correct":true,"explanation":"そのとおり。宅地とは、①建物の敷地に供せられる土地(現に建物が建つ土地や建物の敷地に供する目的で取引される土地)、②用途地域内のその他の土地(道路・公園・河川・広場・水路を除く)をいい、用途地域の内外を問わない。"},{"text":"現に農地として耕作されている土地は、用途地域内に存するものであっても、宅地に該当しない。","is_correct":false,"explanation":"用途地域内の土地は、道路・公園・河川・広場・水路の用に供されているものを除き宅地に該当する。現況が農地であっても、用途地域内に存すれば宅地である。"}],"explanation":"宅地の定義は「建物の敷地に供せられる土地」と「用途地域内の土地(道路・公園・河川・広場・水路を除く)」の2本立てである。登記地目や現況の利用状況ではなく、建物の敷地に供する目的の有無と用途地域の内外で判断する点が繰り返し問われる。","difficulty":1,"tags":["宅建業法","宅地の定義"],"shuffle_choices":true},{"id":"Q1002","topic":"宅建業法の基本","question_type":"select_incorrect","question":"宅地建物取引業法に規定する「取引」に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"自己の所有する賃貸マンションの各住戸を、不特定多数の者に反復継続して賃貸する行為は、取引に該当するため、免許を受けなければならない。","is_correct":true,"explanation":"誤り。自ら当事者として行う貸借(自ら貸借)は、宅地建物取引業法上の「取引」に該当しない。したがって、反復継続して行っても免許は不要である。"},{"text":"他人が所有する建物の売買の媒介を業として行う行為は、取引に該当する。","is_correct":false,"explanation":"正しい。売買・交換・貸借の媒介は、いずれも取引に該当する。"},{"text":"建物の貸借の代理を業として行う行為は、取引に該当し、免許を受けなければならない。","is_correct":false,"explanation":"正しい。自ら貸借は取引に当たらないが、貸借の「代理」や「媒介」を業として行うことは取引に該当し、免許が必要である。"},{"text":"自ら所有する宅地を、転売により利益を得る目的で不特定多数の者に反復継続して売却する行為は、取引に該当する。","is_correct":false,"explanation":"正しい。自ら当事者として行う売買・交換は取引に該当する。反復継続して不特定多数に行えば「業」となり免許が必要である。"}],"explanation":"取引とは、①自ら行う売買・交換、②売買・交換・貸借の代理、③売買・交換・貸借の媒介をいう。自ら行う「貸借」だけは取引に含まれない点が最重要のひっかけであり、サブリースや転貸も同様に免許不要である。","difficulty":1,"tags":["宅建業法","取引の定義"],"shuffle_choices":true},{"id":"Q1003","topic":"宅建業法の基本","question_type":"select_correct","question":"宅地建物取引業の免許を要しない者等に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"地方公共団体が造成した宅地を不特定多数の者に反復継続して分譲する場合、当該地方公共団体は都道府県知事の免許を受けなければならない。","is_correct":false,"explanation":"国及び地方公共団体には宅地建物取引業法の規定が適用されないため、免許を受けることなく宅地の分譲を行うことができる。"},{"text":"信託業法第3条の免許を受けた信託会社は、国土交通大臣への届出をすることなく宅地建物取引業を営むことができる。","is_correct":false,"explanation":"信託会社は免許に関する規定こそ適用されないが、宅地建物取引業を営もうとするときは、あらかじめ国土交通大臣に届け出なければならない。無届出で営めるわけではない。"},{"text":"破産管財人が、破産財団の換価のために裁判所の監督の下で宅地を反復継続して売却する行為は、宅地建物取引業に該当するため、免許が必要である。","is_correct":false,"explanation":"破産管財人による破産財団の換価のための売却は、裁判所の監督の下で行われる法定の職務行為であり、「業として行う」ものに当たらないため、免許は不要である。"},{"text":"信託業法第3条の免許を受けた信託会社には、宅地建物取引業の免許に関する規定は適用されないが、営業保証金など免許以外の宅地建物取引業法の規定は適用される。","is_correct":true,"explanation":"正しい。信託会社は国土交通大臣に届出をすれば国土交通大臣の免許を受けた宅地建物取引業者とみなされ、免許に関する規定を除き、営業保証金や業務上の規制など宅地建物取引業法の規定の適用を受ける。"}],"explanation":"国・地方公共団体は宅地建物取引業法の適用が全面的に除外されるのに対し、信託会社・信託銀行は「免許の規定だけ」が適用除外であり、国土交通大臣への届出を経てみなし業者として免許以外の規制には服する。両者の除外範囲の違いを正確に区別することがポイントである。","difficulty":2,"tags":["宅建業法","免許不要者"],"shuffle_choices":true},{"id":"Q1004","topic":"宅建業法の基本","question_type":"select_incorrect","question":"宅地建物取引業の免許の要否に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"農業を営むAが、所有する農地を宅地に転用して多数の区画に分割し、不特定多数の者に反復継続して売却する場合、Aは免許を受けなければならない。","is_correct":false,"explanation":"正しい。自ら売主として不特定多数の者に反復継続して宅地を売却する行為は宅地建物取引業に該当し、農家であっても免許が必要である。"},{"text":"Bが、所有する宅地を10区画に分割し、その販売代理を宅地建物取引業者Cに一括して依頼して不特定多数の者に分譲する場合、B自身は販売活動を行わないため、Bは免許を受ける必要はない。","is_correct":true,"explanation":"誤り。宅地建物取引業者に代理を依頼しても、売買契約の効果は売主であるBに帰属する。Bは自ら売主として反復継続して売買を行うことになるため、免許が必要である。"},{"text":"Dが、相続により取得した宅地を、一括して宅地建物取引業者Eに売却する場合、Dは免許を受ける必要はない。","is_correct":false,"explanation":"正しい。1回限りの一括売却には反復継続性がなく、「業として行う」ものに該当しないため、免許は不要である。"},{"text":"免許を受けない者は、宅地建物取引業を営む旨の表示をし、又は宅地建物取引業を営む目的で広告をすることも禁止されている。","is_correct":false,"explanation":"正しい。無免許者は営業行為そのものだけでなく、宅建業を営む旨の表示や営業目的の広告をすることも禁止されている。"}],"explanation":"「業」に該当するかは、不特定多数を相手方とするか(対象の広さ)と反復継続性の有無で判断する。宅地建物取引業者に代理・媒介を依頼しても、契約の当事者は売主本人である以上、売主自身に免許が必要となる点が頻出のひっかけである。","difficulty":3,"tags":["宅建業法","業の定義","無免許営業"],"shuffle_choices":true},{"id":"Q1005","topic":"免許","question_type":"select_correct","question":"宅地建物取引業の免許の区分に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"事務所の数が10を超える宅地建物取引業者は、事務所がすべて一の都道府県内にある場合でも、国土交通大臣の免許を受けなければならない。","is_correct":false,"explanation":"免許の区分は事務所の「数」ではなく、事務所が所在する都道府県の数で決まる。一の都道府県内にのみ事務所があれば、数が多くても知事免許である。"},{"text":"一の都道府県の区域内にのみ事務所を設置して宅地建物取引業を営もうとする場合は、設置する事務所が複数であっても、当該都道府県知事の免許を受ければよい。","is_correct":true,"explanation":"正しい。一の都道府県内にのみ事務所を設置する場合はその都道府県知事の免許、二以上の都道府県に事務所を設置する場合は国土交通大臣の免許を受ける。"},{"text":"都道府県知事の免許を受けた宅地建物取引業者は、免許を受けた都道府県の区域内でしか宅地建物の取引を行うことができない。","is_correct":false,"explanation":"知事免許であっても、事務所を設置しない限り、全国どこでも取引(業務)を行うことができる。免許の区分は業務を行える地域を制限するものではない。"},{"text":"甲県知事の免許を受けた宅地建物取引業者が、乙県内に契約の締結を行わない案内所を設置する場合、国土交通大臣への免許換えが必要である。","is_correct":false,"explanation":"案内所は事務所に該当しないため、他の都道府県に案内所を設置しても免許換えは不要である。免許換えが必要となるのは事務所の設置状況が変わる場合である。"}],"explanation":"大臣免許か知事免許かは、事務所が二以上の都道府県に所在するか否かのみで決まり、事務所の数や業務を行う地域とは無関係である。また、案内所は事務所ではないため免許区分に影響しない。","difficulty":1,"tags":["宅建業法","免許"],"shuffle_choices":true},{"id":"Q1006","topic":"免許","question_type":"select_correct","question":"宅地建物取引業の免許換えに関する次の記述のうち、正しいものはどれか。","choices":[{"text":"免許換えにより新たに免許を受けた場合、その免許の有効期間は、従前の免許の有効期間の残存期間である。","is_correct":false,"explanation":"免許換え後の免許の有効期間は、従前の免許の残存期間ではなく、新たな免許を受けた日から5年である。"},{"text":"甲県知事の免許を受けた宅地建物取引業者が、甲県内の事務所を廃止して乙県内にのみ事務所を設置する場合、甲県知事を経由して乙県知事に免許換えの申請をしなければならない。","is_correct":false,"explanation":"知事免許から他の知事免許への免許換えは、新たに免許権者となる知事に直接申請する。経由申請が必要となるのは国土交通大臣に免許申請する場合(主たる事務所の所在地を管轄する知事を経由)である。"},{"text":"免許換えが必要であるにもかかわらず、免許換えの申請を怠って営業を続けた場合、免許権者は情状により免許を取り消すことができる。","is_correct":false,"explanation":"免許換えを怠っていることが判明した場合、免許権者は免許を取り消さなければならない(必要的取消事由)。「取り消すことができる」という任意的なものではない。"},{"text":"甲県知事の免許を受けた宅地建物取引業者が、甲県内の事務所をすべて廃止し、乙県内にのみ事務所を設置して事業を継続する場合、乙県知事の免許を受けなければならない。","is_correct":true,"explanation":"正しい。事務所の所在する都道府県が甲県から乙県のみに変わるため、乙県知事への免許換えが必要である。"}],"explanation":"免許換えは、事務所の設置状況の変化により免許権者が変わる場合に必要となる手続である。免許換え後の有効期間は残存期間の引継ぎではなく新たに5年となること、免許換えを怠った場合は必要的取消事由となることが頻出論点である。","difficulty":2,"tags":["宅建業法","免許","免許換え"],"shuffle_choices":true},{"id":"Q1007","topic":"免許","question_type":"select_incorrect","question":"宅地建物取引業の免許の有効期間及び更新に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"免許の有効期間は、国土交通大臣の免許、都道府県知事の免許のいずれも5年である。","is_correct":false,"explanation":"正しい。免許の有効期間は、大臣免許・知事免許を問わず一律5年である。"},{"text":"免許の更新を受けようとする者は、免許の有効期間満了の日の90日前から30日前までの間に、免許申請書を提出しなければならない。","is_correct":false,"explanation":"正しい。更新の申請期間は有効期間満了の日の90日前から30日前までである。"},{"text":"有効期間満了の日までに更新申請に対する処分がなされない場合、免許は有効期間の満了により効力を失い、処分がなされるまで宅地建物取引業を営むことができない。","is_correct":true,"explanation":"誤り。所定の期間内に更新申請をしたにもかかわらず満了日までに処分がなされないときは、処分がなされるまで従前の免許が引き続き効力を有するため、業務を継続することができる。"},{"text":"免許の更新がなされた場合、新たな免許の有効期間は、従前の免許の有効期間満了の日の翌日から起算して5年となる。","is_correct":false,"explanation":"正しい。更新後の有効期間は、処分がなされた日からではなく、従前の有効期間満了日の翌日から起算して5年である。"}],"explanation":"更新申請を期間内に行えば、行政側の処分の遅れによって業者が不利益を受けないよう、処分がなされるまで従前の免許が効力を持ち続ける。この場合でも、更新後の有効期間は従前の満了日の翌日から起算される点をあわせて押さえたい。","difficulty":1,"tags":["宅建業法","免許","有効期間"],"shuffle_choices":true},{"id":"Q1008","topic":"免許","question_type":"select_correct","question":"宅地建物取引業の免許の欠格事由に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"破産手続開始の決定を受けた個人であっても、復権を得れば、復権を得た日から5年を経過していなくても、免許を受けることができる。","is_correct":true,"explanation":"正しい。破産手続開始の決定を受けて復権を得ない者は欠格であるが、復権を得れば直ちに欠格事由に該当しなくなり、5年の経過を待つ必要はない。"},{"text":"破産手続開始の決定を受けた個人は、復権を得た日から5年を経過しなければ、免許を受けることができない。","is_correct":false,"explanation":"破産による欠格は「復権を得ないこと」自体が要件であり、復権を得れば直ちに免許を受けることができる。5年の経過は不要である。"},{"text":"法人の役員のうちに破産手続開始の決定を受けて復権を得ない者がいる場合でも、当該法人自体が破産していなければ、その法人は免許を受けることができる。","is_correct":false,"explanation":"法人の役員又は政令で定める使用人のうちに欠格事由に該当する者がいる場合、その法人も免許を受けることができない。"},{"text":"破産手続開始の決定を受けたことのある者が復権を得て免許を受ける場合、免許権者は必ずその免許に条件を付さなければならない。","is_correct":false,"explanation":"免許権者は免許に条件を付すことが「できる」にとどまり、復権を得た者の免許に必ず条件を付すという規定は存在しない。"}],"explanation":"破産による欠格事由は「復権を得ない」状態が続く間のみであり、復権により直ちに解消する。刑罰による欠格(5年間)と異なり期間の経過を要しない点が典型的なひっかけであり、役員が欠格なら法人も欠格となる連帯性もあわせて重要である。","difficulty":2,"tags":["宅建業法","免許","欠格事由"],"shuffle_choices":true},{"id":"Q1009","topic":"免許","question_type":"select_incorrect","question":"宅地建物取引業の免許の欠格事由(刑罰関係)に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"拘禁刑に処せられ、刑の全部の執行猶予を付された者は、執行猶予期間が満了すれば、その満了の日から5年を経過していなくても、免許を受けることができる。","is_correct":false,"explanation":"正しい。執行猶予期間が満了すると刑の言渡しは効力を失うため、満了により直ちに欠格事由に該当しなくなる。"},{"text":"道路交通法違反により罰金の刑に処せられた者は、その刑の執行を終わった日から5年を経過していなくても、免許を受けることができる。","is_correct":false,"explanation":"正しい。罰金刑で欠格となるのは、宅地建物取引業法違反や傷害罪・背任罪など一定の犯罪に限られる。道路交通法違反の罰金は欠格事由に該当しない。"},{"text":"傷害罪により罰金の刑に処せられた者は、その刑の執行を終わった日から5年を経過しなければ、免許を受けることができない。","is_correct":false,"explanation":"正しい。傷害罪などの暴力的な犯罪による罰金刑は欠格事由に該当し、刑の執行を終わり又は執行を受けることがなくなった日から5年間は免許を受けられない。"},{"text":"拘禁刑の判決を受け、これを不服として控訴し裁判が係属中である者は、免許を受けることができない。","is_correct":true,"explanation":"誤り。欠格事由となるのは刑に「処せられた」場合、すなわち刑が確定した場合である。控訴・上告により裁判が係属中で刑が確定していない間は、欠格事由に該当しない。"}],"explanation":"拘禁刑以上の刑はすべての犯罪で欠格となるが、罰金刑は宅建業法違反・暴力的犯罪等の一定の罪に限られる。また、欠格となるのは刑の確定後であり、控訴・上告中は該当しないこと、執行猶予は期間満了で直ちに欠格が解消することが頻出論点である。","difficulty":2,"tags":["宅建業法","免許","欠格事由"],"shuffle_choices":true},{"id":"Q1010","topic":"免許","question_type":"select_correct","question":"宅地建物取引業の免許の欠格事由(免許取消し関係)に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"不正の手段により免許を受けたことを理由に免許を取り消された法人において、当該取消しに係る聴聞の期日及び場所の公示の日前60日以内に政令で定める使用人であった者は、取消しの日から5年間免許を受けることができない。","is_correct":false,"explanation":"5年間の欠格となるのは、公示日前60日以内に当該法人の「役員」であった者である。政令で定める使用人であった者は、この欠格事由には該当しない。"},{"text":"業務停止処分を受けたことがある宅地建物取引業者は、当該処分の日から5年を経過しなければ、免許の更新を受けることができない。","is_correct":false,"explanation":"欠格事由となるのは一定の理由による免許取消処分であり、業務停止処分を受けたこと自体は欠格事由ではない。"},{"text":"不正の手段により免許を受けたことを理由として免許を取り消された法人において、当該取消しに係る聴聞の期日及び場所の公示の日前60日以内に役員であった者は、当該取消しの日から5年間免許を受けることができない。","is_correct":true,"explanation":"正しい。三大違反(不正手段による免許取得、業務停止事由に該当し情状が特に重いこと、業務停止処分違反)を理由とする免許取消しの場合、公示日前60日以内の役員も取消しの日から5年間欠格となる。"},{"text":"免許取消処分の聴聞の期日及び場所が公示された後、処分の決定前に相当の理由なく廃業の届出をした者は、届出の日から3年間免許を受けることができない。","is_correct":false,"explanation":"処分逃れのための廃業届出をした者の欠格期間は、届出の日から3年ではなく5年である。"}],"explanation":"三大違反による免許取消しの効果は法人だけでなく、聴聞公示日前60日以内に役員であった者にも及ぶ(5年間の欠格)。対象は役員に限られ政令使用人は含まれないこと、処分逃れの廃業届出も届出日から5年間欠格となることをセットで押さえたい。","difficulty":3,"tags":["宅建業法","免許","欠格事由"],"shuffle_choices":true},{"id":"Q1011","topic":"免許","question_type":"select_incorrect","question":"宅地建物取引業の免許の欠格事由(暴力団関係)に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"暴力団員による不当な行為の防止等に関する法律に規定する暴力団員は、免許を受けることができない。","is_correct":false,"explanation":"正しい。暴力団員は欠格事由に該当し、免許を受けることができない。"},{"text":"暴力団員でなくなった日から3年を経過した者は、免許を受けることができる。","is_correct":true,"explanation":"誤り。暴力団員でなくなった日から5年を経過しない者は欠格事由に該当する。3年の経過では足りない。"},{"text":"暴力団員等がその事業活動を支配する者は、免許を受けることができない。","is_correct":false,"explanation":"正しい。暴力団員等がその事業活動を支配する者は、それ自体が欠格事由とされている。"},{"text":"法人の政令で定める使用人が暴力団員である場合、当該法人は免許を受けることができない。","is_correct":false,"explanation":"正しい。役員又は政令で定める使用人が欠格事由に該当する法人は、免許を受けることができない。"}],"explanation":"暴力団員及び暴力団員でなくなった日から5年を経過しない者(いわゆる暴力団員等)は欠格であり、暴力団員等が事業活動を支配する者も免許を受けられない。「3年」などの期間のすり替えに注意が必要である。","difficulty":2,"tags":["宅建業法","免許","欠格事由"],"shuffle_choices":true},{"id":"Q1012","topic":"免許","question_type":"select_correct","question":"宅地建物取引業者の変更の届出に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"法人である宅地建物取引業者の役員の氏名に変更があった場合、当該業者は30日以内にその旨を免許権者に届け出なければならない。","is_correct":true,"explanation":"正しい。役員の氏名は免許申請書の記載事項であり、変更があったときは30日以内に免許権者に変更の届出をしなければならない。"},{"text":"法人である宅地建物取引業者の役員の住所に変更があった場合、当該業者は30日以内にその旨を免許権者に届け出なければならない。","is_correct":false,"explanation":"変更の届出が必要なのは役員の「氏名」であり、住所は届出事項とされていない。"},{"text":"宅地建物取引業者の事務所の所在地に変更があった場合、当該業者は2週間以内にその旨を免許権者に届け出なければならない。","is_correct":false,"explanation":"事務所の名称・所在地は届出事項であるが、届出期間は2週間以内ではなく30日以内である。"},{"text":"法人である宅地建物取引業者の資本金の額に変更があった場合、当該業者は30日以内にその旨を免許権者に届け出なければならない。","is_correct":false,"explanation":"資本金の額は変更の届出事項とされていない。届出が必要なのは商号・名称、役員及び政令で定める使用人の氏名、事務所の名称・所在地、事務所ごとの専任の宅地建物取引士の氏名である。"}],"explanation":"変更の届出は30日以内に免許権者に対して行う。対象は商号・名称、役員・政令使用人の氏名、事務所の名称・所在地、専任の宅地建物取引士の氏名であり、「住所」や「資本金」が含まれない点が定番のひっかけである。","difficulty":1,"tags":["宅建業法","免許","変更の届出"],"shuffle_choices":true},{"id":"Q1013","topic":"免許","question_type":"select_correct","question":"宅地建物取引業者の廃業等の届出に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"個人である宅地建物取引業者が死亡した場合、その相続人は、死亡の日から30日以内に免許権者に届け出なければならない。","is_correct":false,"explanation":"死亡の場合の届出期間は、死亡の日からではなく、相続人が死亡の事実を「知った日」から30日以内である。"},{"text":"法人である宅地建物取引業者が合併により消滅した場合、存続する法人を代表する役員が、その旨を免許権者に届け出なければならない。","is_correct":false,"explanation":"合併消滅の場合の届出義務者は、消滅した法人を代表する役員「であった者」である。存続法人の代表役員ではない。"},{"text":"宅地建物取引業者が破産手続開始の決定を受けた場合、免許は当該決定の日に遡って効力を失う。","is_correct":false,"explanation":"破産手続開始の決定・解散・廃業の場合、免許は届出の時に効力を失う。決定の日に失効するのではない。なお届出義務者は破産管財人である。"},{"text":"法人である宅地建物取引業者が合併により消滅した場合、免許は届出の時ではなく、合併により消滅した時に効力を失う。","is_correct":true,"explanation":"正しい。死亡と合併消滅の場合は、免許はその事実が発生した時(死亡時・消滅時)に効力を失う。届出の時に失効する破産・解散・廃業と区別される。"}],"explanation":"廃業等の届出は原則として事由発生から30日以内(死亡のみ「知った日」から30日以内)であり、届出義務者は死亡=相続人、合併消滅=消滅法人の代表役員であった者、破産=破産管財人、解散=清算人、廃業=代表役員(個人は本人)である。免許の失効時期は、死亡・合併は事由発生時、その他は届出時という区別が最重要ポイントである。","difficulty":3,"tags":["宅建業法","免許","廃業等の届出"],"shuffle_choices":true},{"id":"Q1014","topic":"免許","question_type":"select_correct","question":"個人である宅地建物取引業者Aが死亡した場合等に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"Aの相続人は、Aが生前に締結した売買契約に基づく取引を結了する目的の範囲内であっても、免許を受けていない以上、その取引に関する業務を行うことができない。","is_correct":false,"explanation":"相続人は、被相続人が締結した契約に基づく取引を結了する目的の範囲内においては、宅地建物取引業者とみなされるため、免許がなくても当該業務を行うことができる。"},{"text":"Aの相続人は、Aが生前に締結した売買契約に基づく取引を結了する目的の範囲内において、宅地建物取引業者とみなされる。","is_correct":true,"explanation":"正しい。死亡・合併消滅・免許の失効や取消しの場合、一般承継人又は業者であった者は、締結済みの契約に基づく取引を結了する目的の範囲内でなお業者とみなされる。"},{"text":"Aの相続人は、取引を結了する目的の範囲内で宅地建物取引業者とみなされるため、その範囲内であれば新たに宅地の売買契約を締結することもできる。","is_correct":false,"explanation":"みなし業者として認められるのは、既に締結されていた契約に基づく取引を結了させるための業務に限られる。新たな売買契約の締結はできない。"},{"text":"宅地建物取引業の免許は相続により承継されるため、Aの相続人は、Aの免許の有効期間の残存期間中、宅地建物取引業を営むことができる。","is_correct":false,"explanation":"免許は一身専属的なものであり、相続や合併によって承継されない。相続人が宅地建物取引業を営むには、自ら免許を受ける必要がある。"}],"explanation":"免許は相続・合併では承継されないが、取引の相手方保護のため、一般承継人は既存契約の取引を結了する目的の範囲内に限り業者とみなされる。「結了目的の範囲内」という限定があるため、新規契約の締結までは認められない。","difficulty":2,"tags":["宅建業法","免許","みなし業者"],"shuffle_choices":true},{"id":"Q1015","topic":"免許","question_type":"select_incorrect","question":"宅地建物取引業の免許の条件等に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"免許権者は、免許に条件を付し、及びこれを変更することができる。","is_correct":false,"explanation":"正しい。免許権者は、宅地建物取引業の適正な運営や取引の公正を確保するため必要な最小限度の条件を免許に付し、変更することができる。"},{"text":"免許の条件は、新規の免許のときだけでなく、免許の更新に当たっても付すことができる。","is_correct":false,"explanation":"正しい。免許の条件は、新規免許時と更新時のいずれにおいても付すことができる。"},{"text":"宅地建物取引業者が免許に付された条件に違反した場合、免許権者は必ずその免許を取り消さなければならない。","is_correct":true,"explanation":"誤り。免許の条件に違反した場合は、免許権者は免許を「取り消すことができる」とされる任意的取消事由であり、必ず取り消さなければならないものではない。"},{"text":"宅地建物取引業者は、免許取消処分を受けたときは、遅滞なく免許証を返納しなければならない。","is_correct":false,"explanation":"正しい。免許取消処分を受けたとき、免許換えにより免許が効力を失ったとき、亡失した免許証を発見したとき、廃業等の届出をするときは、免許証を返納しなければならない。"}],"explanation":"免許の条件違反は任意的取消事由であり、免許換えを怠った場合や欠格事由に該当した場合などの必要的取消事由とは区別される。「できる」と「しなければならない」の書き分けは免許分野全体を通じた頻出の出題ポイントである。","difficulty":2,"tags":["宅建業法","免許","免許の条件"],"shuffle_choices":true},{"id":"Q1016","topic":"免許","question_type":"select_incorrect","question":"無免許営業及び名義貸しの禁止に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"宅地建物取引業者は、自己の名義をもって他人に宅地建物取引業を営ませることはできないが、自己の名義をもって他人に宅地建物取引業を営む旨の表示又は広告をさせることはできる。","is_correct":true,"explanation":"誤り。名義貸しは、他人に営業させることだけでなく、自己の名義で他人に宅建業を営む旨の表示や広告をさせることも禁止されている。"},{"text":"免許を受けない者は、宅地建物取引業を営む目的をもって、宅地の売買に関する広告をしてはならない。","is_correct":false,"explanation":"正しい。無免許者は、営業行為だけでなく、宅建業を営む旨の表示や営業目的の広告も禁止される。"},{"text":"免許を受けずに宅地建物取引業を営んだ者は、3年以下の拘禁刑若しくは300万円以下の罰金に処せられ、又はこれを併科されることがある。","is_correct":false,"explanation":"正しい。無免許営業は宅地建物取引業法の罰則の中でも最も重い部類であり、3年以下の拘禁刑若しくは300万円以下の罰金又はその併科の対象となる。"},{"text":"免許の申請中である者は、免許を受けるまでの間、宅地建物取引業を営む旨の表示をし、又は営業の準備として売買契約を締結することはできない。","is_correct":false,"explanation":"正しい。免許申請中であっても免許を受けるまでは無免許者であり、営業行為はもちろん、宅建業を営む旨の表示や広告も禁止される。"}],"explanation":"無免許営業の禁止と名義貸しの禁止は、いずれも「営業そのもの」だけでなく「表示・広告」まで禁止範囲に含む。免許申請中の者も免許を受けるまでは営業も広告もできない点に注意したい。","difficulty":2,"tags":["宅建業法","免許","無免許営業","名義貸し"],"shuffle_choices":true},{"id":"Q1017","topic":"免許","question_type":"select_correct","question":"宅地建物取引業法上の「事務所」に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"商業登記簿に登載された支店は、宅地建物取引業を営んでいなくても、本店で宅地建物取引業を営んでいれば、すべて事務所に該当する。","is_correct":false,"explanation":"支店が事務所に該当するのは、その支店で宅地建物取引業を営む場合に限られる。宅建業を営まない支店は事務所に該当しない。"},{"text":"本店では宅地建物取引業を営まず、支店のみで宅地建物取引業を営む場合、本店は事務所に該当しない。","is_correct":false,"explanation":"支店で宅地建物取引業を営む場合、本店は宅建業を直接営んでいなくても、支店を統括する拠点として事務所に該当する。"},{"text":"継続的に業務を行うことができる施設を有する場所で、宅地建物取引業に係る契約を締結する権限を有する使用人を置くものは、商業登記簿上の支店でなくても、事務所に該当する。","is_correct":true,"explanation":"正しい。本店・支店のほか、継続的に業務を行うことができる施設を有し、契約締結権限を有する使用人を置く場所(営業所など)も事務所に該当する。"},{"text":"宅地の分譲のために設置した案内所で契約の申込みを受けるものは、事務所に該当するため、営業保証金として500万円を供託しなければならない。","is_correct":false,"explanation":"案内所は、契約の申込みを受けるものであっても事務所には該当しない。したがって営業保証金の供託は不要である(専任の宅地建物取引士の設置等、案内所としての規制は別途ある)。"}],"explanation":"事務所とは、①本店(支店で宅建業を営む場合は本店自体が営んでいなくても常に事務所)、②宅建業を営む支店、③継続的に業務を行える施設があり契約締結権限者を置く場所をいう。案内所は契約の申込みを受けるものでも事務所ではなく、営業保証金の対象にならない。","difficulty":3,"tags":["宅建業法","免許","事務所"],"shuffle_choices":true},{"id":"Q1018","topic":"宅地建物取引士","question_type":"select_correct","question":"宅地建物取引士の登録に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"宅地建物取引士資格試験に合格した者は、全国いずれの都道府県知事に対しても、登録の申請をすることができる。","is_correct":false,"explanation":"登録の申請ができるのは、その者が合格した試験を行った都道府県知事に対してのみである。"},{"text":"宅地建物取引士の登録には有効期間の定めがなく、消除されない限り効力を有する。","is_correct":true,"explanation":"正しい。登録は一度受ければ有効期間の定めがなく、死亡や登録消除処分などにより消除されない限り一生有効である。有効期間5年が定められているのは宅地建物取引士証である。"},{"text":"宅地建物取引に関し2年以上の実務経験を有しない者は、登録実務講習を修了しても、登録を受けることができない。","is_correct":false,"explanation":"2年以上の実務経験がない者でも、国土交通大臣の登録を受けた登録実務講習を修了すれば、実務経験と同等以上の能力を有する者として登録を受けることができる。"},{"text":"宅地建物取引士資格試験に合格した者が合格の日から1年以内に登録の申請をしない場合、その合格は効力を失う。","is_correct":false,"explanation":"試験の合格は原則として一生有効であり、期間の経過によって失効しない。1年という期間は、合格後1年以内に取引士証の交付を受ける場合に法定講習が免除されるという場面で登場する数字である。"}],"explanation":"「合格」「登録」はいずれも有効期間がなく一生有効であるのに対し、「宅地建物取引士証」のみ有効期間5年である。登録先は合格した試験を行った知事に限られる点、実務経験2年は登録実務講習の修了で代替できる点も基本事項である。","difficulty":1,"tags":["宅建業法","宅地建物取引士","登録"],"shuffle_choices":true},{"id":"Q1019","topic":"宅地建物取引士","question_type":"select_incorrect","question":"宅地建物取引士の登録の移転に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"登録の移転は義務ではなく、移転の事由が生じても、申請するかどうかは本人の任意である。","is_correct":false,"explanation":"正しい。登録の移転は「申請することができる」とされており、義務ではない。"},{"text":"甲県知事の登録を受けている者が、乙県に所在する宅地建物取引業者の事務所の業務に従事し、又は従事しようとするときは、乙県知事に登録の移転を申請することができる。","is_correct":false,"explanation":"正しい。登録の移転は、登録している都道府県以外の都道府県に所在する業者の事務所の業務に従事し、又は従事しようとするときに、現在の登録先知事を経由して申請できる。"},{"text":"甲県知事の登録を受けている者が、自己の住所を乙県に移転したときは、そのことを理由として乙県知事に登録の移転を申請することができる。","is_correct":true,"explanation":"誤り。登録の移転が認められるのは勤務先の事務所の所在地が他の都道府県にある場合であり、単に住所を他の都道府県に移しただけでは登録の移転を申請することはできない。"},{"text":"事務の禁止の処分を受けた者は、その禁止の期間が満了するまでは、登録の移転を申請することができない。","is_correct":false,"explanation":"正しい。事務禁止処分の期間中は、登録の移転を申請することができない。"}],"explanation":"登録の移転は、他の都道府県の業者の事務所で業務に従事する(しようとする)場合にのみ認められる任意の制度である。住所の移転は理由にならないこと、事務禁止期間中は申請できないことが典型的な出題ポイントである。","difficulty":2,"tags":["宅建業法","宅地建物取引士","登録の移転"],"shuffle_choices":true},{"id":"Q1020","topic":"宅地建物取引士","question_type":"select_correct","question":"宅地建物取引士の変更の登録等に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"登録を受けている者は、本籍に変更があったときは、遅滞なく変更の登録を申請しなければならない。","is_correct":true,"explanation":"正しい。氏名・住所・本籍など登録事項に変更があったときは、遅滞なく変更の登録を申請しなければならない。"},{"text":"登録を受けている者は、住所に変更があったときは、30日以内に変更の登録を申請しなければならない。","is_correct":false,"explanation":"変更の登録は「30日以内」ではなく「遅滞なく」申請しなければならない。30日以内という期間は宅地建物取引業者の変更の届出の期間である。"},{"text":"登録を受けている者が宅地建物取引業者の業務に従事している場合、その勤務先の業者の商号に変更があっても、変更の登録を申請する必要はない。","is_correct":false,"explanation":"勤務先である宅地建物取引業者の商号又は名称、免許証番号は登録簿の登載事項であるため、変更があれば遅滞なく変更の登録を申請しなければならない。"},{"text":"登録の移転の申請とともに宅地建物取引士証の交付を申請した場合、移転後の知事から交付される取引士証の有効期間は、新たに交付の日から5年となる。","is_correct":false,"explanation":"登録の移転に伴い交付される取引士証の有効期間は、従前の取引士証の有効期間の残存期間である。新たに5年とはならない。"}],"explanation":"変更の登録は「遅滞なく」行う点で、業者の変更の届出(30日以内)と区別される。登録事項には氏名・住所・本籍のほか勤務先業者の商号・免許証番号が含まれ、登録の移転に伴う取引士証は残存期間しか有効でないことも頻出である。","difficulty":2,"tags":["宅建業法","宅地建物取引士","変更の登録"],"shuffle_choices":true},{"id":"Q1021","topic":"宅地建物取引士","question_type":"select_incorrect","question":"宅地建物取引士証に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"宅地建物取引士証の有効期間は5年であり、申請により更新することができる。","is_correct":false,"explanation":"正しい。取引士証の有効期間は5年で、申請により更新される。更新時には原則として法定講習の受講が必要である。"},{"text":"宅地建物取引士は、重要事項の説明をするときは、説明の相手方から請求がなくても、宅地建物取引士証を提示しなければならない。","is_correct":false,"explanation":"正しい。重要事項説明の際は、相手方の請求の有無にかかわらず取引士証を提示しなければならない。なお、それ以外の場面では取引の関係者から請求があったときに提示義務が生じる。"},{"text":"宅地建物取引士は、登録が消除されたとき、又は宅地建物取引士証が効力を失ったときは、速やかに宅地建物取引士証を返納しなければならない。","is_correct":false,"explanation":"正しい。登録消除又は取引士証の失効の場合は、交付を受けた都道府県知事に速やかに返納しなければならない。"},{"text":"宅地建物取引士は、事務の禁止の処分を受けたときは、速やかに宅地建物取引士証をその交付を受けた都道府県知事に返納しなければならない。","is_correct":true,"explanation":"誤り。事務禁止処分を受けたときは、取引士証を交付を受けた知事に「提出」しなければならない。「返納」は登録消除・失効の場合の手続であり、提出された取引士証は禁止期間満了後に返還請求できる。"}],"explanation":"取引士証は、登録消除・失効の場合は「返納」、事務禁止処分の場合は「提出」と手続が使い分けられている。提出の場合は禁止期間が満了すれば返還を受けられる点で返納と異なる。いずれの違反にも10万円以下の過料が定められている。","difficulty":1,"tags":["宅建業法","宅地建物取引士","取引士証"],"shuffle_choices":true},{"id":"Q1022","topic":"宅地建物取引士","question_type":"select_correct","question":"宅地建物取引士証の交付と法定講習に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"宅地建物取引士証の更新を受けようとする者は、交付の申請前1年以内に行われる都道府県知事が指定する講習を受講しなければならない。","is_correct":false,"explanation":"法定講習は交付の申請前「6か月以内」に行われるものを受講しなければならない。1年以内ではない。"},{"text":"宅地建物取引士資格試験に合格した日から2年以内に宅地建物取引士証の交付を受けようとする者は、法定講習の受講が免除される。","is_correct":false,"explanation":"法定講習が免除されるのは、試験合格の日から「1年以内」に取引士証の交付を受けようとする場合である。2年以内ではない。"},{"text":"登録の移転の申請とともに宅地建物取引士証の交付を申請する場合、法定講習を受講する必要はない。","is_correct":true,"explanation":"正しい。登録の移転に伴う取引士証の交付の場合は法定講習の受講が不要である。この場合の取引士証の有効期間は従前の残存期間となる。"},{"text":"宅地建物取引士証の交付を初めて受ける者は、合格からの経過期間にかかわらず、常に法定講習の受講が免除される。","is_correct":false,"explanation":"初めての交付であっても、法定講習が免除されるのは合格の日から1年以内に交付を受ける場合に限られる。合格から1年を超えていれば受講が必要である。"}],"explanation":"法定講習(都道府県知事指定の講習)は交付申請前6か月以内のものを受講するのが原則で、例外は①合格後1年以内の交付、②登録の移転に伴う交付の2つである。「6か月」「1年」という数字の入替えが定番のひっかけとなる。","difficulty":2,"tags":["宅建業法","宅地建物取引士","法定講習"],"shuffle_choices":true},{"id":"Q1023","topic":"宅地建物取引士","question_type":"select_incorrect","question":"専任の宅地建物取引士の設置に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"宅地建物取引業者は、その事務所ごとに、業務に従事する者5人に1人以上の割合で、成年者である専任の宅地建物取引士を置かなければならない。","is_correct":false,"explanation":"正しい。事務所には、業務従事者の数の5分の1以上の成年者である専任の宅地建物取引士を置く必要がある。"},{"text":"宅地の分譲のために設置した案内所で契約の申込みを受けるものには、業務に従事する者5人に1人以上の割合で、専任の宅地建物取引士を置かなければならない。","is_correct":true,"explanation":"誤り。契約締結又は申込受付を行う案内所等に必要な専任の宅地建物取引士は、従事者の人数にかかわらず1人以上でよい。5人に1人以上の割合が要求されるのは事務所である。"},{"text":"既存の事務所において専任の宅地建物取引士の数が法定数を下回った場合、宅地建物取引業者は2週間以内に必要な措置を執らなければならない。","is_correct":false,"explanation":"正しい。法定数に不足が生じたときは、2週間以内に補充などの必要な措置を執らなければならない。"},{"text":"宅地建物取引士である未成年者は、原則として専任の宅地建物取引士となることができないが、その者自身が宅地建物取引業者(個人)であるときは、その事務所の専任の宅地建物取引士とみなされる。","is_correct":false,"explanation":"正しい。専任の宅地建物取引士は成年者でなければならないのが原則であるが、未成年の取引士が業者本人又は法人業者の役員であるときは、その者が主として業務に従事する事務所等の専任の取引士とみなされる。"}],"explanation":"専任の宅地建物取引士の設置基準は、事務所が「従事者5人に1人以上」、契約締結・申込受付を行う案内所等が「1人以上」であり、両者の基準の入替えが典型的なひっかけである。不足時は2週間以内の補充措置に加え、30日以内の変更の届出も必要となる。","difficulty":3,"tags":["宅建業法","宅地建物取引士","専任の宅地建物取引士"],"shuffle_choices":true},{"id":"Q1024","topic":"営業保証金","question_type":"select_correct","question":"宅地建物取引業者の営業保証金の供託に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"営業保証金の額は、事務所の数にかかわらず、一律1,000万円である。","is_correct":false,"explanation":"営業保証金の額は主たる事務所につき1,000万円、その他の事務所ごとに500万円であり、事務所の数に応じて増加する。"},{"text":"営業保証金は、主たる事務所及びその他の事務所ごとに、それぞれの事務所の最寄りの供託所に分けて供託しなければならない。","is_correct":false,"explanation":"営業保証金は、全事務所分の合計額を「主たる事務所の最寄りの供託所」にまとめて供託する。事務所ごとに分けて供託するのではない。"},{"text":"主たる事務所のほかに3か所の支店を設置して宅地建物取引業を営もうとする場合、供託すべき営業保証金の合計額は2,000万円である。","is_correct":false,"explanation":"1,000万円+500万円×3=2,500万円であり、2,000万円ではない。"},{"text":"営業保証金は、主たる事務所につき1,000万円、その他の事務所につき事務所ごとに500万円の合計額を、主たる事務所の最寄りの供託所に供託しなければならない。","is_correct":true,"explanation":"正しい。供託額は主たる事務所1,000万円・その他の事務所ごとに500万円で、その合計額を主たる事務所の最寄りの供託所に一括して供託する。"}],"explanation":"営業保証金は「主たる事務所1,000万円+その他の事務所ごとに500万円」の合計額を、主たる事務所の最寄りの供託所に一括供託する。金額と供託先の2点が基本であり、事務所ごとに分けて供託するという誤りの記述に注意する。","difficulty":1,"tags":["宅建業法","営業保証金"],"shuffle_choices":true},{"id":"Q1025","topic":"営業保証金","question_type":"select_incorrect","question":"営業保証金を有価証券で供託する場合に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"地方債証券を供託する場合、その価額は額面金額の80%として評価される。","is_correct":true,"explanation":"誤り。地方債証券及び政府保証債証券の評価額は額面金額の90%である。80%と評価されるのは、国土交通省令で定めるその他の有価証券である。"},{"text":"国債証券を供託する場合、その価額は額面金額の100%として評価される。","is_correct":false,"explanation":"正しい。国債証券は額面金額どおり100%で評価される。"},{"text":"営業保証金は、金銭と有価証券とを併用して供託することができる。","is_correct":false,"explanation":"正しい。営業保証金は、金銭のみ、有価証券のみ、又は金銭と有価証券の併用のいずれの方法でも供託できる。"},{"text":"国債証券及び地方債証券以外の国土交通省令で定める有価証券を供託する場合、その価額は額面金額の80%として評価される。","is_correct":false,"explanation":"正しい。国債100%、地方債・政府保証債90%、その他の省令で定める有価証券80%という評価割合が定められている。"}],"explanation":"有価証券による供託の評価割合は、国債100%・地方債及び政府保証債90%・その他の省令で定める有価証券80%である。90%と80%の入替えが定番のひっかけであり、金銭との併用供託が可能な点もあわせて押さえる。","difficulty":2,"tags":["宅建業法","営業保証金","有価証券"],"shuffle_choices":true},{"id":"Q1026","topic":"営業保証金","question_type":"select_correct","question":"営業保証金の供託と事業の開始に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"宅地建物取引業者は、営業保証金を供託すれば、その旨を免許権者に届け出る前であっても、事業を開始することができる。","is_correct":false,"explanation":"供託しただけでは足りず、供託した旨を免許権者に届け出た後でなければ事業を開始できない。"},{"text":"宅地建物取引業者は、営業保証金を供託し、その旨を免許権者に届け出た後でなければ、事業を開始してはならない。","is_correct":true,"explanation":"正しい。事業開始の要件は「免許取得+供託+供託した旨の届出」であり、届出まで完了して初めて事業を開始できる。"},{"text":"免許権者は、免許をした日から6か月以内に宅地建物取引業者が供託した旨の届出をしないときは、その届出をすべき旨の催告をしなければならない。","is_correct":false,"explanation":"催告をしなければならないのは、免許をした日から「3か月以内」に届出がない場合である。6か月ではない。"},{"text":"免許権者は、供託の届出をすべき旨の催告が到達した日から1か月以内に宅地建物取引業者が届出をしないときは、その免許を取り消さなければならない。","is_correct":false,"explanation":"催告到達から1か月以内に届出がないときは、免許を「取り消すことができる」のであって、取り消さなければならないのではない。"}],"explanation":"供託→届出→事業開始という順序が絶対であり、届出前の事業開始は許されない。免許日から3か月以内に届出がなければ必ず催告し、催告到達から1か月以内に届出がなければ免許を取り消すことができる(任意的取消し)という数字と語尾の組合せが頻出である。","difficulty":1,"tags":["宅建業法","営業保証金","事業開始"],"shuffle_choices":true},{"id":"Q1027","topic":"営業保証金","question_type":"select_incorrect","question":"営業保証金の還付に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"営業保証金から還付を受けることができるのは、宅地建物取引業者と宅地建物取引業に関し取引をしたことにより生じた債権を有する者に限られる。","is_correct":false,"explanation":"正しい。還付の対象となるのは、宅建業に関する取引により生じた債権に限られる。"},{"text":"宅地建物取引業者は、宅地建物取引業に関し取引をしたことにより生じた債権を有する場合であっても、営業保証金から還付を受けることができない。","is_correct":false,"explanation":"正しい。取引の相手方が宅地建物取引業者である場合は、還付を受けられる者から除外されている。営業保証金制度は一般消費者保護のための制度だからである。"},{"text":"宅地建物取引業者から依頼を受けて事務所の内装工事を行った建設業者は、その工事代金債権について営業保証金から還付を受けることができる。","is_correct":true,"explanation":"誤り。内装工事の代金債権は宅地建物取引業に関する「取引」により生じた債権ではないため、還付の対象とならない。広告代金債権や給料債権も同様に対象外である。"},{"text":"還付を受けることができる額は、当該宅地建物取引業者が供託した営業保証金の額が限度となる。","is_correct":false,"explanation":"正しい。還付は当該業者が供託している営業保証金の額の範囲内でしか受けられない。"}],"explanation":"還付の対象は「宅建業に関する取引により生じた債権」に限られ、内装工事代金・広告料・従業員の給料などの債権は含まれない。また、平成29年改正により宅地建物取引業者は還付を受けられる者から除外されている。","difficulty":2,"tags":["宅建業法","営業保証金","還付"],"shuffle_choices":true},{"id":"Q1028","topic":"営業保証金","question_type":"select_correct","question":"営業保証金の不足額の供託に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"還付により営業保証金に不足が生じた場合、宅地建物取引業者は、免許権者から不足額を供託すべき旨の通知書の送付を受けた日から2週間以内に、不足額を供託しなければならない。","is_correct":true,"explanation":"正しい。不足額の供託は、免許権者からの通知書の送付を受けた日から2週間以内に行わなければならない。"},{"text":"還付により営業保証金に不足が生じた場合、宅地建物取引業者は、不足が生じた日から30日以内に不足額を供託しなければならない。","is_correct":false,"explanation":"供託期限の起算点は不足が生じた日ではなく、免許権者から通知書の送付を受けた日であり、期間も30日ではなく2週間以内である。"},{"text":"不足額を供託した宅地建物取引業者は、供託した日から30日以内に、その旨を免許権者に届け出なければならない。","is_correct":false,"explanation":"不足額を供託したときは、供託した日から「2週間以内」にその旨を免許権者に届け出なければならない。30日以内ではない。"},{"text":"不足額の供託は金銭で行わなければならず、有価証券により供託することはできない。","is_correct":false,"explanation":"不足額の供託についても、通常の供託と同様に金銭のほか一定の有価証券により行うことができる。"}],"explanation":"還付による不足額は、免許権者からの通知書送付を受けた日から2週間以内に供託し、供託の日から2週間以内に届出を行う。「2週間」が二度登場する点と、起算点が「通知を受けた日」である点が出題の中心である。","difficulty":2,"tags":["宅建業法","営業保証金","不足額の供託"],"shuffle_choices":true},{"id":"Q1029","topic":"営業保証金","question_type":"select_correct","question":"宅地建物取引業者が主たる事務所を移転し、その最寄りの供託所が変更した場合に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"有価証券のみで営業保証金を供託している場合、遅滞なく、従前の供託所に対し、移転後の最寄りの供託所への保管替えを請求しなければならない。","is_correct":false,"explanation":"保管替えの請求ができるのは、金銭のみで供託している場合に限られる。有価証券が含まれる場合は保管替えを請求できない。"},{"text":"金銭と有価証券とを併用して営業保証金を供託している場合、金銭部分についてのみ保管替えを請求することができる。","is_correct":false,"explanation":"金銭と有価証券の併用供託の場合も保管替えの請求はできず、移転後の最寄りの供託所に新たに供託し直さなければならない。金銭部分だけを保管替えすることも認められない。"},{"text":"金銭のみで営業保証金を供託している場合、遅滞なく、費用を予納して、従前の供託所に対し、移転後の主たる事務所の最寄りの供託所への保管替えを請求しなければならない。","is_correct":true,"explanation":"正しい。金銭のみで供託しているときは、遅滞なく費用を予納して保管替えを請求しなければならない。"},{"text":"保管替えを請求することができない場合、宅地建物取引業者は、従前の供託所から営業保証金を取り戻した後でなければ、移転後の最寄りの供託所に供託することができない。","is_correct":false,"explanation":"有価証券を含む場合は、先に移転後の最寄りの供託所に営業保証金を新たに供託し、その後に従前の供託所から取り戻す(いわゆる二重供託)。取戻しが先ではない。"}],"explanation":"主たる事務所の移転により最寄りの供託所が変わった場合、金銭のみの供託なら保管替え請求(義務)、有価証券を含む供託なら新たに供託してから従前分を取り戻す。「金銭のみ」という限定と、二重供託では新供託が先という順序がポイントである。","difficulty":2,"tags":["宅建業法","営業保証金","保管替え"],"shuffle_choices":true},{"id":"Q1030","topic":"営業保証金","question_type":"select_incorrect","question":"営業保証金の取戻しに関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"免許の有効期間の満了により免許が失効したことに伴い営業保証金を取り戻す場合、原則として、還付請求権者に対し6か月を下らない一定期間内に申し出るべき旨の公告をしなければならない。","is_correct":false,"explanation":"正しい。免許失効等による取戻しは、原則として6か月以上の期間を定めた公告をし、その期間内に還付請求権者の申出がなかった場合に行うことができる。"},{"text":"一部の事務所を廃止したことにより営業保証金の額が法定の額を超えることとなった場合、その超過額については、公告をすることなく直ちに取り戻すことができる。","is_correct":true,"explanation":"誤り。一部の事務所の廃止による超過額の取戻しの場合も、原則どおり6か月を下らない期間を定めた公告が必要である。公告不要となるのは、取戻し事由発生から10年経過した場合、保証協会の社員となった場合、主たる事務所移転による二重供託の場合などに限られる。"},{"text":"営業保証金の取戻し事由が発生した時から10年を経過したときは、公告をすることなく営業保証金を取り戻すことができる。","is_correct":false,"explanation":"正しい。取戻し事由発生から10年を経過すれば、還付請求権が時効等により消滅していると考えられるため、公告なしで取り戻すことができる。"},{"text":"宅地建物取引業保証協会の社員となったことにより営業保証金の供託を要しなくなった場合、公告をすることなく営業保証金を取り戻すことができる。","is_correct":false,"explanation":"正しい。保証協会の社員となった場合は、弁済業務保証金制度により還付請求権者の保護が図られるため、公告なしで取り戻すことができる。"}],"explanation":"営業保証金の取戻しは、還付請求権者保護のため6か月以上の公告が原則であり、一部事務所の廃止による超過額の取戻しも例外ではない。公告不要となるのは、①10年経過、②保証協会の社員となった場合、③主たる事務所移転に伴う二重供託の場合である。","difficulty":3,"tags":["宅建業法","営業保証金","取戻し"],"shuffle_choices":true},{"id":"Q1031","topic":"保証協会","question_type":"select_correct","question":"宅地建物取引業保証協会の弁済業務保証金分担金に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"主たる事務所のほかに従たる事務所を2か所設置している宅地建物取引業者が保証協会に加入しようとする場合、納付すべき弁済業務保証金分担金の額は120万円である。","is_correct":true,"explanation":"分担金は主たる事務所につき60万円、従たる事務所1か所につき30万円である。60万円＋30万円×2＝120万円となり正しい。"},{"text":"弁済業務保証金分担金は、金銭のほか、国債証券その他の有価証券をもって納付することができる。","is_correct":false,"explanation":"分担金の納付は金銭に限られる。有価証券による納付が認められるのは、営業保証金の供託や保証協会が行う弁済業務保証金の供託である。"},{"text":"保証協会に加入した宅地建物取引業者は、加入した日から2週間以内に弁済業務保証金分担金を納付すればよい。","is_correct":false,"explanation":"分担金は保証協会に加入しようとする日までに納付しなければならない。加入後2週間以内という期限は、新たに事務所を設置した場合の追加納付の場面である。"},{"text":"弁済業務保証金分担金の額は、その宅地建物取引業者が供託すべき営業保証金の額と同額である。","is_correct":false,"explanation":"営業保証金は主たる事務所1,000万円・従たる事務所1か所500万円であるのに対し、分担金は主60万円・従30万円であり、同額ではない。"}],"explanation":"弁済業務保証金分担金は、主たる事務所につき60万円、その他の事務所1か所につき30万円を、加入しようとする日までに金銭で保証協会に納付する。少額の負担で営業保証金の供託に代える制度であり、金額と納付期限は頻出論点である。","difficulty":1,"tags":["宅建業法","保証協会"],"shuffle_choices":true},{"id":"Q1032","topic":"保証協会","question_type":"select_incorrect","question":"保証協会の社員である宅地建物取引業者Aが新たに事務所を設置した場合等に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"Aは、新たに事務所を設置した日から2週間以内に、その事務所の分の弁済業務保証金分担金を保証協会に納付しなければならない。","is_correct":false,"explanation":"正しい記述である。事務所を新設したときは、設置の日から2週間以内に1か所につき30万円の分担金を保証協会に納付する。"},{"text":"Aは、新たに事務所を設置した日から2週間以内に、その事務所の最寄りの供託所に弁済業務保証金を供託しなければならない。","is_correct":true,"explanation":"誤り。社員である宅地建物取引業者が自ら供託所に供託するのではなく、保証協会に分担金を納付する。弁済業務保証金を供託所に供託するのは保証協会である。"},{"text":"Aが期限内に分担金を納付しなかったときは、Aは社員の地位を失う。","is_correct":false,"explanation":"正しい記述である。新設事務所分の分担金を2週間以内に納付しないときは、社員の地位を失う。"},{"text":"Aが社員の地位を失ったときは、その日から1週間以内に営業保証金を供託しなければ、宅地建物取引業を営むことができない。","is_correct":false,"explanation":"正しい記述である。社員の地位を失った宅地建物取引業者は、その日から1週間以内に営業保証金を供託しなければならない。"}],"explanation":"保証協会の制度では、社員は分担金を協会に納付し、供託所への弁済業務保証金の供託は協会が行うという役割分担になっている。社員自身が供託所に供託するとするひっかけは典型パターンである。","difficulty":2,"tags":["宅建業法","保証協会"],"shuffle_choices":true},{"id":"Q1033","topic":"保証協会","question_type":"select_correct","question":"保証協会が行う弁済業務保証金の供託に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"保証協会は、社員から弁済業務保証金分担金の納付を受けた日から2週間以内に、弁済業務保証金を供託しなければならない。","is_correct":false,"explanation":"誤り。保証協会は、分担金の納付を受けた日から1週間以内に、納付額に相当する弁済業務保証金を供託しなければならない。"},{"text":"弁済業務保証金は、当該社員の主たる事務所の最寄りの供託所に供託しなければならない。","is_correct":false,"explanation":"誤り。弁済業務保証金の供託先は、法務大臣及び国土交通大臣の定める供託所である。主たる事務所の最寄りの供託所に供託するのは営業保証金の場合である。"},{"text":"保証協会は、弁済業務保証金を金銭のみならず、国債証券等の一定の有価証券をもって供託することができる。","is_correct":true,"explanation":"正しい。社員から協会への分担金の納付は金銭に限られるが、協会が供託所に行う弁済業務保証金の供託は、金銭のほか一定の有価証券によることもできる。"},{"text":"保証協会は、弁済業務保証金を供託したときは、その旨を当該社員である宅地建物取引業者に届け出なければならない。","is_correct":false,"explanation":"誤り。保証協会は、供託した旨を当該社員の免許権者（国土交通大臣又は都道府県知事）に届け出るのであり、社員に届け出るのではない。"}],"explanation":"分担金の納付（社員→協会）は金銭のみだが、弁済業務保証金の供託（協会→供託所）は有価証券でも可能である。供託期限は納付から1週間以内、供託先は法務大臣及び国土交通大臣の定める供託所という点を対比して押さえたい。","difficulty":2,"tags":["宅建業法","保証協会"],"shuffle_choices":true},{"id":"Q1034","topic":"保証協会","question_type":"select_correct","question":"保証協会の社員と宅地建物取引業に関し取引をした者の弁済業務保証金からの還付に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"還付を受けようとする者は、保証協会の認証を受けた上で、保証協会に対して還付請求をしなければならない。","is_correct":false,"explanation":"誤り。還付請求の相手方は保証協会ではなく、弁済業務保証金が供託されている供託所である。認証を協会から受ける点は正しいが、請求先が異なる。"},{"text":"その宅地建物取引業者が保証協会の社員となる前に、当該業者と宅地建物取引業に関し取引をした者は、還付を受けることができない。","is_correct":false,"explanation":"誤り。社員となる前の取引により生じた債権を有する者も、弁済業務保証金から還付を受けることができる。"},{"text":"還付を受けることができる額は、当該社員が保証協会に納付した弁済業務保証金分担金の額の範囲内に限られる。","is_correct":false,"explanation":"誤り。還付限度額は、その社員が保証協会の社員でないとしたならば供託すべき営業保証金の額に相当する額の範囲内であり、分担金の額よりはるかに大きい。"},{"text":"宅地建物取引業者は、その取引により生じた債権であっても、弁済業務保証金から還付を受けることができない。","is_correct":true,"explanation":"正しい。還付を受けられるのは宅地建物取引業に関し取引をした者であるが、宅地建物取引業者に該当する者は除かれる。"}],"explanation":"還付は、協会の認証を受けた上で供託所に対して請求し、限度額は営業保証金に相当する額の範囲内である。プロである宅地建物取引業者は保護の対象から除外されている点も含め、還付の要件は総合的に出題されやすい。","difficulty":2,"tags":["宅建業法","保証協会"],"shuffle_choices":true},{"id":"Q1035","topic":"保証協会","question_type":"select_correct","question":"弁済業務保証金の還付が行われた場合の還付充当金に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"社員である宅地建物取引業者は、保証協会から還付充当金を納付すべき旨の通知を受けた日から2週間以内に、その額を保証協会に納付しなければならない。","is_correct":true,"explanation":"正しい。還付充当金は、保証協会からの通知を受けた日から2週間以内に保証協会に納付しなければならない。"},{"text":"還付充当金は、保証協会ではなく、還付が行われた供託所に直接納付しなければならない。","is_correct":false,"explanation":"誤り。還付充当金の納付先は保証協会である。供託所との関係で供託を行うのは保証協会の役割である。"},{"text":"社員が期限内に還付充当金を納付しなかった場合でも、社員の地位を失うことはない。","is_correct":false,"explanation":"誤り。通知を受けた日から2週間以内に還付充当金を納付しないときは、その社員は保証協会の社員の地位を失う。"},{"text":"還付充当金の額は、実際に還付された額にかかわらず、弁済業務保証金分担金と同額である。","is_correct":false,"explanation":"誤り。還付充当金は、還付された弁済業務保証金の額に相当する額を納付するものであり、分担金と同額と定められているわけではない。"}],"explanation":"還付により減少した弁済業務保証金を補填するため、社員は通知から2週間以内に還付額に相当する還付充当金を保証協会に納付する。納付を怠れば社員の地位を失うという流れをセットで押さえることが重要である。","difficulty":1,"tags":["宅建業法","保証協会"],"shuffle_choices":true},{"id":"Q1036","topic":"保証協会","question_type":"select_correct","question":"保証協会の社員の地位の喪失及び弁済業務保証金分担金の返還に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"社員がその一部の事務所を廃止した場合、保証協会は、還付請求権者に対する公告をした後でなければ、その事務所分の弁済業務保証金分担金を返還することができない。","is_correct":false,"explanation":"誤り。一部の事務所を廃止したことにより分担金を返還する場合には、公告は不要である。公告が必要となるのは、社員の地位を失った場合の返還である。"},{"text":"社員が社員の地位を失った場合、保証協会は、還付請求権者に対し6か月を下らない一定期間内に認証を受けるため申し出るべき旨の公告をし、その期間経過後に弁済業務保証金分担金を返還する。","is_correct":true,"explanation":"正しい。社員の地位を失ったことによる返還の場合、保証協会は6か月以上の期間を定めて公告し、その期間内に申出がなかった場合等に分担金を返還する。"},{"text":"社員の地位を失った宅地建物取引業者は、その日から2週間以内に営業保証金を供託しなければならない。","is_correct":false,"explanation":"誤り。社員の地位を失った日から1週間以内に営業保証金を供託しなければならない。2週間ではない。"},{"text":"社員の地位を失った宅地建物取引業者は、営業保証金を供託しなくても、免許の有効期間が満了するまでは宅地建物取引業を営むことができる。","is_correct":false,"explanation":"誤り。営業保証金の供託と届出をしないまま業務を行うことはできず、供託を怠れば監督処分の対象となる。"}],"explanation":"分担金の返還について、社員の地位喪失の場合は6か月以上の公告が必要だが、一部事務所の廃止の場合は公告不要で返還できる。この対比と、地位喪失後1週間以内の営業保証金供託義務は応用問題の定番である。","difficulty":3,"tags":["宅建業法","保証協会"],"shuffle_choices":true},{"id":"Q1037","topic":"事務所・案内所等に関する規制","question_type":"select_correct","question":"宅地建物取引業法上の「事務所」に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"本店で宅地建物取引業を営まず、支店でのみ宅地建物取引業を営む場合、その本店は事務所に該当しない。","is_correct":false,"explanation":"誤り。支店で宅地建物取引業を営む場合、本店は直接宅地建物取引業を営んでいなくても、統括機能を有するものとして常に事務所に該当する。"},{"text":"商業登記簿に登載された支店は、宅地建物取引業を営んでいなくても、すべて事務所に該当する。","is_correct":false,"explanation":"誤り。支店は宅地建物取引業を営むものに限って事務所に該当する。宅地建物取引業を営まない支店は事務所ではない。"},{"text":"商業登記簿に支店として登載されていても、建設業のみを営み宅地建物取引業を営まない支店は、事務所に該当しない。","is_correct":true,"explanation":"正しい。支店は宅地建物取引業を営むものだけが事務所に該当するため、他業種のみを営む支店は事務所に当たらない。"},{"text":"一団の宅地の分譲のために設けたテント張りの案内所は、契約を締結する権限を有する使用人を置けば、事務所に該当する。","is_correct":false,"explanation":"誤り。事務所に該当するのは継続的に業務を行うことができる施設であることが前提であり、土地に定着しないテント張りの案内所は事務所には該当しない。"}],"explanation":"事務所とは、本店（支店で宅建業を営む場合は本店も含む）、宅建業を営む支店、及び継続的に業務を行うことができる施設で契約締結権限を有する使用人を置くものをいう。本店と支店で扱いが非対称である点がひっかけの中心となる。","difficulty":2,"tags":["宅建業法","事務所"],"shuffle_choices":true},{"id":"Q1038","topic":"事務所・案内所等に関する規制","question_type":"select_correct","question":"事務所に置くべき成年者である専任の宅地建物取引士に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"宅地建物取引業者は、事務所ごとに、業務に従事する者10人に1人以上の割合で専任の宅地建物取引士を置かなければならない。","is_correct":false,"explanation":"誤り。事務所については、業務に従事する者5人に1人以上の割合で成年者である専任の宅地建物取引士を置かなければならない。"},{"text":"業務に従事する者が14人いる事務所には、成年者である専任の宅地建物取引士を3人以上置かなければならない。","is_correct":true,"explanation":"正しい。14人÷5＝2.8であり、5人に1人以上の割合を満たすには3人以上の専任の宅地建物取引士が必要となる。"},{"text":"専任の宅地建物取引士は、宅地建物取引士であれば成年者であることを要しない。","is_correct":false,"explanation":"誤り。事務所等に置くべき専任の宅地建物取引士は、原則として成年者でなければならない。未成年者は、業者自身が宅地建物取引士である場合等のみなし規定に該当しない限り専任となれない。"},{"text":"専任の宅地建物取引士の数に不足が生じたときは、30日以内に必要な措置を執らなければならない。","is_correct":false,"explanation":"誤り。法定数に不足が生じた場合は、2週間以内に必要な措置を執らなければならない。30日以内ではない。"}],"explanation":"事務所には業務従事者5人に1人以上の割合で成年者である専任の宅地建物取引士の設置が必要であり、端数は切り上げて計算する。不足時の補充期限が2週間以内である点も併せて問われやすい。","difficulty":1,"tags":["宅建業法","専任の宅建士"],"shuffle_choices":true},{"id":"Q1039","topic":"事務所・案内所等に関する規制","question_type":"select_incorrect","question":"案内所等に置くべき専任の宅地建物取引士に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"宅地の売買契約の申込みを受ける案内所には、そこで業務に従事する者の数にかかわらず、成年者である専任の宅地建物取引士を1人以上置けば足りる。","is_correct":false,"explanation":"正しい記述である。契約締結又は申込みの受領を行う案内所等では、従事者数に関係なく1人以上の専任の宅地建物取引士を置けばよい。"},{"text":"物件の案内のみを行い、契約の締結も申込みの受領も行わない案内所には、専任の宅地建物取引士を置く必要はない。","is_correct":false,"explanation":"正しい記述である。専任の宅地建物取引士の設置義務があるのは、契約締結又は申込受領を行う案内所等に限られる。"},{"text":"契約の申込みを受ける案内所には、事務所と同様に、業務に従事する者5人に1人以上の割合で専任の宅地建物取引士を置かなければならない。","is_correct":true,"explanation":"誤り。5人に1人以上という割合の規制は事務所に関するものであり、案内所等は従事者数にかかわらず1人以上で足りる。"},{"text":"売主である宅地建物取引業者と媒介を行う宅地建物取引業者が共同で契約の申込みを受ける案内所を設置する場合、いずれかの業者が専任の宅地建物取引士を1人以上置けば足りる。","is_correct":false,"explanation":"正しい記述である。複数の業者が同一の案内所で業務を行う場合、いずれかの業者が1人以上の専任の宅地建物取引士を置けばよいとされている。"}],"explanation":"専任の宅地建物取引士の設置数は、事務所が5人に1人以上であるのに対し、契約締結・申込受領を行う案内所等は従事者数を問わず1人以上である。両者の基準を入れ替えるひっかけが頻出である。","difficulty":2,"tags":["宅建業法","専任の宅建士","案内所"],"shuffle_choices":true},{"id":"Q1040","topic":"事務所・案内所等に関する規制","question_type":"select_correct","question":"宅地建物取引業者が掲示すべき標識に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"一団の宅地建物の分譲を案内所を設置して行う場合、その案内所のほか、当該物件の所在する場所にも標識を掲示しなければならない。","is_correct":true,"explanation":"正しい。一団の宅地建物を分譲する場合には、案内所だけでなく物件の所在場所にも標識の掲示が必要である。"},{"text":"契約の申込みを受けない案内所には、標識を掲示する必要はない。","is_correct":false,"explanation":"誤り。標識は、契約締結や申込受領を行わない案内所であっても、公衆の見やすい場所に掲示しなければならない。"},{"text":"標識は常時掲示する必要はなく、取引の関係者から請求があったときに提示すれば足りる。","is_correct":false,"explanation":"誤り。標識は公衆の見やすい場所に掲示しておく義務がある。請求時に提示すれば足りるのは従業者証明書である。"},{"text":"売主である宅地建物取引業者から依頼を受けた媒介業者が案内所を設置した場合、売主が物件所在地に標識を掲示していれば、媒介業者はその案内所に標識を掲示する必要はない。","is_correct":false,"explanation":"誤り。案内所を設置した媒介業者は、自らその案内所に標識を掲示しなければならない。売主の掲示によって代替されるものではない。"}],"explanation":"標識は、事務所のほか、契約行為の有無を問わずすべての案内所等、さらに分譲物件の所在場所にも掲示が必要である。無免許営業や責任の所在の不明確化を防ぐ趣旨から、掲示場所は広く定められている。","difficulty":1,"tags":["宅建業法","標識"],"shuffle_choices":true},{"id":"Q1041","topic":"事務所・案内所等に関する規制","question_type":"select_correct","question":"宅地建物取引業者が備え付けるべき帳簿に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"帳簿は、主たる事務所に一括して備え付ければ足り、従たる事務所ごとに備え付ける必要はない。","is_correct":false,"explanation":"誤り。帳簿は事務所ごとに備え付けなければならず、主たる事務所への一括備付けでは義務を果たしたことにならない。"},{"text":"宅地建物取引業者は、取引の関係者から請求があったときは、帳簿を閲覧させなければならない。","is_correct":false,"explanation":"誤り。閲覧義務が定められているのは従業者名簿であり、帳簿には閲覧させる義務はない。両者を混同させる典型的なひっかけである。"},{"text":"帳簿は、取引が終了するごとに閉鎖しなければならない。","is_correct":false,"explanation":"誤り。帳簿は各事業年度の末日をもって閉鎖するものとされており、取引ごとに閉鎖するのではない。"},{"text":"帳簿は、閉鎖後5年間（当該宅地建物取引業者が自ら売主となる新築住宅に係るものにあっては10年間）保存しなければならない。","is_correct":true,"explanation":"正しい。帳簿の保存期間は閉鎖後5年間が原則であり、自ら売主となる新築住宅に係るものは10年間である。"}],"explanation":"帳簿は事務所ごとに備え、取引のあったつど所定事項を記載し、各事業年度末日に閉鎖して閉鎖後5年間（自ら売主の新築住宅は10年間）保存する。従業者名簿の保存期間10年や閲覧義務との対比で問われることが多い。","difficulty":2,"tags":["宅建業法","帳簿"],"shuffle_choices":true},{"id":"Q1042","topic":"事務所・案内所等に関する規制","question_type":"select_incorrect","question":"従業者名簿及び従業者証明書に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"従業者名簿は、最終の記載をした日から10年間保存しなければならない。","is_correct":false,"explanation":"正しい記述である。従業者名簿の保存期間は最終記載日から10年間であり、帳簿の5年間より長い。"},{"text":"宅地建物取引業者は、取引の関係者から請求があったときは、従業者名簿をその者の閲覧に供しなければならない。","is_correct":false,"explanation":"正しい記述である。従業者名簿には取引関係者からの請求に応じた閲覧義務がある。"},{"text":"従業者が宅地建物取引士である場合、従業者証明書の携帯に代えて宅地建物取引士証を携帯させれば足りる。","is_correct":true,"explanation":"誤り。従業者証明書と宅地建物取引士証は別個のものであり、宅地建物取引士証の携帯や提示をもって従業者証明書に代えることはできない。"},{"text":"非常勤の役員や一時的に業務を補助するアルバイトにも、従業者証明書を携帯させなければならない。","is_correct":false,"explanation":"正しい記述である。従業者証明書の携帯義務は、非常勤役員や一時的な事務補助者を含め、業務に従事する者に広く及ぶ。"}],"explanation":"従業者証明書は業務従事者全員に携帯させ、取引関係者の請求があれば提示しなければならない。宅地建物取引士証で代用できるとするひっかけは本試験の定番であり、両者は制度趣旨も様式も異なる別個の証明書である。","difficulty":2,"tags":["宅建業法","従業者名簿","従業者証明書"],"shuffle_choices":true},{"id":"Q1043","topic":"事務所・案内所等に関する規制","question_type":"select_correct","question":"宅地建物取引業者が事務所等に備えるべきもの等に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"報酬の額は、事務所だけでなく、契約の申込みを受ける案内所にも掲示しなければならない。","is_correct":false,"explanation":"誤り。報酬額の掲示義務があるのは事務所のみであり、案内所には契約行為を行うものであっても掲示義務はない。"},{"text":"契約の申込みを受ける案内所には、標識のほか、帳簿及び従業者名簿も備え付けなければならない。","is_correct":false,"explanation":"誤り。帳簿と従業者名簿の備付け義務は事務所ごとに課されるものであり、案内所には備付け義務はない。"},{"text":"宅地建物取引業者は、事務所ごとに、公衆の見やすい場所に報酬の額を掲示し、帳簿及び従業者名簿を備え付けなければならない。","is_correct":true,"explanation":"正しい。報酬額の掲示、帳簿・従業者名簿の備付けは、いずれも事務所ごとに課される義務である。"},{"text":"従業者名簿は書面で調製しなければならず、電子計算機のディスプレイに表示する方法による電磁的記録での備付けは認められない。","is_correct":false,"explanation":"誤り。従業者名簿は、必要事項を直ちに表示できるのであれば、電磁的記録による備付けも認められている。"}],"explanation":"事務所には報酬額の掲示、帳簿・従業者名簿の備付けが必要だが、案内所等に必要なのは基本的に標識（及び契約行為を行う場合の専任宅建士）である。義務の課される場所を横断的に整理しておくと応用問題に対応できる。","difficulty":3,"tags":["宅建業法","報酬額の掲示","事務所"],"shuffle_choices":true},{"id":"Q1044","topic":"事務所・案内所等に関する規制","question_type":"select_correct","question":"宅地建物取引業法第50条第2項の規定による案内所等の届出に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"契約の申込みを受ける案内所を設置する場合、業務を開始する日の5日前までに届出をしなければならない。","is_correct":false,"explanation":"誤り。届出は業務を開始する日の10日前までにしなければならない。5日前ではない。"},{"text":"届出は免許権者に対してのみ行えばよく、案内所の所在地を管轄する都道府県知事への届出は不要である。","is_correct":false,"explanation":"誤り。届出先は免許権者及び案内所の所在地を管轄する都道府県知事の双方である（両者が同一の場合は当該知事のみ）。"},{"text":"契約の締結も申込みの受領も行わない案内所を設置する場合にも、届出が必要である。","is_correct":false,"explanation":"誤り。50条2項の届出が必要なのは、契約を締結し又は契約の申込みを受ける案内所等に限られる。単に案内のみを行う案内所には届出義務はない。"},{"text":"甲県知事の免許を受けた宅地建物取引業者が、乙県内に契約の申込みを受ける案内所を設置する場合、業務開始の10日前までに、甲県知事及び乙県知事の双方に届出をしなければならない。","is_correct":true,"explanation":"正しい。免許権者である甲県知事と、案内所の所在地を管轄する乙県知事の双方に、業務開始の10日前までに届け出る必要がある。"}],"explanation":"契約締結又は申込受領を行う案内所等を設置するときは、業務開始の10日前までに、免許権者と所在地管轄知事の双方に届け出なければならない。届出期限の10日前と届出先の二重性が最重要ポイントである。","difficulty":2,"tags":["宅建業法","案内所","50条2項の届出"],"shuffle_choices":true},{"id":"Q1045","topic":"媒介契約の規制","question_type":"select_correct","question":"宅地の売買の媒介契約の有効期間に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"専任媒介契約の有効期間は3か月を超えることができず、これより長い期間を定めたときは、その期間は3か月とされる。","is_correct":true,"explanation":"正しい。専任媒介契約の有効期間の上限は3か月であり、これを超える定めをしても契約自体は有効で、期間のみ3か月に短縮される。"},{"text":"専任媒介契約の有効期間を6か月と定めた場合、その媒介契約は全体として無効となる。","is_correct":false,"explanation":"誤り。3か月を超える定めをしても媒介契約自体が無効になるのではなく、有効期間が3か月に短縮されるにとどまる。"},{"text":"一般媒介契約の有効期間も、3か月を超えることができない。","is_correct":false,"explanation":"誤り。有効期間の上限3か月の規制は専任媒介契約（専属専任を含む）に関するものであり、一般媒介契約には法律上の期間制限はない。"},{"text":"専任媒介契約において、有効期間満了時に依頼者の申出がなくても自動的に更新される旨の特約は有効である。","is_correct":false,"explanation":"誤り。更新は依頼者の申出がある場合に限られ、自動更新の特約は依頼者に不利なものとして無効である。"}],"explanation":"専任媒介契約の有効期間は3か月以内で、超過する定めは3か月に短縮される。依頼者を長期間拘束することを防ぐ趣旨であり、一般媒介には期間規制がない点、自動更新特約が無効である点と併せて整理したい。","difficulty":1,"tags":["宅建業法","媒介契約"],"shuffle_choices":true},{"id":"Q1046","topic":"媒介契約の規制","question_type":"select_correct","question":"媒介契約における業務処理状況の報告義務に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"専任媒介契約を締結した宅地建物取引業者は、依頼者に対し、業務の処理状況を1週間に1回以上報告しなければならない。","is_correct":false,"explanation":"誤り。専任媒介契約の報告義務は2週間に1回以上である。1週間に1回以上の報告が必要なのは専属専任媒介契約である。"},{"text":"専属専任媒介契約を締結した宅地建物取引業者は、依頼者に対し、業務の処理状況を2週間に1回以上報告すれば足りる。","is_correct":false,"explanation":"誤り。専属専任媒介契約では1週間に1回以上の報告が必要であり、2週間に1回では義務を果たしたことにならない。"},{"text":"一般媒介契約を締結した宅地建物取引業者も、依頼者に対し、業務の処理状況を2週間に1回以上報告しなければならない。","is_correct":false,"explanation":"誤り。定期的な業務処理状況の報告義務は専任媒介契約・専属専任媒介契約に課されるものであり、一般媒介契約にはない。"},{"text":"専属専任媒介契約を締結した宅地建物取引業者は、業務の処理状況を1週間に1回以上報告しなければならないが、この報告は口頭で行うこともできる。","is_correct":true,"explanation":"正しい。専属専任媒介契約の報告頻度は1週間に1回以上であり、報告の方法について法律上の定めはないため、口頭や電子メールによる報告も認められる。"}],"explanation":"業務処理状況の報告は、専任媒介が2週間に1回以上、専属専任媒介が1週間に1回以上であり、一般媒介には定期報告義務がない。報告方法に制限はなく口頭でもよい点も押さえておきたい。","difficulty":1,"tags":["宅建業法","媒介契約"],"shuffle_choices":true},{"id":"Q1047","topic":"媒介契約の規制","question_type":"select_incorrect","question":"指定流通機構への登録義務に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"専任媒介契約を締結した宅地建物取引業者は、契約締結の日から7日以内（宅地建物取引業者の休業日を除く。）に、所定の事項を指定流通機構に登録しなければならない。","is_correct":false,"explanation":"正しい記述である。専任媒介契約の登録期限は、休業日を除いて契約締結日から7日以内である。"},{"text":"専属専任媒介契約を締結した場合の登録期限は、契約締結の日から5日以内（宅地建物取引業者の休業日を除く。）である。","is_correct":false,"explanation":"正しい記述である。専属専任媒介契約では、休業日を除き5日以内に登録しなければならない。"},{"text":"登録期限である7日又は5日の期間の計算においては、宅地建物取引業者の休業日も算入される。","is_correct":true,"explanation":"誤り。登録期限の計算では宅地建物取引業者の休業日は算入されない。休業日を除いて7日以内・5日以内と計算する。"},{"text":"指定流通機構に登録をした宅地建物取引業者は、登録を証する書面を遅滞なく依頼者に引き渡すか、依頼者の承諾を得て電磁的方法により提供しなければならない。","is_correct":false,"explanation":"正しい記述である。登録後は指定流通機構が発行する登録を証する書面を遅滞なく依頼者に引き渡す必要があり、依頼者の承諾を得れば電磁的方法による提供も認められる。"}],"explanation":"指定流通機構への登録は、専任媒介が7日以内、専属専任媒介が5日以内で、いずれも宅地建物取引業者の休業日を除いて計算する。休業日の算入の有無は数字とセットで問われる頻出の細部である。","difficulty":2,"tags":["宅建業法","媒介契約","指定流通機構"],"shuffle_choices":true},{"id":"Q1048","topic":"媒介契約の規制","question_type":"select_correct","question":"指定流通機構への登録及び成約の通知に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"指定流通機構への登録事項には、当該宅地建物の所在や売買すべき価額のほか、依頼者の氏名も含まれる。","is_correct":false,"explanation":"誤り。登録事項は物件の所在・規模・形質、売買すべき価額、主要な法令上の制限、専属専任媒介契約である場合はその旨などであり、依頼者の氏名は含まれない。"},{"text":"登録に係る宅地建物の売買契約が成立した場合の指定流通機構への通知は、依頼者の承諾があれば省略することができる。","is_correct":false,"explanation":"誤り。成約時の通知は法律上の義務であり、依頼者の承諾によって省略できるものではない。"},{"text":"一般媒介契約を締結した宅地建物取引業者は、当該物件を指定流通機構に登録することが禁止されている。","is_correct":false,"explanation":"誤り。一般媒介契約には登録義務がないだけであり、任意に指定流通機構へ登録することは禁止されていない。"},{"text":"登録に係る宅地建物の売買契約が成立したときは、宅地建物取引業者は、遅滞なく、登録番号、取引価格及び契約成立年月日を指定流通機構に通知しなければならない。","is_correct":true,"explanation":"正しい。成約時には、登録番号・取引価格・契約成立年月日の3項目を遅滞なく指定流通機構に通知しなければならない。"}],"explanation":"指定流通機構制度は物件情報を共有して取引の成立を促進する仕組みであり、成約時には登録番号・取引価格・契約成立年月日を遅滞なく通知する。登録事項・通知事項の中身まで問う応用的な出題に対応できるようにしたい。","difficulty":3,"tags":["宅建業法","媒介契約","指定流通機構"],"shuffle_choices":true},{"id":"Q1049","topic":"媒介契約の規制","question_type":"select_correct","question":"宅地建物取引業法第34条の2の規定に基づき交付すべき書面（媒介契約書面）の記載事項等に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"宅地建物取引業者が売買すべき価額について意見を述べるときは、必ず書面によりその根拠を明らかにしなければならない。","is_correct":false,"explanation":"誤り。価額について意見を述べるときは根拠を明らかにする必要があるが、その方法は書面に限られず、口頭で示すことも認められる。"},{"text":"標準媒介契約約款に基づかない媒介契約である場合には、その旨を媒介契約書面に記載する必要はない。","is_correct":false,"explanation":"誤り。媒介契約書面には、標準媒介契約約款に基づくものであるか否かの別を記載しなければならず、基づかない場合はその旨の記載が必要である。"},{"text":"既存の建物の売買の媒介契約を締結したときは、依頼者に対する建物状況調査を実施する者のあっせんに関する事項を媒介契約書面に記載しなければならない。","is_correct":true,"explanation":"正しい。既存建物の売買又は交換の媒介では、建物状況調査を実施する者のあっせんに関する事項が媒介契約書面の記載事項とされている。"},{"text":"一般媒介契約を締結したときは、媒介契約書面の交付や電磁的方法による提供をする必要はない。","is_correct":false,"explanation":"誤り。34条の2の書面交付義務は、一般媒介契約を含む売買・交換の媒介契約すべてに及ぶ。一般媒介だから不要とはならない。"}],"explanation":"媒介契約書面には、物件の表示、売買すべき価額、媒介契約の種類、既存建物の場合の建物状況調査のあっせんに関する事項、有効期間・解除、指定流通機構への登録、報酬、標準約款に基づくか否かの別などを記載する。価額への意見の根拠明示が口頭でも可能な点は頻出のひっかけである。","difficulty":2,"tags":["宅建業法","媒介契約","34条の2書面"],"shuffle_choices":true},{"id":"Q1050","topic":"媒介契約の規制","question_type":"select_incorrect","question":"宅地建物取引業法第34条の2の規定に基づく書面の交付等に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"宅地建物取引業者は、宅地の売買の媒介契約を締結したときは、遅滞なく、所定の事項を記載した書面を作成して記名押印し、依頼者に交付しなければならない。","is_correct":false,"explanation":"正しい記述である。媒介契約書面は契約締結後遅滞なく交付し、宅地建物取引業者が記名押印する必要がある。"},{"text":"媒介契約書面への記名押印は、成年者である専任の宅地建物取引士が行わなければならない。","is_correct":true,"explanation":"誤り。媒介契約書面に記名押印するのは宅地建物取引業者であり、宅地建物取引士による記名は要求されていない。宅建士の記名が必要なのは重要事項説明書（35条書面）や37条書面である。"},{"text":"宅地建物取引業者は、依頼者の承諾を得て、媒介契約書面の交付に代えて、電磁的方法により当該書面に記載すべき事項を提供することができる。","is_correct":false,"explanation":"正しい記述である。依頼者の承諾を得れば、書面の交付に代えて電磁的方法による提供が認められている。"},{"text":"建物の貸借の媒介契約を締結した場合には、34条の2に規定する書面を交付する義務はない。","is_correct":false,"explanation":"正しい記述である。媒介契約書面の交付義務は売買又は交換の媒介に限られ、貸借の媒介には適用されない。"}],"explanation":"媒介契約書面は宅地建物取引業者が記名押印して交付するものであり、宅地建物取引士の関与は要件とされていない。35条書面・37条書面における宅建士の記名と混同させるのが定番のひっかけである。電磁的方法による提供が可能となった点も現行法の重要知識である。","difficulty":2,"tags":["宅建業法","媒介契約","34条の2書面"],"shuffle_choices":true},{"id":"Q1051","topic":"媒介契約の規制","question_type":"select_correct","question":"専任媒介契約の更新に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"依頼者の申出があれば、更新後の有効期間を6か月と定めることができる。","is_correct":false,"explanation":"誤り。更新後の有効期間も3か月を超えることができない。依頼者の申出があっても3か月が上限である。"},{"text":"専任媒介契約は、有効期間の満了に際して依頼者の申出がない限り更新されず、あらかじめ自動更新する旨を定める特約は無効である。","is_correct":true,"explanation":"正しい。更新には依頼者の申出が必要であり、申出なしに自動更新される旨の特約は依頼者に不利なものとして無効となる。"},{"text":"有効期間の満了に際し、宅地建物取引業者からの申出により更新することができる。","is_correct":false,"explanation":"誤り。更新の申出をすることができるのは依頼者であり、宅地建物取引業者側からの申出による更新は認められない。"},{"text":"更新の申出は、有効期間の満了の1か月前までにしなければならない。","is_correct":false,"explanation":"誤り。更新の申出の時期について、満了の1か月前までといった法律上の制限はない。有効期間の満了に際して依頼者が申し出ればよい。"}],"explanation":"専任媒介契約の更新は、有効期間満了時の依頼者の申出によってのみ行うことができ、更新後の期間も3か月以内に限られる。依頼者保護の趣旨から、自動更新特約のような依頼者に不利な特約は無効とされる。","difficulty":3,"tags":["宅建業法","媒介契約"],"shuffle_choices":true},{"id":"Q1052","topic":"広告に関する規制","question_type":"select_correct","question":"宅地建物取引業法第32条の誇大広告等の禁止に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"著しく事実に相違する表示をした広告であっても、実際に誤認した者が現れなければ、誇大広告等の禁止に違反しない。","is_correct":false,"explanation":"誤り。誇大広告等の禁止は表示行為そのものを規制するものであり、現実に誤認した者が生じたかどうかにかかわらず違反が成立する。"},{"text":"誇大広告をしても、その広告に係る取引が成立しなかった場合には、宅地建物取引業法違反とはならない。","is_correct":false,"explanation":"誤り。取引の成立や損害の発生は違反の成立要件ではない。広告をした時点で違反となる。"},{"text":"現在の環境ではなく将来の環境や利便についての表示であれば、実際のものよりも著しく優良であると人を誤認させるものであっても差し支えない。","is_correct":false,"explanation":"誤り。誇大広告等の禁止の対象には、現在の事項だけでなく将来の環境や利便に関する表示も含まれる。"},{"text":"著しく事実に相違する表示をした場合、取引が成立せず損害を受けた者がいなくても宅地建物取引業法違反となり、監督処分のほか罰則の対象にもなる。","is_correct":true,"explanation":"正しい。誇大広告等の禁止に違反すれば、結果の発生を問わず違反が成立し、業務停止等の監督処分に加え、6月以下の懲役若しくは100万円以下の罰金又はその併科の対象となる。"}],"explanation":"誇大広告等の禁止は、著しく事実に相違する表示や、実際より著しく優良・有利と誤認させる表示を、結果の発生を問わず禁止するものである。将来の環境・利便に関する表示も対象に含まれ、違反には監督処分と罰則の双方が用意されている。","difficulty":1,"tags":["宅建業法","広告規制","誇大広告"],"shuffle_choices":true},{"id":"Q1053","topic":"広告に関する規制","question_type":"select_incorrect","question":"広告の開始時期の制限に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"建築確認を受ける前の建物については、売買に関する広告だけでなく、貸借に関する広告をすることもできない。","is_correct":false,"explanation":"正しい記述である。広告開始時期の制限は、売買・交換・貸借を問わずすべての取引態様の広告に及ぶ。"},{"text":"建築確認の申請中である旨を表示すれば、建築確認を受ける前であっても当該建物の売買の広告をすることができる。","is_correct":true,"explanation":"誤り。建築確認前は、申請中である旨を表示したとしても広告をすることはできない。表示による例外は認められていない。"},{"text":"都市計画法の開発許可を受ける前の宅地については、その売買に関する広告をすることができない。","is_correct":false,"explanation":"正しい記述である。開発許可等の処分の前は、当該宅地に関する広告は禁止される。"},{"text":"建築確認を受ける前の建物であっても、当該建物の貸借の媒介契約を締結することはできる。","is_correct":false,"explanation":"正しい記述である。契約締結時期の制限は売買・交換（自ら当事者となる場合と代理・媒介）に限られ、貸借の代理・媒介は建築確認前でも行うことができる。"}],"explanation":"未完成物件は、開発許可・建築確認等の処分があった後でなければ広告できず、申請中である旨を表示しても広告は許されない。一方、契約締結時期の制限は貸借の代理・媒介には及ばないため、広告と契約で規制範囲が異なる点が最大のポイントである。","difficulty":2,"tags":["宅建業法","広告規制","広告開始時期"],"shuffle_choices":true},{"id":"Q1054","topic":"広告に関する規制","question_type":"select_correct","question":"取引態様の別の明示義務に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"宅地建物取引業者は、広告をするときに取引態様の別を明示していた場合であっても、注文を受けたときは、遅滞なく、改めてその注文をした者に取引態様の別を明らかにしなければならない。","is_correct":true,"explanation":"正しい。取引態様の明示は、広告時と注文を受けたときの双方で必要であり、広告での明示をもって注文時の明示に代えることはできない。"},{"text":"広告に取引態様の別を明示していれば、その広告を見た者から注文を受けたときに改めて明示する必要はない。","is_correct":false,"explanation":"誤り。広告時に明示していても、注文を受けたときには遅滞なく改めて取引態様の別を明らかにしなければならない。"},{"text":"注文を受けたときの取引態様の別の明示は、書面で行わなければならず、口頭で行うことはできない。","is_correct":false,"explanation":"誤り。取引態様の明示の方法について法律上の制限はなく、口頭で明らかにすることも認められる。"},{"text":"同一の物件について数回に分けて広告をする場合には、最初の広告に取引態様の別を明示すれば、その後の広告では省略することができる。","is_correct":false,"explanation":"誤り。取引態様の別は広告のつど明示しなければならず、複数回の広告の場合も各回ごとに明示が必要である。"}],"explanation":"取引態様の別は、広告をするとき及び注文を受けたときのそれぞれで明示しなければならず、一方を行えば他方が不要となる関係にはない。報酬請求の可否等に関わる重要な情報であるため、二重の明示が義務付けられている。","difficulty":2,"tags":["宅建業法","広告規制","取引態様の明示"],"shuffle_choices":true},{"id":"Q1055","topic":"広告に関する規制","question_type":"select_incorrect","question":"いわゆる「おとり広告」等に関する次の記述のうち、宅地建物取引業法の規定に照らし、誤っているものはどれか。","choices":[{"text":"実際には存在しない物件を広告することは、誇大広告等の禁止に違反する。","is_correct":false,"explanation":"正しい記述である。存在しない架空の物件の広告は、著しく事実に相違する表示として誇大広告等の禁止に違反する。"},{"text":"物件は存在するが、実際には取引する意思のない物件を広告することも、誇大広告等の禁止に違反する。","is_correct":false,"explanation":"正しい記述である。取引の対象となり得ない物件や取引する意思のない物件を集客目的で広告するおとり広告は、誇大広告等として禁止される。"},{"text":"既に売買契約が成立して取引できなくなった物件の広告を、そのまま掲載し続けることも、誇大広告等の禁止に違反する。","is_correct":false,"explanation":"正しい記述である。成約済みで取引できない物件の広告を放置して掲載し続けることも、実際には取引できない物件の広告としておとり広告に該当する。"},{"text":"おとり広告に該当する広告であっても、故意ではなく過失によって掲載されたものであれば、宅地建物取引業法違反とはならない。","is_correct":true,"explanation":"誤り。誇大広告等の禁止への違反は、故意によるものであるか過失によるものであるかを問わず成立する。掲載の更新を怠った過失による成約済み物件の放置も違反となり得る。"}],"explanation":"存在しない物件、取引する意思のない物件、成約済みで取引できない物件の広告は、いずれもおとり広告として誇大広告等の禁止に違反する。違反の成立に故意は要求されず、広告管理の懈怠による場合も監督処分等の対象となる。","difficulty":3,"tags":["宅建業法","広告規制","おとり広告"],"shuffle_choices":true},{"id":"Q1056","topic":"重要事項の説明(35条書面)","question_type":"select_correct","question":"宅地建物取引業者Aが行う宅地建物取引業法第35条に規定する重要事項の説明の相手方に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"Aが宅地の売買の媒介を行う場合、Aは売主及び買主の双方に対して重要事項の説明をしなければならない。","is_correct":false,"explanation":"重要事項の説明の相手方は、物件を取得しようとする者、すなわち買主・借主・交換により物件を取得する者である。売主に対して説明する義務はない。"},{"text":"Aが建物の貸借の媒介を行う場合、Aは貸主に対しても重要事項の説明をしなければならない。","is_correct":false,"explanation":"貸借の場合の説明の相手方は借主であり、貸主に説明する義務はない。"},{"text":"Aが宅地の売買の媒介を行う場合、Aは買主に対して契約が成立するまでの間に重要事項の説明をすれば足り、売主に対して説明する必要はない。","is_correct":true,"explanation":"重要事項の説明は、契約が成立するまでの間に、物件を取得しようとする買主に対して行えばよく、売主への説明は不要である。"},{"text":"買主が宅地建物取引業者である場合でも、Aは35条書面を交付したうえで、その内容を宅地建物取引士に説明させなければならない。","is_correct":false,"explanation":"相手方が宅地建物取引業者である場合、35条書面の交付(電磁的方法による提供を含む)は必要だが、説明そのものは省略できる。"}],"explanation":"重要事項の説明は、これから物件を取得・賃借しようとする者に契約するか否かの判断材料を与える制度であるため、相手方は買主・借主等に限られ、時期は契約成立前でなければならない。なお、相手方が宅建業者のときは書面の交付のみで足り、説明は不要である。","difficulty":1,"tags":["宅建業法","重要事項説明"],"shuffle_choices":true},{"id":"Q1057","topic":"重要事項の説明(35条書面)","question_type":"select_incorrect","question":"宅地建物取引業法第35条に規定する重要事項の説明に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"重要事項の説明は、契約が成立した後、遅滞なく行えば足りる。","is_correct":true,"explanation":"誤り。重要事項の説明は契約が成立するまでの間に行わなければならない。契約成立後遅滞なく交付するのは37条書面である。"},{"text":"重要事項の説明は宅地建物取引士に行わせなければならないが、その宅地建物取引士は専任の者である必要はない。","is_correct":false,"explanation":"正しい。説明も記名も宅地建物取引士であれば足り、成年者である専任の宅地建物取引士に限定されていない。"},{"text":"35条書面には、宅地建物取引士の記名がなければならない。","is_correct":false,"explanation":"正しい。35条書面には宅地建物取引士の記名が必要である。押印は法改正により不要とされている。"},{"text":"宅地建物取引士は、重要事項の説明をするときは、相手方から請求がなくても宅地建物取引士証を提示しなければならない。","is_correct":false,"explanation":"正しい。重要事項の説明の際の取引士証の提示は、請求の有無にかかわらず義務である。"}],"explanation":"重要事項の説明は契約締結の判断材料を与える制度であるから、必ず契約成立前に行わなければならない。説明・記名を行う宅地建物取引士は専任である必要はなく、説明時には請求がなくても取引士証を提示する義務がある。","difficulty":1,"tags":["宅建業法","重要事項説明"],"shuffle_choices":true},{"id":"Q1058","topic":"重要事項の説明(35条書面)","question_type":"select_correct","question":"重要事項の説明における宅地建物取引士証の提示に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"重要事項の説明の際に宅地建物取引士証を提示しなかった場合でも、罰則の適用を受けることはない。","is_correct":false,"explanation":"重要事項説明時の提示義務に違反した宅地建物取引士は、10万円以下の過料に処されることがある。"},{"text":"宅地建物取引士証の提示は、勤務先の宅地建物取引業者が発行する従業者証明書の提示をもって代えることができる。","is_correct":false,"explanation":"従業者証明書と宅地建物取引士証は別個の制度であり、取引士証の提示を従業者証明書で代替することはできない。"},{"text":"テレビ会議等のITを活用して重要事項の説明を行う場合には、宅地建物取引士証の提示は不要である。","is_correct":false,"explanation":"IT重説の場合も、宅地建物取引士証を画面上に提示し、相手方が視認して確認したことを確かめる必要がある。提示が免除されるわけではない。"},{"text":"重要事項の説明の相手方が提示を求めなかった場合であっても、宅地建物取引士は説明の際に宅地建物取引士証を提示しなければならない。","is_correct":true,"explanation":"重要事項の説明の際は、相手方からの請求の有無にかかわらず、取引士証の提示が義務付けられている。"}],"explanation":"取引の関係者から請求があったときの提示義務とは別に、重要事項の説明の際には請求がなくても宅地建物取引士証を提示しなければならず、違反には10万円以下の過料の制裁がある。IT重説においても画面上での提示と相手方の確認が求められる。","difficulty":2,"tags":["宅建業法","重要事項説明","宅地建物取引士"],"shuffle_choices":true},{"id":"Q1059","topic":"重要事項の説明(35条書面)","question_type":"select_correct","question":"テレビ会議等のITを活用した重要事項の説明(いわゆるIT重説)に関する次の記述のうち、宅地建物取引業法の規定及び解釈によれば、正しいものはどれか。","choices":[{"text":"IT重説は建物の貸借の媒介に限って認められており、宅地又は建物の売買では対面で説明しなければならない。","is_correct":false,"explanation":"IT重説は貸借だけでなく、売買・交換の取引においても認められている。"},{"text":"IT重説を実施するには、宅地建物取引士と相手方が映像及び音声を相互にやり取りできる環境にあり、かつ、35条書面(電磁的方法による提供を含む)があらかじめ相手方に交付・提供されていることが必要である。","is_correct":true,"explanation":"IT重説は、双方向でやり取りできるIT環境の確保、35条書面等の事前交付(提供)、相手方が書面等を確認しながら説明を受けられる状態などの要件を満たして初めて対面の説明と同様に取り扱われる。"},{"text":"IT重説による場合には、宅地建物取引士でない従業者が説明を行うことができる。","is_correct":false,"explanation":"IT重説であっても説明の主体は宅地建物取引士でなければならない。説明方法が変わるだけで、説明者の資格要件は緩和されない。"},{"text":"IT重説を実施すれば、35条書面の交付又は電磁的方法による提供を省略することができる。","is_correct":false,"explanation":"IT重説は説明方法に関する取扱いであり、35条書面の交付(又は承諾を得た電磁的方法による提供)の義務がなくなるわけではない。"}],"explanation":"IT重説は、一定の要件(双方向の映像・音声環境、35条書面等の事前交付・提供、取引士証の画面上での提示と確認等)を満たした場合に、対面による説明と同様に取り扱われる制度であり、売買・貸借のいずれでも実施できる。書面交付義務や宅地建物取引士による説明義務自体は免除されない。","difficulty":2,"tags":["宅建業法","重要事項説明","IT重説"],"shuffle_choices":true},{"id":"Q1060","topic":"重要事項の説明(35条書面)","question_type":"select_incorrect","question":"35条書面の電磁的方法による提供に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":[{"text":"宅地建物取引業者は、重要事項の説明の相手方の承諾を得た場合には、35条書面の交付に代えて、電磁的方法により提供することができる。","is_correct":false,"explanation":"正しい。相手方の承諾を得れば、書面の交付に代えて電磁的方法による提供が認められている。"},{"text":"35条書面を電磁的方法により提供する場合にも、宅地建物取引士の記名に代わる措置を講じなければならない。","is_correct":false,"explanation":"正しい。電磁的方法による提供の場合も、宅地建物取引士の記名に相当する措置(電子署名等)を講じる必要がある。"},{"text":"宅地建物取引業者が適当と認めるときは、相手方の承諾を得ることなく、35条書面を電磁的方法により提供することができる。","is_correct":true,"explanation":"誤り。電磁的方法による提供には、あらかじめ相手方の承諾を得ることが必要であり、業者の判断のみで行うことはできない。"},{"text":"電磁的方法による提供は、相手方がファイルへの記録を出力して書面を作成できるものであることなど、一定の基準に適合するものでなければならない。","is_correct":false,"explanation":"正しい。提供されたデータを相手方が出力して書面化できること、改変が行われていないか確認できることなどの基準を満たす必要がある。"}],"explanation":"35条書面は、相手方の承諾を得たうえで、宅地建物取引士の記名に代わる措置を講じ、出力可能性等の技術的基準を満たす電磁的方法により提供することができる。承諾なしに業者の判断だけで電磁的提供に切り替えることはできない。","difficulty":1,"tags":["宅建業法","重要事項説明","電磁的方法"],"shuffle_choices":true},{"id":"Q1061","topic":"重要事項の説明(35条書面)","question_type":"select_correct","question":"宅地建物取引業法第35条に規定する重要事項の説明の内容に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"建物の売買の媒介において、当該建物に登記された抵当権が引渡しまでに抹消される予定である場合には、その抵当権について説明する必要はない。","is_correct":false,"explanation":"登記された権利の種類・内容等は、引渡しまでに抹消される予定であっても説明しなければならない。抹消予定であることは説明を省略する理由にならない。"},{"text":"建物の貸借の媒介においては、都市計画法及び建築基準法に基づく制限をすべて説明しなければならない。","is_correct":false,"explanation":"建物の貸借では、借主が建物を建築・造成するわけではないため、都市計画法・建築基準法上の制限は原則として説明事項とされていない(新住宅市街地開発法等ごく一部の制限に限られる)。"},{"text":"私道に関する負担に関する事項は、建物の貸借の媒介においても説明しなければならない。","is_correct":false,"explanation":"私道負担は、宅地の売買・貸借及び建物の売買では説明事項だが、建物の貸借に限っては説明不要とされている。"},{"text":"宅地の売買の媒介において、当該宅地の上に登記された地上権があるときは、買主がその存在を知っている場合であっても、その内容を説明しなければならない。","is_correct":true,"explanation":"登記された権利の種類・内容、登記名義人等は説明事項であり、相手方が知っていることを理由に省略することはできない。"}],"explanation":"登記された権利に関する事項は、抹消予定や相手方の認識にかかわらず説明が必要である。一方、法令上の制限は建物の貸借ではほとんど説明不要であり、私道負担も建物の貸借に限り説明事項から除かれている点が、取引態様による違いとして頻出である。","difficulty":2,"tags":["宅建業法","重要事項説明"],"shuffle_choices":true},{"id":"Q1062","topic":"重要事項の説明(35条書面)","question_type":"select_incorrect","question":"宅地の売買の媒介における重要事項の説明の内容に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":[{"text":"飲用水、電気及びガスの供給並びに排水のための施設が整備されていない場合には、その整備の見通し及び整備についての特別の負担に関する事項を説明しなければならない。","is_correct":false,"explanation":"正しい。インフラの整備状況は説明事項であり、未整備の場合は整備の見通しと特別の負担について説明する必要がある。"},{"text":"代金以外に授受される金銭があるときは、その額及び授受の目的を説明しなければならない。","is_correct":false,"explanation":"正しい。手付金・固定資産税の清算金など、代金以外に授受される金銭については、額と授受の目的が説明事項である。"},{"text":"契約の解除に関する事項は、その定めがない場合には、定めがない旨を説明しなければならない。","is_correct":false,"explanation":"正しい。35条の説明事項については、定めがないときは「定めなし」として説明・記載する必要がある。定めがなくても省略できない。"},{"text":"代金の額並びにその支払の時期及び方法は、重要事項として説明しなければならない。","is_correct":true,"explanation":"誤り。代金の額・支払時期・支払方法は35条の説明事項ではなく、37条書面の必要的記載事項である。35条で必要なのは「代金以外に授受される金銭」の額と目的である。"}],"explanation":"代金や借賃そのものの額は当事者が当然に認識しているため35条の説明事項ではなく、37条書面の記載事項とされている。これに対し、代金以外に授受される金銭は35条の説明事項であり、両者の振り分けは本試験で繰り返し問われる論点である。","difficulty":2,"tags":["宅建業法","重要事項説明","37条書面との比較"],"shuffle_choices":true},{"id":"Q1063","topic":"重要事項の説明(35条書面)","question_type":"select_correct","question":"手付金等の保全措置等に関する重要事項の説明についての次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"手付金等の保全措置は、売買の媒介を行う宅地建物取引業者が講じなければならないものとして、その概要を説明する。","is_correct":false,"explanation":"手付金等の保全措置を講じる義務を負うのは、自ら売主となる宅地建物取引業者であり、媒介業者ではない。"},{"text":"宅地建物取引業者が自ら売主となる売買契約において手付金等を受領しようとする場合には、その保全措置の概要を重要事項として説明しなければならない。","is_correct":true,"explanation":"自ら売主となる業者が手付金等を受領しようとするときは、保全措置の概要が35条の説明事項とされている。"},{"text":"建物の貸借の媒介においても、手付金等の保全措置の概要を説明しなければならない。","is_correct":false,"explanation":"手付金等の保全措置は、宅建業者が自ら売主となる売買・交換に関する制度であり、貸借では説明事項とならない。"},{"text":"手付金等の保全措置の概要は、35条書面に記載せず、口頭で説明すれば足りる。","is_correct":false,"explanation":"重要事項は35条書面に記載したうえで、その書面を交付(又は電磁的方法により提供)して説明しなければならず、口頭の説明のみでは足りない。"}],"explanation":"手付金等の保全措置(法41条・41条の2)は自ら売主となる宅建業者に課される義務であり、その概要は契約前の判断材料として35条の説明事項とされている。説明は書面の交付を伴う必要があり、口頭のみでは義務を果たしたことにならない。","difficulty":2,"tags":["宅建業法","重要事項説明","手付金等の保全"],"shuffle_choices":true},{"id":"Q1064","topic":"重要事項の説明(35条書面)","question_type":"select_correct","question":"区分所有建物の取引における重要事項の説明に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"区分所有建物の売買の媒介においては、計画的な維持修繕のための費用の積立てに関する規約の定め(案を含む)があるときは、その内容及び既に積み立てられている額を説明しなければならない。","is_correct":true,"explanation":"修繕積立金に関する規約の定め(案の段階を含む)の内容と、既に積み立てられている額は、区分所有建物の売買における追加の説明事項である。"},{"text":"区分所有建物の貸借の媒介においても、売買の場合と同様に、管理規約の内容や修繕積立金の額などをすべて説明しなければならない。","is_correct":false,"explanation":"貸借の場合に説明が必要な区分所有建物特有の事項は、専有部分の用途その他の利用制限に関する規約の定めと、管理の委託先に関する事項に限られる。"},{"text":"一棟の建物の管理が管理会社に委託されている場合、その委託先の氏名(名称)及び住所は、貸借の媒介では説明する必要がない。","is_correct":false,"explanation":"管理の委託先の氏名(名称)・住所は、区分所有建物の売買だけでなく貸借においても説明事項とされている。"},{"text":"修繕積立金を特定の者にのみ減免する旨の規約の定めがある場合、買主がその減免対象者でなければ説明する必要はない。","is_correct":false,"explanation":"特定の者にのみ費用を減免する規約の定めがあるときはその内容を説明しなければならず、買主が減免対象かどうかで省略の可否は決まらない。"}],"explanation":"区分所有建物の売買では、敷地に関する権利、共用部分に関する規約、修繕積立金、管理の委託先など多くの追加事項の説明が必要である。これに対し貸借では、専有部分の用途制限に関する規約と管理の委託先の2点に限られる点が最重要のひっかけ論点である。","difficulty":3,"tags":["宅建業法","重要事項説明","区分所有建物"],"shuffle_choices":true},{"id":"Q1065","topic":"重要事項の説明(35条書面)","question_type":"select_incorrect","question":"建物の貸借の媒介における重要事項の説明に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":[{"text":"水防法の規定により市町村が提供する水害ハザードマップに当該建物の所在地が表示されているときは、そのハザードマップにおける当該建物の所在地を説明しなければならない。","is_correct":false,"explanation":"正しい。水害ハザードマップにおける物件の所在地は、売買・貸借を問わず説明事項とされている。"},{"text":"台所、浴室、便所その他の当該建物の設備の整備の状況について説明しなければならない。","is_correct":false,"explanation":"正しい。建物の貸借では、台所・浴室・便所等の設備の整備状況が追加の説明事項となっている。"},{"text":"敷金その他契約終了時に精算することとされている金銭の精算に関する事項は、その定めがない場合には説明する必要がない。","is_correct":true,"explanation":"誤り。敷金等の精算に関する事項は貸借における説明事項であり、定めがないときは定めがない旨を説明しなければならない。"},{"text":"契約期間及び契約の更新に関する事項について説明しなければならない。","is_correct":false,"explanation":"正しい。契約期間及び更新に関する事項は、貸借における追加の説明事項である。"}],"explanation":"貸借では、設備の整備状況、契約期間・更新、敷金等の精算、用途その他の利用制限などが追加の説明事項となる。35条の説明事項は、定めがない場合であっても「定めがない旨」を説明する必要がある点で、定めがあるときだけ記載する37条書面の任意的記載事項と異なる。","difficulty":2,"tags":["宅建業法","重要事項説明","貸借"],"shuffle_choices":true},{"id":"Q1066","topic":"重要事項の説明(35条書面)","question_type":"select_correct","question":"宅地の売買における重要事項の説明(35条)と37条書面の記載事項に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"宅地の引渡しの時期は、重要事項として説明しなければならない。","is_correct":false,"explanation":"引渡しの時期は35条の説明事項ではなく、37条書面の必要的記載事項である。"},{"text":"移転登記の申請の時期は、重要事項として説明する必要はないが、37条書面には必ず記載しなければならない。","is_correct":true,"explanation":"移転登記の申請時期は35条の説明事項に含まれない一方、売買・交換の37条書面では必要的記載事項とされている。"},{"text":"損害賠償額の予定又は違約金に関する事項は、重要事項として説明する必要はない。","is_correct":false,"explanation":"損害賠償額の予定・違約金に関する事項は35条の説明事項である(37条書面では定めがあるときに記載する任意的記載事項)。"},{"text":"天災その他不可抗力による損害の負担に関する定めは、重要事項として説明しなければならない。","is_correct":false,"explanation":"危険負担に関する定めは35条の説明事項ではなく、定めがあるときに37条書面に記載する事項である。"}],"explanation":"35条は契約前の判断材料、37条は成立した契約内容の証拠書面という役割の違いから、引渡し時期・移転登記の申請時期・代金の額は37条のみ、法令上の制限や手付金等の保全措置は35条のみの事項となる。両書面の振り分けは最頻出の比較論点である。","difficulty":3,"tags":["宅建業法","重要事項説明","37条書面との比較"],"shuffle_choices":true},{"id":"Q1067","topic":"重要事項の説明(35条書面)","question_type":"select_incorrect","question":"重要事項の説明に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":[{"text":"買主が宅地建物取引業者である場合、35条書面の交付又は電磁的方法による提供は必要であるが、宅地建物取引士による説明は省略することができる。","is_correct":false,"explanation":"正しい。宅建業者間の取引では、35条書面の交付(提供)義務は残るが、説明義務は課されない。"},{"text":"売主も媒介業者もいずれも宅地建物取引業者である取引においては、その双方の宅地建物取引業者が重要事項の説明義務を負う。","is_correct":false,"explanation":"正しい。取引に複数の宅建業者が関与する場合、各業者がそれぞれ説明義務を負う。実務上は1通の書面に各業者の宅地建物取引士が記名して共同で行うことができる。"},{"text":"重要事項の説明を行う場所について法律上の制限はなく、宅地建物取引業者の事務所以外の場所で行うこともできる。","is_correct":false,"explanation":"正しい。説明場所に関する規制はなく、相手方の自宅や勤務先などで行っても差し支えない。"},{"text":"重要事項の説明は、相手方の承諾を得れば、売買契約の成立後に行うことができる。","is_correct":true,"explanation":"誤り。重要事項の説明は契約が成立するまでの間に行わなければならず、相手方の承諾があっても契約成立後に行うことは認められない。"}],"explanation":"重要事項の説明の時期は契約成立前と法定されており、当事者の合意によっても後回しにできない。一方、相手方が宅建業者である場合の説明省略や、複数業者が関与する場合の各業者の義務、説明場所の自由といった点は、制度の趣旨から導かれる基本知識である。","difficulty":3,"tags":["宅建業法","重要事項説明"],"shuffle_choices":true},{"id":"Q1068","topic":"37条書面(契約書面)","question_type":"select_correct","question":"宅地建物取引業法第37条の規定により交付すべき書面(37条書面)に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"宅地の売買の媒介を行った宅地建物取引業者は、売主及び買主の双方に対して37条書面を交付(又は電磁的方法により提供)しなければならない。","is_correct":true,"explanation":"37条書面は成立した契約内容を明確にするための書面であり、契約の両当事者に交付しなければならない。"},{"text":"宅地の売買の媒介を行った宅地建物取引業者は、買主に対してのみ37条書面を交付すれば足りる。","is_correct":false,"explanation":"買主のみで足りるのは35条書面(重要事項説明)であり、37条書面は売主・買主の双方に交付する必要がある。"},{"text":"買主が宅地建物取引業者である場合には、その買主に対して37条書面を交付する必要はない。","is_correct":false,"explanation":"37条書面の交付義務は相手方が宅建業者であっても免除されない。業者間で省略できるのは35条の「説明」だけである。"},{"text":"37条書面は、宅地建物取引士がその内容を説明したうえで交付しなければならない。","is_correct":false,"explanation":"37条書面には宅地建物取引士の記名が必要だが、内容を説明する義務はない。説明義務があるのは35条書面である。"}],"explanation":"37条書面は契約成立後の紛争防止のために契約内容を証する書面であるから、交付の相手方は契約の両当事者であり、相手方が宅建業者でも交付義務は免除されない。宅地建物取引士の記名は必要だが、説明や取引士証の提示は不要である。","difficulty":1,"tags":["宅建業法","37条書面"],"shuffle_choices":true},{"id":"Q1069","topic":"37条書面(契約書面)","question_type":"select_incorrect","question":"37条書面に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":[{"text":"37条書面は、契約が成立した後、遅滞なく交付しなければならない。","is_correct":false,"explanation":"正しい。37条書面の交付時期は契約成立後遅滞なくとされている。契約成立前の交付が義務付けられる35条書面と対比される。"},{"text":"37条書面には宅地建物取引士の記名が必要であるが、宅地建物取引士がその内容を説明する必要はない。","is_correct":false,"explanation":"正しい。37条書面に必要なのは宅地建物取引士の記名のみで、説明義務は課されていない。"},{"text":"37条書面を交付する際には、宅地建物取引士は相手方に対して宅地建物取引士証を提示しなければならない。","is_correct":true,"explanation":"誤り。取引士証の提示義務があるのは重要事項の説明の際と取引の関係者から請求があったときであり、37条書面の交付自体に提示義務はない。"},{"text":"35条書面に記名した宅地建物取引士と、37条書面に記名する宅地建物取引士は、同一の者である必要はない。","is_correct":false,"explanation":"正しい。両書面の記名はいずれも宅地建物取引士であれば足り、同一人であることは要求されていない。"}],"explanation":"37条書面については、宅地建物取引士の記名は必要だが、説明義務も取引士証の提示義務もない。35条書面の説明義務・提示義務と混同させるのが典型的なひっかけであり、両書面の手続の違いを正確に区別する必要がある。","difficulty":1,"tags":["宅建業法","37条書面"],"shuffle_choices":true},{"id":"Q1070","topic":"37条書面(契約書面)","question_type":"select_correct","question":"37条書面の記載事項に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"代金の額並びにその支払の時期及び方法は、当事者間に特約がある場合に限り記載すれば足りる。","is_correct":false,"explanation":"代金の額・支払時期・支払方法は必要的記載事項であり、定めの有無にかかわらず必ず記載しなければならない。"},{"text":"宅地又は建物の引渡しの時期は、売買・貸借を問わず、37条書面に必ず記載しなければならない。","is_correct":true,"explanation":"引渡しの時期は、売買でも貸借でも37条書面の必要的記載事項である。"},{"text":"移転登記の申請の時期は、建物の貸借の場合にも37条書面に記載しなければならない。","is_correct":false,"explanation":"移転登記の申請時期は売買・交換における必要的記載事項であり、所有権移転を伴わない貸借では記載事項とされていない。"},{"text":"代金についての金銭の貸借(ローン)のあっせんに関する定めの有無にかかわらず、ローンが成立しないときの措置を必ず記載しなければならない。","is_correct":false,"explanation":"ローンのあっせんに関する定めがある場合に、ローン不成立のときの措置を記載するのであり、定めがなければ記載は不要である。"}],"explanation":"37条書面の必要的記載事項は、当事者、物件を特定するために必要な表示、代金(借賃)の額・支払時期・方法、引渡しの時期、そして売買・交換では移転登記の申請時期である。これに対し、ローンあっせんに係る不成立時の措置などは定めがあるときに記載する任意的記載事項である。","difficulty":2,"tags":["宅建業法","37条書面"],"shuffle_choices":true},{"id":"Q1071","topic":"37条書面(契約書面)","question_type":"select_incorrect","question":"宅地の売買における37条書面の記載事項に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":[{"text":"損害賠償額の予定又は違約金に関する定めがあるときは、その内容を記載しなければならない。","is_correct":false,"explanation":"正しい。損害賠償額の予定・違約金は、定めがあるときに記載すべき任意的記載事項である。"},{"text":"天災その他不可抗力による損害の負担に関する定めがあるときは、その内容を記載しなければならない。","is_correct":false,"explanation":"正しい。危険負担に関する定めは、定めがあるときに記載する事項である。"},{"text":"当該宅地に係る租税その他の公課の負担に関する定めがあるときは、その内容を記載しなければならない。","is_correct":false,"explanation":"正しい。租税公課の負担に関する定めは、売買・交換において定めがあるときに記載する事項である(貸借では不要)。"},{"text":"契約の解除に関する定めがない場合であっても、定めがない旨を37条書面に記載しなければならない。","is_correct":true,"explanation":"誤り。契約の解除に関する事項は、37条書面では定めがあるときに限り記載すればよい。定めがない旨の記載まで求められるのは35条書面の説明事項の扱いである。"}],"explanation":"37条書面の任意的記載事項(解除、損害賠償額の予定、危険負担、租税公課の負担、契約不適合責任に関する定め等)は、定めがあるときに記載すれば足り、定めがなければ記載不要である。定めがなくても「なし」と示す必要がある35条の説明事項との違いが重要である。","difficulty":2,"tags":["宅建業法","37条書面"],"shuffle_choices":true},{"id":"Q1072","topic":"37条書面(契約書面)","question_type":"select_correct","question":"35条書面と37条書面の記載事項の比較に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"建物の貸借において、借賃の額は35条の説明事項ではないが、37条書面には必ず記載しなければならない。","is_correct":true,"explanation":"借賃の額・支払時期・支払方法は35条の説明事項に含まれず、37条書面の必要的記載事項である。35条で説明するのは借賃以外に授受される金銭の額・目的である。"},{"text":"契約の解除に関する事項は、35条書面・37条書面のいずれにおいても、定めがない場合であっても記載しなければならない。","is_correct":false,"explanation":"35条では定めがなくてもその旨の説明が必要だが、37条書面では定めがあるときに限り記載すればよい。"},{"text":"手付金等を受領しようとする場合の保全措置の概要は、37条書面の必要的記載事項である。","is_correct":false,"explanation":"手付金等の保全措置の概要は35条の説明事項であり、37条書面の記載事項ではない。"},{"text":"宅地又は建物の引渡しの時期は、35条書面と37条書面の双方に記載しなければならない。","is_correct":false,"explanation":"引渡しの時期は37条書面の必要的記載事項であり、35条の説明事項ではない。"}],"explanation":"代金・借賃の額や引渡し時期は契約で決まる中心的事項として37条書面のみに記載され、法令上の制限や保全措置の概要は契約前の判断材料として35条のみで説明される。解除に関する事項は両方に登場するが、定めがない場合の扱いが異なる点まで押さえておきたい。","difficulty":3,"tags":["宅建業法","37条書面","重要事項説明"],"shuffle_choices":true},{"id":"Q1073","topic":"37条書面(契約書面)","question_type":"select_correct","question":"37条書面の電磁的方法による提供に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"37条書面については、電磁的方法による提供は認められておらず、必ず紙の書面を交付しなければならない。","is_correct":false,"explanation":"37条書面も、相手方の承諾を得れば電磁的方法による提供が認められている。"},{"text":"37条書面を電磁的方法により提供する場合には、相手方の承諾を得る必要はない。","is_correct":false,"explanation":"電磁的方法による提供には、あらかじめ相手方の承諾を得ることが必要である。"},{"text":"宅地建物取引業者は、相手方の承諾を得たうえで、宅地建物取引士の記名に代わる措置を講じた電磁的方法により、37条書面の交付に代えて提供することができる。","is_correct":true,"explanation":"37条書面は、相手方の承諾を得て、宅地建物取引士の記名に代わる措置(電子署名等)を講じれば、電磁的方法により提供できる。"},{"text":"37条書面を電磁的方法により提供する場合には、宅地建物取引士がその内容を説明しなければならない。","is_correct":false,"explanation":"37条書面には提供方法にかかわらず説明義務はない。電磁的方法によることで新たに説明義務が生じるわけではない。"}],"explanation":"デジタル改革関連法による宅建業法改正で、35条書面・37条書面とも相手方の承諾を条件に電磁的方法による提供が可能となった。その場合も宅地建物取引士の記名に代わる措置が必要であり、37条書面に説明義務がない点は紙の書面の場合と変わらない。","difficulty":2,"tags":["宅建業法","37条書面","電磁的方法"],"shuffle_choices":true},{"id":"Q1074","topic":"報酬に関する制限","question_type":"select_correct","question":"宅地建物取引業者A(消費税課税事業者)は、宅地(代金3,000万円。消費税等相当額を含まない)の売買について買主Bから媒介の依頼を受け、契約を成立させた。この場合の報酬に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"AがBから受領できる報酬の上限額は、96万円である。","is_correct":false,"explanation":"3,000万円×3%+6万円=96万円は消費税等相当額を含まない本体額である。課税事業者Aはこれに10%を上乗せした105万6,000円まで受領できる。"},{"text":"AがBから受領できる報酬の上限額は、105万6,000円である。","is_correct":true,"ex
