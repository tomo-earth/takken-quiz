保護するために必要であり、耐力壁・柱・はりにあっては3cm以上とされている。","is_correct":false,"explanation":"適当。かぶり厚さは鉄筋の保護と付着力確保のために必要で、耐力壁・柱・はりでは3cm以上と定められている。"},{"text":"鉄筋コンクリート造は、耐火性・耐久性に優れる一方、他の構造に比べて建物の自重が大きい。","is_correct":false,"explanation":"適当。鉄筋コンクリート造は耐火性・耐久性・遮音性に優れるが、自重が大きいため地盤や基礎への負担が大きく、工期も長くなりやすい。"}],"explanation":"鉄筋コンクリート造では、アルカリ性のコンクリートが鉄筋を錆から守っており、中性化はその保護機能を失わせる劣化現象である。「酸性」「中性化で腐食が抑えられる」といった性質を逆転させたひっかけが定番である。","difficulty":2,"tags":["税・その他","建物"],"shuffle_choices":true},{"id":"Q4044","topic":"建物","question_type":"select_correct","question":"建築物の構造に関する次の記述のうち、最も適当なものはどれか。","choices":[{"text":"鉄骨鉄筋コンクリート造は、鉄骨の骨組みの周囲に鉄筋を配してコンクリートを打ち込み一体化した構造であり、鉄筋コンクリート造よりさらに強度・じん性に優れ、高層建築物に用いられる。","is_correct":true,"explanation":"適当。鉄骨鉄筋コンクリート造(SRC造)は、鉄骨のじん性と鉄筋コンクリートの剛性・耐火性を兼ね備えた構造で、高層建築物に適している。"},{"text":"鉄筋コンクリート造において、直接土に接する壁・柱・床等のかぶり厚さは、2cm以上あれば足りる。","is_correct":false,"explanation":"不適当。直接土に接する壁・柱・床・はり等のかぶり厚さは4cm以上必要である。土中は湿気により鉄筋が腐食しやすいため、より厚いかぶりが求められる。"},{"text":"コンクリートの中性化は、コンクリートの強度と耐久性を高める現象であるため、進行させることが望ましい。","is_correct":false,"explanation":"不適当。中性化は空気中の二酸化炭素等によりコンクリートのアルカリ性が失われる劣化現象であり、進行すると内部の鉄筋が腐食しやすくなる。"},{"text":"鉄骨鉄筋コンクリート造は、鉄骨がコンクリートに覆われていないため、鉄骨造よりも耐火性に劣る。","is_correct":false,"explanation":"不適当。鉄骨鉄筋コンクリート造では鉄骨がコンクリートで覆われているため、耐火被覆を要する裸の鉄骨造よりも耐火性に優れる。"}],"explanation":"鉄骨鉄筋コンクリート造は、鉄骨・鉄筋・コンクリートの三者の長所を組み合わせた構造で、強度・じん性・耐火性のいずれにも優れる。かぶり厚さは部位によって異なり、耐力壁・柱・はりで3cm以上、直接土に接する部分で4cm以上という数値の使い分けが問われやすい。","difficulty":3,"tags":["税・その他","建物"],"shuffle_choices":true},{"id":"Q4045","topic":"建物","question_type":"select_incorrect","question":"建築物の耐震・制震・免震構造に関する次の記述のうち、最も不適当なものはどれか。","choices":[{"text":"耐震構造は、柱・はり・耐力壁などの部材の強度や粘り強さによって、地震力に直接抵抗する構造である。","is_correct":false,"explanation":"適当。耐震構造は建物自体の強度・じん性で地震力に耐える最も基本的な構造形式である。"},{"text":"制震構造は、ダンパーなどの制震装置を建物内に組み込み、地震の振動エネルギーを吸収して揺れを低減する構造である。","is_correct":false,"explanation":"適当。制震構造は装置がエネルギーを吸収することで建物の揺れを抑える構造であり、超高層建築物などにも用いられる。"},{"text":"免震構造は、基礎と建物本体との間に積層ゴムなどの免震装置を設置し、地震の揺れを建物に伝わりにくくする構造である。","is_correct":false,"explanation":"適当。免震構造は建物を地盤の揺れから絶縁することで、建物に伝わる地震力そのものを小さくする構造である。"},{"text":"制震構造や免震構造は、新築の建築物にしか採用することができず、既存建築物の改修工事に用いることはできない。","is_correct":true,"explanation":"不適当。制震・免震の技術は既存建築物の耐震改修(制震ダンパーの設置、免震レトロフィット等)にも用いることができる。新築専用というのは誤りである。"}],"explanation":"地震対策の構造は、力に耐える「耐震」、エネルギーを吸収する「制震」、揺れを伝えない「免震」の3方式に整理される。いずれも新築だけでなく既存建物の改修にも応用できる点が、近年の出題で狙われやすい。","difficulty":2,"tags":["税・その他","建物"],"shuffle_choices":true},{"id":"Q4046","topic":"建物","question_type":"select_correct","question":"建築物の地震対策に関する次の記述のうち、最も適当なものはどれか。","choices":[{"text":"既存不適格となっている古い木造建築物は、耐震診断や耐震改修を行っても、その耐震性を高めることはできない。","is_correct":false,"explanation":"不適当。旧耐震基準で建てられた建物であっても、耐震診断で弱点を把握し、壁の増設や接合部の補強などの耐震改修を行うことで耐震性を高めることができる。"},{"text":"耐力壁を建物の一方の面だけに集中して配置すると、その面の強度が高まるため、建物全体の耐震性は向上する。","is_correct":false,"explanation":"不適当。壁が一方に偏ると建物の重心と剛心がずれ、地震時にねじれ振動が生じて、壁の少ない側から破壊されやすくなる。"},{"text":"建物の耐震性を確保するためには、必要な壁量を確保したうえで、耐力壁を平面的にも立面的にもバランスよく配置することが重要である。","is_correct":true,"explanation":"適当。耐震性は壁の量と配置バランスの両方で決まる。量が足りていても配置が偏ればねじれによる被害が生じるため、バランスの良い配置が不可欠である。"},{"text":"建物の重心と剛心の位置が大きく離れているほど、地震時のねじれは小さくなり、耐震上有利である。","is_correct":false,"explanation":"不適当。重心(質量の中心)と剛心(強さの中心)が離れているほど地震時のねじれは大きくなる。両者を近づけることが耐震上望ましい。"}],"explanation":"建物の耐震性は「壁量の確保」と「配置のバランス」の両輪で成り立ち、重心と剛心のずれが小さいほどねじれ被害を防げる。既存建物も耐震診断・改修により性能向上が可能であり、これらは木造・非木造を問わず共通する基本原理である。","difficulty":1,"tags":["税・その他","建物"],"shuffle_choices":true}]}</script>
<script>
(function(){
  "use strict";

  var DATA = JSON.parse(document.getElementById('quizData').textContent);
  var ALL = DATA.questions;
  var HKEY = 'takken_history_v1';

  /* ---------- 学習履歴(問題データとは別に保存) ---------- */
  function loadHist(){
    try{ return JSON.parse(localStorage.getItem(HKEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveHist(h){
    try{ localStorage.setItem(HKEY, JSON.stringify(h)); }catch(e){}
  }
  var HIST = loadHist();

  function record(id, ok){
    var r = HIST[id] || {o:0, x:0, last:null};
    if(ok){ r.o++; } else { r.x++; }
    r.last = ok ? 1 : 0;
    HIST[id] = r;
    saveHist(HIST);
  }
  // 苦手 = 直近が不正解、または 不正解回数が正解回数以上
  function isWeak(id){
    var r = HIST[id];
    if(!r) return false;
    return r.last === 0 || r.x >= r.o;
  }
  function isUnseen(id){ return !HIST[id]; }

  /* ---------- 状態 ---------- */
  var SUBJECTS = [];
  (function(){
    var seen = {};
    ALL.forEach(function(q){
      var s = (q.tags && q.tags[0]) ? q.tags[0] : 'その他';
      if(!seen[s]){ seen[s] = 0; }
      seen[s]++;
    });
    SUBJECTS = Object.keys(seen).map(function(k){ return {name:k, n:seen[k]}; });
  })();

  var sel = { subject:'__all__', mode:'all', count:10 };
  var quiz = { list:[], idx:0, answered:false, results:[] };

  /* ---------- 画面ヘルパ ---------- */
  var $ = function(id){ return document.getElementById(id); };
  function show(which){
    $('scHome').classList.toggle('hide', which !== 'home');
    $('scQuiz').classList.toggle('hide', which !== 'quiz');
    $('scResult').classList.toggle('hide', which !== 'result');
    $('btnQuit').classList.toggle('hide', which !== 'quiz');
    window.scrollTo(0,0);
  }
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  /* ---------- 出題プール ---------- */
  function pool(){
    var list = ALL.filter(function(q){
      if(sel.subject === '__all__') return true;
      return (q.tags && q.tags[0]) === sel.subject;
    });
    if(sel.mode === 'weak')   list = list.filter(function(q){ return isWeak(q.id); });
    if(sel.mode === 'unseen') list = list.filter(function(q){ return isUnseen(q.id); });
    return list;
  }
  function shuffle(a){
    a = a.slice();
    for(var i=a.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------- ホーム描画 ---------- */
  function buildSubjectOpts(){
    var box = $('subjectOpts');
    box.innerHTML = '';
    var items = [{name:'__all__', label:'全科目', n:ALL.length}];
    SUBJECTS.forEach(function(s){ items.push({name:s.name, label:s.name, n:s.n}); });
    items.forEach(function(it){
      var b = document.createElement('button');
      b.className = 'opt';
      b.setAttribute('data-subject', it.name);
      b.setAttribute('aria-pressed', String(it.name === sel.subject));
      b.innerHTML = esc(it.label) + '<small>' + it.n + '問</small>';
      b.addEventListener('click', function(){
        sel.subject = it.name;
        [].forEach.call(box.children, function(c){
          c.setAttribute('aria-pressed', String(c.getAttribute('data-subject') === sel.subject));
        });
        refreshHome();
      });
      box.appendChild(b);
    });
  }
  function bindGroup(boxId, attr, key, cast){
    var box = $(boxId);
    [].forEach.call(box.children, function(b){
      b.addEventListener('click', function(){
        if(b.disabled) return;
        sel[key] = cast(b.getAttribute(attr));
        [].forEach.call(box.children, function(c){
          c.setAttribute('aria-pressed', String(cast(c.getAttribute(attr)) === sel[key]));
        });
        refreshHome();
      });
    });
  }
  function refreshHome(){
    var base = ALL.filter(function(q){
      return sel.subject === '__all__' || (q.tags && q.tags[0]) === sel.subject;
    });
    var nWeak   = base.filter(function(q){ return isWeak(q.id); }).length;
    var nUnseen = base.filter(function(q){ return isUnseen(q.id); }).length;
    $('cntAll').textContent    = base.length + '問';
    $('cntWeak').textContent   = nWeak + '問';
    $('cntUnseen').textContent = nUnseen + '問';

    var mbox = $('modeOpts');
    mbox.querySelector('[data-mode="weak"]').disabled   = (nWeak === 0);
    mbox.querySelector('[data-mode="unseen"]').disabled = (nUnseen === 0);
    if((sel.mode === 'weak' && nWeak === 0) || (sel.mode === 'unseen' && nUnseen === 0)){
      sel.mode = 'all';
      [].forEach.call(mbox.children, function(c){
        c.setAttribute('aria-pressed', String(c.getAttribute('data-mode') === 'all'));
      });
    }

    var n = pool().length;
    $('cntFullLabel').textContent = n + '問';
    $('btnStart').disabled = (n === 0);
    var use = (sel.count === 0) ? n : Math.min(sel.count, n);
    $('startNote').textContent = (n === 0)
      ? '該当する問題がありません。条件を変えてください。'
      : 'この条件で ' + use + '問 を出題します（' + n + '問から選びます）';
    renderStats();
  }
  function renderStats(){
    var tb = $('statsBody');
    tb.innerHTML = '';
    var rows = [{name:'全科目', list:ALL}];
    SUBJECTS.forEach(function(s){
      rows.push({name:s.name, list:ALL.filter(function(q){ return (q.tags && q.tags[0]) === s.name; })});
    });
    rows.forEach(function(r){
      var o=0, x=0;
      r.list.forEach(function(q){
        var h = HIST[q.id];
        if(h){ o += h.o; x += h.x; }
      });
      var tot = o + x;
      var pct = tot ? Math.round(o/tot*100) : 0;
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + esc(r.name) + '</td>' +
        '<td><div style="display:flex;align-items:center;gap:8px;">' +
          '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
          '<span style="font-size:14px;min-width:38px;text-align:right;">' + (tot ? pct + '%' : '−') + '</span>' +
        '</div></td>' +
        '<td class="num">' + (tot ? tot + '回' : '−') + '</td>';
      tb.appendChild(tr);
    });
  }

  /* ---------- 出題 ---------- */
  function start(list){
    quiz.list = list;
    quiz.idx = 0;
    quiz.results = [];
    show('quiz');
    render();
  }
  function render(){
    var q = quiz.list[quiz.idx];
    quiz.answered = false;

    $('progBar').style.width = (quiz.idx / quiz.list.length * 100) + '%';
    $('pillPos').textContent = (quiz.idx + 1) + ' / ' + quiz.list.length;
    $('pillTopic').textContent = q.topic;
    var isInc = (q.question_type === 'select_incorrect');
    var tp = $('pillType');
    tp.textContent = isInc ? '誤っているものを選ぶ' : '正しいものを選ぶ';
    tp.className = 'pill ' + (isInc ? 'warn' : 'type');
    $('pillDiff').textContent = ['', '基礎', '標準', '応用'][q.difficulty || 2];
    $('qText').textContent = q.question;

    // 選択肢(必要ならシャッフル)。正解は is_correct で追跡する
    var items = q.choices.map(function(c, i){ return {c:c, orig:i}; });
    if(q.shuffle_choices !== false){ items = shuffle(items); }
    q.__view = items;

    var box = $('choices');
    box.innerHTML = '';
    items.forEach(function(it, i){
      var b = document.createElement('button');
      b.className = 'choice';
      b.innerHTML = '<span class="no">' + (i+1) + '</span><span>' + esc(it.c.text) + '</span>';
      b.addEventListener('click', function(){ answer(i); });
      box.appendChild(b);
    });

    $('answerArea').classList.add('hide');
    $('btnNext').textContent = (quiz.idx === quiz.list.length - 1) ? '結果を見る' : '次の問題へ';
  }
  function answer(pick){
    if(quiz.answered) return;
    quiz.answered = true;
    var q = quiz.list[quiz.idx];
    var items = q.__view;
    var ok = !!items[pick].c.is_correct;
    var correctPos = -1;
    items.forEach(function(it, i){ if(it.c.is_correct){ correctPos = i; } });

    var btns = $('choices').children;
    [].forEach.call(btns, function(b, i){
      b.disabled = true;
      if(i === correctPos){ b.classList.add('correct'); }
      else if(i === pick){ b.classList.add('wrong'); }
    });

    var v = $('verdict');
    v.textContent = ok ? '正解' : '不正解　正解は ' + (correctPos + 1) + ' 番です';
    v.className = 'verdict ' + (ok ? 'ok' : 'ng');

    var ul = $('expList');
    ul.innerHTML = '';
    items.forEach(function(it, i){
      var li = document.createElement('li');
      // 「誤っているものを選ぶ」問題では○×が肢の正誤と紛らわしいため、答えの肢だけを明示する
      var mk = it.c.is_correct
        ? (i+1) + '<span class="tag">これが答え</span>'
        : (i+1);
      li.innerHTML = '<span class="mk ' + (it.c.is_correct ? 'o' : 'x') + '">' + mk + '</span>'
                   + esc(it.c.explanation || '');
      ul.appendChild(li);
    });
    $('expTotal').textContent = q.explanation;
    $('answerArea').classList.remove('hide');

    record(q.id, ok);
    quiz.results.push({q:q, ok:ok, pickText:items[pick].c.text, correctText:items[correctPos].c.text});
    $('progBar').style.width = ((quiz.idx + 1) / quiz.list.length * 100) + '%';
    $('answerArea').scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  function next(){
    if(!quiz.answered) return;
    if(quiz.idx < quiz.list.length - 1){ quiz.idx++; render(); }
    else { finish(); }
  }

  /* ---------- 結果 ---------- */
  function finish(){
    var tot = quiz.results.length;
    var ok = quiz.results.filter(function(r){ return r.ok; }).length;
    var pct = tot ? Math.round(ok/tot*100) : 0;
    $('resPct').textContent = pct + '%';
    $('resDetail').textContent = tot + '問中 ' + ok + '問 正解';
    $('resMsg').textContent =
      pct === 100 ? '全問正解です。この調子で進めましょう。' :
      pct >= 80 ? '合格ラインです。間違えた問題を復習しましょう。' :
      pct >= 60 ? 'もう一歩です。解説を読み直しましょう。' :
                  '解説をじっくり読んで、もう一度挑戦しましょう。';

    var wrongs = quiz.results.filter(function(r){ return !r.ok; });
    var wl = $('wrongList');
    wl.innerHTML = '';
    $('wrongCard').classList.toggle('hide', wrongs.length === 0);
    $('btnRetryWrong').disabled = (wrongs.length === 0);
    wrongs.forEach(function(r){
      var d = document.createElement('div');
      d.className = 'review-item';
      d.innerHTML = '<div class="rq">［' + esc(r.q.topic) + '］' + esc(r.q.question) + '</div>'
                  + '<div class="ra">正解：' + esc(r.correctText) + '</div>';
      wl.appendChild(d);
    });
    quiz.wrongQs = wrongs.map(function(r){ return r.q; });
    show('result');
    renderStats();
  }

  /* ---------- 起動 ---------- */
  buildSubjectOpts();
  bindGroup('modeOpts',  'data-mode',  'mode',  function(v){ return v; });
  bindGroup('countOpts', 'data-count', 'count', function(v){ return parseInt(v, 10); });

  $('btnStart').addEventListener('click', function(){
    var p = shuffle(pool());
    if(sel.count > 0){ p = p.slice(0, sel.count); }
    if(p.length){ start(p); }
  });
  $('btnNext').addEventListener('click', next);
  $('btnQuit').addEventListener('click', function(){
    if(quiz.results.length === 0 || confirm('演習を中断してホームへもどります。よろしいですか？')){
      show('home'); refreshHome();
    }
  });
  $('btnHome').addEventListener('click', function(){ show('home'); refreshHome(); });
  $('btnRetryWrong').addEventListener('click', function(){
    if(quiz.wrongQs && quiz.wrongQs.length){ start(shuffle(quiz.wrongQs)); }
  });
  $('btnReset').addEventListener('click', function(){
    if(confirm('これまでの成績をすべて消します。よろしいですか？')){
      HIST = {}; saveHist(HIST); refreshHome();
    }
  });

  refreshHome();
  show('home');

  /* ---------- オフライン対応の状態表示 ---------- */
  window.__swNote = function(msg){
    var el = $('swNote');
    if(!el) return;
    el.textContent = msg;
    el.classList.remove('hide');
  };
})();
</script>
<script>
/* オフラインで使えるようにする仕組み（Service Worker）の登録 */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      function tell() {
        if (navigator.serviceWorker.controller) {
          if (window.__swNote) { window.__swNote('オフライン対応：準備できました。電波がなくても使えます。'); }
        }
      }
      tell();
      navigator.serviceWorker.addEventListener('controllerchange', tell);
      if (!navigator.serviceWorker.controller && window.__swNote) {
        window.__swNote('オフラインで使えるように準備しています…（このまま少しお待ちください）');
      }
    }).catch(function () {
      if (window.__swNote) { window.__swNote('オフライン対応の準備に失敗しました。通信できる場所で開き直してください。'); }
    });
  });
}
</script>
