nation":"誤り。法定地上権が成立するには抵当権設定当時に建物が存在することが必要であり、更地に設定した後に建築された建物のためには成立しない。"},{"text":"抵当権設定当時に土地と建物の所有者が同一であれば、建物の登記名義が前所有者のままであっても、法定地上権は成立し得る。","is_correct":false,"explanation":"正しい記述。判例は、設定当時に土地・建物が実体上同一人に帰属していれば、登記名義が異なっていても法定地上権の成立を認める。"},{"text":"抵当権設定当時に土地上に建物が存在していた場合、その後建物が取り壊されて再築されたときでも、法定地上権が成立することがある。","is_correct":false,"explanation":"正しい記述。判例は、土地に抵当権が設定された場合、原則として旧建物を基準とする範囲で再築建物のための法定地上権の成立を認める。"},{"text":"抵当権設定当時に、土地と建物の所有者が異なっていた場合には、法定地上権は成立しない。","is_correct":false,"explanation":"正しい記述。法定地上権の成立には、抵当権設定当時に土地と建物が同一の所有者に属することが必要である(民法388条)。"}],"explanation":"法定地上権(民法388条)の成立要件は、①抵当権設定当時に土地上に建物が存在すること、②設定当時に土地と建物が同一所有者に属すること、③競売により土地と建物の所有者が異なるに至ったことである。更地に抵当権を設定した後に建築された建物には成立しない。","difficulty":2,"tags":["権利関係","抵当権"],"shuffle_choices":true},{"id":"Q2043","topic":"抵当権","question_type":"select_correct","question":"一括競売及び抵当権消滅請求に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"更地に抵当権が設定された後にその土地上に建物が築造され、抵当権者が土地と建物を一括して競売した場合、抵当権者は土地と建物双方の売却代金から優先弁済を受けることができる。","is_correct":false,"explanation":"一括競売はできるが、抵当権者が優先弁済を受けられるのは土地の代価についてのみである(民法389条1項ただし書)。"},{"text":"更地に抵当権が設定された後にその土地上に建物が築造された場合、抵当権者は、必ず土地と建物を一括して競売しなければならない。","is_correct":false,"explanation":"一括競売は抵当権者の権利であって義務ではなく、土地のみを競売することもできる(民法389条1項)。"},{"text":"抵当権付きの債務の主たる債務者や保証人も、抵当不動産を買い受ければ、抵当権消滅請求をすることができる。","is_correct":false,"explanation":"主たる債務者、保証人及びこれらの承継人は、全額を弁済すべき立場にあるため、抵当権消滅請求をすることができない(民法380条)。"},{"text":"抵当不動産の所有権を取得した第三取得者は、抵当権の実行としての競売による差押えの効力が発生する前であれば、抵当権消滅請求をすることができる。","is_correct":true,"explanation":"正しい。第三取得者は、抵当権の実行としての競売による差押えの効力発生前に限り、抵当権消滅請求をすることができる(民法379条・382条)。"}],"explanation":"更地への抵当権設定後に築造された建物については土地とともに一括競売ができるが、優先弁済は土地の代価に限られる(民法389条)。抵当権消滅請求は第三取得者に認められた制度であり、主たる債務者・保証人はできず(380条)、競売による差押えの効力発生前に行う必要がある(382条)。","difficulty":2,"tags":["権利関係","抵当権"],"shuffle_choices":true},{"id":"Q2044","topic":"抵当権","question_type":"select_incorrect","question":"Aの所有する甲建物には、Bを抵当権者とする抵当権が設定・登記されている。抵当権と賃借人の保護に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":[{"text":"抵当権設定登記後にAから甲建物を賃借し、競売手続の開始前から使用収益をしているCは、競売によりDが甲建物を買い受けた場合、買受けの時から6か月を経過するまでは甲建物をDに引き渡す必要がない。","is_correct":false,"explanation":"正しい記述。抵当権者に対抗できない賃貸借により競売手続開始前から建物を使用する者には、買受けの時から6か月間の明渡猶予が認められる(民法395条1項)。"},{"text":"明渡猶予期間中、Cは買受人Dに対して甲建物の使用の対価を支払う必要はない。","is_correct":true,"explanation":"誤り。賃貸借契約は買受人に承継されないが、Cは建物使用の対価を支払う義務を負う。Dが相当の期間を定めて1か月分以上の対価の支払を催告し、期間内に支払がない場合には明渡猶予は認められない(民法395条2項)。"},{"text":"明渡猶予の制度は建物の賃借人を対象とするものであり、抵当権が設定された土地の賃借人には適用されない。","is_correct":false,"explanation":"正しい記述。民法395条の明渡猶予は建物の賃借人(使用収益をする者)を対象とし、土地の賃借人には適用されない。"},{"text":"抵当権設定登記前に甲建物の引渡しを受けて賃借権の対抗要件を備えていたEは、競売により甲建物が買い受けられた後も、買受人に賃借権を対抗することができる。","is_correct":false,"explanation":"正しい記述。抵当権設定登記前に対抗要件を備えた賃借権は抵当権に優先し、買受人にも対抗できる。"}],"explanation":"抵当権者に対抗できない建物賃借人でも、競売手続開始前から使用収益していれば買受けの時から6か月の明渡猶予を受けられる(民法395条1項)。ただし賃貸借自体は承継されず、使用の対価の支払義務を負い、催告後も支払わなければ猶予は失われる(同条2項)。","difficulty":2,"tags":["権利関係","抵当権"],"shuffle_choices":true},{"id":"Q2045","topic":"根抵当権","question_type":"select_correct","question":"根抵当権に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"元本の確定前においては、根抵当権の被担保債権の範囲や債務者の変更をするに当たり、後順位抵当権者その他の第三者の承諾を得る必要はない。","is_correct":true,"explanation":"正しい。元本確定前は、被担保債権の範囲及び債務者の変更は後順位抵当権者その他の第三者の承諾を要しない(民法398条の4)。"},{"text":"根抵当権の極度額の変更は、元本の確定前であれば、利害関係を有する者の承諾を得ることなく行うことができる。","is_correct":false,"explanation":"極度額の変更は利害関係人に重大な影響を与えるため、その承諾を得なければすることができない(民法398条の5)。"},{"text":"元本の確定前に根抵当権者から被担保債権の範囲に属する個別の債権を譲り受けた者は、その債権について根抵当権を行使することができる。","is_correct":false,"explanation":"元本確定前の根抵当権には随伴性がなく、個別債権の譲受人はその債権について根抵当権を行使できない(民法398条の7第1項)。"},{"text":"元本の確定期日の定めがない場合、根抵当権設定者は、いつでも元本の確定を請求することができ、請求の時に元本が確定する。","is_correct":false,"explanation":"設定者が確定請求できるのは設定の時から3年を経過した後であり、請求から2週間を経過した時に元本が確定する(民法398条の19第1項)。いつでも請求でき請求時に確定するのは根抵当権者である。"}],"explanation":"根抵当権は極度額の限度で一定範囲の不特定の債権を担保する。元本確定前は被担保債権の範囲・債務者の変更に第三者の承諾は不要だが(民法398条の4)、極度額の変更には利害関係人の承諾が必要である(398条の5)。また確定前は随伴性がなく、設定者の確定請求は設定から3年経過後に可能である。","difficulty":3,"tags":["権利関係","根抵当権"],"shuffle_choices":true},{"id":"Q2046","topic":"担保物権","question_type":"select_incorrect","question":"留置権、先取特権及び質権に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":[{"text":"留置権は、目的物を留置することによって債務の弁済を間接的に強制する権利であり、目的物の競売代金から他の債権者に優先して弁済を受ける優先弁済的効力は認められていない。","is_correct":false,"explanation":"正しい記述。留置権には留置的効力はあるが、優先弁済的効力は認められていない。"},{"text":"先取特権には物上代位性が認められ、目的物の売却、賃貸、滅失等によって債務者が受けるべき金銭に対して、その払渡し前に差押えをして権利を行使することができる。","is_correct":false,"explanation":"正しい記述。先取特権には物上代位性が認められる(民法304条)。"},{"text":"留置権には物上代位性が認められており、目的物が滅失して債務者が損害賠償請求権を取得した場合、留置権者はこれに対して権利を行使することができる。","is_correct":true,"explanation":"誤り。留置権は優先弁済的効力を持たないため、物上代位性は認められていない。物上代位が認められるのは先取特権・質権・抵当権である。"},{"text":"不動産質権者は、設定行為に別段の定めがある場合を除き、質物である不動産を使用収益することができる一方、被担保債権の利息を請求することができない。","is_correct":false,"explanation":"正しい記述。不動産質権者は目的不動産の用法に従い使用収益できる(民法356条)反面、別段の定めがない限り利息を請求できない(358条・359条)。"}],"explanation":"物上代位性は優先弁済的効力を前提とする性質であり、先取特権・質権・抵当権には認められるが、優先弁済的効力のない留置権には認められない。不動産質権では、質権者に使用収益権が認められる代わりに、原則として利息を請求できない。","difficulty":2,"tags":["権利関係","担保物権"],"shuffle_choices":true},{"id":"Q2047","topic":"連帯債務","question_type":"select_correct","question":"A・B・Cの3人は、Dに対して900万円の連帯債務を負っており、負担部分は各自平等である。この場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"DがAに対して履行の請求をした場合、その効力はB及びCにも及び、B及びCについても時効の完成が猶予される。","is_correct":false,"explanation":"履行の請求は相対的効力事由であり、別段の合意がない限り、他の連帯債務者B・Cには効力が及ばない(民法441条)。"},{"text":"DがAに対して債務の全部を免除した場合、B及びCも、Aの負担部分である300万円について債務を免れる。","is_correct":false,"explanation":"免除は相対的効力事由であり、B・CはなおDに対して900万円全額の債務を負う(民法441条)。"},{"text":"AがDに対して有する900万円の反対債権をもって相殺の意思表示をした場合、B及びCの債務も全額消滅する。","is_correct":true,"explanation":"正しい。相殺は弁済と同様に債権を消滅させるため絶対的効力事由であり、Aの相殺によりB・Cの債務も消滅する(民法439条1項)。"},{"text":"AがDを相続して混同が生じた場合でも、その効力はB及びCには一切及ばず、B及びCはDの相続人であるAに対して900万円全額の債務を負い続ける。","is_correct":false,"explanation":"混同は絶対的効力事由であり、Aは弁済をしたものとみなされる(民法440条)。B・Cが900万円全額の連帯債務を負い続けるわけではなく、AはB・Cに負担部分に応じた求償ができるにとどまる。"}],"explanation":"連帯債務における絶対的効力事由は、弁済のほか更改(民法438条)、相殺(439条1項)、混同(440条)である。履行の請求、免除、時効の完成は相対的効力事由とされ、原則として他の連帯債務者に効力が及ばない(441条)。","difficulty":2,"tags":["権利関係","連帯債務"],"shuffle_choices":true},{"id":"Q2048","topic":"連帯債務","question_type":"select_correct","question":"A・B・Cの3人は、Dに対して900万円の連帯債務を負っており、負担部分は各自平等である。連帯債務者間の求償に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"AがDに90万円を弁済した場合、弁済額が自己の負担部分300万円を超えていないため、AはB及びCに対して求償することができない。","is_correct":false,"explanation":"自己の負担部分を超えない弁済であっても、共同の免責を得た額のうち各自の負担部分に応じた額を求償できる(民法442条1項)。"},{"text":"AがDに90万円を弁済した場合、Aは、B及びCに対してそれぞれ30万円を求償することができる。","is_correct":true,"explanation":"正しい。弁済額が負担部分を超えるかどうかにかかわらず、免責を得た額90万円について負担部分の割合(各3分の1)に応じ、B・Cに各30万円を求償できる(民法442条1項)。"},{"text":"AがDに900万円全額を弁済したが、Cが無資力であった場合、Cの負担部分300万円は債権者Dが負担する。","is_correct":false,"explanation":"償還をする資力のない者の負担部分は、求償者及び他の資力のある者の間で各自の負担部分に応じて分割して負担する(民法444条1項)。債権者が負担するのではない。"},{"text":"Aが、B及びCに通知せずにDに900万円全額を弁済した場合でも、Aの求償権は何らの制限も受けない。","is_correct":false,"explanation":"他の連帯債務者があることを知りながら事前の通知をせずに弁済した場合、他の債務者は債権者に対抗できた事由をもって求償者に対抗でき、求償が制限されることがある(民法443条)。"}],"explanation":"連帯債務者の一人が弁済等により共同の免責を得たときは、その額が自己の負担部分を超えなくても、他の債務者に対し負担部分の割合に応じて求償できる(民法442条1項)。無資力者の負担部分は資力のある者の間で分担し(444条)、通知を怠った場合には求償が制限され得る(443条)。","difficulty":2,"tags":["権利関係","連帯債務"],"shuffle_choices":true},{"id":"Q2049","topic":"保証","question_type":"select_incorrect","question":"保証債務に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":[{"text":"保証契約は、書面又は電磁的記録によってしなければ、その効力を生じない。","is_correct":false,"explanation":"正しい記述。保証契約は書面でしなければ効力を生じず、電磁的記録による場合は書面によってされたものとみなされる(民法446条2項・3項)。"},{"text":"債権者が主たる債務者に対して裁判上の請求をしたことによる時効の完成猶予及び更新は、保証人に対しても、その効力を生ずる。","is_correct":false,"explanation":"正しい記述。主たる債務者に対する履行の請求その他の事由による時効の完成猶予・更新は、保証人に対しても効力を生ずる(民法457条1項)。"},{"text":"連帯保証人は、債権者から履行の請求を受けたときであっても、催告の抗弁権及び検索の抗弁権を主張することができない。","is_correct":false,"explanation":"正しい記述。連帯保証人には催告の抗弁権・検索の抗弁権が認められない(民法454条)。"},{"text":"連帯保証ではない通常の保証人は、主たる債務者に弁済をする資力があり、かつ、執行が容易であることを証明しても、債権者からの請求を拒むことができない。","is_correct":true,"explanation":"誤り。通常の保証人は、主たる債務者に弁済の資力があり執行が容易であることを証明すれば、まず主たる債務者の財産に執行するよう主張できる(検索の抗弁権、民法453条)。"}],"explanation":"保証債務には付従性・補充性があり、通常の保証人には催告の抗弁権(民法452条)と検索の抗弁権(453条)が認められるが、連帯保証人にはいずれも認められない(454条)。また、保証契約は書面によらなければ効力を生じない(446条2項)。","difficulty":1,"tags":["権利関係","保証"],"shuffle_choices":true},{"id":"Q2050","topic":"保証","question_type":"select_correct","question":"個人が保証人となる場合の保証契約に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"個人Aが、Bの賃貸借契約から生ずる一切の債務を保証する根保証契約を締結する場合、書面で極度額を定めなければ、その保証契約は効力を生じない。","is_correct":true,"explanation":"正しい。個人根保証契約は、極度額を定めなければ効力を生じず(民法465条の2第2項)、極度額の定めは保証契約の書面等に記載しなければならない(同条3項)。"},{"text":"保証人が法人である根保証契約においても、極度額を定めなければ、その保証契約は効力を生じない。","is_correct":false,"explanation":"極度額の定めが効力要件とされるのは保証人が個人である根保証契約(個人根保証契約)であり、法人が保証人となる場合には適用されない(民法465条の2第1項)。"},{"text":"事業のために負担した貸金債務を個人Aが保証する場合、保証契約の締結後1か月以内に公正証書で保証意思を表示すれば、その保証契約は有効となる。","is_correct":false,"explanation":"保証意思宣明公正証書は、保証契約の締結に先立ち、締結の日前1か月以内に作成されなければならない(民法465条の6第1項)。締結後の作成では無効である。"},{"text":"主たる債務者が株式会社である場合に、その取締役が事業のために負担した貸金債務を保証するときも、公正証書による保証意思の表示がなければ保証契約は効力を生じない。","is_correct":false,"explanation":"主たる債務者が法人である場合のその理事、取締役等が保証人となるときは、公正証書作成の規定は適用されない(民法465条の9)。"}],"explanation":"個人根保証契約では極度額の書面による定めが効力要件である(民法465条の2)。また、事業のために負担した貸金等債務の個人保証では、契約締結前1か月以内に作成された公正証書による保証意思の表示が必要だが(465条の6)、主債務者が法人の場合の取締役等には適用されない(465条の9)。","difficulty":3,"tags":["権利関係","保証"],"shuffle_choices":true},{"id":"Q2051","topic":"賃貸借","question_type":"select_incorrect","question":"Aは、自己所有の甲土地(建物所有目的ではなく資材置場として利用するもので、借地借家法の適用はない)をBに賃貸している。この場合に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":[{"text":"AB間で賃貸借の存続期間を60年と定めた場合、その期間は50年に短縮される。","is_correct":false,"explanation":"正しい記述。民法上の賃貸借の存続期間は50年を超えることができず、これより長い期間を定めても50年となる(民法604条1項)。"},{"text":"Bが甲土地の賃借権の対抗要件を備えている場合において、AがCに甲土地を譲渡したときは、賃貸人の地位は原則として当然にCに移転し、Bの承諾は不要である。","is_correct":false,"explanation":"正しい記述。対抗要件を備えた不動産賃借権の目的不動産が譲渡されると、賃貸人の地位は原則として譲受人に移転し、賃借人の承諾は不要である(民法605条の2第1項)。"},{"text":"賃貸人の地位がAからCに移転した場合、Cは、甲土地の所有権移転登記を備えていなくても、Bに対して賃貸人の地位を主張して賃料を請求することができる。","is_correct":true,"explanation":"誤り。賃貸人たる地位の移転は、賃貸物である不動産について所有権移転登記をしなければ賃借人に対抗できない(民法605条の2第3項)。"},{"text":"Bが対抗要件を備えていない場合でも、AとCの合意により、Bの承諾を得ることなく、賃貸人の地位をCに移転させることができる。","is_correct":false,"explanation":"正しい記述。不動産の譲渡人と譲受人の合意により賃貸人の地位を移転でき、賃借人の承諾を要しない(民法605条の3)。"}],"explanation":"民法上の賃貸借の存続期間の上限は50年である(民法604条)。対抗要件を備えた賃借不動産が譲渡されると賃貸人の地位は当然に移転するが(605条の2第1項)、譲受人がその地位を賃借人に対抗するには所有権移転登記が必要である(同条3項)。","difficulty":2,"tags":["権利関係","賃貸借"],"shuffle_choices":true},{"id":"Q2052","topic":"賃貸借","question_type":"select_correct","question":"Aは、自己所有の甲建物をBに賃貸し、BはAに敷金を交付している。この場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"賃貸借が終了した場合、Bは、敷金の返還を受けるまで甲建物の明渡しを拒むことができる。","is_correct":false,"explanation":"敷金返還債務は明渡しが完了した時に発生するため(民法622条の2第1項1号)、明渡しが先履行であり、両者は同時履行の関係に立たない。"},{"text":"Bは、賃料の支払を延滞した場合、Aに対し、敷金をその延滞賃料の弁済に充てるよう請求することができる。","is_correct":false,"explanation":"賃貸人は敷金を債務の弁済に充てることができるが、賃借人の側から充当を請求することはできない(民法622条の2第2項)。"},{"text":"BがAの承諾を得て賃借権をCに譲渡した場合、Bが交付した敷金に関する権利義務は、特段の合意がなくても当然に新賃借人Cに承継される。","is_correct":false,"explanation":"賃借権が適法に譲渡された場合、敷金に関する権利義務は特段の合意がない限り新賃借人に承継されない(民法622条の2第1項2号、判例)。"},{"text":"甲建物がAからDに譲渡され賃貸人の地位がDに移転した場合、敷金の返還債務は、Bの未払賃料等があればこれを控除した残額について、Dに承継される。","is_correct":true,"explanation":"正しい。賃貸人たる地位が移転した場合、敷金返還債務は未払賃料債務等に充当された後の残額について新賃貸人に承継される(民法605条の2第4項、判例)。"}],"explanation":"敷金の返還債務は賃貸借終了かつ明渡し完了時に発生し、明渡しが先履行である(民法622条の2第1項)。賃借人からの充当請求はできず、賃借権譲渡の際は新賃借人に承継されないが、賃貸人の地位が移転した場合には残額が新賃貸人に承継される(605条の2第4項)。","difficulty":1,"tags":["権利関係","賃貸借"],"shuffle_choices":true},{"id":"Q2053","topic":"賃貸借","question_type":"select_incorrect","question":"Aは、自己所有の甲建物をBに賃貸し、BはCに甲建物を転貸している。この場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":[{"text":"BがAに無断で転貸した場合であっても、その転貸がAに対する背信行為と認めるに足りない特段の事情があるときは、Aは無断転貸を理由に賃貸借契約を解除することができない。","is_correct":false,"explanation":"正しい記述。判例は、無断転貸が背信行為と認めるに足りない特段の事情がある場合には、民法612条2項による解除を認めない。"},{"text":"Aの承諾を得た適法な転貸の場合において、AとBが賃貸借契約を合意解除したときは、Aは、原則としてその解除をもってCに対抗し、甲建物の明渡しを請求することができる。","is_correct":true,"explanation":"誤り。賃貸人と賃借人が賃貸借を合意解除しても、原則としてその解除を転借人に対抗できない(民法613条3項本文)。解除当時、債務不履行による解除権を有していた場合は別である。"},{"text":"Aの承諾を得た適法な転貸の場合において、Bの賃料不払を理由にAが賃貸借契約を解除したときは、Aはその解除をCに対抗することができる。","is_correct":false,"explanation":"正しい記述。債務不履行を理由とする解除は転借人に対抗でき、判例上、転貸借は原則として賃貸人が転借人に目的物の返還を請求した時に履行不能により終了する。"},{"text":"Aの承諾を得た適法な転貸の場合、Cは、AとBとの間の賃貸借に基づくBの債務の範囲を限度として、Aに対して転貸借に基づく債務を直接履行する義務を負い、転借料の前払をもってAに対抗することができない。","is_correct":false,"explanation":"正しい記述。転借人は賃貸人に対して直接履行義務を負い、賃料の前払をもって賃貸人に対抗できない(民法613条1項)。"}],"explanation":"無断転貸による解除は背信行為と認めるに足りない特段の事情がある場合には認められない(判例)。適法な転貸の場合、賃貸借の合意解除は原則として転借人に対抗できないが(民法613条3項)、債務不履行解除は転借人に対抗できる。","difficulty":2,"tags":["権利関係","賃貸借"],"shuffle_choices":true},{"id":"Q2054","topic":"賃貸借","question_type":"select_correct","question":"建物の賃貸借における費用の償還及び原状回復に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"賃借人が雨漏りの修繕費用など賃貸人の負担に属する必要費を支出したときは、賃借人は、賃貸借の終了を待つことなく、直ちに賃貸人にその償還を請求することができる。","is_correct":true,"explanation":"正しい。賃借人が必要費を支出したときは、賃貸人に対し直ちにその償還を請求できる(民法608条1項)。"},{"text":"賃借人が有益費を支出したときは、賃借人は、支出後直ちに、支出した金額の全額の償還を賃貸人に請求することができる。","is_correct":false,"explanation":"有益費は賃貸借終了の時に、価格の増加が現存する場合に限り、賃貸人の選択により支出額又は増価額の償還を請求できる(民法608条2項)。直ちに全額請求できるのではない。"},{"text":"賃借人は、賃貸借終了時に、通常の使用収益によって生じた賃借物の損耗や経年変化についても、原状に復する義務を負う。","is_correct":false,"explanation":"通常損耗及び経年変化は原状回復義務の対象から除外されている(民法621条括弧書)。"},{"text":"賃借物に生じた損傷が賃借人の責めに帰することができない事由によるものであっても、賃借人は原状回復義務を負う。","is_correct":false,"explanation":"損傷が賃借人の責めに帰することができない事由によるものであるときは、賃借人は原状回復義務を負わない(民法621条ただし書)。"}],"explanation":"必要費は直ちに、有益費は賃貸借終了時に増価が現存する場合に賃貸人の選択に従い償還請求できる(民法608条)。原状回復義務は通常損耗・経年変化を含まず、賃借人に帰責事由のない損傷についても負わない(621条)。","difficulty":1,"tags":["権利関係","賃貸借"],"shuffle_choices":true},{"id":"Q2055","topic":"借地借家法(借地)","question_type":"select_correct","question":"Aは、建物の所有を目的として、Bの所有する甲土地を賃借しようとしている(定期借地権等の特殊な借地権は設定しない)。借地権の存続期間に関する次の記述のうち、借地借家法の規定によれば、正しいものはどれか。","choices":[{"text":"AB間で存続期間を定めなかった場合、借地権の存続期間は20年となる。","is_correct":false,"explanation":"期間を定めなかった場合の借地権の存続期間は30年である(借地借家法3条)。"},{"text":"AB間で存続期間を20年と定めた場合、その定めは有効であり、存続期間は20年となる。","is_correct":false,"explanation":"30年より短い期間を定めても、借地権者に不利な定めとして効力を有せず、存続期間は30年となる(借地借家法3条・9条)。"},{"text":"AB間で存続期間を40年と定めた場合、その定めは有効であり、存続期間は40年となる。","is_correct":true,"explanation":"正しい。借地借家法3条は30年より長い期間を定めた場合はその期間によるとしており、40年の定めは有効である。"},{"text":"借地権が最初に更新された場合の更新後の存続期間は、当事者の合意がない限り10年である。","is_correct":false,"explanation":"最初の更新後の期間は20年、2回目以降の更新後の期間は10年である(借地借家法4条)。これより長い期間の合意は有効である。"}],"explanation":"普通借地権の存続期間は30年であり、契約でこれより長い期間を定めたときはその期間による(借地借家法3条)。30年未満の定めは無効で30年となる。更新後の期間は最初の更新が20年、2回目以降が10年である(4条)。","difficulty":1,"tags":["権利関係","借地借家法"],"shuffle_choices":true},{"id":"Q2056","topic":"借地借家法(借地)","question_type":"select_incorrect","question":"借地権の更新に関する次の記述のうち、借地借家法の規定によれば、誤っているものはどれか。","choices":[{"text":"存続期間の満了時に借地上に建物が存在しない場合には、借地権者が契約の更新を請求しても、請求による更新は生じない。","is_correct":false,"explanation":"正しい記述。更新請求による法定更新は、期間満了時に建物が存在する場合に限り認められる(借地借家法5条1項)。"},{"text":"借地権者が契約の更新を請求した場合でも、借地権設定者が遅滞なく異議を述べ、その異議に正当の事由があるときは、契約は更新されない。","is_correct":false,"explanation":"正しい記述。借地権設定者が遅滞なく正当事由のある異議を述べたときは更新されない(借地借家法5条1項ただし書・6条)。"},{"text":"異議の正当事由の有無は、当事者双方が土地の使用を必要とする事情のほか、借地に関する従前の経過、土地の利用状況、財産上の給付(立退料)の申出などを考慮して判断される。","is_correct":false,"explanation":"正しい記述。借地借家法6条は、双方の土地使用の必要性を基本に、従前の経過、利用状況、財産上の給付の申出を考慮して正当事由を判断すると定める。"},{"text":"存続期間満了後、借地上に建物が存在する状態で借地権者が土地の使用を継続している場合でも、借地権設定者が異議を述べない限り借地契約は期間満了により当然に終了する。","is_correct":true,"explanation":"誤り。建物がある場合に借地権者が使用を継続し、借地権設定者が遅滞なく異議を述べないときは、契約は従前と同一の条件で更新されたものとみなされる(借地借家法5条2項)。当然に終了するのではない。"}],"explanation":"借地契約の法定更新には、更新請求による更新と使用継続による更新があり、いずれも期間満了時に建物が存在することが要件である(借地借家法5条)。借地権設定者が更新を拒むには、遅滞なく異議を述べ、かつその異議に正当事由が必要である(6条)。","difficulty":2,"tags":["権利関係","借地借家法"],"shuffle_choices":true},{"id":"Q2057","topic":"借地借家法(借地)","question_type":"select_correct","question":"借地権者Aが借地権設定者Bの所有する甲土地上に乙建物を所有している場合の建物買取請求権に関する次の記述のうち、借地借家法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"建物買取請求権は、借地契約が更新された場合においても行使することができる。","is_correct":false,"explanation":"建物買取請求権は、存続期間が満了し契約の更新がない場合に認められる(借地借家法13条1項)。更新された場合には行使できない。"},{"text":"存続期間が満了し契約の更新がない場合、Aは、Bに対し乙建物を時価で買い取るよう請求することができ、この請求権は形成権であるから、Aの意思表示によりBの承諾がなくても売買契約が成立したのと同様の効果が生ずる。","is_correct":true,"explanation":"正しい。建物買取請求権(借地借家法13条1項)は形成権であり、借地権者の一方的意思表示により時価による売買契約成立と同様の効果が生ずる。"},{"text":"Aの賃料不払を理由として借地契約が解除された場合であっても、Aは建物買取請求権を行使することができる。","is_correct":false,"explanation":"判例は、借地権者の債務不履行により契約が解除された場合には、建物買取請求権の行使を認めていない。"},{"text":"建物買取請求権が行使された場合の買取価格は、乙建物の建築に要した費用の額である。","is_correct":false,"explanation":"買取価格は建築費用ではなく、請求権行使時における建物の時価である(借地借家法13条1項)。"}],"explanation":"建物買取請求権(借地借家法13条)は、存続期間満了により契約の更新がない場合に借地権者が建物を時価で買い取るよう請求できる形成権であり、行使により当然に売買と同様の効果が生ずる。債務不履行解除の場合には行使できないとするのが判例である。","difficulty":2,"tags":["権利関係","借地借家法"],"shuffle_choices":true},{"id":"Q2058","topic":"借地借家法(借地)","question_type":"select_incorrect","question":"借地権の対抗力に関する次の記述のうち、借地借家法の規定及び判例によれば、誤っているものはどれか。","choices":[{"text":"借地権者Aが借地上の建物についてAの長男名義で保存登記をしている場合でも、Aは、借地権を第三者に対抗することができる。","is_correct":true,"explanation":"誤り。判例は、借地上の建物の登記は借地権者自身の名義であることを要し、家族など他人名義の登記では対抗力が認められないとする。"},{"text":"借地権の登記がされていなくても、借地権者が借地上に自己名義で登記された建物を所有していれば、借地権を第三者に対抗することができる。","is_correct":false,"explanation":"正しい記述。借地上に借地権者名義の登記ある建物を所有するときは、借地権自体の登記がなくても第三者に対抗できる(借地借家法10条1項)。"},{"text":"登記されていた借地上の建物が滅失した場合でも、借地権者が建物を特定するために必要な事項等を土地の見やすい場所に掲示すれば、滅失の日から2年間は借地権を第三者に対抗することができる。","is_correct":false,"explanation":"正しい記述。建物滅失の場合、一定事項の掲示により滅失日から2年間対抗力が維持される(借地借家法10条2項)。"},{"text":"借地上の建物の登記は、権利に関する登記ではなく表示に関する登記(表題登記)であっても、借地権の対抗力が認められる。","is_correct":false,"explanation":"正しい記述。判例は、借地権者名義の表示に関する登記(表題登記)であっても対抗力を認めている。"}],"explanation":"借地権は、その登記がなくても借地上の登記ある建物の所有により第三者に対抗できる(借地借家法10条1項)。ただし判例上、建物の登記は借地権者自身の名義であることが必要であり、配偶者や子など他人名義では対抗力が認められない。","difficulty":2,"tags":["権利関係","借地借家法"],"shuffle_choices":true},{"id":"Q2059","topic":"借地借家法(借地)","question_type":"select_correct","question":"地代等の増減額請求に関する次の記述のうち、借地借家法の規定によれば、正しいものはどれか。なお、定期借地権に関する特則は考慮しないものとする。","choices":[{"text":"一定の期間、地代を増額しない旨の特約がある場合でも、借地権設定者は、経済事情の変動を理由にその期間中に地代の増額を請求することができる。","is_correct":false,"explanation":"増額しない旨の特約は借地権者に有利であるため有効であり、その定めに反して期間中に増額請求することはできない(借地借家法11条1項ただし書)。"},{"text":"一定の期間、地代を減額しない旨の特約がある場合には、借地権者は、その期間中は地代の減額を請求することができない。","is_correct":false,"explanation":"減額しない旨の特約は借地権者に不利な定めであり、借地権者はこの特約にかかわらず減額請求ができると解されている。"},{"text":"地代の増額請求を受けた借地権者は、増額の裁判が確定するまでの間、地代の支払を一切拒むことができる。","is_correct":false,"explanation":"増額について当事者間に協議が調わないときは、借地権者は裁判確定までは自己が相当と認める額の地代を支払えば足りるのであり、支払を拒めるわけではない(借地借家法11条2項)。"},{"text":"地代の増額請求について裁判が確定した場合において、既に支払った額に不足があるときは、借地権者は、その不足額に年1割の割合による支払期後の利息を付して支払わなければならない。","is_correct":true,"explanation":"正しい。増額の裁判確定時に既払額に不足があるときは、不足額に年1割の利息を付して支払わなければならない(借地借家法11条2項ただし書)。"}],"explanation":"地代等増減額請求権(借地借家法11条)では、増額しない特約は有効だが、減額しない特約は借地権者に不利なため借地権者を拘束しない。増額請求を受けた借地権者は相当と認める額を支払えば足り、裁判確定後に不足があれば年1割の利息を付して支払う。","difficulty":2,"tags":["権利関係","借地借家法"],"shuffle_choices":true},{"id":"Q2060","topic":"借地借家法(借地)","question_type":"select_incorrect","question":"定期借地権等に関する次の記述のうち、借地借家法の規定によれば、誤っているものはどれか。","choices":[{"text":"一般定期借地権は、存続期間を50年以上として設定する必要があり、契約の更新等をしない旨の特約は、公正証書による等書面(又は電磁的記録)によってしなければならない。","is_correct":false,"explanation":"正しい記述。一般定期借地権は存続期間50年以上で、更新等をしない特約は書面又は電磁的記録によることを要する(借地借家法22条)。公正証書に限られない。"},{"text":"事業用定期借地権の設定を目的とする契約は、公正証書以外の書面によってすることもできる。","is_correct":true,"explanation":"誤り。事業用定期借地権等の設定を目的とする契約は、公正証書によってしなければならない(借地借家法23条3項)。他の書面では代用できない。"},{"text":"事業用定期借地権は、専ら事業の用に供する建物(居住の用に供するものを除く)の所有を目的とし、存続期間を10年以上50年未満として設定するものである。","is_correct":false,"explanation":"正しい記述。事業用定期借地権等は、専ら事業用建物(居住用を除く)の所有を目的とし、存続期間は10年以上50年未満である(借地借家法23条)。"},{"text":"建物譲渡特約付借地権は、借地権設定後30年以上を経過した日に、借地上の建物を相当の対価で借地権設定者に譲渡する旨を定めることにより設定することができる。","is_correct":false,"explanation":"正しい記述。建物譲渡特約付借地権は、設定後30年以上経過した日に建物を相当の対価で譲渡する旨の特約により借地権を消滅させるものである(借地借家法24条)。"}],"explanation":"定期借地権には、一般定期借地権(50年以上・書面又は電磁的記録)、事業用定期借地権等(10年以上50年未満・公正証書必須)、建物譲渡特約付借地権(30年以上経過日に建物譲渡)の3種類がある。公正証書が必須なのは事業用定期借地権等のみである。","difficulty":1,"tags":["権利関係","借地借家法"],"shuffle_choices":true},{"id":"Q2061","topic":"請負","question_type":"select_correct","question":"Aを注文者、Bを請負人として、住宅の建築工事の請負契約が締結された。この場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"完成した住宅に契約不適合があった場合、その不適合がAの供した材料の性質によって生じたものであっても、Bは常に担保責任を負う。","is_correct":false,"explanation":"注文者の供した材料の性質又は注文者の与えた指図により生じた不適合については、原則として注文者は担保責任を追及できない(民法636条本文)。"},{"text":"Aは、住宅の契約不適合を知った時から2年以内にその旨をBに通知しなければ、担保責任を追及することができない。","is_correct":false,"explanation":"通知期間は不適合を知った時から1年以内である(民法637条1項)。2年ではない。"},{"text":"契約不適合がAの与えた指図によって生じた場合でも、Bがその指図が不適当であることを知りながらAに告げなかったときは、Aは担保責任を追及することができる。","is_correct":true,"explanation":"正しい。民法636条ただし書により、請負人が材料又は指図の不適当を知りながら告げなかったときは、注文者は担保責任を追及できる。"},{"text":"建物その他の土地の工作物の請負契約においては、契約不適合があっても、注文者は契約を解除することができない。","is_correct":false,"explanation":"土地の工作物について解除を制限する旧規定は削除されており、現行法では建物の請負契約でも債務不履行の一般原則に従って解除ができる。"}],"explanation":"請負人の担保責任について、注文者の供した材料や指図により生じた不適合は原則として追及できないが、請負人がその不適当を知りながら告げなかった場合は別である(民法636条)。担保責任追及には不適合を知った時から1年以内の通知が必要であり(637条)、建物請負でも解除は可能である。","difficulty":2,"tags":["権利関係","請負"],"shuffle_choices":true},{"id":"Q2062","topic":"請負","question_type":"select_incorrect","question":"Aを注文者、Bを請負人とする請負契約に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":[{"text":"Aは、Bが仕事を完成しない間であっても、Bに債務不履行がない限り、請負契約を解除することができない。","is_correct":true,"explanation":"誤り。注文者は、請負人が仕事を完成しない間は、いつでも損害を賠償して契約を解除することができる(民法641条)。請負人の債務不履行は不要である。"},{"text":"Aの責めに帰することができない事由によって仕事の完成が不能となった場合でも、既にした仕事の結果のうち可分な部分の給付によってAが利益を受けるときは、Bはその利益の割合に応じて報酬を請求することができる。","is_correct":false,"explanation":"正しい記述。仕事完成前の履行不能等の場合でも、可分な部分の給付により注文者が利益を受けるときは、その部分は仕事の完成とみなされ、割合に応じた報酬請求ができる(民法634条)。"},{"text":"報酬は、特約がない限り、仕事の目的物の引渡しと同時に支払わなければならない。","is_correct":false,"explanation":"正しい記述。報酬は仕事の目的物の引渡しと同時に支払うことを要する(民法633条)。報酬は後払が原則である。"},{"text":"Aが破産手続開始の決定を受けたときは、Bが仕事を完成しない間は、B又は破産管財人は契約の解除をすることができる。","is_correct":false,"explanation":"正しい記述。注文者が破産手続開始の決定を受けたときは、請負人又は破産管財人は契約を解除できる(民法642条1項)。"}],"explanation":"注文者は仕事完成前であればいつでも損害を賠償して契約を解除でき(民法641条)、請負人の帰責事由は不要である。また、注文者に帰責事由なく完成不能となった場合等でも割合的報酬の請求が認められる(634条)。","difficulty":1,"tags":["権利関係","請負"],"shuffle_choices":true},{"id":"Q2063","topic":"共有","question_type":"select_correct","question":"A・B・Cの3人は、甲建物を各3分の1の持分で共有している。この場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"甲建物の増築など、その形状又は効用の著しい変更を伴う変更を加えるには、A・B・Cの持分の価格の過半数の同意があれば足りる。","is_correct":false,"explanation":"軽微な変更を除く共有物の変更には、共有者全員の同意が必要である(民法251条1項)。持分の過半数では足りない。"},{"text":"甲建物の外壁の修繕など、その形状又は効用の著しい変更を伴わない変更(軽微な変更)は、A・B・Cの持分の価格の過半数で決することができる。","is_correct":true,"explanation":"正しい。形状又は効用の著しい変更を伴わない変更(軽微な変更)は、管理に関する事項として持分の価格の過半数で決することができる(民法251条1項括弧書・252条1項)。"},{"text":"Aが単独で甲建物を使用している場合、甲建物の管理に関する事項を決するには、使用者であるAの同意を得なければならない。","is_correct":false,"explanation":"共有物を使用する共有者がいる場合でも、管理に関する事項は持分の価格の過半数で決することができる(民法252条1項後段)。使用者の同意は要件ではない。"},{"text":"甲建物の不法占拠者に対する妨害排除の請求などの保存行為も、持分の価格の過半数で決しなければ行うことができない。","is_correct":false,"explanation":"保存行為は各共有者が単独ですることができる(民法252条5項)。"}],"explanation":"令和3年改正後の民法では、共有物の変更のうち形状又は効用の著しい変更を伴わないもの(軽微変更)は持分の価格の過半数で決することができ(251条1項・252条1項)、共有物を使用する共有者がいても同様である。保存行為は各共有者が単独で行える。","difficulty":1,"tags":["権利関係","共有"],"shuffle_choices":true},{"id":"Q2064","topic":"共有","question_type":"select_incorrect","question":"A・B・Cの3人が甲土地を共有している場合に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":[{"text":"Cが必要な調査を尽くしても氏名等や所在を知ることができない所在等不明共有者である場合、A・Bは、裁判所の裁判を得て、C以外の共有者の同意により甲土地に変更を加えることができる。","is_correct":false,"explanation":"正しい記述。裁判所は、所在等不明共有者以外の共有者の同意を得て変更を加えることができる旨の裁判をすることができる(民法251条2項)。"},{"text":"Cが所在等不明共有者である場合、Aは、裁判所の裁判を得て、Cの持分の時価相当額を供託するなどの手続を経て、Cの持分を取得することができる。","is_correct":false,"explanation":"正しい記述。不動産の共有者は、裁判所の裁判により所在等不明共有者の持分を取得することができる(民法262条の2)。"},{"text":"A・B・Cは、5年を超えない期間内であれば甲土地を分割しない旨の契約をすることができ、この契約は更新することもできるが、更新後の期間も更新の時から5年を超えることができない。","is_correct":false,"explanation":"正しい記述。共有者は5年を超えない期間内で不分割特約をすることができ、更新も可能だが更新の時から5年を超えられない(民法256条)。"},{"text":"Aは、自己の持分を第三者に譲渡するには、B及びCの同意を得なければならない。","is_correct":true,"explanation":"誤り。各共有者は、自己の持分を他の共有者の同意なく自由に処分(譲渡・担保設定等)することができる。共有物全体の処分と異なり、持分の処分に他の共有者の同意は不要である。"}],"explanation":"共有持分の処分は各共有者の自由であり、他の共有者の同意を要しない。令和3年改正により、所在等不明共有者がいる場合には、裁判所の裁判を経て残りの共有者の同意で変更を加えることや(民法251条2項)、その持分を取得すること(262条の2)が可能となった。","difficulty":3,"tags":["権利関係","共有"],"shuffle_choices":true},{"id":"Q2065","topic":"借地借家法(借家)","question_type":"select_correct","question":"建物の賃貸借に対する借地借家法の適用に関する次の記述のうち、借地借家法の規定によれば、正しいものはどれか。","choices":[{"text":"建物の使用貸借にも、借地借家法の借家に関する規定が適用される。","is_correct":false,"explanation":"借地借家法の借家に関する規定が適用されるのは建物の「賃貸借」であり、無償で貸借する使用貸借には適用されない。"},{"text":"借地借家法の借家に関する規定は、事業用の建物には適用されず、居住用の建物にのみ適用される。","is_correct":false,"explanation":"借家に関する規定は建物の用途を問わず適用される。店舗や事務所などの事業用建物の賃貸借も対象となる。"},{"text":"一時使用のために建物を賃借したことが明らかな場合には、借地借家法の借家に関する規定は適用されない。","is_correct":true,"explanation":"借地借家法40条により、一時使用目的であることが明らかな建物賃貸借には同法の借家の規定は適用されず、民法の規定によることになる。"},{"text":"一時使用のために建物を賃借したことが明らかな場合でも、賃借人は借地借家法に基づく造作買取請求権を行使することができる。","is_correct":false,"explanation":"一時使用目的の建物賃貸借には借地借家法の規定が適用されないため、同法33条の造作買取請求権も行使できない。"}],"explanation":"借地借家法40条は、一時使用のために建物の賃貸借をしたことが明らかな場合には同法第3章(借家)の規定を適用しないと定める。借家の規定は建物の用途を問わず賃貸借に適用されるが、使用貸借や一時使用目的の賃貸借は対象外である点を押さえたい。","difficulty":1,"tags":["権利関係","借地借家法"],"shuffle_choices":true},{"id":"Q2066","topic":"借地借家法(借家)","question_type":"select_incorrect","question":"建物の賃貸借の期間等に関する次の記述のうち、借地借家法の規定によれば、誤っているものはどれか。","choices":[{"text":"期間を6か月と定めた建物賃貸借(定期建物賃貸借を除く。)は、期間の定めがない建物の賃貸借とみなされる。","is_correct":false,"explanation":"正しい記述である。借地借家法29条1項により、1年未満の期間を定めた建物賃貸借は期間の定めがないものとみなされる。"},{"text":"期間を1年未満と定めた建物賃貸借(定期建物賃貸借を除く。)は、契約自体が無効となる。","is_correct":true,"explanation":"誤っている。1年未満の期間を定めても契約が無効になるのではなく、期間の定めがない賃貸借とみなされるだけである(借地借家法29条1項)。"},{"text":"定期建物賃貸借においては、期間を6か月と定めることも有効である。","is_correct":false,"explanation":"正しい記述である。定期建物賃貸借には29条1項が適用されないため(借地借家法38条1項後段)、1年未満の期間を定めてもその期間が有効となる。"},{"text":"法令により一定の期間を経過した後に建物を取り壊すべきことが明らかな場合、建物を取り壊すこととなる時に賃貸借が終了する旨の特約は、その事由を記載した書面(電磁的記録によることも可)によってすれば有効である。","is_correct":false,"explanation":"正しい記述である。借地借家法39条の取壊し予定の建物の賃貸借に関する特約は、取壊し事由を記載した書面(電磁的記録を含む。)によってしなければならない。"}],"explanation":"借地借家法29条1項は、期間を1年未満とする建物賃貸借を「期間の定めがない建物の賃貸借とみなす」と定めており、契約自体が無効になるわけではない。なお定期建物賃貸借(38条)と取壊し予定の建物の賃貸借(39条)では1年未満の期間や取壊し時終了特約が認められる。","difficulty":2,"tags":["権利関係","借地借家法"],"shuffle_choices":true},{"id":"Q2067","topic":"借地借家法(借家)","question_type":"select_correct","question":"期間の定めがある建物の賃貸借の更新に関する次の記述のうち、借地借家法の規定によれば、正しいものはどれか。","choices":[{"text":"賃貸人が期間満了の1年前から6か月前までの間に更新拒絶の通知をしなかったときは、従前の契約と同一の条件で契約を更新したものとみなされ、更新後の契約は期間の定めがないものとなる。","is_correct":true,"explanation":"借地借家法26条1項のとおりであり、法定更新後の契約は期間の定めがないものとされる。"},{"text":"法定更新された場合、更新後の契約の期間は、従前の契約と同一の期間となる。","is_correct":false,"explanation":"法定更新後の契約は、期間については「定めがないもの」とされる(借地借家法26条1項ただし書)。従前と同一の期間になるのではない。"},{"text":"賃貸人が更新拒絶の通知をするには正当の事由は不要であり、期間内に通知さえすれば契約は期間満了により当然に終了する。","is_correct":false,"explanation":"賃貸人からの更新拒絶の通知は、正当の事由があると認められる場合でなければすることができない(借地借家法28条)。"},{"text":"賃貸人が適法に更新拒絶の通知をした場合には、期間満了後に賃借人が建物の使用を継続していても、契約が更新されることはない。","is_correct":false,"explanation":"更新拒絶の通知をしても、期間満了後に賃借人が使用を継続し、賃貸人が遅滞なく異議を述べなかったときは契約は更新されたものとみなされる(借地借家法26条2項)。"}],"explanation":"借地借家法26条1項により、当事者が期間満了の1年前から6か月前までの間に更新拒絶等の通知をしなかったときは法定更新となり、更新後は期間の定めのない賃貸借となる。賃貸人からの更新拒絶には正当事由が必要であり(28条)、通知後も使用継続に対し遅滞なく異議を述べなければやはり更新される(26条2項)。","difficulty":1,"tags":["権利関係","借地借家法"],"shuffle_choices":true},{"id":"Q2068","topic":"借地借家法(借家)","question_type":"select_correct","question":"Aが所有する建物を期間の定めなくBに賃貸している場合に関する次の記述のうち、民法及び借地借家法の規定によれば、正しいものはどれか。","choices":[{"text":"Aが解約の申入れをした場合、正当の事由の有無にかかわらず、申入れの日から6か月を経過すれば賃貸借は終了する。","is_correct":false,"explanation":"賃貸人Aからの解約申入れには正当の事由が必要である(借地借家法28条)。正当事由のない解約申入れによって賃貸借は終了しない。"},{"text":"Aが正当の事由のある解約の申入れをした場合、賃貸借は申入れの日から3か月を経過した時に終了する。","is_correct":false,"explanation":"賃貸人からの解約申入れの場合、賃貸借は申入れの日から6か月を経過することによって終了する(借地借家法27条1項)。3か月ではない。"},{"text":"Bが解約の申入れをするには、正当の事由が必要である。","is_correct":false,"explanation":"正当事由が必要とされるのは賃貸人側からの解約申入れ・更新拒絶であり(借地借家法28条)、賃借人Bからの解約申入れに正当事由は不要である。"},{"text":"Bが解約の申入れをした場合、賃貸借は申入れの日から3か月を経過した時に終了する。","is_correct":true,"explanation":"賃借人からの解約申入れには借地借家法の特則がなく、民法617条1項により建物賃貸借は解約申入れの日から3か月を経過することで終了する。"}],"explanation":"期間の定めのない建物賃貸借において、賃貸人からの解約申入れは正当事由(借地借家法28条)を要し、申入れの日から6か月経過で終了する(同27条1項)。これに対し賃借人からの解約申入れは民法617条1項によることになり、正当事由は不要で、3か月の経過により終了する。","difficulty":2,"tags":["権利関係","借地借家法"],"shuffle_choices":true},{"id":"Q2069","topic":"借地借家法(借家)","question_type":"select_correct","question":"Aは、その所有する建物をBに賃貸して引き渡し、Bから敷金を受領した。その後、Aはこの建物をCに売却し、所有権移転登記を了した。この場合に関する次の記述のうち、民法及び借地借家法の規定並びに判例によれば、正しいものはどれか。","choices":[{"text":"Bは、賃借権の登記をしていなければ、Cに対して賃借権を対抗することができない。","is_correct":false,"explanation":"建物賃貸借では、賃借権の登記がなくても建物の引渡しがあれば対抗力が認められる(借地借家法31条)。引渡しを受けているBは登記なしでもCに対抗できる。"},{"text":"Bは、建物の引渡しを受けているので、賃借権の登記がなくてもCに対して賃借権を対抗することができる。","is_correct":true,"explanation":"借地借家法31条により、建物の賃貸借は建物の引渡しがあったときはその後に物権を取得した者に対しても効力を生ずる。"},{"text":"賃貸人たる地位がAからCに移転するためには、Bの承諾が必要である。","is_correct":false,"explanation":"対抗力ある賃貸借の目的建物が譲渡された場合、賃貸人たる地位は原則として当然に譲受人に移転し、賃借人の承諾は不要である(民法605条の2第1項)。"},{"text":"BがAに差し入れていた敷金の返還債務は、Cに承継されない。","is_correct":false,"explanation":"賃貸人たる地位が移転すると、敷金返還債務も新賃貸人Cに承継される(民法605条の2第4項)。"}],"explanation":"借地借家法31条により建物の引渡しが建物賃借権の対抗要件となるため、Bは登記がなくても新所有者Cに賃借権を対抗できる。この場合、賃貸人たる地位はBの承諾なくCに移転し(民法605条の2第1項)、敷金返還債務もCに承継される(同条4項)。","difficulty":2,"tags":["権利関係","借地借家法"],"shuffle_choices":true},{"id":"Q2070","topic":"借地借家法(借家)","question_type":"select_incorrect","question":"建物の賃借人の造作買取請求権に関する次の記述のうち、借地借家法の規定及び判例によれば、誤っているものはどれか。","choices":[{"text":"賃借人は、賃貸人の同意を得て建物に付加した造作について、期間満了により賃貸借が終了するとき、賃貸人に対し時価で買い取るべきことを請求することができる。","is_correct":false,"explanation":"正しい記述である。借地借家法33条1項のとおり、賃貸人の同意を得て付加した造作(エアコン等)は期間満了又は解約申入れによる終了の際に時価での買取りを請求できる。"},{"text":"造作買取請求権を排除する旨の特約は、有効である。","is_correct":false,"explanation":"正しい記述である。造作買取請求権(33条)は借地借家法37条の強行規定に含まれておらず、これを排除する特約も有効である。"},{"text":"賃借人の債務不履行により賃貸借契約が解除された場合であっても、賃借人は造作買取請求権を行使することができる。","is_correct":true,"explanation":"誤っている。判例は、賃借人の債務不履行(賃料不払等)により契約が解除された場合には造作買取請求権を行使できないとしている。"},{"text":"賃借人は、造作代金の支払を受けるまで建物の明渡しを拒むことはできない。","is_correct":false,"explanation":"正しい記述である。判例は、造作代金債権は造作に関して生じた債権であって建物に関して生じた債権ではないとして、建物についての留置権や同時履行の抗弁を否定している。"}],"explanation":"造作買取請求権(借地借家法33条)は、期間満了又は解約申入れによって賃貸借が終了する場合に認められるものであり、判例は賃借人の債務不履行解除の場合にはこれを行使できないとする。また同権利は任意規定であり排除特約は有効で、造作代金の未払を理由に建物の明渡しを拒むこともできない。","difficulty":2,"tags":["権利関係","借地借家法"],"shuffle_choices":true},{"id":"Q2071","topic":"借地借家法(借家)","question_type":"select_correct","question":"居住の用に供する建物の賃借人が死亡した場合の賃借権の承継に関する次の記述のうち、借地借家法の規定によれば、正しいものはどれか。","choices":[{"text":"賃借人が相続人なしに死亡した場合、賃借人と事実上夫婦と同様の関係にあった同居者は、賃借人の権利義務を承継する。","is_correct":true,"explanation":"借地借家法36条1項本文のとおり、相続人なしに死亡した場合、事実上夫婦又は養親子と同様の関係にあった同居者が賃借人の権利義務を承継する。"},{"text":"賃借人に相続人がいる場合であっても、同居していた内縁の配偶者は、相続人に優先して賃借権を承継する。","is_correct":false,"explanation":"借地借家法36条の承継は賃借人が「相続人なしに」死亡した場合の制度であり、相続人がいる場合には賃借権は相続人が相続する。"},{"text":"同居者が権利義務の承継を望まないときは、賃借人の死亡を知った時から3か月以内に反対の意思表示をしなければならない。","is_correct":false,"explanation":"反対の意思表示の期間は、賃借人が相続人なしに死亡したことを知った後1か月以内である(借地借家法36条1項ただし書)。3か月ではない。"},{"text":"この承継の規定は、事業用の建物の賃貸借についても適用される。","is_correct":false,"explanation":"借地借家法36条は「居住の用に供する建物」の賃貸借についての規定であり、事業用建物には適用されない。"}],"explanation":"借地借家法36条は、居住用建物の賃借人が相続人なしに死亡した場合に、事実上夫婦又は養親子と同様の関係にあった同居者に賃借人の権利義務を承継させる制度である。承継を望まない同居者は死亡を知った後1か月以内に反対の意思表示をすればよく、相続人がいる場合にはこの規定の適用はない。","difficulty":1,"tags":["権利関係","借地借家法"],"shuffle_choices":true},{"id":"Q2072","topic":"借地借家法(借家)","question_type":"select_correct","question":"定期建物賃貸借に関する次の記述のうち、借地借家法の規定によれば、正しいものはどれか。","choices":[{"text":"定期建物賃貸借契約は、公正証書によって締結しなければ、その効力を生じない。","is_correct":false,"explanation":"定期建物賃貸借は「公正証書による等書面」(電磁的記録も可)によって契約すればよく、公正証書に限定されない(借地借家法38条1項・2項)。"},{"text":"賃貸人が、契約の締結前に、賃借人に対し、更新がなく期間満了により賃貸借が終了する旨を記載した書面を交付(賃借人の承諾を得て電磁的方法による提供も可)して説明しなかったときは、更新がない旨の定めは無効となる。","is_correct":true,"explanation":"借地借家法38条3項・5項のとおり、事前の書面交付による説明を欠くと契約の更新がない旨の定めは無効となり、普通の建物賃貸借として扱われる。"},{"text":"期間が2年の定期建物賃貸借において、賃貸人が期間満了の1年前から6か月前までの間に終了の通知をしなかった場合でも、期間の満了により当然に賃貸借の終了を賃借人に対抗することができる。","is_correct":false,"explanation":"期間1年以上の定期建物賃貸借では、通知期間内に終了通知をしなければ終了を賃借人に対抗できない。通知期間経過後に通知した場合は、通知の日から6か月を経過した後でなければ対抗できない(借地借家法38条6項)。"},{"text":"床面積200㎡未満の居住用建物の定期建物賃貸借においては、賃借人は、理由のいかんを問わず、いつでも中途解約の申入れをすることができる。","is_correct":false,"explanation":"中途解約の特例は、転勤・療養・親族の介護その他のやむを得ない事情により生活の本拠として使用することが困難となった場合に限られる(借地借家法38条7項)。この場合、申入れから1か月で賃貸借は終了する。"}],"explanation":"定期建物賃貸借(借地借家法38条)は、公正証書等の書面(又は電磁的記録)による契約に加え、契約前に更新がない旨を記載した書面を交付して説明することが必要であり、事前説明を欠くと更新がない旨の定めは無効となる。期間1年以上の場合の終了通知(1年前から6か月前まで)や、床面積200㎡未満の居住用建物におけるやむを得ない事情による中途解約特例も重要である。","difficulty":3,"tags":["権利関係","借地借家法"],"shuffle_choices":true},{"id":"Q2073","topic":"不法行為","question_type":"select_correct","question":"不法行為による損害賠償請求権に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"建物を損傷された場合の損害賠償請求権は、被害者が損害及び加害者を知った時から5年間行使しないときは、時効によって消滅する。","is_correct":false,"explanation":"物的損害についての不法行為による損害賠償請求権の短期消滅時効は、損害及び加害者を知った時から3年である(民法724条1号)。5年となるのは人の生命・身体を害する場合である。"},{"text":"不法行為による損害賠償請求権は、不法行為の時から10年を経過したときは、時効によって消滅する。","is_correct":false,"explanation":"長期の期間制限は不法行為の時から20年である(民法724条2号)。10年ではない。"},{"text":"不法行為による損害賠償債務の遅延損害金は、被害者が加害者に対して履行を請求した時から発生する。","is_correct":false,"explanation":"判例は、不法行為による損害賠償債務は催告を要することなく不法行為の時(損害発生時)から遅滞に陥るとしている。請求時からではない。"},{"text":"人の生命又は身体を害する不法行為による損害賠償請求権は、被害者が損害及び加害者を知った時から5年間行使しないときは、時効によって消滅する。","is_correct":true,"explanation":"民法724条の2により、人の生命又は身体を害する不法行為の場合、短期消滅時効の期間は3年ではなく5年とされている。"}],"explanation":"不法行為による損害賠償請求権の消滅時効は、原則として損害及び加害者を知った時から3年、不法行為の時から20年であるが(民法724条)、人の生命又は身体を害する場合には短期の期間が5年に伸長される(724条の2)。また判例により、遅延損害金は催告なしに不法行為の時から発生する。","difficulty":2,"tags":["権利関係","不法行為"],"shuffle_choices":true},{"id":"Q2074","topic":"不法行為","question_type":"select_incorrect","question":"B社の従業員Cが、B社の事業の執行について第三者Dに損害を与えた場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":[{"text":"B社がDに損害を賠償したときは、B社はCに対し、賠償した全額を当然に求償することができる。","is_correct":true,"explanation":"誤っている。判例は、使用者から被用者への求償は、損害の公平な分担の見地から信義則上相当と認められる限度に制限されるとしており、常に全額を求償できるわけではない。"},{"text":"Cの行為が、その行為の外形から判断してB社の事業の範囲内の行為と認められるときは、Cが実際には職務権限を有していなかった場合でも、B社が使用者責任を負うことがある。","is_correct":false,"explanation":"正しい記述である。判例は、行為の外形から職務の範囲内と認められる行為であれば「事業の執行について」に当たるとする(外形標準説)。"},{"text":"B社がCの選任及びその事業の監督について相当の注意をしたときは、B社は使用者責任を免れる。","is_correct":false,"explanation":"正しい記述である。民法715条1項ただし書により、選任・監督につき相当の注意をしたとき、又は相当の注意をしても損害が生ずべきであったときは免責される。"},{"text":"Dは、B社に対しても、Cに対しても、損害賠償を請求することができる。","is_correct":false,"explanation":"正しい記述である。使用者責任が成立する場合でも被用者C自身の一般不法行為責任(民法709条)は消滅せず、両者の債務は連帯債務の関係に立つ。"}],"explanation":"使用者責任(民法715条)が成立しても被用者自身の責任は免れず、被害者は双方に全額の賠償を請求できる。使用者が賠償した場合の被用者への求償は、判例により信義則上相当と認められる限度に制限される。「事業の執行について」の判断には外形標準説が採られている。","difficulty":2,"tags":["権利関係","不法行為"],"shuffle_choices":true},{"id":"Q2075","topic":"不法行為","question_type":"select_correct","question":"A所有の建物をBが賃借して占有していたところ、建物の外壁の設置の瑕疵により外壁の一部が落下し、通行人Cが負傷した。この場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"Aは、損害の発生を防止するのに必要な注意をしたことを証明すれば、Cに対する賠償責任を免れる。","is_correct":false,"explanation":"所有者Aの工作物責任は無過失責任であり(民法717条1項ただし書)、必要な注意をしたことを証明しても免責されない。免責が認められるのは占有者である。"},{"text":"Bは、損害の発生を防止するのに必要な注意をしていた場合であっても、占有者としてCに対する賠償責任を負う。","is_correct":false,"explanation":"占有者Bは、損害の発生を防止するのに必要な注意をしたことを証明すれば免責される(民法717条1項ただし書)。占有者の責任は過失責任的な構成である。"},{"text":"Bが損害の発生を防止するのに必要な注意をしていたときは、所有者であるAがCに対して損害を賠償しなければならない。","is_correct":true,"explanation":"民法717条1項のとおり、第一次的には占有者が責任を負うが、占有者が必要な注意をしていたときは、第二次的に所有者が無過失責任を負う。"},{"text":"外壁の瑕疵が施工業者の手抜き工事によって生じたものである場合、Cは施工業者に対してのみ賠償を請求することができ、A又はBに対して請求することはできない。","is_correct":false,"explanation":"瑕疵の原因について他に責任を負う者がいる場合でも、CはA又はBに対して工作物責任を追及でき、賠償したA又はBがその者(施工業者)に求償できるにとどまる(民法717条3項)。"}],"explanation":"土地の工作物の設置又は保存の瑕疵による損害については、第一次的に占有者が責任を負うが、占有者が損害防止に必要な注意をしたことを証明したときは、所有者が無過失責任を負う(民法717条1項)。損害の原因につき他に責任を負う者があるときは、賠償した占有者・所有者はその者に求償できる(同条3項)。","difficulty":2,"tags":["権利関係","不法行為"],"shuffle_choices":true},{"id":"Q2076","topic":"不法行為","question_type":"select_incorrect","question":"共同不法行為に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":[{"text":"数人が共同の不法行為によって他人に損害を加えたときは、各自が連帯してその損害を賠償する責任を負う。","is_correct":false,"explanation":"正しい記述である。民法719条1項前段のとおり、共同不法行為者は連帯して損害賠償責任を負う。"},{"text":"行為者を教唆した者及び幇助した者も、共同行為者とみなされ、賠償責任を負う。","is_correct":false,"explanation":"正しい記述である。民法719条2項により、教唆者及び幇助者は共同行為者とみなされる。"},{"text":"損害を賠償した共同不法行為者の1人は、他の共同不法行為者に対し、その過失の割合に応じて求償することができる。","is_correct":false,"explanation":"正しい記述である。判例は、共同不法行為者間では各自の過失割合に従って負担部分が定まり、自己の負担部分を超えて賠償した者は他の者に求償できるとする。"},{"text":"被害者は、各共同不法行為者に対し、それぞれの過失割合に応じた額についてのみ賠償を請求することができる。","is_correct":true,"explanation":"誤っている。共同不法行為者の責任は連帯責任であり、被害者は各加害者に対して損害の全額を請求することができる。過失割合は加害者間の求償の場面で問題となるにすぎない。"}],"explanation":"共同不法行為(民法719条)では各加害者が連帯して全額の賠償責任を負うため、被害者はいずれの加害者に対しても損害の全額を請求できる。加害者間の過失割合は、賠償した者から他の加害者への求償の局面で意味を持つ。","difficulty":2,"tags":["権利関係","不法行為"],"shuffle_choices":true},{"id":"Q2077","topic":"相続","question_type":"select_correct","question":"Aが死亡し、相続人として配偶者Bと子C・Dがいる。Cには子Eがいる。Cが家庭裁判所で相続の放棄をした場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"Bの法定相続分は2分の1、Dの法定相続分は2分の1である。","is_correct":true,"explanation":"Cは放棄により初めから相続人とならなかったものとみなされ、その子Eも代襲しない。よって相続人はBとDであり、配偶者Bが2分の1、子Dが2分の1となる。"},{"text":"Eは、Cを代襲してAの相続人となる。","is_correct":false,"explanation":"代襲原因は相続開始以前の死亡、欠格、廃除であり、相続の放棄は代襲原因とならない(民法887条2項)。EはCを代襲しない。"},{"text":"Bの法定相続分は3分の2、Dの法定相続分は3分の1である。","is_correct":false,"explanation":"配偶者と子が相続人の場合の法定相続分は、配偶者2分の1・子2分の1である(民法900条1号)。3分の2・3分の1となるのは配偶者と直系尊属が相続人の場合である。"},{"text":"Cの相続の放棄は、他の相続人であるB及びDに対する意思表示によってすることができる。","is_correct":false,"explanation":"相続の放棄は、家庭裁判所に申述してしなければならない(民法938条)。他の相続人への意思表示だけでは放棄の効力を生じない。"}],"explanation":"相続の放棄をした者は初めから相続人とならなかったものとみなされ(民法939条)、放棄は代襲原因ではないためCの子Eも相続人とならない。その結果、相続人は配偶者Bと子Dとなり、法定相続分はBが2分の1、Dが2分の1である。","difficulty":1,"tags":["権利関係","相続"],"shuffle_choices":true},{"id":"Q2078","topic":"相続","question_type":"select_incorrect","question":"相続の承認及び放棄に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":[{"text":"相続人は、自己のために相続の開始があったことを知った時から3か月以内に限定承認又は放棄をしなかったときは、単純承認をしたものとみなされる。","is_correct":false,"explanation":"正しい記述である。民法915条1項・921条2号のとおり、熟慮期間(3か月)の経過により単純承認が擬制される。"},{"text":"相続の放棄は、3か月の熟慮期間内であれば、いつでも撤回することができる。","is_correct":true,"explanation":"誤っている。相続の承認及び放棄は、熟慮期間内であっても撤回することができない(民法919条1項)。"},{"text":"相続人が相続財産の全部又は一部を処分したときは、原則として単純承認をしたものとみなされる。","is_correct":false,"explanation":"正しい記述である。民法921条1号により、保存行為等を除き、相続財産の処分は法定単純承認事由となる。"},{"text":"相続の放棄は、相続の開始前にすることはできない。","is_correct":false,"explanation":"正しい記述である。相続の放棄は自己のために相続の開始があったことを知った時から可能となるものであり、相続開始前の放棄は認められない。なお遺留分については相続開始前でも家庭裁判所の許可を得て放棄できる点と区別すること。"}],"explanation":"相続の承認・放棄は、いったん行うと熟慮期間内であっても撤回できない(民法919条1項)。熟慮期間は自己のために相続の開始があったことを知った時から3か月であり、期間内に限定承認・放棄をしないときや相続財産を処分したときは単純承認とみなされる(921条)。","difficulty":2,"tags":["権利関係","相続"],"shuffle_choices":true},{"id":"Q2079","topic":"相続","question_type":"select_correct","question":"遺言に関する次の記述のうち、民法及び法務局における遺言書の保管等に関する法律の規定によれば、正しいものはどれか。","choices":[{"text":"自筆証書遺言に添付する相続財産の目録についても、すべて遺言者が自書しなければならない。","is_correct":false,"explanation":"自筆証書遺言に一体のものとして添付する財産目録は自書を要せず、パソコンで作成したものや通帳の写し等でもよい。ただし目録の各頁に署名押印が必要である(民法968条2項)。"},{"text":"公正証書遺言は、相続開始後、遅滞なく家庭裁判所の検認を受けなければならない。","is_correct":false,"explanation":"検認が必要となるのは公正証書遺言以外の遺言書であり、公正証書遺言に検認は不要である(民法1004条2項)。"},{"text":"法務局(遺言書保管所)に保管されている自筆証書遺言については、家庭裁判所の検認を要しない。","is_correct":true,"explanation":"遺言書保管法11条により、遺言書保管所に保管されている自筆証書遺言には民法1004条1項の検認の規定は適用されない。"},{"text":"自筆証書遺言は、日付の記載がなくても、遺言の全文と氏名の自書及び押印があれば有効である。","is_correct":false,"explanation":"自筆証書遺言は、全文・日付・氏名の自書と押印がその方式であり(民法968条1項)、日付を欠く遺言は無効である。"}],"explanation":"自筆証書遺言は全文・日付・氏名の自書と押印を要するが、添付する財産目録は自書不要(各頁に署名押印は必要)である(民法968条)。また、法務局の遺言書保管制度を利用した自筆証書遺言と公正証書遺言には家庭裁判所の検認が不要である。","difficulty":1,"tags":["権利関係","相続"],"shuffle_choices":true},{"id":"Q2080","topic":"相続","question_type":"select_correct","question":"Aが死亡し、相続人は妻Bと子Cのみである。Aは生前、全財産を第三者Fに遺贈する旨の遺言をしていた。この場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"Aに兄弟姉妹がいた場合、その兄弟姉妹にも遺留分が認められる。","is_correct":false,"explanation":"遺留分を有するのは兄弟姉妹以外の相続人(配偶者・子・直系尊属)であり、兄弟姉妹には遺留分がない(民法1042条1項)。"},{"text":"B及びCは、Fに対し、遺贈された不動産そのものの返還を請求することができる。","is_correct":false,"explanation":"遺留分侵害額請求権の行使により生じるのは、侵害額に相当する金銭の支払請求権である(民法1046条1項)。現物の返還を請求できる制度ではない。"},{"text":"遺留分侵害額請求権は、相続の開始及び遺留分を侵害する遺贈があったことを知った時から3年間行使しないときは、時効によって消滅する。","is_correct":false,"explanation":"遺留分侵害額請求権は、相続の開始及び遺留分を侵害する贈与又は遺贈があったことを知った時から1年間行使しないとき、又は相続開始の時から10年を経過したときに消滅する(民法1048条)。3年ではない。"},{"text":"Bの遺留分は遺留分を算定するための財産の価額の4分の1であり、Cの遺留分も4分の1である。","is_correct":true,"explanation":"直系尊属のみが相続人である場合以外の総体的遺留分は2分の1であり(民法1042条1項2号)、これに各自の法定相続分(B・Cとも2分の1)を乗じると、それぞれ4分の1となる。"}],"explanation":"遺留分は、直系尊属のみが相続人の場合は3分の1、それ以外の場合は2分の1であり、各遺留分権利者はこれに法定相続分を乗じた割合を有する(民法1042条)。妻と子1人の場合は各4分の1となる。侵害された場合は金銭の支払を請求でき(1046条)、この請求権は知った時から1年・相続開始から10年で消滅する(1048条)。","difficulty":3,"tags":["権利関係","相続"],"shuffle_choices":true},{"id":"Q2081","topic":"相続","question_type":"select_incorrect","question":"配偶者居住権に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":[{"text":"配偶者居住権の存続期間は、遺産分割協議や遺言に別段の定めがあるときを除き、配偶者の終身の間である。","is_correct":false,"explanation":"正しい記述である。民法1030条により、存続期間は原則として配偶者の終身の間であり、別段の定めをすることもできる。"},{"text":"配偶者は、配偶者居住権を第三者に譲渡することができる。","is_correct":true,"explanation":"誤っている。配偶者居住権は配偶者の居住を保護するための一身専属的な権利であり、譲渡することができない(民法1032条2項)。"},{"text":"配偶者居住権は、その登記をすれば、居住建物の所有権を取得した第三者に対抗することができる。","is_correct":false,"explanation":"正しい記述である。配偶者居住権の対抗要件は登記であり(民法1031条2項)、居住建物の所有者は配偶者に対して登記を備えさせる義務を負う。"},{"text":"配偶者居住権は、遺産の分割又は遺贈によって取得することができる。","is_correct":false,"explanation":"正しい記述である。配偶者居住権は、遺産分割、遺贈(死因贈与を含む)等により取得する(民法1028条1項)。"}],"explanation":"配偶者居住権(民法1028条以下)は、被相続人の配偶者が相続開始時に居住していた建物に無償で住み続けられる権利で、遺産分割や遺贈により取得し、存続期間は原則終身である。譲渡は禁止されており(1032条2項)、第三者への対抗要件は登記である(1031条2項)。","difficulty":2,"tags":["権利関係","相続"],"shuffle_choices":true},{"id":"Q2082","topic":"相続","question_type":"select_correct","question":"相続による所有権の移転の登記の申請義務に関する次の記述のうち、不動産登記法の規定によれば、正しいものはどれか。","choices":[{"text":"相続により不動産の所有権を取得した相続人は、自己のために相続の開始があったことを知り、かつ、当該所有権を取得したことを知った日から3年以内に、所有権の移転の登記を申請しなければならない。","is_correct":true,"explanation":"令和6年4月1日に施行された相続登記の申請義務化のとおりであり(不動産登記法76条の2第1項)、正当な理由がある場合を除き3年以内の申請が義務付けられる。"},{"text":"この登記の申請義務は、相続の開始の時から1年以内に履行しなければならない。","is_correct":false,"explanation":"申請義務の期間は、相続開始及び所有権取得を知った日から3年以内である。1年以内ではなく、起算点も相続開始時そのものではない。"},{"text":"相続人が登記官に対して相続人申告登記の申出をしても、相続登記の申請義務を履行したものとは認められない。","is_correct":false,"explanation":"相続人申告登記(不動産登記法76条の3)の申出をした者は、相続登記の申請義務を履行したものとみなされる。簡易に義務を果たす手段として設けられた制度である。"},{"text":"正当な理由がないのに申請を怠ったときは、50万円以下の過料に処される。","is_correct":false,"explanation":"正当な理由なく相続登記の申請義務に違反した場合の制裁は、10万円以下の過料である(不動産登記法164条1項)。50万円ではない。"}],"explanation":"所有者不明土地問題への対策として相続登記が義務化され、相続人は相続開始と所有権取得を知った日から3年以内に登記を申請しなければならず、正当な理由なく怠ると10万円以下の過料の対象となる(不動産登記法76条の2、164条1項)。相続人申告登記の申出により義務を履行したものとみなされる制度もある(76条の3)。","difficulty":2,"tags":["権利関係","相続","不動産登記法"],"shuffle_choices":true},{"id":"Q2083","topic":"区分所有法","question_type":"select_correct","question":"建物の区分所有等に関する法律に関する次の記述のうち、同法の規定によれば、正しいものはどれか。","choices":[{"text":"廊下や階段室など、構造上区分所有者の全員又はその一部の共用に供されるべき建物の部分は、規約により専有部分とすることができる。","is_correct":false,"explanation":"構造上当然に共用部分となる部分(法定共用部分)は、規約によっても専有部分とすることはできない(区分所有法4条1項)。"},{"text":"敷地利用権は、規約に別段の定めがない限り、専有部分と分離して処分することができる。","is_correct":false,"explanation":"原則と例外が逆である。敷地利用権は専有部分と分離して処分することができないのが原則であり、規約に別段の定めがあるときに限り分離処分が可能となる(区分所有法22条1項)。"},{"text":"集会室など本来専有部分となり得る建物の部分を規約により共用部分とした場合、その旨の登記をしなければ、これをもって第三者に対抗することができない。","is_correct":true,"explanation":"区分所有法4条2項のとおり、規約共用部分は共用部分である旨の登記をしなければ第三者に対抗できない。"},{"text":"各区分所有者の共用部分の持分は、規約に別段の定めがない限り、区分所有者の頭数に応じて均等となる。","is_correct":false,"explanation":"共用部分の持分は、規約に別段の定めがない限り、各区分所有者が有する専有部分の床面積の割合による(区分所有法14条1項・4項)。頭数で均等になるのではない。"}],"explanation":"共用部分には、構造上当然に共用となる法定共用部分と、規約によって共用部分とされる規約共用部分があり、後者は登記が第三者対抗要件となる(区分所有法4条2項)。共用部分の持分は専有部分の床面積割合により(14条)、敷地利用権は原則として専有部分と分離処分できない(22条1項)。","difficulty":1,"tags":["権利関係","区分所有法"],"shuffle_choices":true},{"id":"Q2084","topic":"区分所有法","question_type":"select_correct","question":"建物の区分所有等に関する法律における集会に関する次の記述のうち、同法の規定によれば、正しいものはどれか。","choices":[{"text":"集会の招集の通知は、会日より少なくとも2週間前に発しなければならず、この期間を規約で短縮することはできない。","is_correct":false,"explanation":"招集通知は会日より少なくとも1週間前に発すればよく、この期間は規約で伸長も短縮もできる(区分所有法35条1項)。"},{"text":"管理者は、少なくとも2年に1回、集会を招集しなければならない。","is_correct":false,"explanation":"管理者は、少なくとも毎年1回集会を招集しなければならない(区分所有法34条2項)。"},{"text":"区分所有者の5分の1以上で議決権の5分の1以上を有する者は管理者に集会の招集を請求できるが、この定数は規約で増加することができる。","is_correct":false,"explanation":"5分の1以上という定数は、規約で「減ずる」ことはできるが、増加することはできない(区分所有法34条3項)。"},{"text":"集会の招集の通知は、原則として会日より少なくとも1週間前に、会議の目的たる事項を示して発しなければならないが、この期間は規約で伸縮することができる。","is_correct":true,"explanation":"区分所有法35条1項のとおりであり、1週間という期間は規約で伸長することも短縮することもできる。"}],"explanation":"集会の招集通知は会日の少なくとも1週間前に会議の目的事項を示して発する必要があるが、この期間は規約で伸縮可能である(区分所有法35条1項)。管理者は毎年1回集会を招集する義務を負い(34条2項)、区分所有者の5分の1以上・議決権の5分の1以上による招集請求の定数は規約で減ずることのみできる(34条3項)。","difficulty":2,"tags":["権利関係","区分所有法"],"shuffle_choices":true},{"id":"Q2085","topic":"区分所有法","question_type":"select_correct","question":"建物の区分所有等に関する法律における集会の決議に関する次の記述のうち、同法の規定によれば、正しいものはどれか。","choices":[{"text":"建替え決議は、区分所有者及び議決権の各4分の3以上の多数によって行うことができる。","is_correct":false,"explanation":"建替え決議の要件は、区分所有者及び議決権の各5分の4以上の多数である(区分所有法62条1項)。4分の3ではない。"},{"text":"共用部分の重大変更(形状又は効用の著しい変更を伴う変更)の決議要件のうち、区分所有者の定数は、規約でその過半数まで減ずることができる。","is_correct":true,"explanation":"共用部分の重大変更は区分所有者及び議決権の各4分の3以上の決議によるが、区分所有者の定数(頭数)のみは規約で過半数まで減ずることができる(区分所有法17条1項)。"},{"text":"規約の設定、変更又は廃止は、区分所有者及び議決権の各過半数による集会の決議によって行うことができる。","is_correct":false,"explanation":"規約の設定・変更・廃止は、区分所有者及び議決権の各4分の3以上の多数による集会の決議を要する(区分所有法31条1項)。過半数では足りない。"},{"text":"建替え決議の要件である区分所有者及び議決権の各5分の4以上という定数は、規約で減ずることができる。","is_correct":false,"explanation":"建替え決議の5分の4以上という要件は、規約によっても減ずることができない。規約で緩和できるのは共用部分の重大変更における区分所有者の定数などに限られる。"}],"explanation":"集会の決議は原則として区分所有者及び議決権の各過半数によるが、規約の設定・変更・廃止や共用部分の重大変更は各4分の3以上、建替えは各5分の4以上の特別多数を要する。このうち規約で緩和できるのは、共用部分の重大変更に係る区分所有者の定数(過半数まで)などに限られる(区分所有法17条1項)。","difficulty":3,"tags":["権利関係","区分所有法"],"shuffle_choices":true},{"id":"Q2086","topic":"区分所有法","question_type":"select_incorrect","question":"建物の区分所有等に関する法律における規約及び占有者の地位に関する次の記述のうち、同法の規定によれば、誤っているものはどれか。","choices":[{"text":"専有部分の賃借人などの占有者は、規約に定めることにより、集会において議決権を行使することができる。","is_correct":true,"explanation":"誤っている。議決権を有するのは区分所有者であり、占有者には規約によっても議決権を与えることはできない。占有者は会議の目的に利害関係を有する場合に集会に出席して意見を述べることができるにとどまる(区分所有法44条1項)。"},{"text":"規約は、区分所有者の特定承継人に対しても、その効力を生ずる。","is_correct":false,"explanation":"正しい記述である。規約及び集会の決議は、区分所有者の特定承継人(中古で専有部分を買った者など)に対してもその効力を生ずる(区分所有法46条1項)。"},{"text":"占有者は、建物又はその敷地若しくは附属施設の使用方法につき、区分所有者が規約又は集会の決議に基づいて負う義務と同一の義務を負う。","is_correct":false,"explanation":"正しい記述である。区分所有法46条2項のとおり、占有者も使用方法については規約・決議に拘束される。"},{"text":"最初に建物の専有部分の全部を所有する者は、公正証書により、規約共用部分を定める規約を設定することができる。","is_correct":false,"explanation":"正しい記述である。最初に専有部分の全部を所有する者(分譲業者等)は、公正証書により、規約共用部分・規約敷地・敷地利用権の分離処分許容・敷地利用権の割合に関する規約を設定できる(区分所有法32条)。"}],"explanation":"規約と集会決議の効力は特定承継人や占有者(使用方法について)にも及ぶが(区分所有法46条)、占有者に認められるのは利害関係を有する場合の意見陳述権(44条1項)であり、議決権はない。また分譲業者など最初に専有部分の全部を所有する者は、公正証書で一定の事項に限り規約を設定できる(32条)。","difficulty":2,"tags":["権利関係","区分所有法"],"shuffle_choices":true},{"id":"Q2087","topic":"区分所有法","question_type":"select_correct","question":"建物の区分所有等に関する法律における管理者に関する次の記述のうち、同法の規定によれば、正しいものはどれか。","choices":[{"text":"管理者は、区分所有者の中から選任しなければならない。","is_correct":false,"explanation":"管理者の資格に制限はなく、区分所有者以外の者(管理会社等)を管理者に選任することもできる。"},{"text":"管理者の選任は、規約に別段の定めがない限り、区分所有者及び議決権の各4分の3以上の多数による集会の決議によらなければならない。","is_correct":false,"explanation":"管理者の選任・解任は、規約に別段の定めがない限り、集会の普通決議(区分所有者及び議決権の各過半数)による(区分所有法25条1項)。4分の3以上の特別決議は不要である。"},{"text":"管理者は、規約に別段の定めがない限り、集会の決議によって選任し、又は解任することができ、区分所有者以外の者や法人を管理者とすることもできる。","is_correct":true,"explanation":"区分所有法25条1項のとおり選任・解任は集会の決議(普通決議)により、管理者の資格に制限はないため区分所有者以外の者や法人でもよい。"},{"text":"管理者は、集会において、少なくとも毎年2回、その事務に関する報告をしなければならない。","is_correct":false,"explanation":"管理者の事務報告は、集会において毎年1回一定の時期にすれば足りる(区分所有法43条)。毎年2回ではない。"}],"explanation":"管理者は、規約に別段の定めがない限り集会の普通決議で選任・解任され(区分所有法25条1項)、その資格に制限はないので区分所有者以外の自然人や法人も就任できる。管理者は少なくとも毎年1回集会を招集し(34条2項)、集会で事務報告を行う義務を負う(43条)。","difficulty":2,"tags":["権利関係","区分所有法"],"shuffle_choices":true},{"id":"Q2088","topic":"不動産登記法","question_type":"select_correct","question":"登記記録に関する次の記述のうち、不動産登記法の規定によれば、正しいものはどれか。","choices":[{"text":"所有権の移転の登記は、権利部の乙区に記録される。","is_correct":false,"explanation":"所有権に関する登記(保存・移転・差押え等)は権利部の甲区に記録される。乙区に記録されるのは所有権以外の権利に関する登記である。"},{"text":"所有権の保存の登記は、表題部に記録される。","is_correct":false,"explanation":"所有権保存登記は権利に関する登記であり、権利部の甲区に記録される。表題部には土地・建物の物理的現況(所在、地番、地目、床面積等)が記録される。"},{"text":"登記記録は、不動産の所有者ごとに作成される。","is_correct":false,"explanation":"登記記録は、一筆の土地又は一個の建物ごとに作成される(物的編成主義。不動産登記法2条5号)。所有者ごとに作成されるのではない。"},{"text":"抵当権の設定の登記は、権利部の乙区に記録される。","is_correct":true,"explanation":"抵当権は所有権以外の権利であるから、その設定登記は権利部の乙区に記録される。"}],"explanation":"登記記録は一筆の土地又は一個の建物ごとに作成され、不動産の表示に関する事項を記録する表題部と、権利に関する事項を記録する権利部からなる。権利部のうち甲区には所有権に関する登記が、乙区には抵当権・地上権など所有権以外の権利に関する登記が記録される。","difficulty":1,"tags":["権利関係","不動産登記法"],"shuffle_choices":true},{"id":"Q2089","topic":"不動産登記法","question_type":"select_incorrect","question":"登記の申請義務に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","choices":[{"text":"新築した建物の所有権を取得した者は、その所有権の取得の日から1か月以内に、建物の表題登記を申請しなければならない。","is_correct":false,"explanation":"正しい記述である。不動産登記法47条1項により、新築建物等の所有権取得者は取得の日から1か月以内に表題登記を申請する義務を負う。"},{"text":"土地の地目に変更があったときは、表題部所有者又は所有権の登記名義人は、その変更があった日から3か月以内に、地目の変更の登記を申請しなければならない。","is_correct":true,"explanation":"誤っている。地目又は地積の変更の登記は、変更があった日から「1か月以内」に申請しなければならない(不動産登記法37条1項)。3か月ではない。"},{"text":"建物が滅失したときは、表題部所有者又は所有権の登記名義人は、その滅失の日から1か月以内に、建物の滅失の登記を申請しなければならない。","is_correct":false,"explanation":"正しい記述である。不動産登記法57条により、建物滅失の登記は滅失の日から1か月以内に申請しなければならない。"},{"text":"売買により不動産の所有権を取得した者について、その所有権の移転の登記の申請は法律上義務付けられていない。","is_correct":false,"explanation":"正しい記述である。権利に関する登記の申請は原則として任意であり、義務化されているのは相続(遺贈による相続人への移転を含む)による所有権移転登記等に限られる。"}],"explanation":"表示に関する登記(表題登記、地目・地積の変更、滅失など)には1か月以内の申請義務が課されている(不動産登記法36条、37条、47条、57条)。これに対し権利に関する登記の申請は原則自由であるが、相続による所有権移転については例外的に3年以内の申請が義務化されている。","difficulty":2,"tags":["権利関係","不動産登記法"],"shuffle_choices":true},{"id":"Q2090","topic":"不動産登記法","question_type":"select_correct","question":"登記の申請に関する次の記述のうち、不動産登記法の規定によれば、正しいものはどれか。","choices":[{"text":"登記手続をすべきことを命ずる確定判決を得た者は、単独でその登記を申請することができる。","is_correct":true,"explanation":"不動産登記法63条1項のとおり、登記手続を命ずる確定判決による登記は、勝訴した登記権利者又は登記義務者が単独で申請できる。"},{"text":"相続による所有権の移転の登記は、登記権利者と登記義務者が共同して申請しなければならない。","is_correct":false,"explanation":"相続又は法人の合併による権利の移転の登記は、登記権利者(相続人等)が単独で申請することができる(不動産登記法63条2項)。"},{"text":"売買による所有権の移転の登記は、買主が単独で申請することができる。","is_correct":false,"explanation":"権利に関する登記は共同申請が原則であり(不動産登記法60条)、売買による所有権移転登記は登記権利者(買主)と登記義務者(売主)が共同して申請しなければならない。"},{"text":"相続人に対する遺贈による所有権の移転の登記は、登記権利者と登記義務者の共同申請によらなければならない。","is_correct":false,"explanation":"令和5年4月施行の改正により、相続人に対する遺贈による所有権移転登記は、登記権利者(受遺者である相続人)が単独で申請できることとされた(不動産登記法63条3項)。"}],"explanation":"権利に関する登記は登記権利者と登記義務者の共同申請が原則である(不動産登記法60条)が、確定判決による登記や相続・法人合併による移転登記は単独で申請できる(63条1項・2項)。さらに改正により、相続人に対する遺贈による所有権移転登記も受遺者たる相続人の単独申請が可能となった(63条3項)。","difficulty":3,"tags":["権利関係","不動産登記法"],"shuffle_choices":true},{"id":"Q2091","topic":"不動産登記法","question_type":"select_correct","question":"所有権の保存の登記に関する次の記述のうち、不動産登記法の規定によれば、正しいものはどれか。","choices":[{"text":"表題部所有者から売買により所有権を取得した者は、区分建物以外の建物についても、直接自己を名義人とする所有権の保存の登記を申請することができる。","is_correct":false,"explanation":"区分建物以外では、表題部所有者から所有権を取得した者に保存登記の申請適格はない。表題部所有者から直接取得した者が保存登記を申請できるのは区分建物の場合の特則である(不動産登記法74条2項)。"},{"text":"所有権の保存の登記は、表題部所有者と所有権を取得した者とが共同して申請しなければならない。","is_correct":false,"explanation":"所有権保存登記は、申請適格を有する者(表題部所有者、その相続人等)が単独で申請するものであり、共同申請ではない。"},{"text":"表題部所有者の相続人は、自己を名義人とする所有権の保存の登記を申請することができる。","is_correct":true,"explanation":"不動産登記法74条1項1号のとおり、表題部所有者又はその相続人その他の一般承継人は所有権保存登記を申請することができる。"},{"text":"確定判決により自己の所有権が確認された者であっても、表題部所有者でなければ、所有権の保存の登記を申請することはできない。","is_correct":false,"explanation":"所有権を有することが確定判決によって確認された者も、所有権保存登記を申請することができる(不動産登記法74条1項2号)。"}],"explanation":"所有権保存登記を申請できるのは、①表題部所有者又はその相続人その他の一般承継人、②所有権を有することが確定判決で確認された者、③収用により所有権を取得した者であり(不動産登記法74条1項)、区分建物については表題部所有者から所有権を取得した者も申請できる(同条2項)。","difficulty":2,"tags":["権利関係","不動産登記法"],"shuffle_choices":true},{"id":"Q2092","topic":"不動産登記法","question_type":"select_incorrect","question":"仮登記に関する次の記述のうち、不動産登記法の規定によれば、誤っているものはどれか。","choices":[{"text":"仮登記に基づいて本登記をした場合、その本登記の順位は、当該仮登記の順位による。","is_correct":false,"explanation":"正しい記述である。不動産登記法106条のとおり、仮登記には順位保全の効力があり、本登記の順位は仮登記の順位による。"},{"text":"仮登記は、仮登記の登記義務者の承諾があるときは、仮登記の登記権利者が単独で申請することができる。","is_correct":false,"explanation":"正しい記述である。仮登記は、登記義務者の承諾があるとき又は仮登記を命ずる処分があるときは、登記権利者が単独で申請できる(不動産登記法107条1項)。"},{"text":"所有権に関する仮登記に基づく本登記は、登記上の利害関係を有する第三者がある場合には、その第三者の承諾があるときに限り、申請することができる。","is_correct":false,"explanation":"正しい記述である。不動産登記法109条1項のとおり、所有権に関する仮登記の本登記には利害関係第三者の承諾が必要であり、本登記がされるとその第三者の登記は職権で抹消される。"},{"text":"所有権の移転請求権を保全するための仮登記をした者は、その後に当該不動産の所有権を取得した第三者に対し、仮登記のままで所有権の取得を対抗することができる。","is_correct":true,"explanation":"誤っている。仮登記には順位保全の効力があるにとどまり、対抗力はない。本登記をして初めて第三者に権利を対抗できる。"}],"explanation":"仮登記は、将来の本登記の順位を保全するための予備的な登記であり(不動産登記法105条、106条)、それ自体に対抗力はない。登記義務者の承諾等があれば単独申請ができ(107条1項)、所有権に関する仮登記に基づく本登記には登記上の利害関係を有する第三者の承諾を要する(109条1項)。","difficulty":3,"tags":["権利関係","不動産登記法"],"shuffle_choices":true},{"id":"Q2093","topic":"委任","question_type":"select_correct","question":"AがBに対し、A所有の不動産の管理を内容とする委任契約を締結した場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"Bは、報酬に関する特約がなくても、Aに対して報酬を請求することができる。","is_correct":false,"explanation":"委任は無償が原則であり、受任者は特約がなければ委任者に報酬を請求することができない(民法648条1項)。"},{"text":"Bが無報酬で委任を受けた場合でも、Bは善良な管理者の注意をもって委任事務を処理する義務を負う。","is_correct":true,"explanation":"民法644条のとおり、受任者は有償・無償を問わず善管注意義務を負う。無償の場合に注意義務が軽減される寄託(自己の財産に対するのと同一の注意)とは異なる。"},{"text":"委任契約は、相手方に債務不履行がなければ、解除することができない。","is_correct":false,"explanation":"委任は各当事者がいつでもその解除をすることができる(民法651条1項)。ただし相手方に不利な時期に解除したとき等は、やむを得ない事由があった場合を除き損害賠償義務を負う(同条2項)。"},{"text":"委任者Aが死亡した場合でも、委任契約は終了しない。","is_correct":false,"explanation":"委任は、委任者又は受任者の死亡、破産手続開始の決定、受任者の後見開始の審判によって終了する(民法653条)。委任者の死亡は終了事由である。"}],"explanation":"委任契約において受任者は、報酬の有無にかかわらず善良な管理者の注意をもって事務を処理する義務を負う(民法644条)。委任は無償が原則で(648条1項)、各当事者はいつでも解除でき(651条1項)、当事者の死亡や破産手続開始等により終了する(653条)。","difficulty":1,"tags":["権利関係","委任"],"shuffle_choices":true},{"id":"Q2094","topic":"相隣関係","question_type":"select_correct","question":"相隣関係に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"土地の所有者は、隣地の竹木の枝が境界線を越える場合において、その竹木の所有者に枝を切除するよう催告したにもかかわらず相当の期間内に切除されないときは、自らその枝を切り取ることができる。","is_correct":true,"explanation":"令和5年4月施行の改正民法233条3項1号のとおり、催告後相当期間内に切除がないときは、越境された土地の所有者が自ら枝を切り取ることができる。"},{"text":"土地の所有者は、隣地の竹木の枝が境界線を越える場合には、催告することなく、いつでも自らその枝を切り取ることができる。","is_correct":false,"explanation":"自ら切り取ることができるのは、①催告後相当期間内に切除がないとき、②竹木の所有者又はその所在を知ることができないとき、③急迫の事情があるときに限られる(民法233条3項)。無条件にいつでも切り取れるわけではない。"},{"text":"土地の所有者は、隣地の竹木の根が境界線を越える場合には、竹木の所有者にその根を切除させなければならず、自ら切り取ることはできない。","is_correct":false,"explanation":"根が境界線を越えるときは、土地の所有者は自らその根を切り取ることができる(民法233条4項)。枝と根で扱いが異なる点に注意。"},{"text":"土地の所有者は、境界標の調査のため必要な範囲内で隣地を使用する場合には、隣地上の住家についても、居住者の承諾を得ることなく立ち入ることができる。","is_correct":false,"explanation":"境界標の調査等のための隣地使用権は認められるが(民法209条1項)、住家については居住者の承諾がなければ立ち入ることができない(同項ただし書)。"}],"explanation":"令和3年民法改正(令和5年4月施行)により、越境した竹木の枝は、催告後相当期間内に切除されないとき、竹木所有者不明のとき、急迫の事情があるときには土地所有者が自ら切り取れることになった(民法233条3項)。根は従来どおり自ら切り取ることができ(同条4項)、隣地使用権についても住家への立入りには居住者の承諾が必要である(209条1項ただし書)。","difficulty":3,"tags":["権利関係","相隣関係"],"shuffle_choices":true},{"id":"Q2095","topic":"条件","question_type":"select_incorrect","question":"法律行為の条件に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":[{"text":"停止条件付法律行為は、停止条件が成就した時からその効力を生ずる。","is_correct":false,"explanation":"正しい記述である。民法127条1項のとおり、停止条件付法律行為は条件成就の時から効力を生ずる。"},{"text":"条件の成就によって不利益を受ける当事者が故意にその条件の成就を妨げたときは、相手方は、その条件が成就したものとみなすことができる。","is_correct":false,"explanation":"正しい記述である。民法130条1項のとおり、条件成就の妨害があった場合、相手方は条件が成就したものとみなすことができる。"},{"text":"解除条件付法律行為は、解除条件が成就した時からその効力を生ずる。","is_correct":true,"explanation":"誤っている。解除条件付法律行為は、条件が成就した時からその効力を「失う」(民法127条2項)。条件成就により効力を生ずるのは停止条件である。"},{"text":"条件の成否が未定である間における当事者の権利義務は、一般の規定に従い、処分し、相続し、又は保存することができる。","is_correct":false,"explanation":"正しい記述である。民法129条のとおり、条件付権利も処分・相続・保存・担保供与の対象となる。"}],"explanation":"停止条件付法律行為は条件成就の時から効力を生じ、解除条件付法律行為は条件成就の時から効力を失う(民法127条)。条件付権利は成否未定の間も処分・相続でき(129条)、条件成就を故意に妨害した当事者に対しては、相手方は条件が成就したものとみなすことができる(130条1項)。","difficulty":1,"tags":["権利関係","条件"],"shuffle_choices":true},{"id":"Q3001","topic":"都市計画法","question_type":"select_correct","question":"都市計画区域及び準都市計画区域の指定に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"都市計画区域は、原則として、当該区域が所在する市町村が指定する。","is_correct":false,"explanation":"都市計画区域を指定するのは原則として都道府県であり、市町村ではない。二以上の都府県にわたる場合は国土交通大臣が指定する。"},{"text":"準都市計画区域は、関係市町村の申出に基づき、市町村が指定する。","is_correct":false,"explanation":"準都市計画区域を指定するのは都道府県である。市町村に指定権限はない。"},{"text":"都市計画区域は、必要があるときは、市町村の区域外にわたって指定することができる。","is_correct":true,"explanation":"都市計画区域は行政区域にとらわれず、一体の都市として整備・開発・保全すべき区域を、市町村の区域内外にわたって指定できる。"},{"text":"二以上の都府県の区域にわたる都市計画区域は、関係都府県が共同して指定する。","is_correct":false,"explanation":"二以上の都府県にわたる都市計画区域は、あらかじめ関係都府県の意見を聴いたうえで国土交通大臣が指定する。共同指定の制度はない。"}],"explanation":"都市計画区域は実質的な都市の広がりを単位として定めるため、市町村や都府県の行政界に縛られない仕組みになっている。指定権者は原則都道府県、都府県をまたぐときは国土交通大臣であり、準都市計画区域は都道府県が指定する。","difficulty":1,"tags":["法令上の制限","都市計画法","都市計画区域"],"shuffle_choices":true},{"id":"Q3002","topic":"都市計画法","question_type":"select_incorrect","question":"区域区分に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"すべての都市計画区域について、市街化区域と市街化調整区域との区分を定めなければならない。","is_correct":true,"explanation":"誤り。区域区分を定めるかどうかは原則として都道府県の選択に委ねられており(任意)、区分を定めない、いわゆる非線引き都市計画区域も存在する。三大都市圏の一定区域や政令指定都市を含む区域などに限り必須となる。"},{"text":"市街化区域は、すでに市街地を形成している区域及びおおむね10年以内に優先的かつ計画的に市街化を図るべき区域である。","is_correct":false,"explanation":"正しい。市街化区域の定義そのものであり、「おおむね10年以内」という期間がポイントである。"},{"text":"市街化調整区域は、市街化を抑制すべき区域である。","is_correct":false,"explanation":"正しい。市街化を「禁止」ではなく「抑制」すべき区域とされている点に注意する。"},{"text":"区域区分は、都道府県が都市計画に定めるものとされている。","is_correct":false,"explanation":"正しい。区域区分は広域的観点から定める必要があるため、決定権者は都道府県とされている。"}],"explanation":"区域区分(線引き)は無秩序な市街化を防ぐための制度だが、すべての都市計画区域で必須とされているわけではなく、原則として定めるかどうかは任意である。市街化区域の「おおむね10年以内」という数字は頻出なので正確に覚えたい。","difficulty":1,"tags":["法令上の制限","都市計画法","区域区分"],"shuffle_choices":true},{"id":"Q3003","topic":"都市計画法","question_type":"select_correct","question":"用途地域に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"市街化調整区域については、少なくとも用途地域を定めるものとされている。","is_correct":false,"explanation":"市街化調整区域は市街化を抑制すべき区域であるため、用途地域は原則として定めないものとされている。「少なくとも定める」のは市街化区域である。"},{"text":"用途地域は、住居系・商業系・工業系を合わせて全部で12種類である。","is_correct":false,"explanation":"田園住居地域を含め、用途地域は全部で13種類である。"},{"text":"準工業地域は、主として環境の悪化をもたらすおそれのある工業の利便を増進するため定める地域である。","is_correct":false,"explanation":"準工業地域は、主として環境の悪化をもたらすおそれの「ない」工業の利便を増進するため定める地域である。環境悪化のおそれのある工場も立地し得るのは工業地域・工業専用地域である。"},{"text":"市街化区域については、少なくとも用途地域を定めるものとされている。","is_correct":true,"explanation":"市街化区域は積極的に市街化を図る区域であるため、土地利用の秩序を確保する用途地域を少なくとも定めることとされている。"}],"explanation":"用途地域は建築物の用途の混在を防ぐための基本的な地域地区であり、全13種類ある。市街化区域には少なくとも定め、市街化調整区域には原則として定めない、という対比を押さえることが重要である。","difficulty":1,"tags":["法令上の制限","都市計画法","用途地域"],"shuffle_choices":true},{"id":"Q3004","topic":"都市計画法","question_type":"select_correct","question":"地域地区に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"特別用途地区は、用途地域が定められていない土地の区域内において、特別の目的から土地利用の増進等を図るため定める地区である。","is_correct":false,"explanation":"特別用途地区は「用途地域内」の一定の地区において、当該地区の特性にふさわしい土地利用の増進、環境の保護等を図るため定める地区である。用途地域外に定めるのは特定用途制限地域である。"},{"text":"特定用途制限地域は、用途地域が定められていない土地の区域(市街化調整区域を除く。)内において、制限すべき特定の建築物等の用途の概要を定める地域である。","is_correct":true,"explanation":"特定用途制限地域は、非線引き都市計画区域や準都市計画区域の用途地域が定められていない、いわゆる白地地域で、望ましくない用途の立地を制限するために定められる。市街化調整区域には定められない点にも注意する。"},{"text":"高度地区は、市街地の環境維持等のため、建築物の容積率の最高限度又は最低限度を定める地区である。","is_correct":false,"explanation":"高度地区は建築物の「高さ」の最高限度又は最低限度を定める地区である。容積率等を定めるのは高度利用地区であり、名称の似た両者の混同を狙った誤りである。"},{"text":"高層住居誘導地区は、工業専用地域内においても定めることができる。","is_correct":false,"explanation":"高層住居誘導地区は、第一種・第二種住居地域、準住居地域、近隣商業地域、準工業地域のうち一定の容積率が定められた地域内に限って定められる。工業専用地域には定められない。"}],"explanation":"特別用途地区は用途地域「内」、特定用途制限地域は用途地域「外」(ただし市街化調整区域を除く)という対比が最重要ポイントである。地域地区は名称から役割を推測しつつ、高度地区(高さ)と高度利用地区(容積率等)のような紛らわしい組合せを正確に区別したい。","difficulty":2,"tags":["法令上の制限","都市計画法","地域地区"],"shuffle_choices":true},{"id":"Q3005","topic":"都市計画法","question_type":"select_incorrect","question":"地域地区に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"高度利用地区は、建築物の容積率の最高限度及び最低限度、建蔽率の最高限度、建築面積の最低限度等を定める地区である。","is_correct":false,"explanation":"正しい。高度利用地区は土地の合理的かつ健全な高度利用と都市機能の更新を図るための地区であり、「高度」といっても高さではなく利用の程度を意味する。"},{"text":"風致地区内における建築物の建築等の規制は、政令で定める基準に従い、地方公共団体の条例で定められる。","is_correct":false,"explanation":"正しい。風致地区は都市の風致を維持するための地区であり、具体的な行為規制は条例に委ねられている。"},{"text":"準都市計画区域内においては、高度利用地区を定めることができる。","is_correct":true,"explanation":"誤り。準都市計画区域は土地利用の整序を目的とする消極的な区域であるため、定められる地域地区は用途地域、特別用途地区、特定用途制限地域、高度地区(高さの最高限度のみ)、景観地区、風致地区、緑地保全地域、伝統的建造物群保存地区の8種類に限られ、市街地の高度利用を促す高度利用地区は定められない。"},{"text":"準都市計画区域内においては、風致地区を定めることができる。","is_correct":false,"explanation":"正しい。風致地区は環境保全型の地域地区であるため、準都市計画区域内にも定めることができる。"}],"explanation":"準都市計画区域は積極的な整備・開発を予定しない区域であるため、定められる地域地区は土地利用の整序・環境保全を目的とする8種類に限定される。高度利用地区や高層住居誘導地区のような開発促進型の地区は定められない点が問われやすい。","difficulty":3,"tags":["法令上の制限","都市計画法","地域地区"],"shuffle_choices":true},{"id":"Q3006","topic":"都市計画法","question_type":"select_correct","question":"地区計画に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"地区計画の区域(地区整備計画が定められている区域に限る。)内において土地の区画形質の変更又は建築物の建築等を行おうとする者は、原則として、当該行為に着手する日の30日前までに、市町村長に届け出なければならない。","is_correct":true,"explanation":"地区計画の区域内の行為規制は許可制ではなく届出制であり、行為着手の30日前までに市町村長へ届け出る。届出先が知事ではなく市町村長である点も重要である。"},{"text":"地区計画は、都道府県が定める都市計画である。","is_correct":false,"explanation":"地区計画は身近な地区レベルのまちづくりの計画であるため、市町村が定める。"},{"text":"地区計画は、用途地域が定められている土地の区域内に限り、定めることができる。","is_correct":false,"explanation":"地区計画は、用途地域が定められている土地の区域のほか、用途地域が定められていない土地の区域でも一定の要件に該当すれば定めることができる。"},{"text":"届出に係る行為が地区計画に適合しないときは、市町村長は、当該行為の中止又は設計の変更を命ずることができる。","is_correct":false,"explanation":"地区計画の届出制における市町村長の権限は「勧告」にとどまり、中止命令や変更命令をする権限はない。"}],"explanation":"地区計画は地区の特性に応じたきめ細かなまちづくりを行うため市町村が定める都市計画であり、区域内の行為は「30日前までに市町村長へ届出、不適合なら勧告」という緩やかな規制手法が採られている。許可制・命令と混同させる出題が多い。","difficulty":2,"tags":["法令上の制限","都市計画法","地区計画"],"shuffle_choices":true},{"id":"Q3007","topic":"都市計画法","question_type":"select_incorrect","question":"都市施設及び市街地開発事業に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"都市施設は、特に必要があるときは、都市計画区域外においても定めることができる。","is_correct":false,"explanation":"正しい。ごみ焼却場や火葬場などのように、都市計画区域外に設けることが合理的な施設もあるため、区域外にも定めることが認められている。"},{"text":"市街化区域及び区域区分が定められていない都市計画区域については、少なくとも道路、公園及び下水道を定めるものとされている。","is_correct":false,"explanation":"正しい。市街地となる区域における生活基盤の最低限のセットとして、道路・公園・下水道の3つが挙げられている。"},{"text":"住居系の用途地域については、義務教育施設をも定めるものとされている。","is_correct":false,"explanation":"正しい。住居の環境を支える施設として、住居系用途地域には義務教育施設(小学校・中学校)をも定めることとされている。"},{"text":"市街地開発事業は、市街化調整区域内においても定めることができる。","is_correct":true,"explanation":"誤り。市街地開発事業は市街地を積極的に開発・整備する事業であるため、市街化区域又は区域区分が定められていない都市計画区域内においてのみ定めることができ、市街化を抑制すべき市街化調整区域には定められない。"}],"explanation":"都市施設は必要に応じて都市計画区域外にも定められる柔軟な制度であるのに対し、市街地開発事業は面的な市街地整備を行うものであるため市街化調整区域には定められない。「道路・公園・下水道」「義務教育施設」という必須セットも頻出である。","difficulty":2,"tags":["法令上の制限","都市計画法","都市施設"],"shuffle_choices":true},{"id":"Q3008","topic":"都市計画法","question_type":"select_correct","question":"都市計画の決定手続及び都市計画制限に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"都道府県は、都市計画の案を作成しようとする場合においては、必ず公聴会を開催しなければならない。","is_correct":false,"explanation":"公聴会・説明会の開催は「必要があると認めるとき」に行えば足り、常に開催が義務付けられているわけではない。"},{"text":"都市計画を決定しようとする旨の公告があったときは、都市計画の案は、公告の日から1週間、公衆の縦覧に供される。","is_correct":false,"explanation":"縦覧期間は1週間ではなく2週間である。この期間内に住民及び利害関係人は意見書を提出できる。"},{"text":"都市計画施設の区域内において建築物の建築をしようとする者は、原則として、都道府県知事(市の区域内にあっては当該市の長)の許可を受けなければならない。","is_correct":true,"explanation":"都市計画施設の区域又は市街地開発事業の施行区域内では、将来の事業の円滑な施行を確保するため、建築物の建築には原則として知事等の許可(法53条)が必要である。"},{"text":"都市計画の案について意見書を提出することができるのは、関係市町村の住民に限られ、利害関係人は提出することができない。","is_correct":false,"explanation":"意見書は住民及び利害関係人が提出できる。区域外に住む土地所有者などの利害関係人も排除されない。"}],"explanation":"都市計画の決定手続では「公聴会は必要があるとき」「縦覧は2週間」「意見書は住民及び利害関係人」という3点が数字・主体の引っ掛けとして問われやすい。また、都市計画施設の区域内の建築が許可制(53条)とされているのは、将来の事業実施の支障を防ぐためである。","difficulty":2,"tags":["法令上の制限","都市計画法","決定手続"],"shuffle_choices":true},{"id":"Q3009","topic":"都市計画法","question_type":"select_correct","question":"開発行為及び特定工作物に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"建築物の建築の用に供する目的でない、青空駐車場とするためだけの土地の区画形質の変更も、開発行為に該当する。","is_correct":false,"explanation":"開発行為とは、主として建築物の建築又は特定工作物の建設の用に供する目的で行う土地の区画形質の変更をいう。建築等の目的を伴わない区画形質の変更は開発行為に該当しない。"},{"text":"ゴルフコースは、その規模にかかわらず、第二種特定工作物に該当する。","is_correct":true,"explanation":"ゴルフコースは面積要件なしに第二種特定工作物とされている。1ヘクタール以上という要件が付くのは野球場・庭球場・遊園地・墓園などであり、この違いが頻出論点である。"},{"text":"野球場は、その規模にかかわらず、第二種特定工作物に該当する。","is_correct":false,"explanation":"野球場は、その規模が1ヘクタール以上のものに限り第二種特定工作物に該当する。規模を問わないのはゴルフコースである。"},{"text":"コンクリートプラントは、第二種特定工作物に該当する。","is_correct":false,"explanation":"コンクリートプラントやアスファルトプラントなど周辺環境の悪化をもたらすおそれのある工作物は、第一種特定工作物である。"}],"explanation":"開発行為の定義は「建築物の建築・特定工作物の建設目的+土地の区画形質の変更」の両方を満たすことが必要である。特定工作物では、第一種(環境悪化のおそれのあるプラント類)と第二種(ゴルフコースは規模不問、野球場等は1ha以上)の区別が最重要である。","difficulty":2,"tags":["法令上の制限","都市計画法","開発許可"],"shuffle_choices":true},{"id":"Q3010","topic":"都市計画法","question_type":"select_correct","question":"開発許可の要否に関する次の記述のうち、正しいものはどれか。なお、いずれの開発行為も自己の居住用の住宅の建築を目的とするものとし、許可不要の例外には該当しないものとする。","choices":[{"text":"市街化区域内において行う800平方メートルの開発行為には、都道府県知事の許可が必要である。","is_correct":false,"explanation":"市街化区域では1,000平方メートル以上の開発行為が許可の対象となる。800平方メートルは基準未満であるため許可不要である。"},{"text":"準都市計画区域内において行う2,000平方メートルの開発行為には、都道府県知事の許可が必要である。","is_correct":false,"explanation":"準都市計画区域では3,000平方メートル以上の開発行為が許可の対象となる。2,000平方メートルは基準未満であるため許可不要である。"},{"text":"都市計画区域及び準都市計画区域のいずれにも該当しない区域内において行う5,000平方メートルの開発行為には、都道府県知事の許可が必要である。","is_correct":false,"explanation":"両区域外では1ヘクタール(10,000平方メートル)以上の開発行為が許可の対象となる。5,000平方メートルは基準未満であるため許可不要である。"},{"text":"区域区分が定められていない都市計画区域内において行う4,000平方メートルの開発行為には、都道府県知事の許可が必要である。","is_correct":true,"explanation":"非線引き都市計画区域では3,000平方メートル以上の開発行為が許可の対象となる。4,000平方メートルは基準以上であるため許可が必要である。"}],"explanation":"開発許可の面積基準は、市街化区域1,000平方メートル、非線引き都市計画区域及び準都市計画区域3,000平方メートル、両区域外1ヘクタールであり、市街化調整区域には面積基準がなく規模を問わず許可が必要である。数字の暗記が得点に直結する論点である。","difficulty":1,"tags":["法令上の制限","都市計画法","開発許可"],"shuffle_choices":true},{"id":"Q3011","topic":"都市計画法","question_type":"select_incorrect","question":"開発許可が不要となる開発行為に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"市街化調整区域内において、農業を営む者の居住の用に供する建築物の建築を目的として行う開発行為は、その規模にかかわらず、開発許可は不要である。","is_correct":false,"explanation":"正しい。市街化区域以外の区域では、農林漁業用建築物及び農林漁業を営む者の居住用建築物のための開発行為は規模を問わず許可不要とされている。"},{"text":"市街化区域内において、畜舎の建築を目的として行う1,500平方メートルの開発行為は、開発許可が不要である。","is_correct":true,"explanation":"誤り。農林漁業用建築物に関する例外は市街化区域には適用されない。市街化区域内では面積基準のみで判断されるため、1,000平方メートル以上である本肢の開発行為には許可が必要である。"},{"text":"駅舎、図書館、公民館など公益上必要な一定の建築物の建築を目的として行う開発行為は、行われる区域や規模にかかわらず、開発許可は不要である。","is_correct":false,"explanation":"正しい。駅舎・図書館・公民館・変電所などの一定の公益施設のための開発行為は、どの区域でも規模を問わず許可不要である。なお、病院・学校・社会福祉施設はこの例外に含まれない点に注意する。"},{"text":"都市計画事業の施行として行う開発行為は、開発許可が不要である。","is_correct":false,"explanation":"正しい。都市計画事業は認可等の手続で公共性が担保されているため、その施行として行う開発行為に重ねて開発許可を求める必要はないとされている。"}],"explanation":"農林漁業用建築物の例外は「市街化区域以外」に限って適用されるため、市街化区域内では畜舎や温室のための開発行為であっても面積基準(1,000平方メートル以上)により許可の要否を判断する。公益施設の例外に病院・学校等が含まれない点と併せて整理したい。","difficulty":2,"tags":["法令上の制限","都市計画法","開発許可"],"shuffle_choices":true},{"id":"Q3012","topic":"都市計画法","question_type":"select_correct","question":"市街化調整区域内における開発許可に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"市街化調整区域内において、社会福祉施設の建築を目的として行う開発行為は、その規模にかかわらず、原則として開発許可が必要である。","is_correct":true,"explanation":"病院・学校・社会福祉施設は許可不要となる公益上必要な建築物の例外には含まれておらず、市街化調整区域には面積基準もないため、規模にかかわらず原則として開発許可が必要である。"},{"text":"市街化調整区域内において、農産物の集荷の用に供する建築物の建築を目的として行う開発行為は、その規模にかかわらず、開発許可が必要である。","is_correct":false,"explanation":"農産物の生産・集荷の用に供する建築物は農林漁業用建築物に当たり、市街化区域以外の区域では規模を問わず開発許可は不要である。"},{"text":"市街化調整区域内において行う300平方メートルの開発行為は、小規模であるため、開発許可は不要である。","is_correct":false,"explanation":"市街化調整区域には面積による許可不要の基準が設けられていないため、小規模な開発行為であっても原則として許可が必要である。"},{"text":"市街化調整区域内において、図書館の建築を目的として行う開発行為は、開発許可が必要である。","is_correct":false,"explanation":"図書館は公益上必要な建築物の例外に該当するため、市街化調整区域内であっても開発許可は不要である。"}],"explanation":"市街化調整区域は市街化を抑制すべき区域であるため面積基準による例外がなく、規模を問わず開発許可が必要となるのが原則である。そのうえで、農林漁業用建築物や図書館等の公益施設の例外に該当するか、病院・学校・社会福祉施設のように例外から外れているかを個別に判定する。","difficulty":3,"tags":["法令上の制限","都市計画法","開発許可"],"shuffle_choices":true},{"id":"Q3013","topic":"都市計画法","question_type":"select_correct","question":"開発許可の手続に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"開発許可を申請しようとする者は、あらかじめ、開発区域内の土地について権利を有するすべての者の同意を得なければならない。","is_correct":false,"explanation":"必要とされるのは「相当数の同意」であり、すべての権利者の同意までは要求されていない。"},{"text":"開発行為に関係がある公共施設の管理者とは、あらかじめ協議すれば足り、その同意を得る必要はない。","is_correct":false,"explanation":"既存の公共施設(開発行為に関係がある公共施設)の管理者については、協議したうえでその同意を得なければならない。協議のみで足りるのは、開発行為により新たに設置される公共施設の管理予定者である。"},{"text":"開発行為により設置される公共施設を管理することとなる者とは、あらかじめ協議しなければならないが、その同意までは要しない。","is_correct":true,"explanation":"新設される公共施設の管理予定者については協議が要求されるにとどまり、同意までは不要である。既存施設の管理者(協議+同意)との対比で覚える。"},{"text":"開発許可を受けた者から開発区域内の土地の所有権を取得して開発行為を行おうとする者は、都道府県知事の承認を受けることなく、当然に開発許可に基づく地位を承継する。","is_correct":false,"explanation":"特定承継人(売買等で地位を引き継ぐ者)は、都道府県知事の承認を受けて初めて地位を承継できる。承認なしに当然承継するのは相続人などの一般承継人である。"}],"explanation":"開発許可の手続では、既存の公共施設管理者は「協議+同意」、新設施設の管理予定者は「協議のみ」、権利者は「相当数の同意」という3つの区別が核心である。地位の承継についても、一般承継は当然、特定承継は知事の承認が必要という対比を押さえたい。","difficulty":2,"tags":["法令上の制限","都市計画法","開発許可"],"shuffle_choices":true},{"id":"Q3014","topic":"都市計画法","question_type":"select_incorrect","question":"開発許可を受けた開発区域内における、工事完了の公告前の建築等の制限に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"工事完了の公告があるまでの間は、原則として、開発区域内において建築物を建築することができない。","is_correct":false,"explanation":"正しい。造成工事中の区域で建築を認めると工事の施行に支障が生じるため、完了公告前の建築等は原則禁止されている。"},{"text":"開発行為に関する工事用の仮設建築物は、工事完了の公告前であっても建築することができる。","is_correct":false,"explanation":"正しい。工事のための現場事務所などの仮設建築物は、例外として公告前でも建築できる。"},{"text":"開発行為に同意していない土地の所有者は、工事完了の公告前であっても、その権利の行使として建築物を建築することができる。","is_correct":false,"explanation":"正しい。開発行為に同意していない権利者の権利行使まで制限することはできないため、例外として建築が認められている。"},{"text":"工事完了の公告前であっても、都道府県知事に届け出れば、建築物を建築することができる。","is_correct":true,"explanation":"誤り。公告前に建築できる例外は、工事用仮設建築物、知事が支障がないと認めたとき、不同意の権利者の権利行使の3つであり、「届出」により建築できる制度は存在しない。知事が支障ないと「認めた」場合であり、届出制と混同させる引っ掛けである。"}],"explanation":"工事完了公告前の開発区域内では建築等が原則禁止され、例外は①工事用仮設建築物、②知事が支障がないと認めたとき、③不同意の権利者の権利行使の3つに限られる。「届出」で足りるとする肢は例外の要件をすり替えた典型的な誤りパターンである。","difficulty":2,"tags":["法令上の制限","都市計画法","開発許可"],"shuffle_choices":true},{"id":"Q3015","topic":"都市計画法","question_type":"select_correct","question":"開発許可を受けた開発区域内における、工事完了の公告後の建築等の制限に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"工事完了の公告後は、都道府県知事が許可したとき又は開発区域内に用途地域等が定められているときを除き、予定建築物以外の建築物を新築することができない。","is_correct":true,"explanation":"完了公告後の開発区域内では、開発許可の内容との整合性を保つため予定建築物以外の建築等が原則禁止されるが、知事の許可があるとき、又は用途地域等が定められているときは例外となる。"},{"text":"工事完了の公告後は、開発区域内において、どのような建築物でも自由に新築することができる。","is_correct":false,"explanation":"完了公告後も予定建築物等以外の建築物の新築等は原則として禁止されており、自由に建築できるわけではない。"},{"text":"開発区域内に用途地域が定められている場合であっても、予定建築物以外の建築物を新築することは一切できない。","is_correct":false,"explanation":"用途地域等が定められている場合は、この制限の例外となり、用途地域による用途制限に適合する限り予定建築物以外の建築物も新築できる。"},{"text":"予定建築物を新築する場合であっても、改めて都道府県知事の許可を受けなければならない。","is_correct":false,"explanation":"予定建築物の新築は開発許可の内容どおりの建築であるため、改めて知事の許可を受ける必要はない。"}],"explanation":"完了公告後の制限は、開発許可で予定された土地利用を担保するためのものである。したがって予定建築物の建築は当然に可能であり、予定外の建築は知事の許可又は用途地域等の指定がある場合に限り認められる。","difficulty":1,"tags":["法令上の制限","都市計画法","開発許可"],"shuffle_choices":true},{"id":"Q3016","topic":"都市計画法","question_type":"select_correct","question":"市街化調整区域のうち開発許可を受けた開発区域以外の区域内における建築等の制限及び開発許可に関する不服申立てについての次の記述のうち、正しいものはどれか。","choices":[{"text":"市街化調整区域のうち開発許可を受けた開発区域以外の区域内においては、延べ面積200平方メートル以内の住宅であれば、都道府県知事の許可を受けることなく新築することができる。","is_correct":false,"explanation":"法43条の建築等の制限には建築物の規模による例外は設けられていない。小規模な住宅であっても、原則として知事の許可が必要である。"},{"text":"開発許可に関する処分に不服がある者は、開発審査会に対して審査請求をすることができる。","is_correct":true,"explanation":"開発許可に関する処分についての審査請求は、専門的な判断を要するため、開発審査会に対して行うこととされている。"},{"text":"市街化調整区域のうち開発許可を受けた開発区域以外の区域内において、仮設建築物を新築する場合にも、都道府県知事の許可を受けなければならない。","is_correct":false,"explanation":"仮設建築物の新築は法43条の許可が不要とされる例外に該当する。ほかに農林漁業用建築物、公益上必要な建築物、都市計画事業の施行として行うもの、非常災害の応急措置、通常の管理行為・軽易な行為なども例外である。"},{"text":"市街化区域内においても、開発許可を受けた開発区域以外の区域内で建築物を新築するときは、都道府県知事の許可を受けなければならない。","is_correct":false,"explanation":"法43条の建築等の制限は市街化調整区域についてのみ適用される制度であり、市街化区域には適用されない。"}],"explanation":"法43条は、開発許可制度の潜脱を防ぐため、市街化調整区域の開発区域以外の土地における建築等にも知事の許可を要求する制度であり、面積による例外はない。開発許可関係の処分への審査請求先が開発審査会である点も、行政不服審査の一般原則との違いとして押さえたい。","difficulty":3,"tags":["法令上の制限","都市計画法","開発許可"],"shuffle_choices":true},{"id":"Q3017","topic":"建築基準法","question_type":"select_correct","question":"建築確認に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"都市計画区域及び準都市計画区域のいずれにも該当しない区域内において、木造平屋建て・延べ面積150平方メートルの一戸建て住宅を新築する場合、建築確認を受けなければならない。","is_correct":false,"explanation":"平屋かつ延べ面積200平方メートル以下の建築物の新築は、都市計画区域・準都市計画区域等の区域内で行う場合に限り建築確認の対象となる。両区域外での本肢の新築には確認は不要である。"},{"text":"延べ面積300平方メートルの倉庫を事務所に用途変更する場合、建築確認を受けなければならない。","is_correct":false,"explanation":"用途変更で建築確認が必要となるのは、変更後の用途が床面積200平方メートルを超える特殊建築物となる場合である。事務所は特殊建築物ではないため、本肢の用途変更に確認は不要である。"},{"text":"階数が2以上又は延べ面積が200平方メートルを超える建築物を新築する場合は、都市計画区域及び準都市計画区域外の区域においても、建築確認を受けなければならない。","is_correct":true,"explanation":"階数2以上又は延べ面積200平方メートル超の建築物は、木造・非木造を問わず、全国どの区域で新築する場合でも建築確認が必要である。"},{"text":"都市計画区域及び準都市計画区域のいずれにも該当しない区域内において、平屋建て・延べ面積180平方メートルの飲食店を新築する場合、建築確認を受けなければならない。","is_correct":false,"explanation":"飲食店は特殊建築物であるが、その用途に供する床面積が200平方メートル以下であり、かつ平屋・200平方メートル以下の建築物であるため、都市計画区域等の外で新築する場合には建築確認は不要である。"}],"explanation":"現行法では、床面積200平方メートル超の特殊建築物と、階数2以上又は延べ面積200平方メートル超の建築物は全国で建築確認が必要であり、平屋かつ200平方メートル以下の小規模建築物のみ都市計画区域内等に限って確認を要する。用途変更は200平方メートル超の特殊建築物となる場合に確認が必要という点も併せて整理したい。","difficulty":3,"tags":["法令上の制限","建築基準法","建築確認"],"shuffle_choices":true},{"id":"Q3018","topic":"建築基準法","question_type":"select_incorrect","question":"建築確認に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"延べ面積250平方メートルの事務所を共同住宅に用途変更する場合、建築確認を受ける必要はない。","is_correct":true,"explanation":"誤り。共同住宅は特殊建築物であり、その用途に供する床面積が200平方メートルを超えることとなる用途変更には建築確認が必要である。"},{"text":"ホテルを旅館に用途変更する場合のように、類似の用途相互間の用途変更については、建築確認は不要である。","is_correct":false,"explanation":"正しい。ホテルと旅館、劇場と映画館など政令で定める類似用途相互間の変更は、確認を要しない。"},{"text":"階数が2以上又は延べ面積が200平方メートルを超える建築物について大規模の修繕をする場合は、建築確認を受けなければならない。","is_correct":false,"explanation":"正しい。新築だけでなく、大規模の修繕・大規模の模様替も一定規模以上の建築物については確認の対象となる。"},{"text":"防火地域及び準防火地域外において建築物を増築する場合、その増築に係る部分の床面積の合計が10平方メートル以内であれば、建築確認は不要である。","is_correct":false,"explanation":"正しい。防火地域・準防火地域外での10平方メートル以内の増改築・移転は確認不要とされている。両地域内ではこの緩和はなく、規模を問わず確認が必要となる点に注意する。"}],"explanation":"用途変更の確認は「200平方メートル超の特殊建築物になる場合に必要、類似用途間は不要」という2つのルールで判断する。また、10平方メートル以内の増改築・移転の確認不要の扱いは防火地域・準防火地域外に限られることも頻出である。","difficulty":3,"tags":["法令上の制限","建築基準法","建築確認"],"shuffle_choices":true},{"id":"Q3019","topic":"建築基準法","question_type":"select_correct","question":"完了検査及び中間検査に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"建築主は、建築確認を受けた工事を完了したときは、工事が完了した日から7日以内に建築主事等に到達するように、完了検査を申請しなければならない。","is_correct":false,"explanation":"完了検査の申請は、工事完了の日から4日以内に建築主事等に到達するようにしなければならない。7日ではない。"},{"text":"建築確認を受けた建築物は、その規模や用途にかかわらず、検査済証の交付を受けた後でなければ使用することができない。","is_correct":false,"explanation":"検査済証交付前の使用制限が課されるのは一定規模以上の建築物等であり、また仮使用の認定を受ければ交付前でも使用できるため、「規模や用途にかかわらず一切使用できない」とする点が誤りである。"},{"text":"中間検査において特定工程に係る工事が建築基準関係規定に適合しない場合でも、建築主は、当該特定工程後の工程に係る工事を続行することができる。","is_correct":false,"explanation":"特定工程後の工程に係る工事は、中間検査合格証の交付を受けた後でなければ施工することができない。不適合のまま続行することはできない。"},{"text":"特定行政庁等が、安全上、防火上及び避難上支障がないとして仮使用の認定をしたときは、検査済証の交付を受ける前であっても、建築物を仮に使用することができる。","is_correct":true,"explanation":"仮使用の認定制度により、検査済証の交付前であっても認定を受けた範囲で建築物を使用することが認められている。"}],"explanation":"完了検査は「完了日から4日以内到達」で申請し、一定の建築物は検査済証の交付までは原則使用できないが、仮使用の認定という例外がある。中間検査は特定工程について行われ、合格証の交付がなければ後続工程に進めないという工事の安全担保の仕組みである。","difficulty":2,"tags":["法令上の制限","建築基準法","建築確認"],"shuffle_choices":true},{"id":"Q3020","topic":"建築基準法","question_type":"select_correct","question":"建築協定に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"建築協定を締結するには、建築協定区域内の土地の所有者等の過半数の合意があれば足りる。","is_correct":false,"explanation":"建築協定の締結には、土地の所有者等の全員の合意が必要である。過半数で足りるのは廃止の場合である。"},{"text":"建築協定を廃止するには、建築協定区域内の土地の所有者等の過半数の合意があれば足りる。","is_correct":true,"explanation":"廃止は制限をなくす方向の行為であるため、全員合意までは不要とされ、過半数の合意と特定行政庁の認可で足りる。締結・変更(全員合意)との対比で覚える。"},{"text":"借地権の目的となっている土地については、建築協定の締結に当たり、借地権者と土地の所有者の双方の合意を得なければならない。","is_correct":false,"explanation":"借地権の目的となっている土地については、借地権者の合意があれば足り、土地所有者の合意は不要とされている。実際にその土地を利用する者の意思を重視する趣旨である。"},{"text":"土地の所有者が一人しかいない場合に定められた建築協定(いわゆる一人協定)は、特定行政庁の認可の日から直ちにその効力を生ずる。","is_correct":false,"explanation":"一人協定は、認可の日から起算して3年以内に、当該区域内の土地に二以上の土地所有者等が存することとなった時から効力を生ずる。認可の日から直ちに効力が生じるわけではない。"}],"explanation":"建築協定は住民の自主的なまちづくりルールであり、締結・変更は全員合意、廃止は過半数合意という数の違いが最頻出である。借地権付きの土地では借地権者の合意で足りる点、一人協定の効力発生時期も定番の論点である。","difficulty":2,"tags":["法令上の制限","建築基準法","建築協定"],"shuffle_choices":true},{"id":"Q3021","topic":"建築基準法","question_type":"select_correct","question":"建築物の単体規定(採光・換気等)に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"住宅の居室には、原則として、その床面積に対して7分の1以上の採光に有効な部分の面積を有する開口部を設けなければならない。","is_correct":true,"explanation":"住宅の居住のための居室の採光上有効な開口部の割合は、原則として床面積の7分の1以上である。なお、一定の照明設備の設置等の措置を講じた場合には10分の1まで緩和され得る。"},{"text":"居室には、原則として、その床面積に対して25分の1以上の換気に有効な部分の面積を有する開口部を設けなければならない。","is_correct":false,"explanation":"換気に有効な開口部の割合は床面積の20分の1以上である。25分の1ではない。"},{"text":"採光に関する規定は、住宅に限らず、事務所の執務室を含むすべての建築物の居室に適用される。","is_correct":false,"explanation":"採光規定の対象は住宅、学校、病院、寄宿舎など一定の建築物の居室に限られており、事務所の執務室には適用されない。"},{"text":"便所には、採光及び換気のため直接外気に接する窓を必ず設けなければならず、これに代わる設備で代用することはできない。","is_correct":false,"explanation":"便所には採光・換気のため直接外気に接する窓を設けるのが原則であるが、水洗便所で照明設備及び換気設備を設けたものについては窓を設けなくてもよい。"}],"explanation":"採光は原則7分の1以上(一定の措置で10分の1まで緩和可)、換気は20分の1以上という数字の対比が基本である。採光規定は住宅等の一定の居室のみが対象であること、便所の窓は代替設備で足りることも押さえておきたい。","difficulty":1,"tags":["法令上の制限","建築基準法","単体規定"],"shuffle_choices":true},{"id":"Q3022","topic":"建築基準法","question_type":"select_incorrect","question":"建築物の単体規定に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"高さ20メートルを超える建築物には、原則として、有効に避雷設備を設けなければならない。","is_correct":false,"explanation":"正しい。避雷設備の設置義務は高さ20メートル超の建築物に課される。周囲の状況によって安全上支障がない場合は例外となる。"},{"text":"高さ31メートルを超える建築物には、原則として、非常用の昇降機を設けなければならない。","is_correct":false,"explanation":"正しい。非常用昇降機の設置義務は高さ31メートル超の建築物に課される。避雷設備の20メートルとの数字の対比が頻出である。"},{"text":"石綿は、あらかじめ飛散又は発散を防止する措置を講じれば、建築材料として使用することができる。","is_correct":true,"explanation":"誤り。建築物は石綿等をあらかじめ添加した建築材料を使用してはならないのが原則であり、飛散防止措置を講じれば使用できるという規定はない。石綿等の使用は厳格に禁止されている。"},{"text":"単体規定は、都市計画区域及び準都市計画区域の内外を問わず、全国のすべての建築物に適用される。","is_correct":false,"explanation":"正しい。単体規定は個々の建築物の安全性・衛生を確保する最低基準であるため、区域を問わず全国で適用される。集団規定が原則として都市計画区域等内でのみ適用されるのと対照的である。"}],"explanation":"単体規定は建築物単体の安全・衛生の最低基準であり全国一律に適用される。避雷設備20メートル超、非常用昇降機31メートル超という数字と、石綿の使用が原則として全面的に禁止されている点を正確に押さえたい。","difficulty":2,"tags":["法令上の制限","建築基準法","単体規定"],"shuffle_choices":true},{"id":"Q3023","topic":"建築基準法","question_type":"select_correct","question":"建築基準法上の道路に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"建築基準法上の道路は、原則として幅員6メートル以上のものをいう。","is_correct":false,"explanation":"建築基準法上の道路は原則として幅員4メートル以上のものをいう。6メートル以上とされるのは特定行政庁が指定する区域内に限られる。"},{"text":"幅員4メートル未満の道は、すべて建築基準法第42条第2項の道路(いわゆる2項道路)として扱われる。","is_correct":false,"explanation":"2項道路となるのは、集団規定の適用の際すでに建築物が立ち並んでいた幅員4メートル未満の道で、特定行政庁が指定したものに限られる。幅員4メートル未満の道がすべて道路となるわけではない。"},{"text":"2項道路において道路の境界線とみなされた線と道との間の部分(セットバック部分)には、建築物は建築できないが、門や塀であれば築造することができる。","is_correct":false,"explanation":"セットバック部分は道路とみなされるため、建築物の建築だけでなく、門や塀の築造もできない。また、この部分は建蔽率・容積率の算定上、敷地面積に算入されない。"},{"text":"2項道路については、原則として、道路の中心線から水平距離2メートルの線が道路の境界線とみなされる。","is_correct":true,"explanation":"2項道路では中心線から水平距離2メートル後退した線が道路境界線とみなされ、将来の建替え時に幅員4メートルの道路空間が確保される仕組みになっている。片側ががけ地や川などの場合は、その側から4メートルの線となる。"}],"explanation":"建築基準法上の道路は原則幅員4メートル以上であり、2項道路は「基準時に建築物が立ち並んでいた4メートル未満の道+特定行政庁の指定」という要件で例外的に道路とされる。セットバック部分は道路とみなされるため建築や塀の築造ができず、敷地面積にも算入されない。","difficulty":1,"tags":["法令上の制限","建築基準法","道路"],"shuffle_choices":true},{"id":"Q3024","topic":"建築基準法","question_type":"select_correct","question":"接道義務及び道路内の建築制限に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"建築物の敷地は、原則として、建築基準法上の道路に1メートル以上接しなければならない。","is_correct":false,"explanation":"接道義務は原則として2メートル以上である。避難や消防活動のための通路を確保する趣旨である。"},{"text":"地方公共団体は、特殊建築物や階数が3以上の建築物などについて、条例で、接道義務に関する制限を付加することができる。","is_correct":true,"explanation":"避難・通行の安全確保のため必要な場合、地方公共団体は条例で接道義務を強化(付加)できる。逆に条例で緩和することはできない点が対になる論点である。"},{"text":"地盤面下に設ける建築物であっても、道路内に建築することはできない。","is_correct":false,"explanation":"地下街のように地盤面下に設ける建築物は、道路内に建築することができる。道路内建築の禁止の例外である。"},{"text":"公衆便所や巡査派出所は、公益上必要な建築物であるため、特定行政庁の許可を受けることなく道路内に建築することができる。","is_correct":false,"explanation":"公衆便所・巡査派出所等の公益上必要な建築物であっても、道路内に建築するには通行上支障がないものとして特定行政庁が建築審査会の同意を得て許可することが必要である。無許可で建築できるわけではない。"}],"explanation":"接道義務は原則2メートル以上であり、条例による「付加」は可能だが「緩和」は不可という方向性が重要である。道路内建築の禁止についても、地盤面下の建築物は例外、公衆便所等は特定行政庁の許可が要件という違いを区別したい。","difficulty":2,"tags":["法令上の制限","建築基準法","道路"],"shuffle_choices":true},{"id":"Q3025","topic":"建築基準法","question_type":"select_incorrect","question":"用途地域内の建築物の用途制限に関する次の記述のうち、誤っているものはどれか。ただし、特定行政庁の許可については考慮しないものとする。","choices":[{"text":"住宅は、すべての用途地域内において建築することができる。","is_correct":true,"explanation":"誤り。住宅は工業専用地域内では建築することができない。住宅が建築できないのは工業専用地域のみであるが、「すべての用途地域で可」とする本肢は誤りである。"},{"text":"神社、寺院、教会は、すべての用途地域内において建築することができる。","is_correct":false,"explanation":"正しい。宗教施設は地域の生活と密接に関わるため、すべての用途地域で建築可能とされている。"},{"text":"診療所は、すべての用途地域内において建築することができる。","is_correct":false,"explanation":"正しい。診療所はすべての用途地域で建築できる。なお、病院は第一種・第二種低層住居専用地域、田園住居地域、工業地域、
