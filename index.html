planation":"代金400万円超のため速算式により3,000万円×3%+6万円=96万円、消費税等相当額を加えた96万円×1.1=105万6,000円が依頼者の一方から受領できる上限となる。"},{"text":"AがBから受領できる報酬の上限額は、代金の3%に消費税等相当額を加えた99万円である。","is_correct":false,"explanation":"代金400万円超の速算式は「代金×3%+6万円」であり、6万円の加算を落とすと誤った金額になる。正しくは(90万円+6万円)×1.1=105万6,000円である。"},{"text":"Aが売主からも媒介の依頼を受けて契約を成立させた場合でも、AがB及び売主から受領できる報酬の合計額は105万6,000円が上限である。","is_correct":false,"explanation":"媒介の場合、依頼者それぞれから105万6,000円まで受領でき、双方から依頼を受ければ合計211万2,000円まで受領できる。"}],"explanation":"売買の媒介の報酬は、代金400万円超の場合「代金×3%+6万円」の速算式で計算した額が依頼者の一方から受領できる上限であり、課税事業者はこれに消費税等相当額(10%)を加算できる。媒介では各依頼者からそれぞれ上限額まで受領できる点も併せて押さえたい。","difficulty":2,"tags":["宅建業法","報酬"],"shuffle_choices":true},{"id":"Q1075","topic":"報酬に関する制限","question_type":"select_correct","question":"宅地建物取引業者A(消費税課税事業者)は、宅地(代金2,000万円。消費税等相当額を含まない)の売買について売主Cから代理の依頼を受け、契約を成立させた。AがCから受領できる報酬に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"受領できる報酬の上限額は、72万6,000円である。","is_correct":false,"explanation":"72万6,000円(66万円×1.1)は媒介の場合の上限額である。代理の場合は媒介の2倍まで受領できる。"},{"text":"受領できる報酬の上限額は、132万円である。","is_correct":false,"explanation":"132万円は速算式の額66万円を2倍しただけの本体額であり、課税事業者Aは消費税等相当額を加算した145万2,000円まで受領できる。"},{"text":"代理の場合も媒介の場合と同額が上限となるため、受領できる報酬の上限額は72万6,000円である。","is_correct":false,"explanation":"代理の報酬上限は、媒介の場合の速算式で計算した額の2倍であり、媒介と同額ではない。"},{"text":"受領できる報酬の上限額は、145万2,000円である。","is_correct":true,"explanation":"2,000万円×3%+6万円=66万円、代理はその2倍の132万円が本体額の上限で、消費税等相当額を加えた132万円×1.1=145万2,000円まで受領できる。"}],"explanation":"売買の代理の報酬上限は、媒介の速算式で求めた額の2倍であり、課税事業者はさらに消費税等相当額を加算できる。なお、代理と媒介が併存する取引でも、業者全体が受領できる報酬の合計は速算式の2倍が限度となる。","difficulty":2,"tags":["宅建業法","報酬"],"shuffle_choices":true},{"id":"Q1076","topic":"報酬に関する制限","question_type":"select_correct","question":"宅地(代金1,000万円。消費税等相当額を含まない)の売買について、宅地建物取引業者A(課税事業者)が売主から、宅地建物取引業者B(課税事業者)が買主から、それぞれ媒介の依頼を受けて契約を成立させた。この場合の報酬に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"A及びBは、それぞれの依頼者から39万6,000円を上限として報酬を受領することができる。","is_correct":true,"explanation":"1,000万円×3%+6万円=36万円、消費税等相当額を加えて36万円×1.1=39万6,000円が、各業者がそれぞれの依頼者から受領できる上限である。"},{"text":"AとBが受領できる報酬は、両者の合計で39万6,000円が上限である。","is_correct":false,"explanation":"AとBはそれぞれ別個の依頼者から媒介の依頼を受けているため、各自が自己の依頼者から39万6,000円まで受領できる。"},{"text":"Aが代理、Bが媒介として関与した場合には、AとBが受領できる報酬の合計額は、速算式で計算した額の2倍に消費税等相当額を加えた額を超えることができる。","is_correct":false,"explanation":"複数の業者が代理・媒介として関与する場合でも、業者全体で受領できる報酬の合計は、速算式で計算した額の2倍(消費税等相当額を含め79万2,000円)が限度である。"},{"text":"Aが売主・買主の双方から媒介の依頼を受けた場合、Aは双方から合計118万8,000円まで報酬を受領することができる。","is_correct":false,"explanation":"一の業者が双方から媒介の依頼を受けた場合、各依頼者からの上限は39万6,000円ずつであり、合計の上限は79万2,000円である。118万8,000円まで受領することはできない。"}],"explanation":"媒介の報酬は依頼者ごとに速算式の額(消費税等相当額を含む)が上限となり、複数の業者が関与しても、取引全体で受領できる報酬の合計は速算式の2倍が限度である。代理が絡む場合もこの総枠規制を超えることはできない。","difficulty":2,"tags":["宅建業法","報酬"],"shuffle_choices":true},{"id":"Q1077","topic":"報酬に関する制限","question_type":"select_incorrect","question":"建物の貸借の媒介における報酬に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。なお、宅地建物取引業者はいずれも消費税課税事業者とする。","choices":[{"text":"貸借の媒介の報酬は、貸主・借主の双方から受領する場合、その合計額が借賃1か月分の1.1倍以内でなければならない。","is_correct":false,"explanation":"正しい。貸借の媒介の報酬は、依頼者双方から受ける額の合計で借賃1か月分(消費税等相当額を含め1.1倍)が上限である。"},{"text":"居住用建物の貸借の媒介では、媒介の依頼を受けるにあたって承諾を得ている場合を除き、依頼者の一方から受領できる報酬は借賃の2分の1か月分の1.1倍以内である。","is_correct":false,"explanation":"正しい。居住用建物の貸借の媒介では、依頼を受けるにあたって依頼者の承諾がある場合を除き、一方から受領できるのは借賃0.5か月分の1.1倍までである。"},{"text":"居住用建物の貸借の媒介において、貸主及び借主双方の承諾を得た場合には、双方から受領する報酬の合計額を借賃2か月分まで引き上げることができる。","is_correct":true,"explanation":"誤り。承諾があれば一方からの受領割合を変えることはできるが、双方から受ける報酬の合計が借賃1か月分の1.1倍以内という総枠は、承諾があっても超えることができない。"},{"text":"事務所用建物の貸借の媒介では、依頼者の一方から借賃1か月分の1.1倍以内の報酬を受領することができるが、双方から受ける合計額も借賃1か月分の1.1倍以内でなければならない。","is_correct":false,"explanation":"正しい。居住用建物以外の貸借では一方からの受領割合に制限はないが、合計は借賃1か月分の1.1倍が上限である。"}],"explanation":"貸借の媒介の報酬は、依頼者双方からの合計で借賃1か月分(税込1.1倍)が絶対的な上限であり、居住用建物では原則として一方から0.5か月分までという内訳の制限が加わる。承諾によって緩和されるのは内訳の制限のみで、合計の上限は動かない。","difficulty":2,"tags":["宅建業法","報酬","貸借"],"shuffle_choices":true},{"id":"Q1078","topic":"報酬に関する制限","question_type":"select_correct","question":"宅地建物取引業者A(消費税課税事業者)は、事務所用建物の貸借(借賃月額20万円、権利金400万円。いずれも消費税等相当額を含まない。権利金は権利設定の対価として支払われ、返還されないもの)の媒介の依頼を貸主・借主双方から受け、契約を成立させた。この場合の報酬に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"居住用建物の貸借であっても、権利金の授受があれば、権利金の額を売買代金とみなして報酬を計算することができる。","is_correct":false,"explanation":"権利金を売買代金とみなす特例は、居住用建物の貸借には適用されない。適用があるのは宅地及び居住用建物以外の建物の貸借である。"},{"text":"権利金400万円を売買代金とみなして計算すると、Aは依頼者の一方からそれぞれ19万8,000円まで報酬を受領することができる。","is_correct":true,"explanation":"400万円×4%+2万円=18万円、消費税等相当額を加えて18万円×1.1=19万8,000円が依頼者の一方からの上限となり、借賃基準(双方合計22万円)より有利な方を選択できる。"},{"text":"権利金の特例により計算する場合でも、Aが双方から受領する報酬の合計額は借賃1か月分の1.1倍である22万円を超えることができない。","is_correct":false,"explanation":"権利金を売買代金とみなして計算する場合は、売買の媒介と同様に各依頼者から速算式の上限まで受領でき、借賃1か月分の枠に縛られない。"},{"text":"契約終了時に借主に返還される予定の敷金についても、権利金として報酬計算の基礎とすることができる。","is_correct":false,"explanation":"特例の対象となる権利金は、権利設定の対価として支払われる金銭で返還されないものに限られ、返還される敷金は計算の基礎にできない。"}],"explanation":"宅地又は居住用建物以外の建物の貸借で、返還されない権利金が授受されるときは、その額を売買代金とみなして売買の速算式で報酬を計算でき、借賃1か月分基準と比べて高い方によることができる。本問では400万円×4%+2万円=18万円(税込19万8,000円)が各依頼者からの上限となる。","difficulty":3,"tags":["宅建業法","報酬","権利金"],"shuffle_choices":true},{"id":"Q1079","topic":"報酬に関する制限","question_type":"select_correct","question":"宅地建物取引業者A(消費税課税事業者)は、代金500万円(消費税等相当額を含まない)の空家の売買について売主Dから媒介の依頼を受け、契約を成立させた。この売買には通常の売買と比較して現地調査等の費用を要するものとする。低廉な空家等の売買に関する報酬の特例についての次の記述のうち、正しいものはどれか。","choices":[{"text":"この特例は売主から受領する報酬についてのみ適用され、買主から媒介の依頼を受けた場合には通常の上限額しか受領できない。","is_correct":false,"explanation":"現行の特例では、売主・買主のいずれの依頼者からも、特例による上限額まで報酬を受領することができる。売主側に限定されていた旧制度と異なる。"},{"text":"特例を適用するにあたって、報酬額について依頼者に対してあらかじめ説明し、合意する必要はない。","is_correct":false,"explanation":"特例による報酬を受領するには、媒介契約の締結に際し、あらかじめ報酬額について依頼者に説明し、両者間で合意しておく必要がある。"},{"text":"特例の対象となるのは代金400万円以下の宅地建物であり、代金500万円の本件売買には適用されない。","is_correct":false,"explanation":"特例の対象は代金(消費税等相当額を含まない)800万円以下の宅地建物に拡充されており、500万円の本件にも適用がある。400万円以下・18万円という基準は改正前のものである。"},{"text":"現地調査等に要する費用を含め、あらかじめ説明して合意していれば、AはDから30万円の1.1倍に相当する33万円まで報酬を受領することができる。","is_correct":true,"explanation":"代金800万円以下の宅地建物の売買の媒介では、通常の速算式による上限にかかわらず、現地調査等の費用を含めて30万円の1.1倍(33万円)まで受領できる。"}],"explanation":"低廉な空家等の特例は、代金800万円以下の宅地建物の売買・交換の媒介について、現地調査等の費用を考慮し、あらかじめ説明・合意することを条件に、依頼者(売主・買主のいずれも)から30万円の1.1倍まで報酬を受領できる制度である。通常の速算式では500万円×3%+6万円=21万円(税込23万1,000円)にとどまるところ、特例により33万円まで受領できる。","difficulty":3,"tags":["宅建業法","報酬","空家等の特例"],"shuffle_choices":true},{"id":"Q1080","topic":"報酬に関する制限","question_type":"select_incorrect","question":"宅地建物取引業者が受領できる報酬等に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":[{"text":"宅地建物取引業者は、依頼者からの依頼の有無にかかわらず、実際に支出した広告の料金であれば、報酬とは別に受領することができる。","is_correct":true,"explanation":"誤り。報酬とは別に受領できる広告料金は、依頼者の依頼によって行った広告の料金に相当する額に限られる。依頼がないのに行った広告の費用を請求することはできない。"},{"text":"依頼者の依頼によって行った広告の料金に相当する額は、報酬とは別に受領することができる。","is_correct":false,"explanation":"正しい。依頼者の依頼に基づく広告の料金相当額は、報酬の限度額とは別に受領することが認められている。"},{"text":"依頼者の特別の依頼により行う遠隔地における現地調査に要する特別の費用は、依頼者の事前の承諾があれば、報酬とは別に受領することができる。","is_correct":false,"explanation":"正しい。依頼者の特別の依頼により支出を要する特別の費用で、事前に依頼者の承諾があるものは、実費の範囲で報酬とは別に受領できる。"},{"text":"国土交通大臣の定める報酬の限度額を超える報酬を受領した宅地建物取引業者は、監督処分や罰則の対象となることがある。","is_correct":false,"explanation":"正しい。限度額を超える報酬の受領は法46条2項違反であり、業務停止処分等の監督処分のほか、100万円以下の罰金の対象となり得る。"}],"explanation":"宅建業者は、原則として国土交通大臣の定める限度額を超える報酬やそれ以外の金銭を受領できないが、依頼者の依頼による広告料金や、特別の依頼に基づき事前承諾を得た特別の費用の実費は例外的に別途受領できる。「依頼の有無を問わず広告費を請求できる」とするのが典型的なひっかけである。","difficulty":1,"tags":["宅建業法","報酬"],"shuffle_choices":true},{"id":"Q1081","topic":"業務上の規制","question_type":"select_correct","question":"宅地建物取引業者Aが行う業務に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"Aが手付金の分割払いを認めることで契約の締結を誘引した場合であっても、結果として契約が成立しなかったときは、法に違反しない。","is_correct":false,"explanation":"手付についての信用の供与による契約締結の誘引は、誘引行為そのものが禁止されており、契約が成立したかどうかを問わず違反となる。"},{"text":"Aが手付の額を減額することにより契約の締結を誘引する行為は、信用の供与に当たらず、禁止されていない。","is_correct":true,"explanation":"手付の減額は、手付を貸し付けたり支払いを猶予したりするものではないため信用の供与に該当せず、この規定には違反しない。"},{"text":"Aが手付金を貸し付けて契約の締結を誘引した場合でも、その後買主が貸付金を完済すれば違反とはならない。","is_correct":false,"explanation":"貸付けによる誘引の時点で違反が成立しており、後に返済されたとしても違反であることに変わりはない。"},{"text":"手付貸与による契約締結の誘引の禁止に違反した場合、監督処分の対象とはなるが、罰則が科されることはない。","is_correct":false,"explanation":"手付貸与等の禁止違反には、監督処分に加えて6月以下の懲役若しくは100万円以下の罰金(又は併科)という罰則も定められている。"}],"explanation":"宅建業法47条3号は、手付について貸付けその他信用の供与をすることにより契約の締結を誘引する行為を禁止している。貸付け・分割払い・支払猶予は信用の供与に当たるが、手付の減額や銀行ローンのあっせんは信用の供与に当たらない。誘引行為自体が違反であり、契約成立の有無や事後の返済は関係がない。","difficulty":1,"tags":["宅建業法","業務上の規制","手付貸与の禁止"],"shuffle_choices":true},{"id":"Q1082","topic":"業務上の規制","question_type":"select_incorrect","question":"宅地建物取引業者が契約の締結について勧誘をする際の断定的判断の提供に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":[{"text":"利益を生ずることが確実であると誤解させるべき断定的判断を提供する行為は、宅地建物取引業者に故意がなかったとしても禁止される。","is_correct":false,"explanation":"正しい。重要な事実の不告知(47条1号)と異なり、断定的判断の提供の禁止は故意を要件としていない。"},{"text":"「この物件を購入すれば必ず値上がりして利益が出る」と告げて勧誘した場合、実際にその物件が値上がりしたとしても法に違反する。","is_correct":false,"explanation":"正しい。断定的判断を提供する行為自体が禁止されており、結果的にその判断どおりになったかどうかは違反の成否に影響しない。"},{"text":"断定的判断の提供の禁止に違反した場合、指示処分や業務停止処分の対象となるが、罰則の適用はない。","is_correct":false,"explanation":"正しい。47条の2の勧誘規制の違反には罰則の定めがなく、監督処分の対象となるにとどまる。"},{"text":"禁止される断定的判断の提供は、代金の額その他の取引条件に関する事項に限られ、将来の環境や交通の利便に関する事項は含まれない。","is_correct":true,"explanation":"誤り。将来の環境又は交通その他の利便について誤解させるべき断定的判断を提供する行為も、国土交通省令で定める禁止行為とされている。"}],"explanation":"宅建業法47条の2第1項は、利益を生ずることが確実であると誤解させるべき断定的判断の提供を禁止し、同条3項を受けた施行規則は、将来の環境・利便についての断定的判断の提供も禁止している。故意の有無や結果の当否を問わず違反が成立するが、罰則はなく監督処分の対象となる。","difficulty":2,"tags":["宅建業法","業務上の規制","断定的判断の提供禁止"],"shuffle_choices":true},{"id":"Q1083","topic":"業務上の規制","question_type":"select_correct","question":"宅地建物取引業者Aが行う契約締結の勧誘等に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"Aは、勧誘に先立って商号と勧誘目的を告げてさえいれば、相手方が契約を締結しない旨の意思を表示した後も勧誘を継続することができる。","is_correct":false,"explanation":"相手方が契約を締結しない旨の意思(勧誘を引き続き受けることを希望しない旨の意思を含む)を表示した場合、勧誘を継続する行為は禁止される。事前に目的を告げていたかどうかは関係ない。"},{"text":"Aは、勧誘に先立って、自己の商号、勧誘を行う者の氏名及び契約の締結について勧誘をする目的である旨を告げずに勧誘を行ってはならない。","is_correct":true,"explanation":"いわゆる目的を告げない勧誘の禁止であり、勧誘に先立ちこれらを告げないで勧誘する行為は施行規則で禁止されている。"},{"text":"Aが正当な理由なく、契約を締結するかどうかを判断するために必要な時間を与えることを拒んで即決を迫った場合、罰金に処されることがある。","is_correct":false,"explanation":"この行為は禁止行為に該当するが、47条の2関係の勧誘規制違反に罰則はなく、監督処分の対象となるにとどまる。"},{"text":"Aは、相手方が買受けの申込みを撤回した場合、既に受領していた預り金から媒介報酬に相当する額を差し引いて返還することができる。","is_correct":false,"explanation":"申込みの撤回に際し、既に受領した預り金の返還を拒む行為は禁止されており、一部を差し引いて返還することも返還の拒否に該当する。"}],"explanation":"宅建業法47条の2第3項を受けた施行規則16条の11は、勧誘に先立ち商号・勧誘者の氏名・勧誘目的を告げない勧誘、契約しない旨の意思表示後の勧誘の継続、預り金の返還拒否などを禁止している。これらの違反に罰則はないが、指示処分・業務停止処分の対象となる。","difficulty":1,"tags":["宅建業法","業務上の規制","勧誘規制"],"shuffle_choices":true},{"id":"Q1084","topic":"業務上の規制","question_type":"select_correct","question":"宅地建物取引業者及びその従業者の守秘義務に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"宅地建物取引業者は、宅地建物取引業を営まなくなった後は、業務上取り扱ったことについて知り得た秘密を他に漏らしても法に違反しない。","is_correct":false,"explanation":"守秘義務は宅建業を営まなくなった後も課され続けるため、廃業後に秘密を漏らす行為も違反となる。"},{"text":"宅地建物取引業者が裁判の証人として、業務上知り得た秘密に関する事項の証言を求められた場合、これに応じて証言しても守秘義務違反とはならない。","is_correct":true,"explanation":"守秘義務は「正当な理由」がある場合には解除され、裁判の証人として証言する場合や本人の承諾がある場合はこれに該当する。"},{"text":"守秘義務は宅地建物取引業者本人に課されるものであり、その従業者が業務を補助したことについて知り得た秘密を漏らしても法に違反しない。","is_correct":false,"explanation":"従業者にも守秘義務が課されており(75条の3)、従業者でなくなった後も同様である。"},{"text":"守秘義務に違反した場合、監督処分の対象となることはあるが、罰則が科されることはない。","is_correct":false,"explanation":"守秘義務違反には50万円以下の罰金という罰則が定められている。なお、この罪は告訴がなければ公訴を提起できない親告罪である。"}],"explanation":"宅建業法45条は業者に、75条の3は従業者に守秘義務を課しており、いずれも廃業後・退職後にも及ぶ。ただし、裁判での証言や本人の承諾など正当な理由がある場合は秘密を告げることができる。違反には50万円以下の罰金が定められ、親告罪とされている。","difficulty":1,"tags":["宅建業法","業務上の規制","守秘義務"],"shuffle_choices":true},{"id":"Q1085","topic":"業務上の規制","question_type":"select_incorrect","question":"宅地建物取引業者の業務に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":[{"text":"契約の締結を勧誘するために相手方を「威迫する」とは、相手方に不安の念を抱かせる行為をいい、相手方が現実に恐怖心を抱いたことまでは要しない。","is_correct":false,"explanation":"正しい。威迫とは、脅迫のように恐怖心を生じさせる程度に至らなくても、大声を出す、面会を強要するなど相手方を不安にさせる行為をいう。"},{"text":"契約の締結について勧誘をするに際して相手方を威迫する行為の禁止は、相手方が宅地建物取引業者である場合には適用されない。","is_correct":true,"explanation":"誤り。威迫行為の禁止などの業務上の規制は、8種制限と異なり、相手方が宅建業者である取引にも適用される。"},{"text":"宅地建物取引業者は、その従業者に対し、業務を適正に実施させるため、必要な教育を行うよう努めなければならない。","is_correct":false,"explanation":"正しい。従業者への教育は31条の2に定められた努力義務である。"},{"text":"威迫行為の禁止に違反した場合、罰則の適用はないが、指示処分や業務停止処分の対象となる。","is_correct":false,"explanation":"正しい。47条の2第2項の威迫行為の禁止には罰則の定めがなく、監督処分の対象となるにとどまる。"}],"explanation":"宅建業法47条の2第2項は、契約締結の勧誘やクーリング・オフ等の妨害のために相手方を威迫する行為を禁止している。8種制限が宅建業者間の取引に適用されないのとは異なり、こうした業務上の規制は取引の相手方が業者であっても適用される点に注意が必要である。","difficulty":2,"tags":["宅建業法","業務上の規制","威迫行為の禁止"],"shuffle_choices":true},{"id":"Q1086","topic":"8種制限","question_type":"select_correct","question":"宅地建物取引業法第8章に定めるいわゆる8種制限の適用に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"宅地建物取引業者Aが自ら売主となり、宅地建物取引業者Bが買主となる宅地の売買契約には、クーリング・オフの規定が適用される。","is_correct":false,"explanation":"8種制限は宅建業者間の取引には適用されないため(78条2項)、買主が宅建業者である場合にクーリング・オフの規定は適用されない。"},{"text":"宅地建物取引業者Aが売買を媒介し、宅地建物取引業者でない売主Cと宅地建物取引業者でない買主Dが締結する売買契約には、手付金等の保全措置の規定が適用される。","is_correct":false,"explanation":"8種制限は宅建業者が「自ら売主」となる場合の規制であり、業者が媒介するにすぎない取引には適用されない。"},{"text":"宅地建物取引業者Aが自ら売主となり、宅地建物取引業者でないBが買主となる建物の売買契約には、手付の額を代金の2割以内に制限する規定が適用される。","is_correct":true,"explanation":"宅建業者が自ら売主となり、宅建業者でない者が買主となる場合こそが8種制限の適用場面であり、手付の額の制限も適用される。"},{"text":"宅地建物取引業者Aが自ら買主となり、宅地建物取引業者でないCが売主となる宅地の売買契約には、8種制限の規定が適用される。","is_correct":false,"explanation":"8種制限は業者が自ら「売主」となる場合の規制であり、業者が買主となる取引には適用されない。"}],"explanation":"8種制限は、取引に精通した宅建業者が売主として、知識・経験の乏しい一般消費者である買主と契約する場合の買主保護規定である。したがって、①業者が自ら売主であること、②買主が宅建業者でないこと、の両方を満たす場合にのみ適用される。","difficulty":1,"tags":["宅建業法","8種制限"],"shuffle_choices":true},{"id":"Q1087","topic":"8種制限","question_type":"select_correct","question":"宅地建物取引業者Aが自ら売主となり、宅地建物取引業者でないBと宅地の売買契約を締結する場合のクーリング・オフに関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"Bが、Aから媒介の依頼を受けた宅地建物取引業者Cの事務所で買受けの申込みをした場合、Bはクーリング・オフによる申込みの撤回をすることができない。","is_correct":true,"explanation":"売主業者から代理・媒介の依頼を受けた他の宅建業者の事務所も「事務所等」に該当するため、そこで申込みをした場合はクーリング・オフができない。"},{"text":"Bが、土地に定着しないテント張りの案内所で買受けの申込みをした場合、その案内所に専任の宅地建物取引士が置かれていれば、Bはクーリング・オフをすることができない。","is_correct":false,"explanation":"クーリング・オフができなくなる案内所は土地に定着する建物内に設けられたものに限られ、テント張りの案内所は該当しないため、クーリング・オフができる。"},{"text":"Bが自ら申し出て、Bの自宅で買受けの申込みをした場合、Bはクーリング・オフをすることができる。","is_correct":false,"explanation":"買主が自ら申し出た場合の買主の自宅・勤務先は「事務所等」に該当するため、クーリング・オフはできない。"},{"text":"Bが喫茶店で買受けの申込みをし、後日Aの事務所で売買契約を締結した場合、Bはクーリング・オフをすることができない。","is_correct":false,"explanation":"クーリング・オフの可否は買受けの申込みをした場所を基準に判断されるため、申込みが喫茶店であれば、契約締結場所が事務所であってもクーリング・オフができる。"}],"explanation":"クーリング・オフ(37条の2)は「事務所等」以外の場所で買受けの申込みをした場合に認められる。事務所等には、売主業者の事務所のほか、代理・媒介を依頼された業者の事務所、土地に定着し専任宅建士の設置義務がある案内所、買主が自ら申し出た場合の自宅・勤務先が含まれる。申込みと契約の場所が異なるときは申込みの場所で判断する。","difficulty":2,"tags":["宅建業法","8種制限","クーリング・オフ"],"shuffle_choices":true},{"id":"Q1088","topic":"8種制限","question_type":"select_incorrect","question":"宅地建物取引業者Aが自ら売主となり、宅地建物取引業者でないBがホテルのロビーでマンションの買受けの申込みをした場合のクーリング・オフに関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":[{"text":"Aがクーリング・オフができる旨及びその方法をBに告げるときは、書面を交付して行わなければならない。","is_correct":false,"explanation":"正しい。クーリング・オフの告知は、法定事項を記載した書面を交付して行う必要がある。"},{"text":"AがBに対し書面でクーリング・オフについて告げた場合、告げられた日から起算して8日を経過したときは、Bはクーリング・オフをすることができない。","is_correct":false,"explanation":"正しい。書面で告げられた日から起算して8日を経過するとクーリング・オフはできなくなる。告げられた日を1日目として数える点に注意。"},{"text":"AがBに対しクーリング・オフについて何も告げていない場合、Bは宅地建物の引渡しを受け、かつ、代金全額を支払った後であってもクーリング・オフをすることができる。","is_correct":true,"explanation":"誤り。告知がなく8日間の期間が進行していなくても、買主が引渡しを受け、かつ代金全額を支払ったときは、クーリング・オフはできなくなる。"},{"text":"Bがクーリング・オフによる申込みの撤回を行う場合、その意思表示は書面により行い、書面を発した時に効力を生ずる。","is_correct":false,"explanation":"正しい。クーリング・オフの意思表示は書面で行い、到達時ではなく発信時に効力が生じる(発信主義)。"}],"explanation":"クーリング・オフができなくなるのは、①書面で告げられた日から起算して8日を経過したとき、②買主が物件の引渡しを受け、かつ代金全額を支払ったとき、のいずれかである。②は告知の有無にかかわらず適用される。撤回の意思表示は書面で行い、発信した時点で効力を生じる。","difficulty":2,"tags":["宅建業法","8種制限","クーリング・オフ"],"shuffle_choices":true},{"id":"Q1089","topic":"8種制限","question_type":"select_correct","question":"宅地建物取引業者Aが自ら売主となる売買契約について、宅地建物取引業者でない買主Bが適法にクーリング・オフを行った場合等に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"Aは、クーリング・オフによる契約の解除に伴い損害が生じた場合には、Bに対してその賠償を請求することができる。","is_correct":false,"explanation":"クーリング・オフが行われた場合、業者は損害賠償や違約金の支払いを請求することができない。"},{"text":"クーリング・オフができる期間を、書面で告げられた日から起算して10日間とする特約は、無効である。","is_correct":false,"explanation":"期間を8日より長くする特約は買主に有利な特約であるため有効である。無効となるのは買主に不利な特約である。"},{"text":"Bによるクーリング・オフの意思表示は、その書面がAに到達した時に効力を生ずる。","is_correct":false,"explanation":"クーリング・オフの効力は書面を発した時に生じる発信主義が採用されており、到達時ではない。"},{"text":"Aは、クーリング・オフによる解除があったときは、既に受領していた手付金その他の金銭を、速やかにBに返還しなければならない。","is_correct":true,"explanation":"クーリング・オフが行われた場合、業者は受領済みの手付金その他の金銭を速やかに全額返還する義務を負う。"}],"explanation":"クーリング・オフ(37条の2)が行われると契約は白紙に戻り、業者は損害賠償・違約金を請求できず、受領済みの金銭を速やかに返還しなければならない。これらの規定に反する特約で買主に不利なものは無効だが、期間の延長など買主に有利な特約は有効である。","difficulty":1,"tags":["宅建業法","8種制限","クーリング・オフ"],"shuffle_choices":true},{"id":"Q1090","topic":"8種制限","question_type":"select_correct","question":"宅地建物取引業者Aが自ら売主となり、宅地建物取引業者でないBと代金3,000万円の建物の売買契約を締結し、手付を受領する場合に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"Aは、Bとの合意があれば、手付金として700万円を受領することができる。","is_correct":false,"explanation":"業者が自ら売主となる場合、代金の2割(この場合600万円)を超える手付を受領することはできず、合意があっても許されない。"},{"text":"AB間で手付を違約手付と定めた場合であっても、Bは、Aが契約の履行に着手する前であれば、手付を放棄して契約を解除することができる。","is_correct":true,"explanation":"業者が自ら売主となる場合、手付はその名目にかかわらず解約手付としての性質を有するものとされ、これに反する買主に不利な特約は無効である。"},{"text":"Aが手付解除をする場合、Bに対して口頭で手付の倍額を償還する旨を告げれば、契約を解除することができる。","is_correct":false,"explanation":"売主からの手付解除には、手付の倍額を現実に提供することが必要であり、口頭で告げるだけでは足りない。"},{"text":"Bが中間金を支払って契約の履行に着手した後であっても、Aは、手付の倍額を現実に提供して契約を解除することができる。","is_correct":false,"explanation":"手付解除は相手方が履行に着手するまでに限られる。買主が中間金の支払いという履行の着手をした後は、売主から手付解除をすることはできない。"}],"explanation":"宅建業法39条により、業者が自ら売主となる場合、手付の額は代金の2割が上限であり、受領した手付はどのような名目であっても解約手付とみなされる。相手方が履行に着手するまでは、買主は手付を放棄し、売主は倍額を現実に提供することで契約を解除できる。","difficulty":1,"tags":["宅建業法","8種制限","手付"],"shuffle_choices":true},{"id":"Q1091","topic":"8種制限","question_type":"select_correct","question":"宅地建物取引業者Aが自ら売主となって代金4,000万円の宅地の売買契約を締結する場合の手付に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"買主が宅地建物取引業者でないBである場合、Aは手付金として1,000万円を受領することができる。","is_correct":false,"explanation":"手付の上限は代金の2割である800万円であり、1,000万円の手付を受領することはできない。"},{"text":"買主が宅地建物取引業者でないBである場合において、手付金を900万円とする特約をしたときは、特約全体が無効となり、Aは手付を一切受領できない。","is_correct":false,"explanation":"代金の2割を超える部分について受領が禁止されるのであり、特約全体が無効となって手付を一切受領できなくなるわけではない。"},{"text":"買主が宅地建物取引業者Cである場合、Aは手付金として1,000万円を受領することができる。","is_correct":true,"explanation":"手付の額の制限を含む8種制限は宅建業者間の取引には適用されないため、代金の2割を超える手付を受領しても法に違反しない。"},{"text":"買主が宅地建物取引業者でないBから手付金800万円を受領した場合、Aが契約の履行に着手する前であっても、Bは手付を放棄して契約を解除することができない。","is_correct":false,"explanation":"手付は解約手付とみなされるため、売主が履行に着手する前であれば、買主は手付を放棄して契約を解除することができる。"}],"explanation":"手付の額の制限(代金の2割まで)は、業者が自ら売主となり買主が非業者である場合にのみ適用される8種制限の一つである。買主が宅建業者であれば適用がなく、また非業者との取引で2割を超える手付を定めても、超える部分についてのみ受領が許されないと扱われる。","difficulty":2,"tags":["宅建業法","8種制限","手付"],"shuffle_choices":true},{"id":"Q1092","topic":"8種制限","question_type":"select_correct","question":"宅地建物取引業者Aが自ら売主となり、宅地建物取引業者でないBと建築工事完了前のマンション(代金5,000万円)の売買契約を締結する場合の手付金等の保全措置に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"Aは、Bから手付金200万円を受領する場合、保全措置を講ずる必要はない。","is_correct":true,"explanation":"未完成物件では、受領する手付金等が代金の5%(250万円)以下かつ1,000万円以下であれば保全措置は不要である。200万円はこの範囲内である。"},{"text":"Aは、手付金300万円について、指定保管機関との間で手付金等寄託契約を締結する方法により保全措置を講ずることができる。","is_correct":false,"explanation":"指定保管機関による保管の措置は完成物件の場合にのみ認められ、未完成物件では銀行等との保証委託契約又は保険事業者との保証保険契約によらなければならない。"},{"text":"Aが法に定める保全措置を講じない場合であっても、Bは手付金の支払いを拒むことはできない。","is_correct":false,"explanation":"業者が必要な保全措置を講じないときは、買主は手付金等の支払いを拒むことができ、それを理由に債務不履行責任を問われることはない。"},{"text":"契約締結後、引渡し前にBが支払う中間金は、「手付金等」に含まれない。","is_correct":false,"explanation":"手付金等とは、契約締結日以後、物件の引渡し前に支払われる手付金・中間金その他の金銭で代金に充当されるものをいい、中間金も含まれる。"}],"explanation":"手付金等の保全措置(41条)は、未完成物件では代金の5%又は1,000万円を超える手付金等を受領する場合に必要となる。未完成物件で認められる保全の方法は保証委託契約と保証保険契約の2種類であり、指定保管機関による保管は完成物件に限られる。","difficulty":2,"tags":["宅建業法","8種制限","手付金等の保全措置"],"shuffle_choices":true},{"id":"Q1093","topic":"8種制限","question_type":"select_incorrect","question":"宅地建物取引業者Aが自ら売主となり、宅地建物取引業者でないBと建築工事完了後の建物(代金3,000万円)の売買契約を締結する場合の手付金等の保全措置に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":[{"text":"Aは、Bから手付金300万円を受領する場合、保全措置を講ずる必要はない。","is_correct":false,"explanation":"正しい。完成物件では代金の10%(300万円)を「超える」場合に保全措置が必要となるため、ちょうど300万円であれば保全措置は不要である。"},{"text":"Aが手付金150万円を受領し、その後中間金200万円を受領しようとする場合、既に受領した手付金と合わせた350万円全額について保全措置を講じなければならない。","is_correct":false,"explanation":"正しい。手付金等は合算して判定し、限度額を超えることとなる場合には、既に受領した分も含めた全額について保全措置が必要となる。"},{"text":"Bが当該建物について所有権の移転の登記を受けたときは、Aは保全措置を講じることなく中間金を受領することができる。","is_correct":false,"explanation":"正しい。買主が所有権の登記を備えた場合には、買主保護の必要性が薄れるため保全措置は不要とされる。"},{"text":"Aが手付金500万円を受領しようとする場合、代金の10%である300万円を超える部分の200万円についてのみ保全措置を講ずればよい。","is_correct":true,"explanation":"誤り。限度額を超える場合には、超える部分だけでなく、受領しようとする手付金等の全額について保全措置を講じなければならない。"}],"explanation":"完成物件では、手付金等が代金の10%又は1,000万円を超える場合に保全措置が必要となる。保全の対象は超過部分ではなく受領する手付金等の全額であり、複数回に分けて受領する場合は合算して判定する。買主が所有権の登記を備えたときは保全措置が不要となる。","difficulty":3,"tags":["宅建業法","8種制限","手付金等の保全措置"],"shuffle_choices":true},{"id":"Q1094","topic":"8種制限","question_type":"select_correct","question":"宅地建物取引業者Aが自ら売主となり、建築工事完了後のマンション(代金2億円)の売買契約を締結する場合の手付金等の保全措置に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"買主が宅地建物取引業者でないBである場合、手付金1,500万円は代金の10%以下であるから、Aは保全措置を講ずることなくこれを受領できる。","is_correct":false,"explanation":"代金の10%以下であっても、1,000万円を超える手付金等を受領する場合には保全措置が必要である。"},{"text":"買主が宅地建物取引業者でないBである場合、Aが講ずる保全措置は、銀行等との保証委託契約、保険事業者との保証保険契約又は指定保管機関による保管のいずれかの方法による。","is_correct":true,"explanation":"完成物件については、保証委託契約・保証保険契約に加え、指定保管機関による保管(手付金等寄託契約等)の3つの方法が認められている。"},{"text":"買主が宅地建物取引業者Cである場合であっても、Aが1,000万円を超える手付金等を受領するときは、保全措置を講じなければならない。","is_correct":false,"explanation":"手付金等の保全措置の規定は8種制限の一つであり、宅建業者間の取引には適用されないため、保全措置は不要である。"},{"text":"保全措置の対象となる「手付金等」は手付金に限られ、引渡し前に代金に充当される中間金は対象とならない。","is_correct":false,"explanation":"手付金等には、名目を問わず、契約締結日以後引渡し前に支払われ代金に充当される金銭が広く含まれ、中間金も対象となる。"}],"explanation":"保全措置の要否は、完成物件では代金の10%又は1,000万円のいずれかを超えるかどうかで判定するため、割合が10%以下でも金額が1,000万円を超えれば保全が必要である。完成物件では保証委託契約・保証保険契約・指定保管機関による保管の3方式が認められる。","difficulty":3,"tags":["宅建業法","8種制限","手付金等の保全措置"],"shuffle_choices":true},{"id":"Q1095","topic":"8種制限","question_type":"select_correct","question":"宅地建物取引業者Aが、C所有の宅地を自ら売主として売買する場合に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"Aは、Cとの間で当該宅地を取得する契約(予約を含む。)を締結しているときは、宅地建物取引業者でないBと売買契約を締結することができる。","is_correct":true,"explanation":"自己の所有に属しない物件でも、業者が物件を取得する契約(予約を含む)を締結している場合には、非業者の買主と売買契約を締結できる。"},{"text":"Aは、Cとの間の宅地取得契約が農地法の許可を条件とする停止条件付きのものであっても、宅地建物取引業者でないBと売買契約を締結することができる。","is_correct":false,"explanation":"取得契約が停止条件付きである場合は、条件不成就により取得できないおそれがあるため、非業者との売買契約を締結することはできない。"},{"text":"他人の所有に属する物件の売買契約締結の制限は、買主が宅地建物取引業者である場合にも適用される。","is_correct":false,"explanation":"この制限は8種制限の一つであり、宅建業者間の取引には適用されない。"},{"text":"Aは、Cから当該宅地の売却について書面による同意を得ていれば、取得する契約を締結していなくても、宅地建物取引業者でないBと売買契約を締結することができる。","is_correct":false,"explanation":"所有者の同意を得ているだけでは足りず、業者が物件を取得する契約(予約を含む)を現に締結していることが必要である。"}],"explanation":"宅建業法33条の2は、業者が自ら売主として自己の所有に属しない物件を非業者に売ることを原則として禁止し、例外として①物件を取得する契約(予約を含み、停止条件付きを除く)を締結している場合、②未完成物件で保全措置が講じられている場合に契約締結を認めている。","difficulty":2,"tags":["宅建業法","8種制限","他人物売買"],"shuffle_choices":true},{"id":"Q1096","topic":"8種制限","question_type":"select_correct","question":"宅地建物取引業者Aが自ら売主となり、宅地建物取引業者でないBと建物の売買契約を締結する場合において、目的物の種類又は品質に関する契約不適合を担保すべき責任に関する特約についての次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"「契約不適合についてAが責任を負うのは、引渡しの日から1年以内にBがその旨を通知した場合に限る」とする特約は、有効である。","is_correct":false,"explanation":"通知期間を引渡しの日から2年以上とする場合を除き、民法の規定より買主に不利な特約は無効である。1年とする特約は無効となる。"},{"text":"通知期間に関する特約が無効となった場合、Bが契約不適合の通知をすべき期間は、引渡しの日から2年間となる。","is_correct":false,"explanation":"特約が無効となった場合は民法の原則に戻り、買主が不適合を知った時から1年以内に通知すればよいことになる。引渡しから2年になるのではない。"},{"text":"「Aは契約不適合について一切の担保責任を負わない」とする特約は、Bが宅地建物取引業者であっても無効である。","is_correct":false,"explanation":"担保責任の特約の制限は8種制限の一つであり、宅建業者間の取引には適用されないため、業者間であればこのような特約も有効である。"},{"text":"「契約不適合である旨をBがAに通知すべき期間を、建物の引渡しの日から2年間とする」特約は、有効である。","is_correct":true,"explanation":"通知期間について、目的物の引渡しの日から2年以上となる特約は例外的に有効とされており、ちょうど2年間とする特約も有効である。"}],"explanation":"宅建業法40条は、担保責任について民法の規定より買主に不利な特約を原則として無効とするが、契約不適合の通知期間を引渡しの日から2年以上とする特約のみ例外的に認めている。特約が無効となった場合は民法の原則(不適合を知った時から1年以内の通知)が適用される。","difficulty":2,"tags":["宅建業法","8種制限","担保責任の特約制限"],"shuffle_choices":true},{"id":"Q1097","topic":"8種制限","question_type":"select_incorrect","question":"宅地建物取引業者Aが自ら売主となり、宅地建物取引業者でないBと代金2,000万円の宅地の売買契約を締結する場合の損害賠償額の予定等に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":[{"text":"債務不履行を理由とする損害賠償額の予定と違約金を合算して500万円とする特約を定めた場合、その特約は全体として無効となる。","is_correct":true,"explanation":"誤り。合算額が代金の2割(400万円)を超える場合、特約全体が無効となるのではなく、2割を超える部分についてのみ無効となる。"},{"text":"損害賠償額の予定を定めなかった場合、Aは、実際に生じた損害額を立証すれば、代金の2割を超える額の賠償をBに請求することができる。","is_correct":false,"explanation":"正しい。2割の制限は損害賠償額を予定した場合の規制であり、予定を定めていないときは民法の原則により実損害額を請求できる。"},{"text":"損害賠償額の予定と違約金を合算して400万円とする特約は、有効である。","is_correct":false,"explanation":"正しい。合算額が代金の2割である400万円ちょうどであれば、2割を「超え」ていないため有効である。"},{"text":"買主が宅地建物取引業者Cである場合には、損害賠償額の予定と違約金を合算して代金の2割を超える特約も有効である。","is_correct":false,"explanation":"正しい。損害賠償額の予定等の制限は8種制限の一つであり、宅建業者間の取引には適用されない。"}],"explanation":"宅建業法38条は、業者が自ら売主となる場合、債務不履行に基づく損害賠償額の予定と違約金の合算額を代金の2割以内に制限しており、これを超える定めをしたときは超える部分が無効となる。予定を定めなかった場合には、この制限は及ばず実損害の賠償請求が可能である。","difficulty":2,"tags":["宅建業法","8種制限","損害賠償額の予定"],"shuffle_choices":true},{"id":"Q1098","topic":"8種制限","question_type":"select_correct","question":"宅地建物取引業者Aが自ら売主となり、宅地建物取引業者でないBと宅地の割賦販売契約を締結した場合に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"Aは、Bの賦払金の支払いが遅れた場合、20日間の期間を定めて書面で支払いを催告し、その期間内に支払いがないときは、契約を解除することができる。","is_correct":false,"explanation":"催告期間は30日以上の相当の期間でなければならず、20日間の催告による解除は認められない。"},{"text":"Aは、Bの賦払金の不払いを理由に契約を解除するには口頭で催告すれば足り、書面による催告までは要しない。","is_correct":false,"explanation":"割賦販売契約の解除等の前提となる催告は、書面で行わなければならない。"},{"text":"Aは、Bから代金の10分の3を超える額の支払いを受けるまでは、登記その他引渡し以外の売主の義務を履行しないこと(所有権留保)が認められる。","is_correct":true,"explanation":"割賦販売では、代金の10分の3を超える支払いを受けるまでは所有権留保が認められる。逆に3割を超える支払いを受けた後は、原則として登記を移転しなければならない。"},{"text":"割賦販売契約の解除等の制限に関する規定は、買主が宅地建物取引業者である場合にも適用される。","is_correct":false,"explanation":"割賦販売契約の解除等の制限は8種制限の一つであり、宅建業者間の取引には適用されない。"}],"explanation":"宅建業法42条は、割賦販売において賦払金の不払いを理由に解除等をするには30日以上の相当期間を定めた書面による催告を要するとし、43条は代金の10分の3を超える支払いを受けた後の所有権留保を原則として禁止している。いずれも業者間取引には適用されない。","difficulty":3,"tags":["宅建業法","8種制限","割賦販売"],"shuffle_choices":true},{"id":"Q1099","topic":"8種制限","question_type":"select_incorrect","question":"宅地建物取引業者Aが自ら売主となり、宅地建物取引業者Bが買主となる宅地の売買契約に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":[{"text":"Bは、テント張りの案内所で買受けの申込みをした場合であっても、クーリング・オフによる申込みの撤回をすることはできない。","is_correct":false,"explanation":"正しい。クーリング・オフの規定は宅建業者間の取引には適用されないため、申込みの場所を問わずBはクーリング・オフをすることができない。"},{"text":"Aは、Bとの合意により、代金の2割を超える額の手付を受領することができる。","is_correct":false,"explanation":"正しい。手付の額の制限は業者間の取引には適用されないため、2割を超える手付を受領することができる。"},{"text":"Aは、Bから代金の10%を超える手付金等を受領する場合であっても、保全措置を講ずる必要はない。","is_correct":false,"explanation":"正しい。手付金等の保全措置の規定は業者間の取引には適用されない。"},{"text":"AB間で「Aは目的物の契約不適合について一切担保責任を負わない」とする特約を定めた場合、その特約は無効である。","is_correct":true,"explanation":"誤り。担保責任の特約制限を含む8種制限は業者間取引には適用されないため、このような特約も業者間では有効である。"}],"explanation":"宅建業法78条2項により、自ら売主制限(8種制限)は宅建業者相互間の取引には一切適用されない。クーリング・オフ、手付の額の制限、保全措置、担保責任の特約制限などはいずれも、買主が宅建業者であれば適用されないことを横断的に押さえておくことが重要である。","difficulty":1,"tags":["宅建業法","8種制限","業者間取引"],"shuffle_choices":true},{"id":"Q1100","topic":"監督・罰則","question_type":"select_correct","question":"宅地建物取引業者に対する指示処分に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"甲県知事の免許を受けた宅地建物取引業者が乙県内で業務に関し取引の公正を害する行為をした場合、乙県知事は、その業者に対して指示処分をすることができる。","is_correct":true,"explanation":"指示処分は、免許権者のほか、業務を行っている土地を管轄する都道府県知事も行うことができる。"},{"text":"都道府県知事は、指示処分をしたときは、遅滞なくその旨を公告しなければならない。","is_correct":false,"explanation":"公告が必要となるのは業務停止処分と免許取消処分であり、指示処分については公告は不要である。"},{"text":"免許権者は、指示処分をしようとする場合、聴聞を行う必要はない。","is_correct":false,"explanation":"指示処分・業務停止処分・免許取消処分のいずれの監督処分をしようとするときも、公開による聴聞を行わなければならない。"},{"text":"国土交通大臣の免許を受けた宅地建物取引業者に対しては、都道府県知事は指示処分をすることができない。","is_correct":false,"explanation":"大臣免許の業者であっても、その都道府県内で業務を行っている場合には、当該都道府県知事は指示処分をすることができる。"}],"explanation":"指示処分と業務停止処分は、免許権者に加えて、業者が業務を行う土地を管轄する都道府県知事も行うことができる。監督処分を行う際には公開の聴聞が必要であり、公告が求められるのは業務停止処分と免許取消処分に限られる。","difficulty":1,"tags":["宅建業法","監督処分","指示処分"],"shuffle_choices":true},{"id":"Q1101","topic":"監督・罰則","question_type":"select_correct","question":"宅地建物取引業者に対する業務停止処分に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"業務停止処分は、2年以内の期間を定めて、業務の全部又は一部の停止を命ずるものである。","is_correct":false,"explanation":"業務停止処分の期間は1年以内であり、2年以内ではない。"},{"text":"宅地建物取引業者が業務停止処分に違反して業務を行った場合、免許権者は、その業者の免許を取り消さなければならない。","is_correct":true,"explanation":"業務停止処分に違反した場合は必要的免許取消事由に該当し、免許権者は免許を取り消さなければならない。"},{"text":"業務停止処分は免許権者のみが行うことができ、業務地を管轄する都道府県知事は行うことができない。","is_correct":false,"explanation":"業務停止処分は、指示処分と同様、免許権者のほか業務地を管轄する都道府県知事も行うことができる。"},{"text":"宅地建物取引業者が指示処分に従わなかった場合でも、業務停止処分を受けることはない。","is_correct":false,"explanation":"指示処分に従わないことは業務停止処分の事由とされており、業務停止処分を受けることがある。"}],"explanation":"業務停止処分は1年以内の期間を定めて行われ、免許権者と業務地の知事の双方に処分権限がある。業務停止処分に違反したときや、業務停止事由に該当し情状が特に重いときは、必要的免許取消事由となり、免許権者は免許を取り消さなければならない。","difficulty":2,"tags":["宅建業法","監督処分","業務停止処分"],"shuffle_choices":true},{"id":"Q1102","topic":"監督・罰則","question_type":"select_incorrect","question":"宅地建物取引業者に対する免許取消処分に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":[{"text":"宅地建物取引業者が不正の手段により免許を受けたことが判明した場合、免許権者は、その免許を取り消さなければならない。","is_correct":false,"explanation":"正しい。不正の手段による免許取得は必要的免許取消事由である。"},{"text":"宅地建物取引業者が免許を受けてから1年以内に事業を開始しない場合、免許権者は、その免許を取り消さなければならない。","is_correct":false,"explanation":"正しい。免許を受けてから1年以内に事業を開始しないことは必要的免許取消事由である。"},{"text":"宅地建物取引業者が引き続き1年以上事業を休止した場合、免許権者は、情状を考慮して免許を取り消さないことができる。","is_correct":true,"explanation":"誤り。引き続き1年以上の事業の休止は必要的免許取消事由であり、免許権者は必ず免許を取り消さなければならず、裁量の余地はない。"},{"text":"免許取消処分は、指示処分や業務停止処分と異なり、免許権者のみが行うことができる。","is_correct":false,"explanation":"正しい。免許取消処分を行えるのは免許を与えた免許権者だけであり、業務地の知事は行うことができない。"}],"explanation":"免許取消処分には、不正手段による免許取得、1年以内の事業不開始、1年以上の事業休止、欠格事由への該当、業務停止処分違反などの必要的取消事由と、営業保証金供託の届出がない場合などの任意的取消事由がある。取消処分の権限は免許権者に専属する。","difficulty":2,"tags":["宅建業法","監督処分","免許取消処分"],"shuffle_choices":true},{"id":"Q1103","topic":"監督・罰則","question_type":"select_correct","question":"宅地建物取引業者に対する監督処分の手続に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"免許権者は、業務停止処分をしようとする場合には、聴聞を行う必要はない。","is_correct":false,"explanation":"指示処分・業務停止処分・免許取消処分のいずれについても、処分をしようとするときは聴聞を行わなければならない。"},{"text":"監督処分に係る聴聞の期日における審理は、非公開で行われる。","is_correct":false,"explanation":"宅建業法上の監督処分に係る聴聞の審理は、公開により行わなければならない。"},{"text":"都道府県知事は、指示処分をしたときは、その旨を公告しなければならない。","is_correct":false,"explanation":"公告の対象となるのは業務停止処分と免許取消処分であり、指示処分は公告の対象ではない。"},{"text":"免許権者は、業務停止処分又は免許取消処分をしたときは、その旨を公告しなければならない。","is_correct":true,"explanation":"業務停止処分と免許取消処分をしたときは、国土交通大臣は官報により、知事は公報等により公告しなければならない。"}],"explanation":"宅建業者への監督処分(指示・業務停止・免許取消)を行う際には、事前に公開による聴聞を実施しなければならない。処分後の公告は、取引の相手方となる一般消費者に注意を促す趣旨から、業務停止処分と免許取消処分について要求されており、指示処分には不要である。","difficulty":2,"tags":["宅建業法","監督処分","聴聞・公告"],"shuffle_choices":true},{"id":"Q1104","topic":"監督・罰則","question_type":"select_correct","question":"甲県知事の登録を受けている宅地建物取引士Aに対する監督処分に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"Aが乙県内で宅地建物取引士として行うべき事務に関し不正な行為をした場合、乙県知事は、1年以内の期間を定めてAに対する事務禁止処分をすることができる。","is_correct":true,"explanation":"事務禁止処分は1年以内の期間を定めて行われ、登録をしている知事のほか、その行為が行われた都道府県の知事も行うことができる。"},{"text":"Aが乙県内で不正な行為をし、その情状が特に重い場合、乙県知事は、Aの登録を消除することができる。","is_correct":false,"explanation":"登録消除処分を行うことができるのは登録をしている甲県知事のみであり、行為地の乙県知事は登録消除処分をすることができない。"},{"text":"Aが事務禁止処分を受けたときは、速やかに、宅地建物取引士証を甲県知事に返納しなければならない。","is_correct":false,"explanation":"事務禁止処分を受けた場合は宅建士証を交付を受けた知事に「提出」するのであり、「返納」するのは登録が消除されたときや宅建士証が効力を失ったときである。"},{"text":"Aに対する指示処分は、Aを雇用している宅地建物取引業者の免許権者が行う。","is_correct":false,"explanation":"宅建士に対する指示処分を行うのは、登録をしている知事又は行為地の知事であり、勤務先業者の免許権者という基準で決まるものではない。"}],"explanation":"宅建士に対する監督処分には指示処分、1年以内の事務禁止処分、登録消除処分がある。指示処分と事務禁止処分は登録地の知事と行為地の知事の双方が行えるが、登録消除処分は登録をしている知事しか行えない。事務禁止処分を受けた場合、宅建士証は提出、登録消除の場合は返納となる。","difficulty":2,"tags":["宅建業法","監督処分","宅地建物取引士"],"shuffle_choices":true},{"id":"Q1105","topic":"監督・罰則","question_type":"select_correct","question":"宅地建物取引業法の罰則に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"免許を受けずに宅地建物取引業を営んだ者に科される罰則は、100万円以下の罰金のみである。","is_correct":false,"explanation":"無免許営業に対する罰則は3年以下の懲役若しくは300万円以下の罰金、又はその併科であり、罰金刑のみではない。"},{"text":"宅地建物取引業者が自己の名義をもって他人に宅地建物取引業を営ませた場合、免許取消処分の対象とはなるが、罰則が科されることはない。","is_correct":false,"explanation":"名義貸しをして他人に宅建業を営ませた場合には、3年以下の懲役若しくは300万円以下の罰金、又はその併科という罰則も定められている。"},{"text":"免許を受けない者が、宅地建物取引業を営む旨の表示をし、又は宅地建物取引業を営む目的で広告をした場合も、罰則の対象となる。","is_correct":true,"explanation":"無免許の者による営業表示・広告も禁止されており、違反には100万円以下の罰金が定められている。"},{"text":"法人の代表者や従業者が無免許営業の違反行為をした場合でも、その法人自身に罰金刑が科されることはない。","is_correct":false,"explanation":"両罰規定により、行為者を罰するほか法人にも罰金刑が科され、無免許営業等については法人に対し1億円以下の罰金という重科の定めがある。"}],"explanation":"無免許営業と名義貸しによる他人への営業は、宅建業法上最も重い3年以下の懲役若しくは300万円以下の罰金(併科あり)の対象である。無免許の者による営業表示・広告や、名義貸しによる表示・広告も100万円以下の罰金の対象となり、法人には両罰規定による重科もある。","difficulty":3,"tags":["宅建業法","罰則","無免許営業・名義貸し"],"shuffle_choices":true},{"id":"Q1106","topic":"監督・罰則","question_type":"select_incorrect","question":"宅地建物取引業者に対する監督に関する次の記述のうち、宅地建物取引業法の規定によれば、誤っているものはどれか。","choices":[{"text":"国土交通大臣は、すべての宅地建物取引業者に対して、宅地建物取引業の適正な運営を確保するため必要な指導、助言及び勧告をすることができる。","is_correct":false,"explanation":"正しい。国土交通大臣はすべての業者に対し、都道府県知事は当該都道府県内で業務を行う業者に対し、指導・助言・勧告をすることができる。"},{"text":"甲県知事の免許を受けた宅地建物取引業者が乙県内において業務停止処分事由に該当する行為をした場合、乙県知事は、その業者の免許を取り消すことができる。","is_correct":true,"explanation":"誤り。乙県知事は指示処分や業務停止処分を行うことはできるが、免許取消処分ができるのは免許権者である甲県知事のみである。"},{"text":"免許権者は、業務停止処分をしようとするときは、聴聞を行わなければならない。","is_correct":false,"explanation":"正しい。監督処分をしようとするときは、公開による聴聞の手続が必要である。"},{"text":"都道府県知事は、国土交通大臣の免許を受けた宅地建物取引業者に対して監督処分をしたときは、遅滞なく、その旨を国土交通大臣に通知しなければならない。","is_correct":false,"explanation":"正しい。知事が他の免許権者の免許を受けた業者を処分したときは、その免許権者に通知(報告)しなければならない。"}],"explanation":"指示処分・業務停止処分は業務地の知事も行えるが、免許取消処分は免許を与えた免許権者に専属する点が監督処分の権限配分の核心である。また、知事が他の免許権者の業者を処分した場合の通知義務や、大臣・知事による指導・助言・勧告の制度もあわせて整理しておきたい。","difficulty":3,"tags":["宅建業法","監督処分","処分権者"],"shuffle_choices":true},{"id":"Q1107","topic":"監督・罰則","question_type":"select_correct","question":"宅地建物取引士に対する監督処分及び罰則に関する次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","choices":[{"text":"宅地建物取引士が事務禁止処分に違反して宅地建物取引士としてすべき事務を行った場合でも、情状が特に重くない限り、登録が消除されることはない。","is_correct":false,"explanation":"事務禁止処分違反は必要的登録消除事由であり、情状のいかんにかかわらず登録は消除されなければならない。"},{"text":"監督処分として登録を消除された者は、消除の日から3年を経過すれば、再び登録を受けることができる。","is_correct":false,"explanation":"不正登録や事務禁止処分違反等を理由に登録を消除された者は、消除の処分の日から5年間は登録を受けることができない。3年ではない。"},{"text":"都道府県知事は、宅地建物取引士の登録消除処分をしようとするときは、聴聞を行う必要はない。","is_correct":false,"explanation":"宅建士に対する監督処分についても、処分をしようとするときは公開による聴聞を行わなければならない。"},{"text":"事務禁止処分を受けた宅地建物取引士が、速やかに宅地建物取引士証をその交付を受けた都道府県知事に提出しなかったときは、10万円以下の過料に処されることがある。","is_correct":true,"explanation":"事務禁止処分を受けた宅建士は宅建士証を交付知事に提出する義務があり、提出しなかった場合は10万円以下の過料の対象となる。"}],"explanation":"事務禁止処分を受けた宅建士は宅建士証を交付を受けた知事に提出しなければならず、違反には10万円以下の過料が定められている。事務禁止処分違反は必要的登録消除事由に当たり、監督処分により登録を消除された者は5年間再登録できない。宅建士への処分にも聴聞が必要である。","difficulty":3,"tags":["宅建業法","監督処分","宅地建物取引士","罰則"],"shuffle_choices":true},{"id":"Q1108","topic":"住宅瑕疵担保履行法","question_type":"select_correct","question":"特定住宅瑕疵担保責任の履行の確保等に関する法律(住宅瑕疵担保履行法)に基づく資力確保措置に関する次の記述のうち、正しいものはどれか。","choices":[{"text":"宅地建物取引業者は、自ら売主として宅地建物取引業者でない買主に新築住宅を販売する場合、住宅販売瑕疵担保保証金の供託又は住宅販売瑕疵担保責任保険契約の締結による資力確保措置を講じなければならない。","is_correct":true,"explanation":"自ら売主となる宅建業者が非業者の買主に新築住宅を引き渡す場合、供託又は保険加入のいずれかの資力確保措置が義務付けられている。"},{"text":"宅地建物取引業者は、買主が宅地建物取引業者である場合にも、新築住宅の売買について資力確保措置を講じなければならない。","is_correct":false,"explanation":"買主が宅建業者である場合には、資力確保措置を講ずる義務はない。"},{"text":"新築住宅の売買を媒介する宅地建物取引業者も、資力確保措置を講ずる義務を負う。","is_correct":false,"explanation":"資力確保措置の義務を負うのは自ら売主となる宅建業者であり、媒介や代理を行うにすぎない業者は義務を負わない。"},{"text":"この法律にいう「新築住宅」とは、建設工事の完了の日から起算して2年を経過していない住宅で、人の居住の用に供したことのないものをいう。","is_correct":false,"explanation":"新築住宅とは、建設工事完了の日から起算して1年を経過しておらず、かつ、まだ人の居住の用に供したことのない住宅をいう。2年ではない。"}],"explanation":"住宅瑕疵担保履行法は、新築住宅の構造耐力上主要な部分等の瑕疵担保責任(10年間)の履行を確保するため、自ら売主として非業者の買主に新築住宅を引き渡す宅建業者に、保証金の供託又は保険加入を義務付けている。買主が業者の場合や、媒介にとどまる業者には適用がない。","difficulty":1,"tags":["宅建業法","住宅瑕疵担保履行法"],"shuffle_choices":true},{"id":"Q1109","topic":"住宅瑕疵担保履行法","question_type":"select_incorrect","question":"自ら売主として宅地建物取引業者でない買主に新築住宅を販売する宅地建物取引業者の、住宅瑕疵担保履行法に基づく届出等に関する次の記述のうち、誤っているものはどれか。","choices":[{"text":"資力確保措置の状況についての届出の基準日は、毎年3月31日である。","is_correct":false,"explanation":"正しい。法改正により基準日は年1回となり、毎年3月31日とされている。"},{"text":"宅地建物取引業者は、基準日ごとに、当該基準日に係る資力確保措置の状況について、基準日から3週間以内に免許権者に届け出なければならない。","is_correct":false,"explanation":"正しい。基準日ごとに、基準日から3週間以内に免許権者(国土交通大臣又は都道府県知事)へ届け出る必要がある。"},{"text":"宅地建物取引業者が基準日に係る届出をしなかった場合、当該基準日の翌日から起算して1月を経過した日以後は、新たに新築住宅の売買契約を締結することができない。","is_correct":true,"explanation":"誤り。新規契約が禁止されるのは、基準日の翌日から起算して50日を経過した日以後であり、1月ではない。"},{"text":"新築住宅の売買契約締結の禁止に違反して契約を締結した宅地建物取引業者は、罰則の対象となる。","is_correct":false,"explanation":"正しい。契約締結制限に違反した場合には、懲役若しくは罰金又はその併科という罰則が定められており、監督処分の対象にもなる。"}],"explanation":"資力確保措置を講ずる宅建業者は、毎年3月31日の基準日ごとに、その状況を基準日から3週間以内に免許権者へ届け出なければならない。保証金の供託をせず、又は届出をしなかった場合には、基準日の翌日から起算して50日を経過した日以後、新たな新築住宅の売買契約の締結が禁止される。","difficulty":2,"tags":["宅建業法","住宅瑕疵担保履行法"],"shuffle_choices":true},{"id":"Q2001","topic":"制限行為能力者","question_type":"select_correct","question":"未成年者Aの法律行為に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"Aが法定代理人の同意を得ずに自己所有の土地を売却した場合、その売買契約は当然に無効である。","is_correct":false,"explanation":"同意のない未成年者の法律行為は無効ではなく、取り消すことができるにとどまる（民法5条2項）。取り消されるまでは有効である。"},{"text":"Aが法定代理人から宅地建物取引業の営業を許されている場合でも、その営業に関する個々の取引ごとに法定代理人の同意を得なければならない。","is_correct":false,"explanation":"一種又は数種の営業を許された未成年者は、その営業に関しては成年者と同一の行為能力を有する（民法6条1項）ため、個々の取引ごとの同意は不要である。"},{"text":"Aが負担のない贈与を受ける契約を締結する場合、法定代理人の同意を得る必要はない。","is_correct":true,"explanation":"単に権利を得、又は義務を免れる法律行為は、法定代理人の同意なく単独で有効にすることができる（民法5条1項ただし書）。負担のない贈与を受けることはこれに当たる。"},{"text":"Aが婚姻をしたときは、成年に達したものとみなされ、単独で有効に土地を売却できる。","is_correct":false,"explanation":"婚姻による成年擬制の制度は成年年齢の18歳への引下げに伴い廃止されており、婚姻適齢も男女とも18歳である。現行法にこのような規定はない。"}],"explanation":"未成年者が単に権利を得、又は義務を免れる行為は法定代理人の同意が不要である（民法5条1項ただし書）。同意を欠く行為の効果は無効ではなく取消しであり、営業を許可された範囲では成年者と同一の行為能力を有する点、成年擬制が廃止された点にも注意したい。","difficulty":1,"tags":["権利関係","制限行為能力者"],"shuffle_choices":true},{"id":"Q2002","topic":"制限行為能力者","question_type":"select_incorrect","question":"成年被後見人A及びその成年後見人Bに関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":[{"text":"Aが日用品の購入その他日常生活に関する行為をした場合、Bはこれを取り消すことができない。","is_correct":false,"explanation":"正しい記述である。日用品の購入その他日常生活に関する行為は取消しの対象から除外されている（民法9条ただし書）。"},{"text":"AがBの同意を得て自己所有の土地を売却した場合であっても、Bはその売買契約を取り消すことができる。","is_correct":false,"explanation":"正しい記述である。成年被後見人は事理弁識能力を欠く常況にあるため、後見人の同意どおりに行為をする期待ができず、同意を得てした行為であっても取り消すことができる。"},{"text":"BがAに代わってAの居住の用に供する建物を売却するには、家庭裁判所の許可を得なければならない。","is_correct":false,"explanation":"正しい記述である。成年後見人が成年被後見人に代わって居住用の建物又はその敷地について売却等の処分をするには、家庭裁判所の許可が必要である（民法859条の3）。"},{"text":"Aが事理を弁識する能力を一時回復している間にした土地の売買契約は、取り消すことができない。","is_correct":true,"explanation":"誤りである。成年被後見人の法律行為は、行為の時に一時的に事理弁識能力を回復していたとしても取り消すことができる。能力回復時に特別の方式で可能とされるのは遺言（民法973条）などであり、契約には妥当しない。"}],"explanation":"成年被後見人の法律行為は日常生活に関する行為を除き取り消すことができ（民法9条）、これは同意を得た行為や能力を一時回復していた間の行為でも同様である。また、居住用不動産の処分には家庭裁判所の許可が必要である（民法859条の3）。","difficulty":1,"tags":["権利関係","制限行為能力者"],"shuffle_choices":true},{"id":"Q2003","topic":"制限行為能力者","question_type":"select_correct","question":"制限行為能力者に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"被保佐人が保佐人の同意を得ずに自宅建物の新築を内容とする請負契約を締結した場合、これを取り消すことができる。","is_correct":true,"explanation":"新築、改築、増築又は大修繕をすることは保佐人の同意を要する行為とされており（民法13条1項8号）、同意なくした場合は取り消すことができる。"},{"text":"本人以外の者の請求により補助開始の審判をする場合、本人の同意は不要である。","is_correct":false,"explanation":"本人以外の者の請求により補助開始の審判をするには、本人の同意が必要である（民法15条2項）。補助は判断能力の低下が軽度な者を対象とするため、本人の意思が尊重される。"},{"text":"制限行為能力者が、取引の相手方に対し自己が制限行為能力者であることを単に黙秘していた場合、それだけで詐術に当たり、その行為を取り消すことができなくなる。","is_correct":false,"explanation":"判例は、単なる黙秘はそれだけでは詐術（民法21条）に当たらず、他の言動と相まって相手方を誤信させ、又は誤信を強めたときに詐術に当たるとする。"},{"text":"被保佐人と契約した相手方が、被保佐人本人に対し1か月以上の期間を定めて保佐人の追認を得るべき旨を催告したが、期間内に追認を得た旨の通知がなかったときは、その行為を追認したものとみなされる。","is_correct":false,"explanation":"被保佐人本人への催告で期間内に追認を得た旨の通知が発せられないときは、その行為を取り消したものとみなされる（民法20条4項）。追認擬制ではない点がひっかけである。"}],"explanation":"新築・改築・増築・大修繕は民法13条1項の列挙行為であり、保佐人の同意を欠けば取り消せる。補助開始の審判には本人の同意（15条2項）、単なる黙秘は詐術に当たらないとする判例、被保佐人への催告の効果は取消し擬制（20条4項）である点をあわせて押さえたい。","difficulty":2,"tags":["権利関係","制限行為能力者"],"shuffle_choices":true},{"id":"Q2004","topic":"意思表示","question_type":"select_correct","question":"Aは、売却する意思がないのに冗談で、自己所有の甲土地をBに売却する旨の意思表示をした。この場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"Bが、Aの意思表示がAの真意ではないことを知っていた場合でも、AB間の売買契約は有効である。","is_correct":false,"explanation":"相手方が表意者の真意ではないことを知り、又は知ることができたときは、その意思表示は無効である（民法93条1項ただし書）。"},{"text":"Bが、Aの意思表示がAの真意ではないことを知らず、かつ、知ることもできなかった場合、AB間の売買契約は有効である。","is_correct":true,"explanation":"心裡留保による意思表示は、原則として表意者の真意にかかわらず有効であり（民法93条1項本文）、相手方が善意無過失であれば有効なままである。"},{"text":"AB間の売買契約が無効となる場合、Aはその無効を、事情を知らずにBから甲土地を買い受けたCに対しても主張できる。","is_correct":false,"explanation":"心裡留保による意思表示の無効は、善意の第三者に対抗することができない（民法93条2項）。善意のCには無効を主張できない。"},{"text":"Aの意思表示は心裡留保に当たるため、Aはこれを取り消すことができる。","is_correct":false,"explanation":"心裡留保の効果は有効又は無効のいずれかであり、取消しの対象となるものではない（民法93条）。"}],"explanation":"心裡留保による意思表示は原則有効であり、相手方が悪意又は有過失のときに限り無効となる（民法93条1項）。その無効は善意の第三者に対抗できない（同条2項）。効果が取消しではなく有効・無効の問題である点にも注意する。","difficulty":1,"tags":["権利関係","意思表示"],"shuffle_choices":true},{"id":"Q2005","topic":"意思表示","question_type":"select_incorrect","question":"Aは、債権者からの差押えを免れるため、Bと通謀して、自己所有の甲土地をBに売却したように仮装し、B名義の登記を備えさせた。この場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":[{"text":"AB間の売買契約は無効である。","is_correct":false,"explanation":"正しい記述である。相手方と通じてした虚偽の意思表示は無効である（民法94条1項）。"},{"text":"Bから甲土地を買い受けたCが仮装譲渡の事実を知らなかった場合、Cは甲土地の所有権取得について登記を備えていなくても、Aに対して保護される。","is_correct":false,"explanation":"正しい記述である。判例は、民法94条2項の第三者として保護されるために登記を備えることは要しないとする。"},{"text":"Bから甲土地を買い受けたCが、民法94条2項の第三者として保護されるためには、仮装譲渡の事実を知らなかったことに加え、知らなかったことについて過失がないことが必要である。","is_correct":true,"explanation":"誤りである。判例は、94条2項の第三者は善意であれば足り、無過失であることまでは要しないとする。"},{"text":"AB間の売買契約の無効は、仮装譲渡の事実を知ってBから甲土地を買い受けたDに対しては、主張することができる。","is_correct":false,"explanation":"正しい記述である。94条2項が保護するのは善意の第三者に限られるから、悪意のDに対しては無効を対抗できる。"}],"explanation":"虚偽表示は無効であるが、その無効は善意の第三者に対抗できない（民法94条）。判例上、この第三者は善意であれば足りて無過失は不要であり、登記を備えることも要しない。悪意の第三者には無効を主張できる。","difficulty":2,"tags":["権利関係","意思表示"],"shuffle_choices":true},{"id":"Q2006","topic":"意思表示","question_type":"select_correct","question":"錯誤による意思表示に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"表意者が法律行為の基礎とした事情についての認識が真実に反する錯誤による意思表示は、その事情が法律行為の基礎とされていることが表示されていたときに限り、取り消すことができる。","is_correct":true,"explanation":"いわゆる動機の錯誤（基礎事情の錯誤）は、その事情が法律行為の基礎とされていることが表示されていたときに限り取消しが認められる（民法95条2項）。"},{"text":"錯誤が表意者の重大な過失によるものであった場合、相手方が表意者に錯誤があることを知っていたときでも、表意者は意思表示を取り消すことができない。","is_correct":false,"explanation":"重過失ある表意者は原則として取消しできないが、相手方が錯誤を知り、又は重大な過失によって知らなかったときは取り消すことができる（民法95条3項1号）。"},{"text":"法律行為の目的及び取引上の社会通念に照らして重要な錯誤による意思表示は、無効である。","is_correct":false,"explanation":"現行民法上、錯誤の効果は無効ではなく取消しである（民法95条1項）。"},{"text":"錯誤による意思表示の取消しは、取消し前に利害関係を有するに至った第三者が善意であれば、その者に過失があっても対抗することができない。","is_correct":false,"explanation":"錯誤取消しを対抗できないのは善意でかつ過失がない第三者に対してである（民法95条4項）。善意であっても過失があれば対抗できる。"}],"explanation":"錯誤の効果は取消しであり（民法95条1項）、基礎事情の錯誤はその事情が基礎とされていることの表示が必要である（同条2項）。重過失の表意者も相手方が悪意・重過失又は同一の錯誤に陥っていた場合は取り消すことができ（同条3項）、取消しは善意無過失の第三者に対抗できない（同条4項）。","difficulty":2,"tags":["権利関係","意思表示"],"shuffle_choices":true},{"id":"Q2007","topic":"意思表示","question_type":"select_correct","question":"Aは、Bにだまされて、自己所有の甲土地をBに売却した。この場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"Aが売買契約を取り消す前に、事情を知らず、かつ知らないことに過失のないCがBから甲土地を買い受けていた場合、Aは取消しをCに対抗することができる。","is_correct":false,"explanation":"詐欺による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない（民法96条3項）。"},{"text":"Aが売買契約を取り消した後に、Bが甲土地をDに売却した場合、AとDの優劣はDの善意・悪意によって決まり、登記の有無は関係がない。","is_correct":false,"explanation":"判例は、取消し後に出現した第三者との関係は対抗関係となり、登記の先後によって優劣が決まるとする（民法177条）。"},{"text":"Aの取消権は、追認をすることができる時から5年間行使しないとき、又は売買契約の時から10年を経過したときに消滅する。","is_correct":false,"explanation":"取消権は追認をすることができる時から5年、行為の時から20年で消滅する（民法126条）。行為の時から10年ではない。"},{"text":"Aが第三者Eの詐欺によってBに甲土地を売却した場合、BがEによる詐欺の事実を知ることができたときは、Aは売買契約を取り消すことができる。","is_correct":true,"explanation":"第三者による詐欺の場合、相手方がその事実を知り、又は知ることができたときに限り取り消すことができる（民法96条2項）。Bが知ることができた以上、取消しが可能である。"}],"explanation":"第三者詐欺による取消しは相手方が悪意又は有過失のときに限られる（民法96条2項）。取消し前の善意無過失の第三者には取消しを対抗できず（同条3項）、取消し後の第三者とは登記の先後で優劣が決まるというのが判例である。取消権の期間制限は5年・20年である（民法126条）。","difficulty":2,"tags":["権利関係","意思表示"],"shuffle_choices":true},{"id":"Q2008","topic":"意思表示","question_type":"select_correct","question":"強迫による意思表示に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"AがBに強迫されて自己所有の土地をBに売却した場合、その売買契約は取消しを待つまでもなく当然に無効である。","is_correct":false,"explanation":"強迫による意思表示の効果は原則として取消しであり（民法96条1項）、当然に無効となるわけではない。"},{"text":"AがBに強迫されて土地をBに売却し、その後Aが売買契約を取り消した場合、Aは、取消し前にBから土地を買い受けた善意無過失のCに対しても、取消しの効果を主張できる。","is_correct":true,"explanation":"取消し前の善意無過失の第三者に対抗できないとする民法96条3項は詐欺の場合の規定であり、強迫による取消しは善意無過失の第三者にも対抗できる。"},{"text":"第三者CがAを強迫し、AがBに土地を売却した場合、Bが強迫の事実を知らず、かつ知ることができなかったときは、Aは売買契約を取り消すことができない。","is_correct":false,"explanation":"第三者による強迫の場合、詐欺と異なり、相手方の善意・悪意を問わず取り消すことができる（民法96条2項は詐欺のみを対象とする）。"},{"text":"強迫の程度が強く、表意者が完全に意思の自由を失った状態でされた意思表示であっても、取り消すことができるにとどまり、無効を主張することはできない。","is_correct":false,"explanation":"判例は、強迫により完全に意思の自由を失った状態でされた意思表示は無効であるとする。"}],"explanation":"強迫による意思表示は取り消すことができ、その取消しは詐欺と異なり善意無過失の第三者にも対抗できる。また、第三者による強迫の場合も相手方の善意・悪意を問わず取り消すことができる（民法96条）。強迫の保護が詐欺より厚い点が出題の中心である。","difficulty":1,"tags":["権利関係","意思表示"],"shuffle_choices":true},{"id":"Q2009","topic":"代理","question_type":"select_correct","question":"AがBに代理権を与え、BがAのためにCとの間で土地の売買契約を締結した場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"BがCをだまして売買契約を締結させた場合、Aがその事実を知らなかったとしても、Cは売買契約を取り消すことができる。","is_correct":true,"explanation":"代理人の詐欺は相手方に対する契約当事者側の詐欺であり、本人の知不知にかかわらず、相手方は民法96条1項により取り消すことができる。"},{"text":"Bの意思表示の効力が意思の不存在によって影響を受けるべき場合、その事実の有無は、本人であるAについて決するのが原則である。","is_correct":false,"explanation":"代理行為の瑕疵は、実際に意思表示をした代理人について決するのが原則である（民法101条1項）。"},{"text":"AがBに特定の土地の購入を委託した場合において、Aがその土地の欠陥を知っていたときでも、Bが知らなければ、AはBの不知を主張することができる。","is_correct":false,"explanation":"特定の法律行為を委託された代理人がその行為をしたときは、本人は自ら知っていた事情について代理人が知らなかったことを主張できない（民法101条3項）。"},{"text":"Bが真意でないことを自ら知りながら売買の意思表示をした場合、Cがそのことを知っていたときでも、売買契約は常に有効である。","is_correct":false,"explanation":"心裡留保の有無は代理人について判断され、相手方が代理人の真意でないことを知り又は知ることができたときは意思表示は無効となる（民法93条1項ただし書、101条1項）。"}],"explanation":"代理行為の瑕疵は原則として代理人を基準に判断する（民法101条1項）。代理人が相手方に詐欺を行った場合は当事者による詐欺として相手方は取り消すことができる。また、特定の法律行為の委託があるときは、本人は自ら知っていた事情について代理人の不知を主張できない（同条3項）。","difficulty":2,"tags":["権利関係","代理"],"shuffle_choices":true},{"id":"Q2010","topic":"代理","question_type":"select_correct","question":"代理権に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"未成年者Bを任意代理人としてAが土地を売却した場合、Bの法定代理人の同意がないことを理由に、その売買契約を取り消すことができる。","is_correct":false,"explanation":"制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない（民法102条本文）。代理行為の効果は本人に帰属し、代理人自身は不利益を受けないからである。"},{"text":"任意代理人Bが後見開始の審判を受けても、Bの代理権は消滅しない。","is_correct":false,"explanation":"代理人が後見開始の審判を受けたことは代理権の消滅事由である（民法111条1項2号）。"},{"text":"本人Aは、未成年者Bを任意代理人に選任することができ、Bがした代理行為の効果は、Bが未成年者であることを理由に否定されない。","is_correct":true,"explanation":"任意代理人には行為能力が要求されず、制限行為能力者を代理人とすることができる。その代理行為は行為能力の制限を理由に取り消すことができない（民法102条本文）。"},{"text":"本人Aが死亡した場合でも、任意代理人Bの代理権は当然には消滅しない。","is_correct":false,"explanation":"本人の死亡は代理権の消滅事由である（民法111条1項1号）。"}],"explanation":"制限行為能力者も任意代理人となることができ、その代理行為は行為能力の制限を理由に取り消せない（民法102条本文）。代理権は本人の死亡、代理人の死亡・破産手続開始・後見開始などにより消滅する（民法111条）。","difficulty":1,"tags":["権利関係","代理"],"shuffle_choices":true},{"id":"Q2011","topic":"代理","question_type":"select_incorrect","question":"自己契約及び双方代理等に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":[{"text":"AB間の土地売買契約に基づく所有権移転登記の申請について、司法書士CがA・B双方の代理人となることは、債務の履行に当たり、許される。","is_correct":false,"explanation":"正しい記述である。双方代理は原則として無権代理とみなされるが、債務の履行については新たな利害関係を生じさせないため例外的に許される（民法108条1項ただし書）。"},{"text":"本人Aがあらかじめ許諾している場合には、Aの代理人Bが自らAの土地の買主となる契約を締結しても、その効果はAに帰属する。","is_correct":false,"explanation":"正しい記述である。本人があらかじめ許諾した行為については、自己契約も有効に本人に効果が帰属する（民法108条1項ただし書）。"},{"text":"代理人Bが本人Aの許諾なく自己契約をした場合、その契約は当然に無効であり、Aが追認しても効力を生じない。","is_correct":true,"explanation":"誤りである。許諾のない自己契約は無権代理行為とみなされるにとどまり（民法108条1項本文）、本人が追認すれば契約の時に遡って本人に効果が帰属する（民法113条・116条）。"},{"text":"代理人Bと本人Aとの利益が相反する行為については、Aがあらかじめ許諾した場合を除き、代理権を有しない者がした行為とみなされる。","is_correct":false,"explanation":"正しい記述である。自己契約・双方代理に該当しなくても、代理人と本人との利益相反行為は、本人があらかじめ許諾したものを除き無権代理とみなされる（民法108条2項）。"}],"explanation":"自己契約・双方代理・利益相反行為は原則として無権代理行為とみなされる（民法108条）。無効ではないため、本人の追認により有効となる余地がある。債務の履行と本人があらかじめ許諾した行為は例外として許される。","difficulty":2,"tags":["権利関係","代理"],"shuffle_choices":true},{"id":"Q2012","topic":"代理","question_type":"select_correct","question":"Bは、Aから代理権を与えられていないにもかかわらず、Aの代理人と称してCとの間でA所有の土地の売買契約を締結した。この場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"Cは、Bに代理権がないことを契約の締結時に知っていた場合でも、Aが追認をしない間は、売買契約を取り消すことができる。","is_correct":false,"explanation":"無権代理の相手方の取消権は、契約の時に代理権がないことを知らなかった（善意の）相手方にのみ認められる（民法115条）。悪意のCは取り消すことができない。"},{"text":"Cは、Bに代理権がないことを知っていた場合でも、Aに対し相当の期間を定めて追認をするかどうかを催告することができ、Aがその期間内に確答をしないときは、追認を拒絶したものとみなされる。","is_correct":true,"explanation":"無権代理の相手方の催告権は善意・悪意を問わず認められ、本人が期間内に確答しないときは追認拒絶とみなされる（民法114条）。"},{"text":"Aが追認をしたときは、別段の意思表示がない限り、追認の時から将来に向かって契約の効力が生ずる。","is_correct":false,"explanation":"追認は、別段の意思表示がないときは、契約の時に遡って効力を生ずる（民法116条本文）。"},{"text":"Cは、Bに代理権がないことを過失により知らなかった場合、Bが自己に代理権がないことを知っていたときでも、Bに対して履行又は損害賠償の請求をすることができない。","is_correct":false,"explanation":"相手方に過失があっても、無権代理人が自己に代理権がないことを知っていたときは、無権代理人の責任を追及できる（民法117条2項2号ただし書）。"}],"explanation":"無権代理の相手方には、悪意でも行使できる催告権（民法114条・確答なきときは追認拒絶擬制）、善意の場合の取消権（115条）が認められる。追認は契約時に遡及し（116条）、117条の無権代理人の責任は相手方が有過失でも無権代理人が悪意なら追及できる。","difficulty":2,"tags":["権利関係","代理"],"shuffle_choices":true},{"id":"Q2013","topic":"代理","question_type":"select_correct","question":"Bは、代理権がないのにAの代理人と称してA所有の甲土地をCに売却した。その後に相続が開始した場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"Aが死亡し、BがAを単独で相続した場合、Bは本人の資格で追認を拒絶することができる。","is_correct":false,"explanation":"判例は、無権代理人が本人を単独相続した場合、本人自ら法律行為をしたのと同様の地位が生じ、追認拒絶は信義則上許されず、無権代理行為は当然に有効となるとする。"},{"text":"Bが死亡し、AがBを単独で相続した場合、Aが追認を拒絶することは信義則に反し許されない。","is_correct":false,"explanation":"判例は、本人が無権代理人を相続した場合には、本人の追認拒絶は信義則に反せず、無権代理行為は当然には有効とならないとする。"},{"text":"Bが死亡し、AがBを単独で相続した場合、Aが追認を拒絶したときは、CはAに対し民法117条による無権代理人の責任を追及する余地はない。","is_correct":false,"explanation":"判例は、本人は無権代理人の地位を相続により承継するため、追認を拒絶できても、民法117条による無権代理人の債務を免れることはできないとする。"},{"text":"Aが死亡し、BがほかにDとともにAを共同相続した場合、Dの追認がない限り、無権代理行為はBの相続分に相当する部分についても当然に有効となるものではない。","is_correct":true,"explanation":"判例は、共同相続の場合、追認権は共同相続人全員に不可分的に帰属し、全員が共同して行使しない限り、無権代理人の相続分に相当する部分についても当然に有効となるものではないとする。"}],"explanation":"無権代理人が本人を単独相続すれば無権代理行為は当然に有効となるが、本人が無権代理人を相続した場合は追認拒絶が可能である（ただし117条の責任は承継する）。共同相続の場合は共同相続人全員の追認がない限り当然有効とはならないとするのが判例である。","difficulty":3,"tags":["権利関係","代理"],"shuffle_choices":true},{"id":"Q2014","topic":"代理","question_type":"select_correct","question":"表見代理に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"Aから土地の賃貸借契約締結の代理権を与えられたBが、その権限を越えてA所有の土地をCに売却した場合、CにおいてBに売却の代理権があると信ずべき正当な理由があるときは、Aはその責任を負う。","is_correct":true,"explanation":"権限外の行為の表見代理（民法110条）は、基本代理権の存在と、相手方が権限があると信ずべき正当な理由（善意無過失）があれば成立する。"},{"text":"Aから代理権を与えられていたBが、代理権消滅後にAの代理人としてCと契約した場合、Cが代理権消滅の事実を過失によって知らなかったときでも、表見代理が成立する。","is_correct":false,"explanation":"代理権消滅後の表見代理（民法112条1項）は、相手方が代理権消滅の事実について善意かつ無過失であることを要する。過失により知らなかった相手方は保護されない。"},{"text":"AがCに対してBに代理権を与えた旨を表示した場合、Bが実際には代理権を与えられていないことをCが知っていたときでも、AはBの代理行為について責任を負う。","is_correct":false,"explanation":"代理権授与の表示による表見代理（民法109条1項）は、相手方が代理権のないことを知り、又は過失によって知らなかったときは成立しない。"},{"text":"表見代理が成立する場合、相手方は表見代理の主張をせずに、無権代理人に対して民法117条の責任を追及することはできない。","is_correct":false,"explanation":"判例は、表見代理の成立要件が備わっていても、相手方は表見代理を主張せずに無権代理人の責任を選択的に追及でき、無権代理人の側から表見代理の成立を抗弁として主張することはできないとする。"}],"explanation":"表見代理には、代理権授与表示（民法109条）、権限外の行為（110条）、代理権消滅後（112条）の3類型があり、いずれも相手方の善意無過失（110条では正当な理由）が要求される。表見代理が成立し得る場合でも、相手方は無権代理人の責任（117条）を選択して追及できる。","difficulty":3,"tags":["権利関係","代理"],"shuffle_choices":true},{"id":"Q2015","topic":"時効","question_type":"select_correct","question":"Bは、A所有の甲土地を自己の所有と信じて占有を開始した。所有権の取得時効に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"Bが10年の取得時効を主張するためには、善意かつ無過失の状態が時効期間中継続していなければならない。","is_correct":false,"explanation":"善意無過失は占有開始の時点で判断され、時効期間中継続することは要求されない（民法162条2項）。"},{"text":"Bが占有の途中で甲土地が他人の物であることを知った場合でも、占有開始の時に善意かつ無過失であれば、10年の経過により甲土地の所有権を時効取得することができる。","is_correct":true,"explanation":"10年の短期取得時効における善意無過失は占有開始時を基準として判断されるから、途中で悪意となっても10年で時効取得できる。"},{"text":"Bが甲土地を他人の物であると知りながら占有を開始した場合、Bが所有権を時効取得することはない。","is_correct":false,"explanation":"悪意の占有者でも、所有の意思をもって平穏かつ公然と20年間占有を継続すれば時効取得できる（民法162条1項）。"},{"text":"Bの占有を承継したCが、Bの占有を併せて主張する場合、Cは自己の占有のみの瑕疵を引き継ぎ、Bの占有の瑕疵は承継しない。","is_correct":false,"explanation":"占有の承継人が前の占有者の占有を併せて主張する場合には、その瑕疵（悪意など）をも承継する（民法187条2項）。"}],"explanation":"取得時効の期間は、占有開始時に善意無過失であれば10年、それ以外は20年である（民法162条）。善意無過失は占有開始時に判断され、途中の悪意化は影響しない。占有の承継の場合、前主の占有を併せて主張するときは瑕疵も承継する（民法187条2項）。","difficulty":2,"tags":["権利関係","時効"],"shuffle_choices":true},{"id":"Q2016","topic":"時効","question_type":"select_incorrect","question":"消滅時効及び時効の利益に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":[{"text":"債権は、債権者が権利を行使することができることを知った時から5年間行使しないときは、時効によって消滅する。","is_correct":false,"explanation":"正しい記述である。債権の消滅時効期間は、主観的起算点から5年、客観的起算点から10年である（民法166条1項）。"},{"text":"時効の利益は、時効完成前であっても、あらかじめ放棄することができる。","is_correct":true,"explanation":"誤りである。時効の利益は、あらかじめ放棄することができない（民法146条）。債権者が優越的地位を利用して放棄を強要することを防ぐ趣旨である。"},{"text":"確定期限の定めのある債権の消滅時効は、権利を行使することができる時としては、その期限が到来した時から進行する。","is_correct":false,"explanation":"正しい記述である。確定期限付債権は期限到来時から権利行使が可能となるため、客観的起算点は期限到来時である。"},{"text":"消滅時効完成後に債務を承認した債務者は、時効完成の事実を知らなかったときでも、その完成した時効を援用することは許されない。","is_correct":false,"explanation":"正しい記述である。判例は、時効完成後の債務承認があった場合、債務者が完成の事実を知らなくても、その後に時効を援用することは信義則上許されないとする。"}],"explanation":"債権の消滅時効は知った時から5年・行使できる時から10年である（民法166条1項）。時効の利益の事前放棄は禁止され（146条）、時効完成後に債務を承認した者は完成を知らなくても援用できないとするのが判例である。","difficulty":2,"tags":["権利関係","時効"],"shuffle_choices":true},{"id":"Q2017","topic":"時効","question_type":"select_correct","question":"時効の完成猶予及び更新に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"催告があったときは、その時から6か月を経過するまでの間は時効は完成しないが、この完成猶予の期間中に再度催告をしても、更に完成猶予の効力は生じない。","is_correct":true,"explanation":"催告による完成猶予は6か月であり、猶予期間中にされた再度の催告には完成猶予の効力がない（民法150条）。"},{"text":"裁判上の請求をした場合、訴えの取下げにより権利が確定することなく訴訟が終了したときでも、時効は更新される。","is_correct":false,"explanation":"確定判決等により権利が確定することなく訴訟が終了した場合は更新されず、終了の時から6か月間の完成猶予が生ずるにとどまる（民法147条）。"},{"text":"債務者が権利の承認をしたときは、その時から6か月を経過するまでの間、時効の完成が猶予される。","is_correct":false,"explanation":"承認は完成猶予事由ではなく更新事由であり、承認の時から新たに時効期間の進行が始まる（民法152条1項）。"},{"text":"権利についての協議を行う旨の合意は、口頭でされた場合でも、時効の完成猶予の効力を有する。","is_correct":false,"explanation":"協議を行う旨の合意による完成猶予は、書面又は電磁的記録によってされた場合に限り効力を有する（民法151条）。"}],"explanation":"催告による完成猶予は6か月で、再度の催告に猶予の効力はない（民法150条）。裁判上の請求は権利が確定して初めて更新事由となり（147条）、承認は更新事由（152条）、協議の合意による猶予は書面等が必要である（151条）。","difficulty":3,"tags":["権利関係","時効"],"shuffle_choices":true},{"id":"Q2018","topic":"債務不履行・解除","question_type":"select_correct","question":"履行遅滞となる時期に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"債務の履行について確定期限があるときは、債務者は、債権者から履行の請求を受けた時から遅滞の責任を負う。","is_correct":false,"explanation":"確定期限があるときは、期限の到来した時から当然に遅滞となる（民法412条1項）。請求は不要である。"},{"text":"債務の履行について期限を定めなかったときは、債務者は、債務が発生した時から直ちに遅滞の責任を負う。","is_correct":false,"explanation":"期限の定めのない債務は、債務者が履行の請求を受けた時から遅滞となる（民法412条3項）。債務発生時からではない。"},{"text":"債務の履行について不確定期限があるときは、債務者は、期限が到来した時から当然に遅滞の責任を負う。","is_correct":false,"explanation":"不確定期限付債務は、期限到来後に履行の請求を受けた時又は期限の到来を知った時のいずれか早い時から遅滞となる（民法412条2項）。期限到来だけでは遅滞にならない。"},{"text":"債務の履行について不確定期限があるときは、債務者は、期限の到来した後に履行の請求を受けた時又は期限の到来したことを知った時のいずれか早い時から遅滞の責任を負う。","is_correct":true,"explanation":"民法412条2項の規定のとおりであり、請求を受けた時と期限到来を知った時の早い方が基準となる。"}],"explanation":"履行遅滞の起算点は、確定期限付債務は期限到来時、不確定期限付債務は期限到来後の請求時又は期限到来を知った時の早い方、期限の定めのない債務は請求時である（民法412条）。三類型の違いを正確に区別することが重要である。","difficulty":1,"tags":["権利関係","債務不履行・解除"],"shuffle_choices":true},{"id":"Q2019","topic":"債務不履行・解除","question_type":"select_correct","question":"債務不履行による損害賠償に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"特別の事情によって生じた損害は、当事者がその事情を現に予見していた場合に限り、賠償の対象となる。","is_correct":false,"explanation":"特別損害は、当事者がその事情を予見すべきであったときに賠償請求できる（民法416条2項）。現実の予見までは要求されていない。"},{"text":"債務の履行が不能となった場合、債権者は、契約を解除した後でなければ、履行に代わる損害賠償を請求することができない。","is_correct":false,"explanation":"履行不能の場合は、契約の解除を待つまでもなく、履行に代わる損害賠償（填補賠償）を請求できる（民法415条2項1号）。"},{"text":"債務の不履行が、契約その他の債務の発生原因及び取引上の社会通念に照らして債務者の責めに帰することができない事由によるものであるときは、債権者は損害賠償を請求することができない。","is_correct":true,"explanation":"民法415条1項ただし書のとおりであり、帰責事由の有無は契約その他の債務の発生原因及び取引上の社会通念に照らして判断される。"},{"text":"債務の不履行に関して債権者にも過失があった場合でも、裁判所は、これを考慮せずに損害賠償の額を定めることができる。","is_correct":false,"explanation":"債務不履行又は損害の発生・拡大に関して債権者に過失があったときは、裁判所は必ずこれを考慮して責任及び額を定めなければならない（民法418条）。"}],"explanation":"債務不履行による損害賠償は、債務者に免責事由（帰責事由の不存在）があるときは請求できない（民法415条1項ただし書）。賠償範囲は通常損害と予見すべきであった特別損害であり（416条）、履行不能の場合は解除しなくても填補賠償を請求でき（415条2項）、債権者の過失は必要的に考慮される（418条）。","difficulty":2,"tags":["権利関係","債務不履行・解除"],"shuffle_choices":true},{"id":"Q2020","topic":"債務不履行・解除","question_type":"select_incorrect","question":"金銭債務の不履行による損害賠償に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":[{"text":"債権者は、損害賠償を請求するにあたり、損害の発生及びその額を証明することを要しない。","is_correct":false,"explanation":"正しい記述である。金銭債務の不履行については、債権者は損害の証明をすることを要しない（民法419条2項）。"},{"text":"債務者は、不可抗力により支払ができなかったことを証明しても、遅延損害金の支払義務を免れない。","is_correct":false,"explanation":"正しい記述である。金銭債務の不履行については、債務者は不可抗力をもって抗弁とすることができない（民法419条3項）。"},{"text":"約定利率が法定利率を超えるときは、遅延損害金は約定利率によって計算される。","is_correct":false,"explanation":"正しい記述である。損害賠償の額は法定利率によるのが原則だが、約定利率が法定利率を超えるときは約定利率による（民法419条1項ただし書）。"},{"text":"遅延損害金の額を法定利率によって計算する場合、その法定利率は、実際に支払がされる時点における法定利率による。","is_correct":true,"explanation":"誤りである。基準となるのは、債務者が遅滞の責任を負った最初の時点における法定利率である（民法419条1項本文）。法定利率は変動制のため、基準時が明文で定められている。"}],"explanation":"金銭債務の特則として、遅延損害金は債務者が遅滞の責任を負った最初の時点の法定利率（約定利率がこれを超えるときは約定利率）により、債権者は損害の証明が不要で、債務者は不可抗力を抗弁とできない（民法419条）。","difficulty":1,"tags":["権利関係","債務不履行・解除"],"shuffle_choices":true},{"id":"Q2021","topic":"債務不履行・解除","question_type":"select_correct","question":"AがBに自己所有の甲建物を売却する契約を締結した場合の契約の解除に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"Bが代金支払を怠った場合、Aが相当の期間を定めて催告し、その期間が経過すれば、その時点における不履行が契約及び取引上の社会通念に照らして軽微であっても、Aは契約を解除できる。","is_correct":false,"explanation":"催告解除は、催告期間経過時の不履行がその契約及び取引上の社会通念に照らして軽微であるときはすることができない（民法541条ただし書）。"},{"text":"Aの引渡債務の全部が履行不能となったときは、Bは、催告をすることなく、直ちに契約を解除することができる。","is_correct":true,"explanation":"債務の全部の履行が不能であるときは、債権者は催告をすることなく直ちに契約の解除をすることができる（民法542条1項1号）。"},{"text":"Aの債務不履行がBの責めに帰すべき事由によるものであるときでも、Bは契約を解除することができる。","is_correct":false,"explanation":"債務の不履行が債権者の責めに帰すべき事由によるものであるときは、債権者は解除をすることができない（民法543条）。"},{"text":"AB間の契約が解除された場合、解除前にBから甲建物を買い受けていたCは、善意であれば、所有権移転登記を備えていなくても保護される。","is_correct":false,"explanation":"解除前の第三者は善意・悪意を問わず民法545条1項ただし書により保護され得るが、判例上、保護を受けるには登記を備えていることが必要である。"}],"explanation":"催告解除は不履行が軽微なときは認められず（民法541条）、全部履行不能等の場合は無催告解除ができる（542条）。債権者に帰責事由がある不履行では解除できず（543条）、解除前の第三者は善意悪意を問わないが登記を要するとするのが判例である。","difficulty":2,"tags":["権利関係","債務不履行・解除"],"shuffle_choices":true},{"id":"Q2022","topic":"危険負担","question_type":"select_correct","question":"Aは、自己所有の甲建物をBに売却する契約を締結したが、引渡しの前に甲建物が滅失した。この場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"甲建物がA・B双方の責めに帰することができない事由によって滅失した場合、Bは、代金の支払を拒むことができる。","is_correct":true,"explanation":"当事者双方の責めに帰することができない事由によって債務を履行することができなくなったときは、債権者は反対給付の履行を拒むことができる（民法536条1項）。"},{"text":"甲建物がA・B双方の責めに帰することができない事由によって滅失した場合、Bの代金債務は当然に消滅する。","is_correct":false,"explanation":"民法536条1項は履行拒絶権を認める構成であり、反対給付債務が当然に消滅するわけではない。代金債務を消滅させるには契約の解除が必要である。"},{"text":"甲建物がBの責めに帰すべき事由によって滅失した場合でも、Bは代金の支払を拒むことができる。","is_correct":false,"explanation":"債権者の責めに帰すべき事由によって履行不能となったときは、債権者は反対給付の履行を拒むことができない（民法536条2項前段）。"},{"text":"甲建物がBの責めに帰すべき事由によって滅失した場合、Aは、自己の債務を免れたことによって得た利益があっても、これをBに償還する必要はない。","is_correct":false,"explanation":"債権者の帰責事由による履行不能の場合、債務者は自己の債務を免れたことによって利益を得たときは、これを債権者に償還しなければならない（民法536条2項後段）。"}],"explanation":"危険負担について現行民法は履行拒絶権構成を採用しており、双方無責の履行不能では債権者は反対給付の履行を拒める（民法536条1項）。債権者に帰責事由があるときは拒絶できず、債務者は債務を免れて得た利益を償還する（同条2項）。","difficulty":1,"tags":["権利関係","危険負担"],"shuffle_choices":true},{"id":"Q2023","topic":"弁済・相殺・債権譲渡","question_type":"select_correct","question":"第三者による弁済に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"債務者の父は、債務者の親族であることから、当然に弁済をするについて正当な利益を有する第三者に当たる。","is_correct":false,"explanation":"正当な利益の有無は法律上の利害関係の有無で判断され、親子や親族といった事実上の利害関係だけでは正当な利益を有するとはいえない。"},{"text":"債務者所有の不動産に抵当権を設定した物上保証人は、弁済をするについて正当な利益を有する第三者に当たらないため、債務者の意思に反して弁済をすることができない。","is_correct":false,"explanation":"物上保証人は弁済しなければ自己の財産について抵当権を実行される法律上の利害関係を有するから、正当な利益を有する第三者に当たり、債務者の意思に反しても弁済できる。"},{"text":"借地上の建物の賃借人は、その敷地の地代の弁済について、正当な利益を有する第三者に当たる。","is_correct":true,"explanation":"判例は、借地上の建物の賃借人は、地代の不払により借地権が消滅すると建物の使用収益ができなくなる法律上の利害関係を有するから、地代の弁済について正当な利益を有するとする。"},{"text":"弁済をするについて正当な利益を有しない第三者が債務者の意思に反して弁済をした場合、債権者が債務者の意思に反することを知らなかったときでも、その弁済は無効である。","is_correct":false,"explanation":"正当な利益を有しない第三者の弁済は債務者の意思に反してすることができないのが原則だが、債務者の意思に反することを債権者が知らなかったときは有効である（民法474条2項ただし書）。"}],"explanation":"弁済をするについて正当な利益を有するか否かは法律上の利害関係の有無で判断され、物上保証人や借地上建物の賃借人はこれに当たるが、単なる親族関係では足りない。正当な利益のない第三者の弁済は債務者の意思に反するとできないが、債権者が善意なら有効である（民法474条）。","difficulty":3,"tags":["権利関係","弁済・相殺・債権譲渡"],"shuffle_choices":true},{"id":"Q2024","topic":"弁済・相殺・債権譲渡","question_type":"select_correct","question":"弁済の効力に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"受領権者以外の者であって取引上の社会通念に照らして受領権者としての外観を有するものに対してした弁済は、弁済者が善意であれば、過失があっても有効である。","is_correct":false,"explanation":"受領権者としての外観を有する者への弁済が有効となるのは、弁済者が善意であり、かつ、過失がなかったときに限られる（民法478条）。"},{"text":"債権者の代理人と称して債権を行使する者に対して弁済をした場合でも、弁済者が善意かつ無過失であるときは、その弁済は有効である。","is_correct":true,"explanation":"債権者の代理人と詐称する者も、取引上の社会通念に照らして受領権者としての外観を有する者に当たり得るため、善意無過失の弁済者は民法478条により保護される。"},{"text":"受領権者としての外観を有する者に該当しない無権限者への弁済は、債権者がその弁済により利益を受けた場合でも、常に無効である。","is_correct":false,"explanation":"受領権者以外の者への弁済も、債権者がこれによって利益を受けた限度においては効力を有する（民法479条）。"},{"text":"受領権者としての外観を有する者への弁済が有効とされた場合でも、債務者は、真の債権者から請求を受けたときは、改めて弁済をしなければならない。","is_correct":false,"explanation":"民法478条により弁済が有効となれば債権は消滅するから、債務者が真の債権者に二重に弁済する義務はない。真の債権者は弁済を受領した者に対して不当利得返還等を請求することになる。"}],"explanation":"受領権者としての外観を有する者に対する弁済は、弁済者が善意無過失のときに限り有効であり（民法478条）、債権者の代理人と詐称した者もこれに含まれ得る。478条で弁済が有効になれば債権は消滅し、それ以外の無権限者への弁済も債権者が利益を受けた限度で有効となる（479条）。","difficulty":1,"tags":["権利関係","弁済・相殺・債権譲渡"],"shuffle_choices":true},{"id":"Q2025","topic":"弁済・相殺・債権譲渡","question_type":"select_correct","question":"AはBに対して貸金債権（甲債権）を、BはAに対して貸金債権（乙債権）を有している。相殺に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"甲債権の弁済期が到来していない場合でも、乙債権の弁済期が到来していれば、Aは相殺をすることができる。","is_correct":false,"explanation":"相殺をするには自働債権（相殺する側が有する債権。ここでは甲債権）の弁済期が到来していることが必要である。自働債権の弁済期未到来のまま相殺すると、相手方の期限の利益を一方的に奪うことになるからである。"},{"text":"甲債権が時効によって消滅した場合、その消滅以前に甲債権と乙債権が相殺適状にあったときでも、Aは甲債権を自働債権として相殺をすることができない。","is_correct":false,"explanation":"時効によって消滅した債権がその消滅以前に相殺適状にあったときは、債権者はこれを自働債権として相殺をすることができる（民法508条）。"},{"text":"乙債権がAの悪意による不法行為に基づく損害賠償債権である場合、Bは乙債権を自働債権として甲債権と相殺をすることができない。","is_correct":false,"explanation":"民法509条が禁止するのは、悪意による不法行為に基づく損害賠償債権等を受働債権とする相殺である。被害者側が自己の損害賠償債権を自働債権として相殺することは禁止されていない。"},{"text":"甲債権の弁済期が到来している場合、Aは、乙債権について自己の期限の利益を放棄することにより、乙債権の弁済期到来前であっても相殺をすることができる。","is_correct":true,"explanation":"受働債権（相殺される側の債権。Aにとっての乙債権）については、債務者であるAが期限の利益を放棄すれば弁済期前でも相殺が可能である（民法136条2項・505条1項）。"}],"explanation":"相殺には自働債権の弁済期到来が必要だが、受働債権は期限の利益を放棄して相殺できる。時効消滅した債権も消滅前に相殺適状にあれば自働債権にでき（民法508条）、悪意の不法行為等に基づく損害賠償債権は受働債権とする相殺のみが禁止される（509条）。","difficulty":2,"tags":["権利関係","弁済・相殺・債権譲渡"],"shuffle_choices":true},{"id":"Q2026","topic":"弁済・相殺・債権譲渡","question_type":"select_correct","question":"AはBに対する売買代金債権をCに譲渡した。この債権には譲渡を禁止する旨のAB間の特約が付されていた場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"譲渡制限の意思表示がされていても、AからCへの債権譲渡は有効であり、Cが特約の存在について悪意であっても、債権はCに移転する。","is_correct":true,"explanation":"当事者が譲渡制限の意思表示をしたときであっても、債権の譲渡はその効力を妨げられない（民法466条2項）。譲受人の善意・悪意にかかわらず債権は移転する。"},{"text":"Cが譲渡制限特約の存在を知っていた場合、AからCへの債権譲渡は無効である。","is_correct":false,"explanation":"譲渡制限特約があっても譲渡自体は有効である（民法466条2項）。悪意の譲受人に対しては、債務者が履行を拒み、譲渡人への弁済等を対抗できるにとどまる（同条3項）。"},{"text":"Bは、譲渡制限特約について善意であり、かつ知らないことに重大な過失がないCに対しても、債務の履行を拒むことができる。","is_correct":false,"explanation":"債務者が履行を拒絶し、譲渡人への弁済等をもって対抗できるのは、特約について悪意又は善意重過失の譲受人等に対してのみである（民法466条3項）。"},{"text":"譲渡制限特約の付された金銭債権が譲渡されたときでも、債務者Bは、その債権の全額に相当する金銭を供託することはできない。","is_correct":false,"explanation":"譲渡制限の意思表示がされた金銭債権が譲渡されたときは、債務者は債権の全額に相当する金銭を供託することができる（民法466条の2第1項）。"}],"explanation":"譲渡制限特約付きの債権譲渡も有効であり、債権は譲受人に移転する（民法466条2項）。ただし債務者は、悪意又は重過失の譲受人に対しては履行を拒み、譲渡人への弁済等を対抗できる（同条3項）。金銭債権の場合、債務者は供託も可能である（466条の2）。","difficulty":1,"tags":["権利関係","弁済・相殺・債権譲渡"],"shuffle_choices":true},{"id":"Q2027","topic":"弁済・相殺・債権譲渡","question_type":"select_correct","question":"債権譲渡の対抗要件に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"債権の譲受人は、譲渡人に代位して、自ら債務者に対して債権譲渡の通知をすることができる。","is_correct":false,"explanation":"対抗要件としての通知は譲渡人がしなければならず（民法467条1項）、判例は譲受人が譲渡人に代位して通知することも認めていない。"},{"text":"債務者に対する債権譲渡の通知が口頭でされた場合でも、その通知は債務者以外の第三者に対する対抗要件となる。","is_correct":false,"explanation":"債務者以外の第三者に対抗するには、確定日付のある証書による通知又は承諾が必要である（民法467条2項）。口頭の通知は債務者対抗要件にはなり得ても第三者対抗要件にはならない。"},{"text":"同一の債権がCとDに二重に譲渡され、いずれについても確定日付のある証書による通知がされた場合、CとDの優劣は、通知が債務者に到達した日時の先後によって決まる。","is_correct":true,"explanation":"判例は、確定日付のある通知が競合した場合の譲受人相互の優劣は、確定日付の先後ではなく、通知が債務者に到達した日時の先後によって決すべきものとする。"},{"text":"同一の債権がCとDに二重に譲渡され、いずれについても確定日付のある証書による通知がされた場合、CとDの優劣は、それぞれの証書に付された確定日付の先後によって決まる。","is_correct":false,"explanation":"判例は確定日付の先後ではなく、通知の債務者への到達の先後を基準とする。確定日付が先でも到達が後であれば劣後する。"}],"explanation":"債権譲渡の債務者対抗要件は譲渡人からの通知又は債務者の承諾であり、第三者対抗要件には確定日付のある証書が必要である（民法467条）。二重譲渡で確定日付ある通知が競合したときの優劣は、通知の到達の先後によるというのが判例である。","difficulty":3,"tags":["権利関係","弁済・相殺・債権譲渡"],"shuffle_choices":true},{"id":"Q2028","topic":"売買","question_type":"select_correct","question":"Aは、自己所有の甲土地をBに売却する契約を締結し、BはAに解約手付として200万円を交付した。この場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"Bが代金の一部を支払うなど履行に着手した後であっても、Aは、手付の倍額を現実に提供すれば契約を解除することができる。","is_correct":false,"explanation":"手付による解除は、相手方が契約の履行に着手した後はすることができない（民法557条1項ただし書）。履行に着手したBに不測の損害を与えないためである。"},{"text":"Aが手付の倍額を償還して契約を解除するには、Bに対して口頭で倍額を償還する旨を告げるだけでは足りず、現実にその提供をしなければならない。","is_correct":true,"explanation":"売主が手付解除をするには、手付の倍額を現実に提供することが必要である（民法557条1項）。口頭の提供では足りない。"},{"text":"Bは、自らが履行に着手した後は、Aが履行に着手していなくても、手付を放棄して契約を解除することができない。","is_correct":false,"explanation":"履行の着手により解除権を失うのは、相手方が着手した場合である。判例も、自ら履行に着手した当事者であっても、相手方が着手していない間は手付解除ができるとする。"},{"text":"Aが手付の倍額を現実に提供して契約を解除した場合、Bは、解除により損害が生じたときは、別途Aに損害賠償を請求することができる。","is_correct":false,"explanation":"手付解除は債務不履行による解除ではないため、損害賠償に関する民法545条4項の規定は適用されず（民法557条2項）、相手方は損害賠償を請求できない。"}],"explanation":"解約手付が交付された場合、相手方が履行に着手するまでは、買主は手付を放棄し、売主は倍額を現実に提供して解除できる（民法557条1項）。自ら着手していても相手方未着手なら解除でき、手付解除に伴う損害賠償請求は認められない（同条2項）。","difficulty":2,"tags":["権利関係","売買"],"shuffle_choices":true},{"id":"Q2029","topic":"売買","question_type":"select_correct","question":"AがBに中古住宅を売却したところ、引き渡された住宅が品質に関して契約の内容に適合しないものであった。この場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"Bは、Aに対して修補を催告することなく、直ちに代金の減額を請求することができる。","is_correct":false,"explanation":"代金減額請求は、原則として相当の期間を定めて履行の追完の催告をし、その期間内に追完がないことが必要である（民法563条1項）。追完不能等の場合に限り無催告で請求できる（同条2項）。"},{"text":"契約不適合がBの責めに帰すべき事由によるものであるときでも、BはAに対して履行の追完を請求することができる。","is_correct":false,"explanation":"不適合が買主の責めに帰すべき事由によるものであるときは、買主は追完請求をすることができない（民法562条2項）。"},{"text":"Bが品質の契約不適合を理由としてAの責任を追及するには、不適合を知った時から1年以内に訴えを提起しなければならない。","is_correct":false,"explanation":"種類又は品質の契約不適合については、買主が不適合を知った時から1年以内にその旨を売主に通知すれば足り（民法566条）、訴えの提起までは要求されていない。"},{"text":"Bが修補による追完を請求した場合でも、Aは、Bに不相当な負担を課するものでないときは、Bが請求した方法と異なる方法による履行の追完をすることができる。","is_correct":true,"explanation":"売主は、買主に不相当な負担を課するものでないときは、買主が請求した方法と異なる方法による追完をすることができる（民法562条1項ただし書）。"}],"explanation":"契約不適合の場合、買主は追完請求・代金減額請求・損害賠償請求・解除ができる。売主は買主に不相当な負担を課さない限り別の方法で追完でき（民法562条1項ただし書）、代金減額は原則として催告が先行し（563条）、種類・品質の不適合は知った時から1年以内の通知で権利が保存される（566条）。","difficulty":2,"tags":["権利関係","売買"],"shuffle_choices":true},{"id":"Q2030","topic":"売買","question_type":"select_incorrect","question":"売買契約における売主の契約不適合責任に関する次の記述のうち、民法の規定によれば、誤っているものはどれか。","choices":[{"text":"引き渡された目的物が品質に関して契約の内容に適合しない場合、買主がその不適合を知った時から1年以内にその旨を売主に通知しないときは、買主は、原則としてその不適合を理由とする責任追及をすることができない。","is_correct":false,"explanation":"正しい記述である。種類又は品質の契約不適合については、知った時から1年以内の通知を怠ると、原則として追完請求・代金減額請求・損害賠償請求・解除ができなくなる（民法566条本文）。"},{"text":"売主が引渡しの時に目的物の契約不適合を知り、又は重大な過失によって知らなかったときは、買主は、不適合を知った時から1年以内に通知をしなくても、責任を追及することができる。","is_correct":false,"explanation":"正しい記述である。売主が引渡時に不適合につき悪意又は善意重過失であったときは、1年の通知期間の制限は適用されない（民法566条ただし書）。"},{"text":"引き渡された目的物が数量に関して契約の内容に適合しない場合も、買主は、その不適合を知った時から1年以内にその旨を売主に通知しなければ、責任追及をすることができなくなる。","is_correct":true,"explanation":"誤りである。知った時から1年以内の通知による期間制限（民法566条）は種類又は品質の不適合に限って適用され、数量や権利に関する不適合には適用されない。"},{"text":"買主が契約不適合を理由として損害賠償を請求するには、その不適合が売主の責めに帰することができない事由によるものであるときは、認められない。","is_correct":false,"explanation":"正しい記述である。契約不適合を理由とする損害賠償は債務不履行の一般規定（民法415条）によるため、売主に免責事由があるときは請求できない（民法564条）。"}],"explanation":"知った時から1年以内の通知という期間制限（民法566条）は、種類・品質の契約不適合に限られ、数量・権利の不適合には適用がない。また、売主が引渡時に悪意又は重過失の場合にはこの制限自体が適用されない。損害賠償には売主の帰責事由が必要である。","difficulty":2,"tags":["権利関係","売買"],"shuffle_choices":true},{"id":"Q2031","topic":"売買","question_type":"select_correct","question":"Aは、C所有の甲土地を自己に売却する権限がないにもかかわらず、Bとの間で甲土地の売買契約を締結した。この場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"AB間の売買契約は有効であり、Aは、甲土地の所有権をCから取得してBに移転する義務を負う。","is_correct":true,"explanation":"他人の権利を目的とする売買契約も有効であり、売主はその権利を取得して買主に移転する義務を負う（民法561条）。"},{"text":"他人の権利の売買は原始的に不能な契約であるから、AB間の売買契約は無効である。","is_correct":false,"explanation":"他人物売買も契約として有効である（民法561条）。売主が権利を取得して移転すればよく、契約が無効となるものではない。"},{"text":"AがCから甲土地の所有権を取得できずBに移転できなかった場合、Bは、Aに帰責事由がなくても、Aに対して債務不履行に基づく損害賠償を請求することができる。","is_correct":false,"explanation":"権利を移転できない場合の買主の救済は債務不履行の一般規定によるため、損害賠償請求には売主に免責事由がないこと（帰責事由）が必要である（民法415条1項ただし書）。なお解除には売主の帰責事由は不要である。"},{"text":"Aが契約の時に甲土地が他人の物であることを知らなかったときは、Aの側から売買契約を解除することができる。","is_correct":false,"explanation":"善意の売主に解除権を認める規定は現行民法には存在しない（債権法改正前の旧562条は削除された）。売主は権利を取得して移転する義務を負うのみである。"}],"explanation":"他人物売買は有効であり、売主は権利を取得して買主に移転する義務を負う（民法561条）。移転できない場合は債務不履行の一般規定により処理され、解除に売主の帰責事由は不要だが、損害賠償には必要である。善意の売主の解除権の規定は改正により削除されている。","difficulty":2,"tags":["権利関係","売買"],"shuffle_choices":true},{"id":"Q2032","topic":"売買","question_type":"select_correct","question":"Aは、自己所有の甲建物をBに売却する契約を締結した。目的物の滅失等に関する危険の移転及び買主の権利の期間制限に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"Aが契約の内容に適合する甲建物をBに引き渡した後、甲建物がA・B双方の責めに帰することができない事由により滅失した場合でも、Bは契約を解除することができる。","is_correct":false,"explanation":"契約に適合する目的物の引渡し後に双方無責の事由で滅失したときは、買主は追完請求・代金減額請求・損害賠償請求及び解除をすることができない（民法567条1項前段）。"},{"text":"Aが契約の内容に適合する甲建物をBに引き渡した後、甲建物がA・B双方の責めに帰することができない事由により滅失した場合、Bは代金の支払を拒むことができない。","is_correct":true,"explanation":"引渡しによって危険は買主に移転するため、引渡し後の双方無責の滅失について買主は代金の支払を拒むことができない（民法567条1項後段）。"},{"text":"Aが契約の内容に適合する甲建物の引渡しを提供したにもかかわらずBが受領を拒み、その後、A・B双方の責めに帰することができない事由により甲建物が滅失した場合、Bは代金の支払を拒むことができる。","is_correct":false,"explanation":"売主が契約の内容に適合する目的物の履行を提供したのに買主が受領を拒み、又は受領できない場合において、提供以後に双方無責の事由で滅失したときも、危険は買主が負担し、代金の支払を拒めない（民法567条2項）。"},{"text":"引き渡された甲建物に品質の契約不適合があった場合、Bが不適合を知った時から1年以内にその旨をAに通知していれば、Bの追完請求権が消滅時効にかかることはない。","is_correct":false,"explanation":"1年以内の通知（民法566条）は失権を防ぐものにすぎず、買主の権利はこれとは別に消滅時効の一般規定（民法166条1項）に服する。通知をしても、時効期間が経過すれば権利は消滅し得る。"}],"explanation":"契約に適合する目的物の引渡し（又は受領遅滞中の履行の提供）後に双方無責の事由で目的物が滅失・損傷したときは、買主は責任追及ができず、代金の支払も拒めない（民法567条）。また、1年以内の通知をしても買主の権利は消滅時効の一般規定に服する点に注意する。","difficulty":3,"tags":["権利関係","売買"],"shuffle_choices":true},{"id":"Q2033","topic":"物権変動","question_type":"select_correct","question":"Aは、自己所有の甲土地をBに売却する契約を締結した。この場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"甲土地の所有権は、AからBへの所有権移転登記が完了した時に初めてBに移転する。","is_correct":false,"explanation":"物権変動は当事者の意思表示のみによって効力を生じる(民法176条)。登記は対抗要件にすぎず、権利移転の効力発生要件ではない。"},{"text":"所有権の移転時期について特約がない限り、甲土地の所有権は売買契約の成立と同時にBに移転する。","is_correct":true,"explanation":"正しい。判例は、特定物売買では特約がない限り契約成立時に所有権が移転するとしている(意思主義・民法176条)。"},{"text":"Bが代金全額を支払うまで所有権は移転しないというのが民法の定める原則であり、これと異なる特約は無効である。","is_correct":false,"explanation":"民法の原則は意思表示のみによる移転であり、代金完済時に移転させる特約は有効だが、それは特約による例外にすぎない。"},{"text":"甲土地の引渡しがされるまでは、契約が成立していても所有権はBに移転しない。","is_correct":false,"explanation":"引渡しは動産の対抗要件であって、所有権移転の効力発生要件ではない。特約がなければ契約成立時に移転する。"}],"explanation":"民法176条は、物権の設定及び移転は当事者の意思表示のみによって効力を生じると定める(意思主義)。判例は、特定物の売買では特約のない限り契約成立時に所有権が移転するとしており、登記や引渡し、代金支払は移転の要件ではない。","difficulty":1,"tags":["権利関係","物権変動"],"shuffle_choices":true},{"id":"Q2034","topic":"物権変動","question_type":"select_correct","question":"Aは、Bの詐欺により自己所有の甲土地をBに売却し、所有権移転登記を了したが、その後、詐欺を理由にこの売買契約を取り消した。この場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"取消しにより売買契約は初めから無効であったものとみなされるから、Aは、取消し後にBから甲土地を買い受けたCに対し、登記がなくても所有権を対抗できる。","is_correct":false,"explanation":"判例によれば、取消し後に現れた第三者との関係は民法177条の対抗問題となり、Aは登記がなければ対抗できない。"},{"text":"取消し後にBから甲土地を買い受けたCがAの取消しの事実を知っていた場合、Cが先に登記を備えても、Aは常にCに所有権を対抗できる。","is_correct":false,"explanation":"取消し後の第三者との優劣は登記の先後で決まり、Cが単に悪意であっても先に登記を備えれば原則としてCが優先する(背信的悪意者は別)。"},{"text":"取消し前にBから甲土地を買い受けた善意無過失のDは、所有権移転登記を備えていなければ、Aの取消しに対抗できない。","is_correct":false,"explanation":"詐欺による取消しは善意無過失の第三者に対抗できず(民法96条3項)、判例上、この第三者に登記は要求されないと解されている。"},{"text":"取消し後にBから甲土地を買い受けたCとAとの優劣は、対抗要件である登記の先後によって決せられる。","is_correct":true,"explanation":"正しい。判例は、取消し後の第三者との関係を復帰的物権変動とBからの譲渡の二重譲渡類似の関係とみて、民法177条により登記の先後で決するとしている。"}],"explanation":"詐欺取消しの場面では、取消し前の第三者は民法96条3項(善意無過失で保護)、取消し後の第三者は民法177条(登記の先後)で処理するのが判例である。取消し後は、AとCが対抗関係に立つため、先に登記を備えた者が優先する。","difficulty":2,"tags":["権利関係","物権変動"],"shuffle_choices":true},{"id":"Q2035","topic":"物権変動","question_type":"select_incorrect","question":"Aは、B所有の甲土地を所有の意思をもって平穏かつ公然に占有し続け、取得時効が完成した。この場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":[{"text":"時効完成前にBから甲土地を買い受けて登記を備えたCに対し、Aは、登記がなければ時効による所有権の取得を対抗できない。","is_correct":true,"explanation":"誤り。時効完成前に現れた第三者は時効取得者にとって当事者と同視され、Aは登記がなくても時効取得を対抗できる(判例)。"},{"text":"時効完成後にBから甲土地を買い受けて登記を備えたDに対しては、Aは、登記がなければ時効による所有権の取得を対抗できない。","is_correct":false,"explanation":"正しい記述。時効完成後の第三者との関係は民法177条の対抗問題となり、登記の先後で優劣が決まる(判例)。"},{"text":"時効完成後に第三者Dが登記を備えた場合でも、その後Aが引き続き時効取得に必要な期間占有を継続すれば、Aは登記がなくてもDに対して時効取得を対抗できる。","is_correct":false,"explanation":"正しい記述。判例は、第三者の登記後さらに時効期間の占有を継続した場合、時効取得者は登記なくして対抗できるとする。"},{"text":"Aは、時効の起算点を自己に有利なように任意に選択して、時効完成の時期を遅らせたり早めたりすることはできない。","is_correct":false,"explanation":"正しい記述。判例は、時効の起算点は占有開始時に固定され、援用者が任意に選択することはできないとする。"}],"explanation":"取得時効と登記に関する判例法理では、時効完成前の第三者には登記なくして対抗でき、時効完成後の第三者とは民法177条の対抗関係に立つ。また、第三者の登記後に再度時効期間占有を継続すれば再び登記なくして対抗できる。","difficulty":2,"tags":["権利関係","物権変動"],"shuffle_choices":true},{"id":"Q2036","topic":"物権変動","question_type":"select_correct","question":"Aは、自己所有の甲土地をBに売却したが、Bが所有権移転登記を備えない間に、AはCにも甲土地を売却し、Cが所有権移転登記を備えた。この場合に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"Cが、AB間の売買の事実を知っていた場合には、Cは民法177条の第三者に当たらず、Bは登記がなくてもCに所有権を対抗できる。","is_correct":false,"explanation":"単なる悪意者は民法177条の第三者に含まれる。登記を備えたCが原則として優先し、Bが対抗できないのは Cが背信的悪意者である場合に限られる。"},{"text":"Cが背信的悪意者である場合には、AC間の売買契約自体が無効となるため、Cは所有権を取得しない。","is_correct":false,"explanation":"背信的悪意者の理論は、Cが177条の第三者に当たらずBに登記の欠缺を主張できないというものであり、AC間の売買が当然に無効となるわけではない。"},{"text":"Cが背信的悪意者であっても、Cから甲土地を買い受けたDは、D自身が背信的悪意者と評価されない限り、登記を備えればBに所有権を対抗できる。","is_correct":true,"explanation":"正しい。判例は、背信的悪意者からの転得者について、転得者自身が背信的悪意者と評価されない限り177条の第三者に当たるとしている。"},{"text":"Cが背信的悪意者に当たるかどうかは、Cの主観的事情とは無関係に、専ら登記の先後のみによって判断される。","is_correct":false,"explanation":"背信的悪意者かどうかは、悪意に加えて登記の欠缺を主張することが信義則に反すると認められる事情の有無という主観的・客観的事情から判断される。"}],"explanation":"民法177条の第三者には単なる悪意者も含まれるが、信義則に反する背信的悪意者は含まれない。判例は、背信的悪意者からの転得者については、転得者自身を基準に背信性を判断し、背信的悪意者と評価されない限り登記を備えれば保護されるとする。","difficulty":3,"tags":["権利関係","物権変動"],"shuffle_choices":true},{"id":"Q2037","topic":"物権変動","question_type":"select_incorrect","question":"相続と登記に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":[{"text":"共同相続人B・Cが相続した甲土地について、Bが勝手に単独名義の登記をして第三者Dに売却し登記を移転しても、Cは自己の持分を登記がなくてもDに対抗できる。","is_correct":false,"explanation":"正しい記述。判例は、共同相続人の一人による無権利の処分について、他の相続人は自己の持分を登記なくして第三者に対抗できるとする。"},{"text":"遺産分割により法定相続分を超える持分を取得した相続人は、その超える部分については、登記を備えなければ遺産分割後に現れた第三者に対抗できない。","is_correct":false,"explanation":"正しい記述。民法899条の2により、法定相続分を超える権利の取得は、対抗要件を備えなければ第三者に対抗できない。"},{"text":"相続放棄をした相続人Bの債権者が、放棄後にBの相続持分を差し押さえた場合、他の相続人Cは、登記を備えていなければ相続放棄の効力をその債権者に対抗できない。","is_correct":true,"explanation":"誤り。判例は、相続放棄の遡及効は絶対的であり、放棄後に現れた第三者に対しても登記なくして対抗できるとする。"},{"text":"特定の相続人に甲土地を相続させる旨の遺言(特定財産承継遺言)により甲土地を取得した相続人も、法定相続分を超える部分については、登記を備えなければ第三者に対抗できない。","is_correct":false,"explanation":"正しい記述。民法899条の2は遺産分割だけでなく特定財産承継遺言による承継にも適用され、法定相続分を超える部分は対抗要件が必要である。"}],"explanation":"判例は相続放棄の遡及効を絶対的なものと解し、放棄者の持分を差し押さえた債権者に対しても登記なくして対抗できるとする。他方、遺産分割や特定財産承継遺言による法定相続分を超える取得は、民法899条の2により登記なくして第三者に対抗できない。","difficulty":2,"tags":["権利関係","物権変動"],"shuffle_choices":true},{"id":"Q2038","topic":"抵当権","question_type":"select_correct","question":"抵当権の性質に関する次の記述のうち、民法の規定及び判例によれば、正しいものはどれか。","choices":[{"text":"被担保債権が弁済により消滅した場合、抵当権の設定登記が抹消されていなくても、抵当権は消滅する。","is_correct":true,"explanation":"正しい。抵当権には付従性があり、被担保債権が消滅すれば抵当権も当然に消滅する。登記の抹消は消滅の要件ではない。"},{"text":"被担保債権が第三者に譲渡された場合でも、抵当権は譲渡人のもとにとどまり、譲受人に移転することはない。","is_correct":false,"explanation":"抵当権には随伴性があり、被担保債権が譲渡されれば抵当権も原則としてこれに伴って譲受人に移転する。"},{"text":"抵当権者が被担保債権の一部の弁済を受けたときは、抵当権は弁済を受けた割合に応じて縮減し、目的物の一部についてのみ行使できる。","is_correct":false,"explanation":"抵当権には不可分性があり、被担保債権の全部の弁済を受けるまで、目的物の全部についてその権利を行使できる(民法372条・296条)。"},{"text":"抵当権者は、抵当不動産が焼失して債務者が受け取るべき火災保険金請求権に物上代位する場合、その払渡し前に差押えをする必要はない。","is_correct":false,"explanation":"物上代位権を行使するには、金銭その他の物の払渡しまたは引渡しの前に差押えをしなければならない(民法372条・304条)。"}],"explanation":"抵当権には付従性・随伴性・不可分性・物上代位性が認められる。被担保債権が消滅すれば抵当権も消滅し(付従性)、債権譲渡に伴い移転し(随伴性)、全部の弁済まで目的物全部に及び(不可分性)、物上代位には払渡し前の差押えが必要である(民法372条・304条)。","difficulty":1,"tags":["権利関係","抵当権"],"shuffle_choices":true},{"id":"Q2039","topic":"抵当権","question_type":"select_incorrect","question":"抵当権の効力の及ぶ範囲に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":[{"text":"宅地に抵当権が設定された当時、その宅地に存在した石灯籠や取り外しのできる庭石などの従物にも、抵当権の効力が及ぶ。","is_correct":false,"explanation":"正しい記述。判例は、抵当権設定当時に存在した従物に抵当権の効力が及ぶとしている。"},{"text":"借地上の建物に抵当権が設定された場合、その建物の従たる権利である敷地の賃借権にも、抵当権の効力が及ぶ。","is_correct":false,"explanation":"正しい記述。判例は、建物の抵当権の効力は従たる権利である敷地利用権(賃借権)にも及ぶとする。"},{"text":"抵当権の効力は、被担保債権について不履行があったときは、その後に生じた抵当不動産の果実に及ぶ。","is_correct":false,"explanation":"正しい記述。民法371条により、被担保債権の不履行後に生じた果実(天然果実・法定果実)には抵当権の効力が及ぶ。"},{"text":"抵当不動産が賃貸されている場合であっても、抵当権者は、その賃料債権に対して物上代位権を行使することはできない。","is_correct":true,"explanation":"誤り。判例は、抵当不動産の賃料債権に対する物上代位を認めている。払渡し前に差押えをすれば賃料から優先弁済を受けられる。"}],"explanation":"抵当権の効力は付加一体物に及び(民法370条)、判例上、設定当時の従物や従たる権利(敷地賃借権)にも及ぶ。また、被担保債権の不履行後の果実に及び(民法371条)、賃料債権への物上代位も判例により認められている。","difficulty":2,"tags":["権利関係","抵当権"],"shuffle_choices":true},{"id":"Q2040","topic":"抵当権","question_type":"select_correct","question":"Aの所有する甲土地には、Bを抵当権者とする1番抵当権と、Cを抵当権者とする2番抵当権が設定され、それぞれ登記されている。この場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","choices":[{"text":"Bは、後順位抵当権者Cがいる場合でも、被担保債権の利息の全額について常に優先弁済を受けることができる。","is_correct":false,"explanation":"後順位抵当権者等の利害関係人がいる場合、利息等は満期となった最後の2年分に制限される(民法375条)。全額ではない。"},{"text":"抵当権によって担保されるのは元本債権のみであり、利息は抵当権によって担保されない。","is_correct":false,"explanation":"利息も被担保債権の範囲に含まれる。ただし、後順位抵当権者等との関係では満期となった最後の2年分に限られる(民法375条)。"},{"text":"Bは、Cとの関係では、利息については満期となった最後の2年分についてのみ、1番抵当権者として優先弁済を受けることができる。","is_correct":true,"explanation":"正しい。民法375条により、後順位抵当権者その他の利害関係人との関係では、利息その他の定期金は満期となった最後の2年分に限り優先弁済を受けられる。"},{"text":"後順位抵当権者や他の債権者が存在しない場合であっても、Bが債務者Aに対して抵当権を実行するときは、利息は満期となった最後の2年分に制限される。","is_correct":false,"explanation":"民法375条の制限は後順位抵当権者等の利害関係人を保護する趣旨であり、利害関係人がいない場合、債務者や設定者との関係では2年分に制限されない。"}],"explanation":"民法375条は、抵当権者は利息その他の定期金について満期となった最後の2年分についてのみ優先弁済権を行使できると定める。これは後順位抵当権者など利害関係人保護のための制限であり、利害関係人がいない場合には適用されない。","difficulty":2,"tags":["権利関係","抵当権"],"shuffle_choices":true},{"id":"Q2041","topic":"抵当権","question_type":"select_correct","question":"Aの所有する甲土地には、Bの1番抵当権(債権額2,000万円)、Cの2番抵当権(債権額2,400万円)、Dの3番抵当権(債権額3,000万円)が設定・登記されている。甲土地の競売に基づく売却代金5,400万円を配当する場合に関する次の記述のうち、民法の規定によれば、正しいものはどれか。なお、元本以外の債権額は考慮しないものとする。","choices":[{"text":"BがDに抵当権の順位を譲渡していた場合、Dの受ける配当額は、譲渡がない場合と同じく1,000万円である。","is_correct":false,"explanation":"順位の譲渡がなければB2,000万円・C2,400万円・D1,000万円だが、順位の譲渡があるとBとDの配当合計3,000万円からDが先に配当を受けるため、Dの配当は3,000万円となる。"},{"text":"BがDに抵当権の順位を譲渡していた場合、Dは3,000万円、Bは0円の配当を受ける。","is_correct":true,"explanation":"正しい。順位の譲渡では、譲渡当事者の本来の配当額の合計(B2,000万円+D1,000万円=3,000万円)から、譲受人Dが先に自己の債権額まで配当を受ける。Dの債権額は3,000万円なのでDが3,000万円を受け、Bは0円となる。"},{"text":"BがDに抵当権の順位を放棄していた場合、Bの受ける配当額は2,000万円のまま変わらない。","is_correct":false,"explanation":"順位の放棄では、BとDの本来の配当額の合計3,000万円を債権額の割合(2,000万円対3,000万円=2対3)で按分するため、Bの配当は1,200万円に減少する。"},{"text":"Bが順位の譲渡又は放棄のいずれをした場合でも、Cの受ける配当額は減少する。","is_correct":false,"explanation":"順位の譲渡・放棄は当事者(BとD)の間でのみ効力を生じ、中間の抵当権者Cの配当額2,400万円には影響しない。"}],"explanation":"本来の配当はB2,000万円・C2,400万円・D1,000万円である。順位の譲渡では当事者の配当合計3,000万円から譲受人Dが優先して受け(D3,000万円・B0円)、順位の放棄では同額を債権額の割合2対3で按分する(B1,200万円・D1,800万円)。いずれもCには影響しない。","difficulty":3,"tags":["権利関係","抵当権"],"shuffle_choices":true},{"id":"Q2042","topic":"抵当権","question_type":"select_incorrect","question":"法定地上権に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。","choices":[{"text":"Aが自己所有の更地である甲土地に抵当権を設定した後、甲土地上に乙建物を建築した場合において、抵当権の実行により甲土地がBに買い受けられたときは、乙建物のために法定地上権が成立する。","is_correct":true,"expla
