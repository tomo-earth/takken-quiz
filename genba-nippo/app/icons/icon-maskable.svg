<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A130C"/>
      <stop offset="0.45" stop-color="#123D1C"/>
      <stop offset="1" stop-color="#1E8A38"/>
    </linearGradient>
    <radialGradient id="globe" cx="0.5" cy="0.58" r="0.72">
      <stop offset="0" stop-color="#EAF7FF"/>
      <stop offset="0.28" stop-color="#A8DFF6"/>
      <stop offset="0.62" stop-color="#4FB4E8"/>
      <stop offset="1" stop-color="#1E8ECC"/>
    </radialGradient>
    <clipPath id="rim"><circle cx="380" cy="400" r="268"/></clipPath>
    <mask id="mouth" maskUnits="userSpaceOnUse" x="0" y="0" width="760" height="1000">
      <rect width="760" height="1000" fill="#fff"/>
      <g transform="rotate(35 380 400)">
        <path d="M 680.8 475.0 A 310 310 0 0 1 624.3 590.9 L 498.2 492.4 A 150 150 0 0 0 525.6 436.3 Z" fill="#000"/>
      </g>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 225) scale(0.44) translate(-380 -400)">
    <g mask="url(#mouth)">
    <g transform="rotate(35 380 400)">
      <circle cx="380" cy="400" r="270" fill="#FFFFFF"/>
      <circle cx="380" cy="400" r="198" fill="url(#globe)"/>
      <!-- 横棒（左上へ突き出す部分は円の外まで） -->
      <rect x="56" y="340" width="324" height="120" fill="#FFFFFF"/>
      <rect x="380" y="340" width="272" height="120" fill="#FFFFFF" clip-path="url(#rim)"/>
    </g>
  </g>
  </g>
  <text x="256" y="428" text-anchor="middle" fill="#FFFFFF"
        font-family="Arial, 'Liberation Sans', Helvetica, sans-serif"
        font-weight="bold" font-size="62" letter-spacing="6">EARTH</text>
</svg>